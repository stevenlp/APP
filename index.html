        <span class="cc-ex">${verResto ? 'Vuelve a las ' + top.length + ' que más usas' : resto.length + ' más: ' + escapeHTML(resto.slice(0,3).join(', ')) + (resto.length > 3 ? '…' : '')}</span>
      </div>` : '';
    openOverlay(`<h3>¿Qué categoría quieres limitar?</h3>
      <div class="step-label metal-text">${libres.length
        ? (verResto ? 'Todas las que aún no tienen límite' : 'Las que más usas')
        : 'Ya tienen límite todas tus categorías'}</div>
      ${libres.length ? `<div class="cat-grid">${top.map(ficha).join('')}${verResto ? resto.map(ficha).join('') : ''}${fichaResto}</div>` : ''}
      <div class="other-type-wrap">
        <div class="other-split">
          <div class="chip other-type" data-addlimit="Otro tipo" role="button" tabindex="0">${ic('sparkle')} Otro</div>
          <div class="chip new-cat" id="limNewCat" role="button" tabindex="0">${ic('plus')} Nueva categoría</div>
        </div>
      </div>
      <div class="sheet-actions"><button class="ghost-btn" id="closeBtn2">Cancelar</button></div>`);
    sheetBody.querySelector('#closeBtn2').onclick = closeOverlay;
    sheetBody.querySelector('#limNewCat').onclick = ()=>openNewCategory(
      nombre=>ticketLimite(nombre, verResto), ()=>openAddLimitCategory(verResto));
    const resBtn = sheetBody.querySelector('[data-limresto]');
    if(resBtn){
      resBtn.onclick = ()=>openAddLimitCategory(!verResto);
      resBtn.onkeydown = e=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); resBtn.click(); } };
    }
    sheetBody.querySelectorAll('[data-addlimit]').forEach(el=>{
      const cat = el.dataset.addlimit;
      if(CAT_EXAMPLES[cat]) attachLongPress(el, ()=>openCategoryExamples(cat));
      el.onclick = ()=>{ if(wasLongPress(el)) return; ticketLimite(cat, verResto); };
    });
  }
  function ticketLimite(cat, verResto){
    const info = catInfo(cat, 'gasto');
    abreTicket({
      titulo:'Nuevo límite', icono:info.icon, hex:info.hex, importe:cat,
      filas:[['Periodo', 'Mensual'], ['Importe', 'Sin definir']],
      confirmar:'Añadir', onVolver: ()=>openAddLimitCategory(verResto), onConfirmar: ()=>anadeLimite(cat),
    });
  }
  async function anadeLimite(cat){
    if(!state.limitCategories.includes(cat)) state.limitCategories.push(cat);
    /* Una categoría nueva nace mensual, que es lo que espera casi todo el
       mundo; si es de las de una vez al año, se cambia con el botón. */
    if(!state.limitPeriods) state.limitPeriods = {};
    if(!state.limitPeriods[cat]) state.limitPeriods[cat] = 'mes';
    await saveState(); closeOverlay(); render();
  }

  /* ============ CARTERAS · un mismo esqueleto para cada cuenta ============
     Nómina, Efectivo y cada neo banco se pintan igual: selector de periodo
     arriba a la derecha, rueda y cifra del periodo elegido, y debajo el
     desglose de en qué se ha ido el dinero. */
  const CART_PERIODOS = [
    {id:'sem',  label:'Sem',  dias:7},
    {id:'mes',  label:'Mes',  mes:true},
    {id:'90d',  label:'90d',  dias:90},
    {id:'anio', label:'Año',  anio:true},
    {id:'todo', label:'Todo', todo:true},
  ];
  /* Un único periodo para toda la app: el selector de cualquier bloque manda
     sobre todos los demás, así que al cambiarlo se actualiza la pantalla
     entera con los datos de ese mismo tramo de tiempo. Se guarda con tus datos:
     si cierras la app y vuelves, sigues en el mismo tramo. */
  let cartPeriodo = 'mes';
  function periodoValido(id){ return CART_PERIODOS.some(p=>p.id === id); }
  function setPeriodo(id){
    if(!periodoValido(id) || cartPeriodo === id) return false;
    cartPeriodo = id;
    state.periodo = id;
    return true;
  }

  function cartRango(){
    const id = cartPeriodo;
    const p = CART_PERIODOS.find(x=>x.id === id) || CART_PERIODOS[1];
    const h = now(), to = h.getTime();
    if(p.todo) return {id, label:p.label, from:0, to, texto:'desde el principio'};
    if(p.mes)  return {id, label:p.label, from:new Date(h.getFullYear(),h.getMonth(),1,0,0,0,0).getTime(), to, texto:MESES[h.getMonth()]};
    if(p.anio) return {id, label:p.label, from:new Date(h.getFullYear(),0,1,0,0,0,0).getTime(), to, texto:'año ' + h.getFullYear()};
    return {id, label:p.label, from:to - p.dias*86400000, to, texto:'últimos ' + p.dias + ' días'};
  }
  /* El nombre del tramo se lee suelto en unos sitios y necesita preposición en
     otros: "en septiembre", pero "desde el principio". */
  function tramoFrase(r){
    r = r || cartRango();
    if(r.texto === 'desde el principio') return 'desde el principio';
    if(/^últimos/.test(r.texto)) return 'en los ' + r.texto;
    if(/^año/.test(r.texto)) return 'en el ' + r.texto;
    return 'en ' + r.texto;
  }
  function segHTML(key){
    const act = cartPeriodo;
    return `<div class="seg" data-seg="${escapeHTML(key)}">${CART_PERIODOS.map(p=>
      `<button type="button" class="seg-b ${p.id===act?'on':''}" data-p="${p.id}">${p.label}</button>`).join('')}</div>`;
  }
  /* ---- El mando del tiempo, fuera de las tarjetas ----
     Antes iba metido dentro de cada tarjeta, y eso engañaba: parecía que solo
     mandaba sobre esa tarjeta cuando en realidad manda sobre la pantalla
     entera. Ahora va en una tira suya arriba del todo, una sola por pantalla,
     y debajo todo habla del tramo que marque. Va fuera de los bloques a
     propósito: no se puede mover ni esconder sin querer. */
  function segBarraHTML(key){
    const r = cartRango();
    return `<div class="seg-barra">
      <span class="sb-k">${ic('clock',12)}<b>${escapeHTML(r.texto)}</b></span>
      ${segHTML(key)}
    </div>`;
  }
  /* El techo y el suelo que tocó esa cuenta dentro del periodo. */
  function cartPico(accId, r){
    const vals = (state.history || [])
      .filter(h=>h.ts >= r.from && h.ts <= r.to && h.by && typeof h.by[accId] === 'number')
      .map(h=>h.by[accId]);
    if(!vals.length) return null;
    return {max:+Math.max.apply(null, vals).toFixed(2), min:+Math.min.apply(null, vals).toFixed(2)};
  }
  /* Sueldos cobrados dentro del periodo: cuenta el de cada mes que empieza
     dentro del rango, que es cuando de verdad entra el dinero. */
  function cartSueldos(r, accId){
    const N = nomCfg(accId);
    const hoy = now();
    /* Nunca se va más atrás del primer mes con datos: si no, "Todo" sumaría
       sueldos de años en los que la app ni existía. */
    let ini = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    state.transactions.forEach(t=>{
      const d = new Date(t.ts), c = new Date(d.getFullYear(), d.getMonth(), 1);
      if(c < ini) ini = c;
    });
    Object.keys(N.monthlySalaries || {}).forEach(k=>{
      const p = String(k).split('-').map(Number);
      if(p.length === 2 && p[0]){ const c = new Date(p[0], p[1]-1, 1); if(c < ini) ini = c; }
    });
    const desde = Math.max(r.from, ini.getTime());
    let cur = new Date(hoy.getFullYear(), hoy.getMonth(), 1), total = 0, guard = 0;
    const meses = [];
    while(cur.getTime() >= desde && guard++ < 600){
      if(cur.getTime() <= r.to){
        const s = salaryForMonth(cur.getTime(), accId);
        total += s;
        if(s > 0) meses.push({ts:cur.getTime(), amount:+s.toFixed(2),
                              label:'Sueldo de ' + MESES[cur.getMonth()] + ' ' + cur.getFullYear()});
      }
      cur = new Date(cur.getFullYear(), cur.getMonth()-1, 1);
    }
    cartSueldos.detalle = meses;
    return +total.toFixed(2);
  }

  /* ---- Desplegar una barra del historial ----
     Al tocar una categoría se abren los movimientos que la forman —nombre,
     tipo, fecha e importe— y, a la vez, la rueda de arriba se apaga entera
     menos el trozo de esa categoría, para ver de un vistazo qué parte del
     círculo ocupa. Solo una abierta a la vez por tarjeta: si no, la rueda no
     sabría a cuál apuntar. */
  function bindDesglose(cont){
    const sel = k => '[data-pcsub="' + (window.CSS && CSS.escape ? CSS.escape(k) : k) + '"]';
    /* "Mostrar más" / "Mostrar menos" de las listas largas. */
    cont.querySelectorAll('[data-pcmas]').forEach(btn=>{
      btn.onclick = (e)=>{
        e.stopPropagation();
        if(editMode) return;
        const k = btn.dataset.pcmas;
        pcMas[k] = !pcMas[k];
        render();
      };
    });
    cont.querySelectorAll('.pc-row[data-pcrow]').forEach(row=>{
      row.onclick = ()=>{
        if(editMode) return;
        const key = row.dataset.pcrow;
        const card = row.closest('.ledger-card') || cont;
        const sub = card.querySelector(sel(key));
        if(!sub) return;
        const abrir = !pcAbierto[key];
        if(abrir){
          card.querySelectorAll('.pc-row.on[data-pcrow]').forEach(o=>{
            if(o === row) return;
            o.classList.remove('on');
            pcAbierto[o.dataset.pcrow] = false;
            const s = card.querySelector(sel(o.dataset.pcrow));
            if(s) s.hidden = true;
          });
        }
        pcAbierto[key] = abrir;
        row.classList.toggle('on', abrir);
        sub.hidden = !abrir;
        const wrap = card.querySelector('.donut-wrap');
        if(!wrap) return;
        wrap.querySelectorAll('.dseg.on').forEach(s=>s.classList.remove('on'));
        const seg = wrap.querySelector('.dseg[data-pcid="' + (window.CSS && CSS.escape ? CSS.escape(key) : key) + '"]');
        wrap.classList.toggle('enfocando', abrir && !!seg);
        if(abrir && seg) seg.classList.add('on');
      };
    });
  }

  /* ---- El historial de la cuenta ----
     Tres secciones separadas por una línea fina: lo que sale, lo que entra y lo
     que se ha apartado en inversión. Cada línea con su importe, su porcentaje
     dentro de la sección y su barra. Todo sigue al selector de periodo. */
  const PC_SEC_ICO = {in:'arrowDown', out:'arrowUp', inv:'trending'};
  /* `ref` es opcional y solo lo usa el coste recurrente: ahí el porcentaje y la
     barra no se miden contra la sección, sino contra la rueda entera, para que
     cada barra diga exactamente qué trozo del círculo ocupa. Sin `ref` todo
     sigue como siempre: porcentaje sobre la sección y barra sobre su mayor. */
  /* Clave estable para emparejar una fila del desglose con su trozo de rueda. */
  function pcKey(s){ return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'x'; }
  /* Qué filas del desglose están abiertas. Se guarda fuera del pintado para que
     al cambiar de periodo o repintar no se cierren solas. */
  let pcAbierto = {};
  /* Una línea del desplegable: un movimiento de los que suman esa barra. */
  function pcMovHTML(t, signo){
    const tipo = txTipo(t);
    const nombre = t.description || t.category || tipo.label;
    const detalle = [fmtDateShort(t.ts), tipo.label];
    if(t.note && t.note !== t.description) detalle.push(t.note);
    return `<div class="pc-srow">
      <span class="pc-sn">${escapeHTML(nombre)}<i>${escapeHTML(detalle.join(' · '))}</i></span>
      <span class="pc-sv">${signo}${fmt(t.amount)}</span>
    </div>`;
  }
  /* Qué listas están desplegadas del todo. Fuera del pintado, para que no se
     vuelvan a plegar al cambiar de periodo o repintar la pantalla. */
  let pcMas = {};
  /* Cuántas categorías se enseñan antes de tener que pulsar "Mostrar más". */
  const PC_TOPE = 4;
  function pcSeccionHTML(clave, titulo, items, total, signo, vacio, ref, limite){
    const contra = ref > 0 ? ref : total;
    const tope = ref > 0 ? ref : (items.length ? Math.max.apply(null, items.map(x=>x.amount)) : 1);
    /* Con muchas categorías el bloque se hacía kilométrico: solo se enseñan las
       primeras y el resto entra con "Mostrar más". */
    const idSec = clave + '-' + pcKey(titulo);
    const todas = !limite || !!pcMas[idSec];
    const lista = todas ? items : items.slice(0, limite);
    const ocultos = items.length - lista.length;
    return `<div class="pc-sec ${clave}">
      <div class="pc-sech">
        <span class="pc-seck"><i class="pc-secico">${ic(PC_SEC_ICO[clave] || 'sparkle',12)}</i>${titulo}</span>
        <span class="pc-secv">${items.length ? signo + fmt(total) : fmt(0)}</span>
      </div>
      ${items.length ? lista.map(x=>{
        const pct = contra > 0 ? Math.round((x.amount/contra)*100) : 0;
        const key = x.key || (clave + '-' + pcKey(x.label));
        /* Cada barra guarda dentro los movimientos que la forman: al tocarla se
           abren y, de paso, la rueda de arriba se centra en ese trozo. */
        const dentro = Array.isArray(x.tx) ? x.tx : [];
        const abierta = !!pcAbierto[key];
        return `<div class="pc-row ${dentro.length?'desplegable':''} ${abierta?'on':''}" data-pcrow="${escapeHTML(key)}">
          <div class="pc-rt">
            <span class="pc-ri" style="--ti:${x.hex || 'var(--accent)'}">${ic(x.icon || 'sparkle',15)}</span>
            <span class="pc-rn">${escapeHTML(x.label)}</span>
            <span class="pc-rv">${fmt(x.amount)} <i>· ${pct}%</i></span>
            ${dentro.length ? `<i class="pc-rchev">${ic('chevronRight',12)}</i>` : ''}
          </div>
          <div class="pc-tr"><span class="pc-fi" style="--w:${((x.amount/tope)*100).toFixed(2)}%;background:${x.hex}"></span></div>
        </div>
        ${dentro.length ? `<div class="pc-sub" data-pcsub="${escapeHTML(key)}" ${abierta?'':'hidden'}>
          <div class="pc-subh">${dentro.length} movimiento${dentro.length===1?'':'s'} · ${fmt(x.amount)}</div>
          ${dentro.map(t=>pcMovHTML(t, signo)).join('')}
        </div>` : ''}`;
      }).join('') : `<div class="pc-vacio">${escapeHTML(vacio)}</div>`}
      ${limite && items.length > limite ? `<button type="button" class="pc-mas ${todas?'on':''}" data-pcmas="${escapeHTML(idSec)}">
        <i>${ic('chevronRight',12)}</i>${todas ? 'Mostrar menos' : 'Mostrar ' + ocultos + ' más'}
      </button>` : ''}
    </div>`;
  }
  function pcHistorialHTML(mov, opts){
    opts = opts || {};
    /* Orden fijo en toda la app: primero lo que entra, luego lo que sale y por
       último lo que se aparta en inversión. Las tres van igual: título, total,
       y una fila por concepto con su icono, su color, su importe y su barra.
       La inversión solo la llevan los neo bancos: es de donde se invierte. */
    return `<div class="pc-gastos">
      ${pcSeccionHTML('in', opts.labelIngresos || 'Ingresos', mov.entradas, mov.totalEnt, '+', opts.vacioIngresos || 'Nada ha entrado en este periodo.')}
      ${pcSeccionHTML('out','Gastos',       mov.salidas,     mov.totalSal, '-', 'Nada gastado en este periodo.')}
      ${opts.conInversion
        ? pcSeccionHTML('inv','Inversiones',  mov.inversiones, mov.totalInv, '', 'Nada apartado en inversión en este periodo.')
        : ''}
    </div>`;
  }

  /* Reparte los movimientos de una cuenta dentro del periodo: por dónde entró
     el dinero, en qué se fue y qué se apartó. Las transferencias cuentan como
     uno más; la inversión va en su propio cajón y nunca como gasto. */
  function cartMovimientos(accId, r){
    const tx = state.transactions.filter(t=>t.account === accId && t.ts >= r.from && t.ts <= r.to);
    const entradas = {}, salidas = {}, inversiones = {};
    tx.forEach(t=>{
      const esTf = !!t.transfer;
      if(t.kind === 'ingreso'){
        const k = esTf ? 'Transferencia recibida'
          : (esNomina(accId) && t.category === 'Nómina' && t.description) ? t.description
          : (t.category || 'Otros ingresos');
        if(!entradas[k]) entradas[k] = {label:k, amount:0, tf:esTf, tx:[]};
        entradas[k].amount += t.amount; entradas[k].tx.push(t);
      } else if(txEsInversion(t)){
        const k = t.description || 'Inversión';
        if(!inversiones[k]) inversiones[k] = {label:k, amount:0, tx:[]};
        inversiones[k].amount += t.amount; inversiones[k].tx.push(t);
      } else {
        const k = esTf ? 'Transferencia enviada' : (t.category || 'Otros gastos');
        if(!salidas[k]) salidas[k] = {label:k, amount:0, tf:esTf, tx:[]};
        salidas[k].amount += t.amount; salidas[k].tx.push(t);
      }
    });
    const INGRESO_TONOS = ['#30B0C7','#5E5CE6','#FF9500','#00C7BE','#AF52DE','#FFCC00'];
    /* Cada grupo se lleva sus movimientos dentro: son los que se despliegan al
       tocar la barra, y los que explican de dónde sale ese porcentaje. */
    const ordena = l => l.sort((a,b)=>b.ts - a.ts);
    const listaEnt = Object.values(entradas).sort((a,b)=>b.amount-a.amount).map((x,i)=>({
      label:x.label, amount:+x.amount.toFixed(2), key:'in-'+pcKey(x.label), tx:ordena(x.tx),
      hex: x.tf ? '#8E8E93' : ((CAT_INGRESO[x.label] || CAT_LEGACY[x.label]) ? (CAT_INGRESO[x.label] || CAT_LEGACY[x.label]).hex : INGRESO_TONOS[i % INGRESO_TONOS.length]),
      icon: x.tf ? 'repeat' : ((CAT_INGRESO[x.label] || CAT_LEGACY[x.label]) ? (CAT_INGRESO[x.label] || CAT_LEGACY[x.label]).icon : 'arrowDown'),
    }));
    const listaSal = Object.values(salidas).sort((a,b)=>b.amount-a.amount).map(x=>({
      label:x.label, amount:+x.amount.toFixed(2), key:'out-'+pcKey(x.label), tx:ordena(x.tx),
      hex: x.tf ? '#8E8E93' : getCatHex(x.label,'gasto'),
      icon: x.tf ? 'repeat' : getCatIcon(x.label,'gasto'),
    }));
    const listaInv = Object.values(inversiones).sort((a,b)=>b.amount-a.amount).map(x=>({
      label:x.label, amount:+x.amount.toFixed(2), key:'inv-'+pcKey(x.label), tx:ordena(x.tx),
      hex:'#0A84FF', icon:'trending',
    }));
    return {entradas:listaEnt, salidas:listaSal, inversiones:listaInv,
      totalEnt:+listaEnt.reduce((s,x)=>s+x.amount,0).toFixed(2),
      totalSal:+listaSal.reduce((s,x)=>s+x.amount,0).toFixed(2),
      totalInv:+listaInv.reduce((s,x)=>s+x.amount,0).toFixed(2), tx};
  }

  /* ---- La tira de "qué ha pasado en este tramo" ----
     El saldo de una cuenta es de hoy y no puede ser otra cosa: el tramo
     siempre termina ahora mismo, así que pedirle a un saldo que "sea de la
     semana pasada" no significa nada. Lo que sí tiene sentido —y es lo que
     cambia de verdad al tocar Sem / Mes / 90d / Año / Todo— es cuánto entró,
     cuánto salió y con qué se queda la cuenta en ese tramo. Va debajo del
     saldo, y la lleva igual la Nómina, Efectivo, cada cartera que crees y cada
     neo banco, porque todas se pintan con la misma tarjeta. */
  function variacionHTML(variacion, mov, r){
    const signo = variacion > 0 ? '+' : variacion < 0 ? '-' : '';
    const cls   = variacion > 0 ? 'pos' : variacion < 0 ? 'neg' : '';
    const salida = +(mov.totalSal + mov.totalInv).toFixed(2);
    return `<div class="pc-var">
      <div class="pv-h">${ic('clock',11)} ${escapeHTML(nbMayus(tramoFrase(r)))}</div>
      <div class="pv-row">
        <span class="pv-b in">${ic('arrowDown',11)}<i>Entró</i><b>${fmt(mov.totalEnt)}</b></span>
        <span class="pv-b out">${ic('arrowUp',11)}<i>Salió</i><b>${fmt(salida)}</b></span>
        <span class="pv-b net ${cls}">${ic('scale',11)}<i>Se queda</i><b>${signo}${fmt(Math.abs(variacion))}</b></span>
      </div>
    </div>`;
  }

  /* La tarjeta común. Todo lo que enseña depende del periodo del selector. */
  function cuentaCard(opts){
    const r = cartRango();
    const mov = cartMovimientos(opts.accId, r);
    const entradas = mov.entradas.slice();
    /* En la nómina el sueldo del periodo es la primera entrada. */
    if(opts.conSueldo){
      const sueldo = cartSueldos(r, opts.accId);
      /* El sueldo no es un movimiento apuntado, sale de lo que tengas guardado
         mes a mes. Para que la barra se despliegue igual que las demás, se
         desglosa en una línea por mes cobrado. */
      if(sueldo > 0) entradas.unshift({label:'Sueldo · ' + r.texto, hex:'#248A3D', icon:'bank',
        amount:sueldo, key:'in-sueldo',
        tx:(cartSueldos.detalle || []).map(m=>({
          id:'sueldo-'+m.ts, ts:m.ts, amount:m.amount, kind:'ingreso',
          account:opts.accId, category:'Nómina', description:m.label, note:'',
        }))});
    }
    mov.entradas = entradas;
    mov.totalEnt = +entradas.reduce((s,x)=>s+x.amount,0).toFixed(2);

    /* La rueda se reparte sobre lo que entró; si en el periodo se gastó más de
       lo que entró, manda el gasto para que los trozos sigan viéndose. */
    const trozos = mov.salidas.concat(mov.inversiones);
    const salidasTot = +(mov.totalSal + mov.totalInv).toFixed(2);
    const donutTotal = Math.max(mov.totalEnt, salidasTot);
    const restante = Math.max(+(donutTotal - salidasTot).toFixed(2), 0);
    const donut = donutSVG(trozos, donutTotal, {hex:'#34C759', amount:restante, icon:'wallet'});

    const pico = cartPico(opts.accId, r);
    const cifra = pico ? pico.max : opts.saldo;
    /* Lo invertido sigue dentro de la cuenta, pero ya no se puede gastar. */
    const invertido = invertidoEn(opts.accId);
    const disponible = +(opts.saldo - invertido).toFixed(2);
    /* Lo que la cuenta ha ganado o perdido DENTRO del tramo elegido. El saldo
       de arriba es de hoy y no puede ser otra cosa (el tramo siempre acaba
       ahora mismo); esto es lo que de verdad cambia al tocar el selector. */
    const variacion = +(mov.totalEnt - mov.totalSal - mov.totalInv).toFixed(2);

    return `<div class="ledger-card tilt3d">
      <div class="pc-head">
        <div class="card-title big"><span class="ct-ico" style="--ct-c:${(()=>{const w=state.wallets.find(x=>x.id===opts.accId);return (w&&w.hex)||(String(opts.accId).indexOf('platform:')===0?'#0A84FF':'#34C759');})()}">${ic(opts.icono)}</span> ${opts.tituloHTML}</div>
      </div>
      <div class="donut-wrap">
        <div style="flex:none;">${donut}</div>
        <div class="donut-figures">
          <div class="saldo-label"><span class="pc-periodo">${escapeHTML(pico ? 'Máximo · ' + r.texto : r.texto)}</span></div>
          <div class="saldo-num ${cifra<0?'negative':''}">${fmt(cifra)}</div>
          <div class="pc-now">saldo ahora <b>${fmt(opts.saldo)}</b>${pico ? ' · mín <b>' + fmt(pico.min) + '</b>' : ''}</div>
        </div>
      </div>
      <div class="pc-disp">
        <span class="pd-k">${ic('wallet',12)} ${L('cart.disponible','Disponible ahora')}</span>
        <span class="pd-v">${fmt(disponible)}</span>
        ${invertido > 0 ? `<span class="pd-s">${ic('trending',11)} ${fmt(invertido)} invertidos · no se pueden gastar</span>` : ''}
      </div>
      ${variacionHTML(variacion, mov, r)}
      ${opts.extraHTML || ''}
      ${pcHistorialHTML(mov, {conInversion: !!opts.conInversion, labelIngresos: opts.labelIngresos,
                              vacioIngresos: opts.vacioIngresos})}
      ${opts.footerHTML || ''}
    </div>`;
  }

  function walletCardBody(account, balance, title, icon){
    return cuentaCard({accId:account, tituloHTML:escapeHTML(title), icono:icon, saldo:accountTotal(account)});
  }

  /* Tarjeta metalizada de una plataforma: cada una con su propio acabado.
     Limpia, con la proporción de una tarjeta de verdad y el chip desnudo en su
     sitio de siempre. No lleva botones: los movimientos se hacen desde el botón
     redondo de abajo. Al tocarla se abre su detalle en una hoja. */
  /* Lo que ha entrado menos lo que ha salido de un neo banco dentro del tramo. */
  function platDelta(pid, r){
    const acc = 'platform:' + pid;
    let ent = 0, sal = 0;
    state.transactions.forEach(t=>{
      if(t.account !== acc || t.ts < r.from || t.ts > r.to) return;
      if(t.kind === 'ingreso') ent += t.amount; else sal += t.amount;
    });
    return +(ent - sal).toFixed(2);
  }
  function platformCardHTML(p, armed, deleting){
    const m = metalOf(p);
    const style = `--mc-bg:${metalBg(m)};--mc-ink:${m.ink};--mc-soft:${m.soft};--mc-line:${m.line};`
      + `--mc-chip:${m.chip};--mc-sheen:${m.sheen};--mc-shadow:${m.shadow};--mc-logo:${m.logoFilter};`;
    return `<div class="metal-card ${deleting?'deleting':''}" data-pid="${p.id}"
        role="button" tabindex="0" title="Toca la tarjeta para ver el detalle" style="${style}">
      <div class="mc-sheen"></div>
      <i class="mc-watermark" aria-hidden="true"></i>
      <div class="mc-head">
        <div class="mc-chip">${ic('chip',26)}</div>
      </div>
      <div class="mc-name">${escapeHTML(p.name)}</div>
      <div class="mc-bal ${p.balance<0?'negative':''}">${fmt(p.balance)}</div>
      ${(()=>{
        /* Debajo del saldo, lo que esta tarjeta ha movido dentro del tramo
           elegido arriba: en verde si acabó ganando y en rojo si acabó
           perdiendo. El saldo grande es el de hoy y no cambia con el filtro
           (el tramo siempre termina ahora); lo que cambia es esta línea. */
        const r = cartRango(), d = platDelta(p.id, r);
        const cls = d > 0 ? 'pos' : d < 0 ? 'neg' : 'cero';
        const cifra = d === 0 ? 'Sin movimiento' : (d > 0 ? '+' : '−') + fmt(Math.abs(d));
        return `<div class="mc-delta ${cls}">
          <b>${cifra}</b><span>${escapeHTML(nbMayus(tramoFrase(r)))}</span>
        </div>`;
      })()}
      <div class="mc-foot">
        <i class="mc-brand" aria-hidden="true"></i>
      </div>
      ${armed?`<div class="row-delete-overlay"><span class="del-confirm-btn glass-tap" data-delconfirm-p="${p.id}">${ic('trash',13)} Eliminar</span></div>`:''}
    </div>`;
  }


  /* ---- El detalle de un neo banco, en su propia hoja ----
     Al tocar la tarjeta sube una hoja desde abajo con toda la cuenta dentro:
     rueda, disponible y el desglose de ingresos, gastos e inversiones. La
     tarjeta se queda limpia y la pantalla de detrás no se mueve. */
  function openPlatSheet(id){
    const p = state.platforms.find(x=>x.id === id);
    if(!p) return;
    const accId = 'platform:' + p.id;
    openOverlay(`<h3>${ic('card',17)} ${escapeHTML(p.name)}</h3>
      <div class="step-label metal-text">Todo lo de esta cuenta ${escapeHTML(tramoFrase())}</div>
      <div class="plat-sheet">
        <div class="ps-mini">${platformCardHTML(p, false, false)}</div>
        ${cuentaCard({accId:accId, tituloHTML:escapeHTML(p.name),
                      icono:'card', saldo:accountTotal(accId), conInversion:true})}
      </div>
      <div class="sheet-actions">
        <button class="ghost-btn" id="psClose">Cerrar</button>
      </div>`);
    sheetBody.querySelectorAll('.saldo-num, .wl-v').forEach(fitBigNumber);
    bindDesglose(sheetBody);
    /* Esta hoja ya no lleva selector propio: el del tiempo es uno solo y vive
       arriba de la pantalla. La hoja enseña el tramo que esté puesto ahí. */
    sheetBody.querySelector('#psClose').onclick = closeOverlay;
  }

  /* ============ CONTRATO ============
     Le dice a la app hasta cuándo cobras y cuánto, para que rellene el sueldo
     sola y apague el cobro en cuanto se acabe el periodo. */
  const CONTRATOS = [
    {id:'indefinido', label:'Indefinido', ico:'briefcase', duracion:false, pregunta:true,
     nota:'Cobras todos los meses, sin fecha de fin.'},
    {id:'temporal',   label:'Temporal',   ico:'clock',     duracion:true,  pregunta:false,
     nota:'Con fecha de inicio y duración: la app mete el sueldo sola y se apaga al acabar.'},
    {id:'practicas',  label:'Prácticas',  ico:'chip',      duracion:true,  pregunta:false,
     nota:'Igual que el temporal, con la ayuda que cobras cada mes.'},
    {id:'autonomo',   label:'Autónomo',   ico:'sparkle',   duracion:false, pregunta:true,
     nota:'Lo que entra cambia cada mes, así que siempre te lo pregunto.'},
    {id:'ninguno',    label:'Sin contrato', ico:'pause',   duracion:false, pregunta:false,
     nota:'Ahora mismo no cobras nada: el cobro queda apagado.'},
  ];
  let nomAjustesOpen = false;

  function contratoCfg(accId){
    const N = nomCfg(accId);
    if(!N.contrato || typeof N.contrato !== 'object') N.contrato = {};
    const c = N.contrato;
    if(!CONTRATOS.some(x=>x.id === c.tipo)) c.tipo = 'indefinido';
    if(typeof c.meses !== 'number' || c.meses < 0) c.meses = 0;
    if(typeof c.importe !== 'number' || c.importe < 0) c.importe = 0;
    if(typeof c.inicio !== 'number') c.inicio = null;
    return c;
  }
  function contratoDef(accId){ return CONTRATOS.find(x=>x.id === contratoCfg(accId).tipo) || CONTRATOS[0]; }
  /* ¿Estás trabajando? Verde solo si lo has dicho tú en el arranque y además
     tienes un contrato puesto. Sin contrato o en paro, rojo. */
  function trabajando(accId){
    const N = nomCfg(accId);
    return N.working !== false && contratoCfg(accId).tipo !== 'ninguno';
  }
  function contratoConDuracion(accId){ return contratoDef(accId).duracion; }

  /* Último instante del último mes que cubre el contrato. */
  function contratoFin(accId){
    const c = contratoCfg(accId);
    if(!contratoConDuracion(accId) || !c.inicio || c.meses <= 0) return null;
    const d = new Date(c.inicio);
    return new Date(d.getFullYear(), d.getMonth() + c.meses, 0, 23, 59, 59, 999).getTime();
  }
  function contratoVigente(accId){
    const c = contratoCfg(accId);
    if(c.tipo === 'ninguno') return false;
    if(!contratoConDuracion(accId)) return true;
    const fin = contratoFin(accId);
    if(!c.inicio || fin == null) return false;
    const d = new Date(c.inicio);
    const desde = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    const t = now().getTime();
    return t >= desde && t <= fin;
  }
  /* Meses que quedan por cobrar, contando el actual. */
  function contratoRestan(accId){
    const fin = contratoFin(accId);
    if(fin == null) return null;
    const h = now(), f = new Date(fin);
    return Math.max((f.getFullYear() - h.getFullYear())*12 + (f.getMonth() - h.getMonth()) + 1, 0);
  }

  /* Rellena los meses que cubre el contrato y enciende o apaga el cobro. */
  async function aplicaContrato(accId){
    const N = nomCfg(accId);
    if(!state.onboarded) return;
    const c = contratoCfg(accId);
    if(!N.monthlySalaries) N.monthlySalaries = {};
    if(!N.salaryAsk) N.salaryAsk = defaultSalaryAsk();
    let cambio = false;

    if(contratoConDuracion(accId) && c.inicio && c.meses > 0 && c.importe > 0){
      const ini = new Date(c.inicio);
      for(let i=0;i<c.meses;i++){
        const m = new Date(ini.getFullYear(), ini.getMonth()+i, 1);
        if(m.getTime() > now().getTime()) break;   /* los meses que aún no han llegado, no */
        const k = monthKey(m);
        if(!Object.prototype.hasOwnProperty.call(N.monthlySalaries, k)){
          N.monthlySalaries[k] = c.importe;
          cambio = true;
        }
      }
    }

    const debe = contratoVigente(accId);
    const on = N.salaryAsk.enabled !== false;
    /* Con contrato cerrado o sin contrato, el interruptor lo lleva la app. */
    if(!contratoDef(accId).pregunta){
      if(debe !== on){ N.salaryAsk.enabled = debe; cambio = true; }
      /* Si ya sabe el importe, no hace falta preguntar nada este mes. */
      if(debe && c.importe > 0 && N.salaryAsk.lastAskedMonth !== monthKey()){
        N.salaryAsk.lastAskedMonth = monthKey();
        cambio = true;
      }
    }
    if(cambio) await saveState();
  }

  /* El desplegable con todo lo del sueldo: cuánto, cuándo y qué contrato. */
  function nominaAjustesHTML(stats, accId){
    const N = nomCfg(accId);
    const c = contratoCfg(accId);
    const def = contratoDef(accId);
    const cfg = N.salaryAsk || defaultSalaryAsk();
    const on = cfg.enabled !== false;
    const restan = contratoRestan(accId);
    const fin = contratoFin(accId);
    const estado = on
      ? `<span class="pa-on">${ic('check',11)} Cobro activo${restan != null ? ' · quedan ' + restan + ' mes' + (restan===1?'':'es') : ''}</span>`
      : `<span class="pa-off">${ic('pause',11)} Cobro apagado${fin != null ? ' · terminó el ' + fmtDateShort(fin) : ''}</span>`;

    /* Semáforo: verde si estás trabajando y con contrato; rojo si no. */
    const activo = trabajando(accId);
    return `<div class="pc-acc bottom ${nomAjustesOpen?'open':''}">
      <button type="button" class="pc-acch" id="nomAjustesTgl">
        <span class="pa-ico">${ic('settings',15)}</span>
        <span class="pa-t">
          <b>${L('nomina.ajustes','Sueldo y contrato')}</b>
          <i>${escapeHTML(def.label)} · ${estado.replace(/<[^>]+>/g,'').trim()}</i>
        </span>
        <span class="pa-luz ${activo?'ok':'no'}" title="${activo?'Trabajando y con contrato':'Sin contrato o sin trabajar'}" aria-label="${activo?'Trabajando y con contrato':'Sin contrato o sin trabajar'}"></span>
        <span class="pa-c">${ic('chevronRight',15)}</span>
      </button>
      <div class="pc-accb" ${nomAjustesOpen?'':'hidden'}>
        <div class="pa-row">
          <div>
            <div class="sr-k">${ic('calendar',12)} ${L('nomina.sueldoK','Sueldo de')} ${MESES[now().getMonth()]}</div>
            <div class="sr-s">Cámbialo si este mes cobras otra cantidad, o ponlo a 0 si no trabajas.</div>
          </div>
          <input type="number" inputmode="decimal" id="salaryMonthInput" value="${stats.salary}" step="0.01" min="0">
        </div>

        <div class="pa-k">${ic('briefcase',12)} Tipo de contrato</div>
        <div class="pa-chips">
          ${CONTRATOS.map(x=>`<button type="button" class="nb-fchip ${x.id===c.tipo?'on':''}" data-contrato="${x.id}">${ic(x.ico,12)} ${x.label}</button>`).join('')}
        </div>
        <div class="pa-nota">${escapeHTML(def.nota)}</div>

        ${def.duracion ? `<div class="pa-grid">
          <label><span>Empieza</span><input type="date" id="ctInicio" value="${c.inicio ? toDateInput(c.inicio) : ''}"></label>
          <label><span>Meses</span><input type="number" id="ctMeses" min="1" max="120" step="1" value="${c.meses || ''}" placeholder="6"></label>
          <label><span>Al mes</span><input type="number" id="ctImporte" inputmode="decimal" min="0" step="0.01" value="${c.importe || ''}" placeholder="0.00"></label>
        </div>
        <div class="pa-nota">${(c.inicio && c.meses > 0)
          ? 'Cubre de ' + escapeHTML(fmtDateShort(c.inicio)) + ' a ' + escapeHTML(fmtDateShort(contratoFin(accId))) + '. La app mete el sueldo sola cada mes y no te pregunta.'
          : 'Rellena las tres casillas y la app se encarga del resto.'}</div>` : ''}

        ${def.pregunta ? `<div class="pa-k">${ic('clock',12)} ${L('nomina.pregunta','Pregunta del sueldo')}</div>
        <div class="ac-line">
          <span class="ac-mini">
            <input type="number" id="askDayInput" min="1" max="31" step="1" value="${cfg.day}" title="Día del mes" ${on?'':'disabled'}>
            <input type="time" id="askTimeInput" value="${pad2(cfg.hour)}:${pad2(cfg.minute)}" title="Hora" ${on?'':'disabled'}>
            <span class="switch mini ${on?'on':''}" id="askToggleRow" title="Preguntar cada mes"><span></span></span>
          </span>
        </div>
        <div class="pa-nota">${on
          ? 'Cada mes, el día ' + cfg.day + ' a las ' + pad2(cfg.hour) + ':' + pad2(cfg.minute) + '.'
          : 'Apagada · los meses que no rellenes contarán 0 €.'}</div>` : ''}

        <div class="pa-estado ${on?'ok':'off'}">${estado}</div>
      </div>
    </div>`;
  }

  function bindNominaAjustes(rerender, accId){
    const N = nomCfg(accId);
    const tgl = document.getElementById('nomAjustesTgl');
    if(tgl) tgl.onclick = ()=>{
      if(editMode) return;
      nomAjustesOpen = !nomAjustesOpen;
      const caja = tgl.parentElement;
      caja.classList.toggle('open', nomAjustesOpen);
      const body = caja.querySelector('.pc-accb');
      if(body) body.hidden = !nomAjustesOpen;
    };
    document.querySelectorAll('[data-contrato]').forEach(b=>{
      b.onclick = async ()=>{
        if(editMode) return;
        contratoCfg(accId).tipo = b.dataset.contrato;
        /* Elegir un contrato con sueldo vuelve a encender el cobro: si lo has
           marcado es porque estás trabajando. El interruptor sigue a mano.
           Y el semáforo va con esto: "sin contrato" lo pone en rojo. */
        N.working = b.dataset.contrato !== 'ninguno';
        if(contratoDef(accId).pregunta) N.salaryAsk.enabled = true;
        await saveState();
        await aplicaContrato(accId);
        rerender();
      };
    });
    const ini = document.getElementById('ctInicio');
    if(ini) ini.onchange = async ()=>{
      const v = ini.value ? new Date(ini.value + 'T00:00:00').getTime() : null;
      contratoCfg(accId).inicio = v;
      await saveState(); await aplicaContrato(accId); rerender();
    };
    const mes = document.getElementById('ctMeses');
    if(mes) mes.onchange = async ()=>{
      const v = parseInt(mes.value, 10);
      contratoCfg(accId).meses = isNaN(v) ? 0 : Math.min(Math.max(v, 0), 120);
      await saveState(); await aplicaContrato(accId); rerender();
    };
    const imp = document.getElementById('ctImporte');
    if(imp) imp.onchange = async ()=>{
      const v = parseFloat(imp.value);
      contratoCfg(accId).importe = isNaN(v) ? 0 : Math.max(v, 0);
      await saveState(); await aplicaContrato(accId); rerender();
    };
  }

  /* La nómina usa la misma tarjeta, con su desplegable de sueldo y contrato
     debajo del gráfico y sus tres botones propios. */
  /* La nómina: lo que entra de más se llama "Pagas extra", no lleva inversión
     (eso es cosa de los neo bancos) y el bloque de sueldo y contrato va al
     final del todo, debajo del desglose. */
  function nominaCardBody(stats, accId, nombre){
    const acc = accId || 'banco';
    return cuentaCard({accId:acc, tituloHTML: acc === 'banco' ? L('nomina.titulo','Nómina') : escapeHTML(nombre || 'Nómina'),
      icono:'bank', saldo:accountTotal(acc), conSueldo:true,
      labelIngresos:L('nomina.pagasExtra','Pagas extra'),
      vacioIngresos:'Ninguna paga extra en este periodo.',
      footerHTML:nominaAjustesHTML(stats, acc)});
  }



  /* Deja el selector de periodo listo en cualquier bloque que lo lleve. El
     periodo es común: al tocarlo se repinta toda la pantalla para que cada
     cifra (nómina, carteras, gastos, ingresos e inversión) hable del mismo
     tramo de tiempo. */
  function bindSegPeriodo(cont, rerender){
    cont.querySelectorAll('[data-seg]').forEach(box=>{
      box.querySelectorAll('[data-p]').forEach(b=>{
        b.onclick = async (e)=>{
          e.stopPropagation();
          if(editMode) return;
          if(!setPeriodo(b.dataset.p)) return;
          await saveState();
          render();
          /* Si el selector estaba dentro de una hoja abierta, se repinta ella
             también para no quedarse con las cifras del periodo anterior. */
          if(typeof rerender === 'function') rerender();
        };
      });
    });
  }
  function bindSalaryAskConfig(rerender, accId){
    const N = nomCfg(accId);
    const dayEl = document.getElementById('askDayInput');
    const timeEl = document.getElementById('askTimeInput');
    const row = document.getElementById('askToggleRow');
    if(dayEl) dayEl.onchange = async ()=>{
      const v = parseInt(dayEl.value,10);
      N.salaryAsk.day = Math.min(Math.max(isNaN(v)?1:v, 1), 31);
      await saveState(); rerender();
    };
    if(timeEl) timeEl.onchange = async ()=>{
      const parts = String(timeEl.value||'').split(':');
      N.salaryAsk.hour = Math.min(Math.max(parseInt(parts[0],10)||0,0),23);
      N.salaryAsk.minute = Math.min(Math.max(parseInt(parts[1],10)||0,0),59);
      await saveState(); rerender();
    };
    if(row) row.onclick = async ()=>{
      N.salaryAsk.enabled = !(N.salaryAsk.enabled !== false);
      await saveState();
      showToast(N.salaryAsk.enabled
        ? 'Te preguntaré el sueldo cada mes.'
        : 'Ya no te preguntaré el sueldo. Los meses nuevos contarán como 0 €.');
      rerender();
    };
  }


  /* ---- Registrar una inversión ----
     Solo desde un neo banco: se elige qué se compra, cuánto se mete, lo que
     cobra el bróker por la operación y una nota para acordarse. */
  const INV_TIPOS = [
    {id:'accion',   label:'Acción',   icon:'trending'},
    {id:'etf',      label:'ETF',      icon:'chartBar'},
    {id:'bono',     label:'Bono',     icon:'receipt'},
    {id:'cripto',   label:'Cripto',   icon:'chip'},
    {id:'liquidez', label:'Liquidez', icon:'coin'},
    {id:'manual',   label:'Manual',   icon:'edit'},
    {id:'otro',     label:'Otro',     icon:'sparkle'},
  ];
  /* Una pregunta por pantalla, como el resto de asistentes: primero qué se
     compra, luego cuánto, luego lo que cobra el bróker y al final una nota
     con el resumen. Elegir el tipo ya pasa solo a la siguiente pantalla. */
  function openInvestSheet(accId, nombreCuenta){
    const meta = accountMeta(accId);
    const titulo = nombreCuenta || meta.label;
    const d = {tipo:null, amount:'', fee:'', note:''};
    const PASOS = ['tipo','cantidad','coste','nota'];
    const CAMPO = {cantidad:'amount', coste:'fee', nota:'note'};
    const TIT = {tipo:'¿Qué tipo de inversión?', cantidad:'¿Cuánto inviertes?', coste:'¿Tiene coste la operación?', nota:'¿Algún concepto?'};
    const SUB = {tipo:'', cantidad:'', coste:'Opcional', nota:'Opcional'};
    let i = 0;
    const etiqueta = ()=> (INV_TIPOS.find(t=>t.id === d.tipo) || INV_TIPOS[0]).label;
    const tieneCoste = ()=> parseFloat(d.fee) > 0;
    const lee = ()=>{ const el = sheetBody.querySelector('#invIn'); if(el && CAMPO[PASOS[i]]) d[CAMPO[PASOS[i]]] = el.value; };
    const ok = ()=> PASOS[i] === 'tipo' ? !!d.tipo : PASOS[i] === 'cantidad' ? parseFloat(d.amount) > 0 : true;

    function cuerpo(p){
      if(p === 'tipo') return `<div class="inv-tipos">${INV_TIPOS.map(t=>
        `<button type="button" class="inv-tipo ${d.tipo===t.id?'active':''}" data-invtipo="${t.id}">
           <span class="it-ico">${ic(t.icon,18)}</span><span>${t.label}</span></button>`).join('')}</div>`;
      if(p === 'cantidad') return `<div class="tf-field" id="invWrap">
          <input type="number" inputmode="decimal" id="invIn" class="inv-big" placeholder="0.00" value="${escapeHTML(d.amount)}">
        </div>
        `;
      if(p === 'coste') return `<input type="number" inputmode="decimal" id="invIn" class="inv-big" placeholder="0.00" value="${escapeHTML(d.fee)}">
        `;
      return `<input type="text" id="invIn" maxlength="70" placeholder="Ej. 3 acciones de Biotricity, aportación al MSCI World…" value="${escapeHTML(d.note)}">
        `;
    }
    function draw(){
      const p = PASOS[i], ultimo = i === PASOS.length - 1;
      const textoSig = ultimo ? 'Revisar' : (p === 'coste' && !tieneCoste() ? 'Sin coste' : 'Continuar');
      openOverlay(`<div class="w-pasos">${PASOS.map((x,n)=>`<i class="${n<i?'ok':n===i?'on':''}"></i>`).join('')}</div>
        <div class="w-cuenta">${ic('trending',13)} ${escapeHTML(titulo)}</div>
        <h3>${TIT[p]}</h3>
        <div class="step-label metal-text">Paso ${i+1} de ${PASOS.length}${SUB[p] ? ' · ' + SUB[p] : ''}</div>
        ${cuerpo(p)}
        <div class="sheet-actions">
          <button class="ghost-btn" id="invBack">${i === 0 ? 'Cancelar' : 'Atrás'}</button>
          ${p === 'tipo' ? '' : `<button class="primary-btn glass-tap ${ok()?'':'is-locked'}" id="invNext" style="margin-top:0;">${textoSig}</button>`}
        </div>`);
      const inp = sheetBody.querySelector('#invIn');
      const next = sheetBody.querySelector('#invNext');
      if(inp){
        setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 80);
        inp.addEventListener('input', ()=>{
          lee();
          if(!next) return;
          next.classList.toggle('is-locked', !ok());
          if(p === 'coste') next.textContent = tieneCoste() ? 'Continuar' : 'Sin coste';
          if(p === 'cantidad' && ok()){ clearInvalid(inp); const w = sheetBody.querySelector('#invWrap'); if(w) w.classList.remove('ring-alert'); }
        });
        inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); if(next) next.click(); } });
      }
      sheetBody.querySelectorAll('[data-invtipo]').forEach(el=>{
        el.onclick = ()=>{ d.tipo = el.dataset.invtipo; i++; draw(); };
      });
      sheetBody.querySelector('#invBack').onclick = ()=>{ lee(); if(i === 0){ closeOverlay(); return; } i--; draw(); };
      if(next) next.onclick = ()=>{
        lee();
        if(!ok()){
          const w = sheetBody.querySelector('#invWrap');
          if(w) w.classList.add('ring-alert');
          if(inp) markInvalid(inp, 'Escribe cuánto quieres invertir');
          return;
        }
        if(!ultimo){ i++; draw(); return; }
        abreTicket({
          titulo: 'Inversión', icono: (INV_TIPOS.find(t=>t.id === d.tipo) || INV_TIPOS[0]).icon,
          importe: fmt(+parseFloat(d.amount).toFixed(2)),
          filas: [['Sale de', titulo], ['Tipo', etiqueta()],
                  ['Coste', tieneCoste() ? fmt(+parseFloat(d.fee).toFixed(2)) : 'Sin coste'], ['Concepto', d.note]],
          confirmar: 'Invertir', onVolver: draw, onConfirmar: guardar,
        });
      };
    }
    async function guardar(){
      const tipo = d.tipo || 'accion';
      const comision = Math.max(parseFloat(d.fee) || 0, 0);
      const nota = (d.note || '').trim();
      const et = etiqueta();
      const cantidad = +parseFloat(d.amount).toFixed(2);
      const stamp = Date.now();
      const uid = s=> 'inv' + s + stamp.toString(36) + Math.random().toString(36).slice(2,6);
      state.transactions.push({
        id: uid('a'), ts: stamp, account: accId, kind:'gasto', category:'Inversión',
        description: nota || et, note: nota, invType: tipo, invLabel: et,
        fee: +comision.toFixed(2), amount: cantidad, remaining: 0, compensated: false,
      });
      adjustAccount(accId, -cantidad);
      if(comision > 0){
        state.transactions.push({
          id: uid('c'), ts: stamp + 1, account: accId, kind:'gasto', category:'Comisión',
          description: 'Coste de la operación · ' + et, note: nota,
          amount: +comision.toFixed(2), remaining: +comision.toFixed(2), compensated: false,
        });
        adjustAccount(accId, -comision);
      }
      await saveState(); closeOverlay(); render();
      showToast(`${fmt(cantidad)} invertidos en ${et}${comision > 0 ? ' · ' + fmt(comision) + ' de coste' : ''}.`);
    }
    draw();
  }

  function renderCarteras(){
    const stats = computeStatsBanco();
    if(walletTab === 'patrimonio') walletTab = 'plataformas';

    /* Nóminas y neo bancos que has creado tú desde los bloques predeterminados. */
    let nomExtra = walletTab.startsWith('nomina:') ? (state.nominas || []).find(n=>'nomina:' + n.id === walletTab) : null;
    let neoGrupo = walletTab.startsWith('neo:') ? (state.neoGroups || []).find(g=>'neo:' + g.id === walletTab) : null;
    if((walletTab.startsWith('nomina:') && !nomExtra) || (walletTab.startsWith('neo:') && !neoGrupo)) walletTab = 'nomina';
    const nomAcc = walletTab === 'nomina' ? 'banco' : (nomExtra ? walletTab : null);
    const platsVista = state.platforms.filter(p=>(p.group || null) === (neoGrupo ? neoGrupo.id : null));
    const btnQuitar = nombre => `<button class="ghost-btn glass-tap" id="removeWalletBtn" style="width:100%;margin-top:14px;color:var(--danger);">${ic('trash',14)} Eliminar "${escapeHTML(nombre)}"</button>`;

    const openWallet = state.wallets.find(w=>w.id === walletTab);
    let bloques = [];
    let body = '';
    if(nomAcc){
      bloques = [
        {id:'nomina', name: nomExtra ? nomExtra.name : LT('nomina.titulo','Nómina'),
         html: nominaCardBody(computeStatsBanco(undefined, nomAcc), nomAcc, nomExtra && nomExtra.name) + (nomExtra ? btnQuitar(nomExtra.name) : '')},
      ];
    } else if(openWallet){
      /* Efectivo es fija: viene de serie y no se puede quitar. Los movimientos
         se añaden con el botón redondo de abajo, así que la cartera no repite
         esos botones. */
      const fija = false;   /* Efectivo también se puede borrar */
      body = walletCardBody(openWallet.id, openWallet.balance, openWallet.name, openWallet.icon)
        + (fija ? '' :
            `<button class="ghost-btn glass-tap" id="removeWalletBtn" style="width:100%;margin-top:14px;color:var(--danger);">${ic('trash',14)} Eliminar "${escapeHTML(openWallet.name)}"</button>`);
    } else if(walletTab==='plataformas' || neoGrupo){
      /* Las tarjetas van apiladas como en una cartera de verdad: solo se ve el
         canto de cada una. Al tocar una se abre su detalle en una hoja. */
      const platSumAll = platsVista.reduce((s,p)=>s+p.balance,0);
      /* Lo que se ha movido en los neo bancos dentro del tramo elegido, para
         que el selector también mande en esta pestaña y no solo dentro de la
         hoja de cada tarjeta. */
      const rNeo = cartRango();
      let entraNeo = 0, saleNeo = 0;
      const idsVista = new Set(platsVista.map(p=>'platform:' + p.id));
      state.transactions.forEach(t=>{
        if(!idsVista.has(t.account)) return;
        if(t.ts < rNeo.from || t.ts > rNeo.to) return;
        if(t.kind === 'ingreso') entraNeo += t.amount; else saleNeo += t.amount;
      });
      bloques = [
        {id:'total', name:LT('neo.total','Total en neo bancos'), html:`<div class="wallet-lead">
          <div class="pc-head">
            <span class="ct-ico" style="--ct-c:#0A84FF">${ic('card',20)}</span>
            <div class="wl-k">${neoGrupo ? 'Total en ' + escapeHTML(neoGrupo.name) : L('neo.total','Total en neo bancos')}</div>
          </div>
          <div class="wl-v" id="platTotalNum">${fmt(platSumAll)}</div>
          <div class="wl-s">${platsVista.length} ${platsVista.length===1?'cuenta':'cuentas'}</div>
          ${variacionHTML(+(entraNeo - saleNeo).toFixed(2),
             {totalEnt:+entraNeo.toFixed(2), totalSal:+saleNeo.toFixed(2), totalInv:0}, rNeo)}
        </div>`},
        {id:'tarjetas', name:'Tarjetas', html:`<div class="platform-cards stack ${platsVista.length>1?'apilada':''} ${cardsSpread?'abierta':''} ${platDealt?'no-deal':''}" id="platStack">
          ${platsVista.map(p=>platformCardHTML(p, armedPlatformId===p.id, deletingPlatformId===p.id)).join('')}
        </div>`
          + (platsVista.length>1
              ? `<button type="button" class="cards-toggle ${cardsSpread?'on':''}" id="cardsToggle">
                   <i class="ct-chev">${ic('chevronRight',12)}</i>${cardsSpread?'Volver a apilar':'Separar las tarjetas'}
                 </button>`
              : '')},
        {id:'acciones', name:'Botones', html:`<div class="wallet-btn-row" style="margin-top:16px;">
          <button class="primary-btn glass-tap" id="addPlatformBtn" style="margin-top:0;">${ic('plus',15)} ${neoGrupo ? 'Añadir tarjeta' : 'Añadir neo banco'}</button>
        </div>${neoGrupo ? btnQuitar(neoGrupo.name) : ''}`},
      ];
    }
    /* Nómina y Neo bancos son fijos: van marcados y no se borran. Las carteras
       que creas tú llevan otro diseño para distinguirlas. El capital total vive
       ahora en el chip "Total" de arriba. */
    const fixedTab = (id, label, icon, key) =>
      `<div class="wallet-tab fixed ${walletTab===id?'active':''}" data-w="${id}">${ic(icon,12)} ${L(key,label)}</div>`;
    /* Efectivo va con Nómina y Neo bancos: es un bloque de serie, no una
       cartera que hayas creado tú, así que lleva su icono y no se borra. */
    /* Orden fijo: primero los neo bancos, luego la nómina y después el resto. */
    /* Las fijas van primero y rellenas; lo que creas tú va detrás, sin
       relleno, con el icono pequeño del tipo de bloque del que nació. */
    const customTab = (id, label, icon) =>
      `<div class="wallet-tab custom ${walletTab===id?'active':''}" data-w="${escapeHTML(id)}"><i class="wt-tipo">${ic(icon,11)}</i>${escapeHTML(label)}</div>`;
    const tabsHTML = [fixedTab('nomina','Nómina','bank','tab.nomina'),
                      fixedTab('plataformas','Neo bancos','card','tab.neo')]
      .concat((state.nominas || []).map(n=>customTab('nomina:' + n.id, n.name, 'bank')))
      .concat((state.neoGroups || []).map(g=>customTab('neo:' + g.id, g.name, 'card')))
      .concat(state.wallets.map(w=>customTab(w.id, w.name, w.icon || 'wallet')))
      .join('');
    if(!bloques.length && body) bloques = [{id:'contenido', name:'Contenido', html:body}];
    const scope = 'carteras-' + walletTab;
    /* El "+" vive fuera del carrusel: las pestañas se deslizan por debajo de él
       y el botón nunca se va de la pantalla. */
    root.innerHTML = `<div class="wallet-tabs-wrap">
        <div class="wallet-tabs scrollable">${tabsHTML}</div>
        <div class="wallet-tab add" id="addWalletTab" role="button" tabindex="0" title="Tus carteras">${ic('plus',15)}</div>
      </div>`
      + segBarraHTML('cart')
      + renderBloques(scope, bloques);
    bindBloques(scope, root);
    /* Al cambiar de pestaña las tarjetas vuelven a repartirse la próxima vez
       que entres en Neo bancos. */
    root.querySelectorAll('.wallet-tab[data-w]').forEach(el=>{ el.onclick = ()=>{
      if(editMode) return;
      if(walletTab !== el.dataset.w) platDealt = false;
      walletTab = el.dataset.w; renderCarteras();
    }; });
    root.querySelectorAll('.saldo-num, .analysis-total, .wl-v').forEach(fitBigNumber);
    if(document.getElementById('addWalletTab')){
      const mas = document.getElementById('addWalletTab');
      mas.onclick = ()=>{ if(!editMode) openAddWallet(); };
      mas.onkeydown = (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if(!editMode) openAddWallet(); } };
    }
    bindTabsScroll(root.querySelector('.wallet-tabs.scrollable'));
    /* La pestaña en la que estás siempre a la vista, aunque la barra se haya
       quedado desplazada del repintado anterior. Se mueve lo justo: si ya se
       ve entera, no se toca. */
    const activa = root.querySelector('.wallet-tab.active');
    if(activa && activa.scrollIntoView) activa.scrollIntoView({block:'nearest', inline:'nearest'});
    if(document.getElementById('platTotalNum')) animateNumber('platTotalNum', platsVista.reduce((s,p)=>s+p.balance,0), 'lastPlatTotal');
    bindSegPeriodo(root, null);
    if(document.getElementById('removeWalletBtn')) document.getElementById('removeWalletBtn').onclick = ()=>confirmRemoveWallet(walletTab);
    if(document.getElementById('salaryMonthInput')){
      const el = document.getElementById('salaryMonthInput');
      el.onchange = async ()=>{
        const v = parseFloat(el.value);
        setSalaryForMonth(isNaN(v) ? 0 : Math.max(v,0), undefined, nomAcc || 'banco');
        await saveState(); render();
      };
    }
    bindConsolidadoCard(root);
    bindSalaryAskConfig(renderCarteras, nomAcc || 'banco');
    bindNominaAjustes(renderCarteras, nomAcc || 'banco');
    bindDesglose(root);
    if(document.getElementById('addPlatformBtn')) document.getElementById('addPlatformBtn').onclick = ()=>openAddPlatform(neoGrupo ? neoGrupo.id : null);
    if(document.getElementById('cardsToggle')) document.getElementById('cardsToggle').onclick = ()=>{
      if(editMode) return;
      cardsSpread = !cardsSpread;
      const stack = document.getElementById('platStack');
      const btn = document.getElementById('cardsToggle');
      if(stack) stack.classList.toggle('abierta', cardsSpread);
      if(btn){
        btn.classList.toggle('on', cardsSpread);
        btn.lastChild.textContent = cardsSpread ? 'Volver a apilar' : 'Separar las tarjetas';
      }
    };
    /* La tarjeta entera es el botón: un toque abre su hoja y mantenerla pulsada
       la arma para borrarla. El orden de estas guardas es lo que impide que un
       pulsado largo abra además el detalle. */
    root.querySelectorAll('[data-pid]').forEach(el=>{
      attachLongPress(el, ()=>{ armedPlatformId = el.dataset.pid; renderCarteras(); });
      el.addEventListener('click', ()=>{
        if(wasLongPress(el)) return;
        if(armedPlatformId===el.dataset.pid){ armedPlatformId=null; renderCarteras(); return; }
        if(editMode) return;
        openPlatSheet(el.dataset.pid);
      });
      el.addEventListener('keydown', (e)=>{
        if(editMode) return;
        if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPlatSheet(el.dataset.pid); }
      });
    });
    /* Con el dedo no hay "hover": la tarjeta que tengas debajo mientras lo
       deslizas se levanta y las demás se apagan un poco. No bloquea el scroll. */
    const pila = document.getElementById('platStack');
    if(pila){
      let actual = null;
      const marca = el=>{
        if(el === actual) return;
        if(actual) actual.classList.remove('lift');
        actual = el;
        if(el) el.classList.add('lift');
        pila.classList.toggle('lifting', !!el);
      };
      const bajo = (x, y)=>{ const e = document.elementFromPoint(x, y); return e ? e.closest('#platStack .metal-card') : null; };
      pila.addEventListener('touchstart', e=>{ const t = e.touches[0]; marca(bajo(t.clientX, t.clientY)); }, {passive:true});
      pila.addEventListener('touchmove', e=>{ const t = e.touches[0]; marca(bajo(t.clientX, t.clientY)); }, {passive:true});
      ['touchend','touchcancel'].forEach(ev=>pila.addEventListener(ev, ()=>setTimeout(()=>marca(null), 180), {passive:true}));
    }
    /* A partir de aquí las tarjetas ya están repartidas: no se vuelven a
       repartir mientras sigas en Neo bancos. */
    if(walletTab === 'plataformas' || neoGrupo) platDealt = true;
    root.querySelectorAll('[data-delconfirm-p]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const id = el.dataset.delconfirmP;
        deletingPlatformId = id; renderCarteras();
        setTimeout(async ()=>{
          const removed = state.platforms.find(p=>p.id===id);
          state.platforms = state.platforms.filter(p=>p.id!==id);
          armedPlatformId=null; deletingPlatformId=null;
          await saveState(); render();
          if(removed){
            showUndoToast('Neo banco eliminado', async ()=>{
              state.platforms.push(removed);
              await saveState(); render();
            });
          }
        }, 420);
      };
    });
  }

  /* ============ SUSCRIPCIONES TAB ============ */
  const URGENCY = {
    due:   {hex:'#FF3B30', label:'Toca pagar'},
    soon:  {hex:'#FF9500', label:'Muy pronto'},
    near:  {hex:'#0A84FF', label:'Esta semana'},
    ok:    {hex:'#34C759', label:'Al día'},
    libre: {hex:'#8E8E93', label:'Sin fecha'},
  };
  function toDateInput(ts){
    const d = new Date(ts);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }
  function fromDateInput(v){
    const parts = String(v||'').split('-').map(Number);
    if(parts.length !== 3 || !parts[0]) return null;
    return new Date(parts[0], parts[1]-1, parts[2], 12, 0, 0).getTime();
  }
  /* Anillo de progreso con relieve, usado en cada suscripción. */
  function ringGauge(progress, hex, size, stroke){
    size = size || 60; stroke = stroke || 6;
    const r = (size-stroke)/2, c = 2*Math.PI*r, uid = ++svgUidCounter;
    const end = (c - clamp01(progress)*c).toFixed(2);
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="ring-gauge">
      <defs>
        <linearGradient id="rg${uid}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="${shadeHex(hex,70)}"/><stop offset="48%" stop-color="${hex}"/><stop offset="100%" stop-color="${shadeHex(hex,-56)}"/>
        </linearGradient>
        <filter id="rgs${uid}" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#1c1c1e" flood-opacity="0.32"/>
        </filter>
      </defs>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(20,23,20,.10)" stroke-width="${stroke}"/>
      <circle class="rg-fill" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="url(#rg${uid})"
        stroke-width="${stroke}" stroke-linecap="round" transform="rotate(-90 ${size/2} ${size/2})"
        filter="url(#rgs${uid})" style="--rg-c:${c.toFixed(2)};--rg-end:${end};"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="${(stroke*0.2).toFixed(2)}"
        transform="rotate(-90 ${size/2} ${size/2})" style="pointer-events:none;"/>
    </svg>`;
  }

  /* ---- Una suscripción o una inversión, como desplegable ----
     Cerrada enseña lo justo: cuánto falta, qué es y cuánto cuesta. Al tocarla
     baja el detalle con las fechas, lo pagado y los botones. */
  /* ---- Lo pagado contra lo que queda ----
     Dos columnas dentro de la tarjeta, que se van moviendo con cada pago.
     La izquierda es todo lo que ya has pagado de este bloque. La derecha, lo
     que te queda:
       · un pago puntual sin cobrar enseña su importe, y al pagarlo esa columna
         desaparece: queda solo la de lo pagado, que es el final de la historia;
       · cualquier otro enseña el siguiente cobro y solo ese, porque sin fecha
         de final no hay forma de saber el total y proyectar "para siempre"
         sería inventárselo. */
  function subBarrasHTML(sub){
    const hist = subHistory(sub);
    const pagado = hist.total;
    const completada = subCompletada(sub);
    const puntual = subPuntual(sub);
    const pendiente = completada ? 0 : +Number(sub.amount || 0).toFixed(2);
    const tope = Math.max(pagado, pendiente, 0.01);
    const pie = completada
      ? 'Pago único completado: ya no queda nada por pagar.'
      : puntual ? 'Pago único: en cuanto lo pagues solo quedará la columna de la izquierda.'
      : subLibre(sub) ? 'Sin fecha fija: a la derecha, lo que costará la próxima vez que lo apuntes.'
      : 'A la derecha va solo el siguiente cobro: este bloque no tiene fecha de final.';
    const col = (clase, etiqueta, valor, nota) => `<div class="sb-col">
        <div class="sb-tubo"><span class="sb-barra ${clase}" style="--h:${((valor/tope)*100).toFixed(1)}%"></span></div>
        <div class="sb-v">${fmt(valor)}</div>
        <div class="sb-k">${etiqueta}</div>
        <div class="sb-n">${escapeHTML(nota)}</div>
      </div>`;
    /* Una cita cuyo coste todavía no sabes no tiene nada que poner en la
       columna de la derecha: sin cifra no hay barra que dibujar, así que se
       queda con una sola y se dice por qué. */
    const sinCifra = citaSinCoste(sub) && !completada;
    const pieFinal = sinCifra
      ? 'Todavía no sabes lo que va a costar: cuando llegue el día te lo preguntaré.'
      : pie;
    return `<div class="sub-barras ${sinCifra?'sola':''}">
      <div class="sb-h">${ic('chartBar',12)} Pagado y pendiente</div>
      <div class="sb-plot">
        ${col('ok','Ya pagado', pagado, hist.count ? hist.count + (hist.count===1?' cobro':' cobros') : 'todavía nada')}
        ${sinCifra ? `<div class="sb-col sb-sin">
            <div class="sb-tubo"><span class="sb-interr">${ic('warning',18)}</span></div>
            <div class="sb-v">—</div>
            <div class="sb-k">Por pagar</div>
            <div class="sb-n">sin definir</div>
          </div>`
          : col('falta','Por pagar', pendiente, completada ? 'nada' : (puntual ? 'pago único' : 'siguiente cobro'))}
      </div>
      <div class="sb-pie">${ic('bolt',11)} ${escapeHTML(pieFinal)}</div>
    </div>`;
  }

  function subCardHTML(sub, sr){
    const u = subUrgency(sub);
    const uc = URGENCY[u];
    const cyc = cycleOf(sub.cycle);
    const libre = subLibre(sub);
    const completada = subCompletada(sub);
    const vencida = subVencida(sub);
    /* Vencida y sin cobro automático: eso es una acción tuya pendiente. */
    const manual = vencida && sub.autoCharge === false;
    const abierta = openSubId === sub.id;
    const armed = armedSubId === sub.id, deleting = deletingSubId === sub.id;
    const esInv = sub.kind === 'inversion';
    const icon = esInv ? 'trending' : getCatIcon(sub.category, 'gasto');
    /* Lo pagado se cuenta dentro del tramo elegido arriba; si no hay tramo,
       se enseña todo el historial de esa suscripción. */
    const hist = (sr && sr.porSub)
      ? (sr.porSub[sub.id] || {count:0, total:0})
      : subHistory(sub);
    const tramo = sr && sr.rango ? sr.rango.texto : null;
    const dias = daysUntil(sub.nextTs);
    /* Cuando se pasa la fecha, lo que importa no es que esté pendiente: es
       cuánto llevas sin pagarlo. Ese número manda en la rueda y se repite en
       rojo en el texto. */
    const retraso = (!libre && !completada && dias < 0) ? Math.abs(dias) : 0;
    const bigNum = completada ? '✓' : libre ? '·' : (retraso ? retraso : dias);
    const ultimo = sub.lastChargedTs ? fmtDateShort(sub.lastChargedTs) : null;
    /* El texto de la izquierda empieza siempre por "Pago", para que se lea de
       corrido con la fecha que tiene enfrente. */
    const proximo = completada ? 'Pago único completado'
      : libre ? 'Pago cuando tú quieras'
      : retraso ? 'Pago pendiente'
      : dias === 0 ? 'Pago hoy'
      : dias === 1 ? 'Pago mañana'
      : 'Pago en ' + dias + ' días';
    /* La cabecera ya no es un <button>: el lápiz vive dentro de ella y un botón
       no puede llevar otro botón dentro. Con role y tabindex se sigue pudiendo
       abrir con el teclado. */
    return `<div class="sub-card ${abierta?'open':''} ${deleting?'deleting':''}" data-subid="${sub.id}" style="--su:${uc.hex};">
      <div class="sub-head" role="button" tabindex="0" data-subopen="${sub.id}">
        <div class="sub-main">
          <div class="sub-ring">
            ${ringGauge(libre ? 0 : subCycleProgress(sub), uc.hex, 62, 6)}
            <div class="sub-ring-num ${retraso?'tarde':''} ${completada?'hecho':''}"><b>${bigNum}</b><span>${
              completada ? 'pagado' : libre ? 'libre'
              : retraso ? (retraso===1?'día tarde':'días tarde') : (dias===1?'día':'días')}</span></div>
          </div>
          <div class="sub-info">
            <div class="sub-name">${escapeHTML(sub.name)}</div>
            <div class="sub-meta">
              ${esInv ? `<span class="sub-chip inv">${ic('trending',11)} ${escapeHTML(sub.invLabel || 'Inversión')}</span>` : ''}
              ${(!esInv && sub.otroLabel) ? `<span class="sub-chip">${ic('sparkle',11)} ${escapeHTML(sub.otroLabel)}</span>` : ''}
              ${(sub.category && !(esInv && sub.category==='Inversión'))
                ? `<span class="sub-chip">${ic(icon,11)} ${escapeHTML(sub.category)}</span>` : ''}
              <span class="sub-chip">${ic('repeat',11)} ${cyc.label}</span>
            </div>
          </div>
          <div class="sub-amount">
            <b>${citaSinCoste(sub) ? 'Sin definir' : fmt(sub.amount)}</b>
            <span>${citaSinCoste(sub) ? 'coste por decidir' : libre ? 'por aportación' : cyc.short}</span>
          </div>
          <div class="sub-tools">
            <button type="button" class="sub-edit glass-tap" data-subedit="${sub.id}" title="Editar" aria-label="Editar">${ic('edit',14)}</button>
            <i class="sub-chev">${ic('chevronRight',14)}</i>
          </div>
        </div>
      </div>
      <div class="sub-drop">
        ${manual ? `<div class="sub-alerta"><span class="sa-ico">${ic('warning',14)}</span>
            <span class="sa-tx">Este pago <b>ya tocaba</b> y lo apuntas tú: dale a <b class="rojo">Pagar ahora</b> cuando lo hayas pagado.</span></div>` : ''}
        ${retraso ? `<div class="sub-retraso">${ic('warning',13)}
          <b>${retraso} día${retraso===1?'':'s'} sin pagar</b>
          <span>vencía el ${escapeHTML(fmtDateShort(sub.nextTs))}</span>
        </div>` : ''}
        <div class="sub-status">
          <span class="sub-when ${retraso?'tarde':''}">${ic('clock',12)} ${proximo}</span>
          <span class="sub-date">${ultimo ? 'Pago realizado el ' + ultimo : 'Sin pagos todavía'}</span>
        </div>
        ${sub.note?`<div class="sub-note">${escapeHTML(sub.note)}</div>`:''}
        <div class="sub-facts">
          ${libre ? '' : citaSinCoste(sub)
            ? `<span>${ic('clock',11)} coste sin definir todavía</span>`
            : subPuntual(sub)
              ? `<span>${ic('calendar',11)} ${fmt(sub.amount)} una sola vez</span>`
              : `<span>${ic('calendar',11)} ${fmt(subYearlyCost(sub))} al año</span>`}
          ${esInv && sub.units ? `<span>${ic('chartBar',11)} ${sub.units} en cada compra${sub.fee ? ' · ' + fmt(sub.fee) + ' de comisión' : ''}</span>` : ''}
          ${hist.count
            ? `<span>${ic('check',11)} ${hist.count} pago${hist.count===1?'':'s'} · ${fmt(hist.total)}${tramo ? ' en ' + escapeHTML(tramo) : ' ya pagado'}</span>`
            : (tramo ? `<span>${ic('clock',11)} sin pagos en ${escapeHTML(tramo)}</span>` : '')}
          ${(libre || completada) ? '' : `<span>${ic('calendar',11)} siguiente el ${fmtDateShort(sub.nextTs)}</span>`}
          <span>${ic('wallet',11)} sale de ${escapeHTML(accountMeta(sub.account).label)}</span>
        </div>
        ${subBarrasHTML(sub)}
        <div class="sub-actions">
          ${completada ? '' : `<button class="sub-btn primary glass-tap ${vencida?'toca':''}" data-subpay="${sub.id}">${ic('check',13)} Pagar ahora</button>`}
          ${(libre || completada) ? '' : `<button class="sub-btn glass-tap aplazar" data-subdelay="${sub.id}">${ic('clock',13)} Aplazar</button>`}
          <button class="sub-btn glass-tap reembolso" data-subrefund="${sub.id}">${ic('repeat',13)} Reembolsar</button>
          ${(vencida || completada) ? `<button class="sub-btn glass-tap finalizar" data-subend="${sub.id}">${ic('check',13)} Finalizar</button>` : ''}
        </div>
      </div>
      ${armed?`<div class="row-delete-overlay"><span class="del-confirm-btn glass-tap" data-delconfirm-sub="${sub.id}">${ic('trash',13)} Eliminar</span></div>`:''}
    </div>`;
  }

  /* ---- Las tres pantallas deslizables del coste recurrente ----
     Lo pagado, lo vencido y lo que viene no se mezclan: cada estado lleva su
     propia rueda y sus propias barras, y así el porcentaje de cada barra es
     exactamente el trozo que ocupa en la rueda que tienes delante. Dentro de
     cada rueda, las suscripciones van por un lado y las inversiones por otro,
     y en cada mitad hay una porción por categoría. */
  const SR_MITADES = [
    {key:'subs', id:'srSub', side:'left',  label:'Suscripciones', hex:'#FF9F0A', clave:'out',
     vacio:'Ninguna suscripción en este tramo.'},
    {key:'invs', id:'srInv', side:'right', label:'Inversiones',   hex:'#5E5CE6', clave:'inv',
     vacio:'Ninguna aportación en este tramo.'},
  ];
  let srEstado = 0;            /* cuál de las tres se está viendo ahora mismo */
  function srPantallaHTML(e, r, tot, idx, total){
    const g = e.grupos;
    const mitades = SR_MITADES.map(d=>{
      const items = (d.key === 'subs' ? g.subs : g.invs).map((x,i)=>Object.assign({}, x, {adid:d.id+i}));
      return {id:d.id, side:d.side, label:d.label, hex:d.hex, clave:d.clave, vacio:d.vacio,
        total: d.key === 'subs' ? g.totalSub : g.totalInv, items};
    });
    const rueda = g.total > 0
      ? annotatedDonutSVG(mitades, g.total, {numId:'srNum_'+e.key, centroK:e.label, centroV:fmt(e.total)})
      : adVaciaSVG(e.vacio);
    /* Deslizando entre tres ruedas parecidas es fácil perder de vista cuál
       tienes delante. Esta banda lo dice con todas las letras, con el color y
       el icono del estado y la posición dentro del carrusel. */
    const banda = `<div class="sr-banda">
      <span class="sb-ico">${ic(e.icon,13)}</span>
      <span class="sb-t"><b>${escapeHTML(e.label)}</b><i>${escapeHTML(e.nota)}</i></span>
      <span class="sb-pos">${(idx||0)+1} de ${total||3}</span>
    </div>`;
    return `<section class="sr-slide" data-srkey="${escapeHTML(e.key)}" style="--se:${e.hex};">
      ${banda}
      <div class="sr-top">
        <div class="sr-rueda">${rueda}</div>
        <div class="sr-cifras">
          <div class="saldo-label"><span class="pc-periodo">${e.cifra} · ${escapeHTML(r.texto)}</span></div>
          <div class="saldo-num">${fmt(e.total)}</div>
          <div class="pc-now">${e.cuenta} ${e.unidad}${e.cuenta===1?'':'s'} · <b>${tot.count}</b> activa${tot.count===1?'':'s'}</div>
        </div>
      </div>
      <div class="pc-gastos sr-barras">
        ${mitades.map(m=>pcSeccionHTML(m.clave, m.label, m.items, m.total, '', m.vacio, g.total, PC_TOPE)).join('')}
      </div>
    </section>`;
  }
  /* Deslizar con el dedo lo lleva el propio navegador; en el escritorio hace
     falta poder arrastrar con el ratón y girar la rueda, como en la barra de
     carteras. Los puntitos llevan a cada pantalla de un toque. */
  function bindSrCarrusel(cont){
    const car = cont.querySelector('#srCarrusel');
    if(!car) return;
    const puntos = Array.prototype.slice.call(cont.querySelectorAll('[data-srp]'));
    const slides = Array.prototype.slice.call(car.querySelectorAll('.sr-slide'));
    if(!slides.length) return;
    /* ---- El bloque mide lo que mida la pantalla que estás viendo ----
       Se mide el alto de verdad del contenido de esa pantalla y se le pone al
       carrusel. Sin esto las tres medían lo que la más larga y en "pendientes"
       quedaba un palmo de bloque vacío debajo. */
    const ajustaAlto = (i, suave)=>{
      const s = slides[i];
      if(!s) return;
      if(!suave){
        const antes = car.style.transition;
        car.style.transition = 'none';
        car.style.height = s.offsetHeight + 'px';
        void car.offsetHeight;          /* fuerza el cambio sin animar */
        car.style.transition = antes || '';
      } else {
        car.style.height = s.offsetHeight + 'px';
      }
    };
    const marca = (i, suave)=>{
      srEstado = i;
      const cardEl = car.closest('.sr-card'), nx = slides[i + 1];
      if(cardEl){
        cardEl.style.setProperty('--sr-next-o', nx ? '1' : '0');
        if(nx) cardEl.style.setProperty('--sr-next', (nx.style.getPropertyValue('--se') || 'transparent').trim());
      }
      puntos.forEach((p,k)=>p.classList.toggle('on', k === i));
      ajustaAlto(i, suave !== false);
    };
    const irA = (i, suave)=>{
      i = Math.max(0, Math.min(slides.length-1, i));
      car.scrollTo({left: car.clientWidth * i, behavior: suave ? 'smooth' : 'auto'});
      marca(i, suave);
    };
    /* Se vuelve a la pantalla en la que estabas después de repintar, y ahí el
       alto se pone de golpe: animarlo en cada repintado daría un salto raro. */
    irA(srEstado, false);
    let tmr = null;
    car.addEventListener('scroll', ()=>{
      clearTimeout(tmr);
      tmr = setTimeout(()=>{
        const i = Math.round(car.scrollLeft / paso());
        if(i !== srEstado) marca(i, true);
        else ajustaAlto(i, true);
      }, 90);
    }, {passive:true});
    /* Al girar el móvil o cambiar el ancho, el contenido se reordena y el alto
       de antes deja de valer. */
    if(window.ResizeObserver){
      const ro = new ResizeObserver(()=>ajustaAlto(srEstado, false));
      slides.forEach(s=>ro.observe(s));
    }
    puntos.forEach(p=>{ p.onclick = ()=>{ if(editMode) return; irA(parseInt(p.dataset.srp,10), true); }; });
    /* Arrastre con el ratón. No se toca el táctil: ahí ya desliza solo. */
    let bajado = false, x0 = 0, sc0 = 0, movido = false;
    car.addEventListener('pointerdown', ev=>{
      if(ev.pointerType === 'touch' || editMode) return;
      bajado = true; movido = false; x0 = ev.clientX; sc0 = car.scrollLeft;
    });
    car.addEventListener('pointermove', ev=>{
      if(!bajado) return;
      const d = ev.clientX - x0;
      if(Math.abs(d) > 3){ movido = true; car.scrollLeft = sc0 - d; }
    });
    const suelta = ()=>{
      if(!bajado) return;
      bajado = false;
      if(movido) irA(Math.round(car.scrollLeft / paso()), true);
    };
    car.addEventListener('pointerup', suelta);
    car.addEventListener('pointercancel', suelta);
    car.addEventListener('pointerleave', suelta);
    /* La rueda del ratón en horizontal cambia de pantalla. */
    car.addEventListener('wheel', ev=>{
      if(editMode) return;
      if(Math.abs(ev.deltaX) <= Math.abs(ev.deltaY)) return;
      ev.preventDefault();
      clearTimeout(tmr);
      car.scrollLeft += ev.deltaX;
      tmr = setTimeout(()=>irA(Math.round(car.scrollLeft / paso()), true), 110);
    }, {passive:false});
    /* Cada rueda se enciende por su cuenta al tocar un trozo o un nombre. */
    slides.forEach(s=>bindConsolidadoCard(cont, s));
  }

  /* ============ HISTORIAL DE SUSCRIPCIONES ============
     Todo lo que ha pasado con las suscripciones y las aportaciones que se
     repiten, ordenado por meses y del mes más reciente hacia atrás. Cada línea
     es un hecho con su estado:

       · pagada      — el cobro ya se registró y está en tus gastos
       · por pagar   — el siguiente cobro, que todavía no ha llegado
       · sin pagar   — se pasó la fecha y no se ha cobrado (cobro automático off)
       · finalizada  — la diste de baja
       · reembolsada — la devolviste y el dinero volvió a la cuenta

     Los reembolsos se anotan aparte (state.subRefunds) porque al reembolsar se
     borra el movimiento y la suscripción: sin ese apunte no quedaría ni rastro
     de que aquello llegó a existir. */
  const SUB_ESTADOS = {
    pagada:      {label:'Pagada',      hex:'#248A3D', icon:'check'},
    porpagar:    {label:'Por pagar',   hex:'#0A84FF', icon:'clock'},
    sinpagar:    {label:'Sin pagar',   hex:'#FF3B30', icon:'warning'},
    finalizada:  {label:'Finalizada',  hex:'#8E8E93', icon:'archive'},
    reembolsada: {label:'Reembolsada', hex:'#FF9500', icon:'undo'},
    aplazada:    {label:'Aplazada',    hex:'#5E5CE6', icon:'clock'},
  };
  let subHistFiltro = 'todo';
  let subHistFrom = '', subHistTo = '', subHistLimit = 30;

  function subEventos(){
    const out = [];
    const esInv = s => s && s.kind === 'inversion';
    /* 1 · Cobros ya registrados: son movimientos de verdad con su subId. */
    state.transactions.filter(t=>t.subId).forEach(t=>{
      const sub = state.subscriptions.find(x=>x.id === t.subId);
      out.push({ts:t.ts, estado:'pagada', tipo: esInv(sub) || txEsInversion(t) ? 'inversion' : 'suscripcion',
        nombre: (sub ? sub.name : null) || t.description || 'Suscripción',
        amount: t.amount, detalle: t.category + ' · ' + accountMeta(t.account).label, subId:t.subId});
    });
    /* 2 · Reembolsos anotados. */
    (state.subRefunds || []).forEach(x=>{
      out.push({ts:x.ts, estado:'reembolsada', tipo:x.tipo || 'suscripcion',
        nombre:x.name, amount:x.amount, detalle:'Devuelto a ' + x.cuenta, subId:x.subId});
    });
    /* 2b · Aplazamientos: de qué día a qué día se movió el cobro. */
    (state.subDelays || []).forEach(x=>{
      out.push({ts:x.ts, estado:'aplazada', tipo:x.tipo || 'suscripcion',
        nombre:x.name, amount:x.amount, subId:x.subId,
        detalle:'Movido del ' + fmtDateShort(x.de) + ' al ' + fmtDateShort(x.a)});
    });
    /* 3 · Lo que queda por cobrar de las que siguen vivas. */
    const hoy0 = startOfDay(Date.now());
    activeSubs().filter(s=>!subLibre(s)).forEach(s=>{
