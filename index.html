  box-shadow:0 0 0 2px var(--chrome-strong);font-variant-numeric:tabular-nums;
}
.nav-item .ni-badge.due{background:var(--danger);animation:niPulse 1.8s var(--ease-in-out) infinite;}
@keyframes niPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.14);}}

/* ---- Una nota dentro de "Movimientos del día" ---- */
/* La nota lleva dos botones a la derecha además del importe. En cuanto el
   nombre se quedaría sin sitio, la fila se parte en dos líneas en lugar de
   cortar el texto. */
.dm-row.nota{border-style:dashed;flex-wrap:wrap;row-gap:7px;}
.dm-row.nota .dm-txt{flex:1 1 150px;min-width:150px;}
.dm-row.nota .dm-a{margin-left:auto;}
.dm-row.nota .dm-a.prev{color:var(--ink-soft);}
.dm-row.nota.vencida{border-color:var(--danger-line);background:var(--danger-soft);border-style:solid;}
.dm-row.nota.vencida .dm-a.prev{color:var(--danger);}
.dm-row.nota.cobrado{opacity:.72;}
.dm-row.nota.cancelado{opacity:.6;}
.dm-row.nota.cancelado .dm-k,.dm-row.nota.cancelado .dm-a{text-decoration:line-through;}
.dn-del,.dn-res{flex:none;background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:3px;border-radius:8px;display:inline-flex;transition:color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);}
.dn-del:active{color:var(--danger);}
.dn-res{color:var(--danger);background:rgba(255,59,48,.12);}
.dn-res:active{transform:scale(.9);}

/* ---- El formulario de tres pasos ---- */
.dn-new{border:1px solid var(--line);background:var(--glass-soft);border-radius:var(--r-md);padding:13px 13px 12px;}
.dn-paso{display:flex;gap:10px;align-items:flex-start;padding-bottom:12px;}
.dn-paso .dn-pn{
  flex:none;width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);
  color:var(--ink-faint);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:2px;
  transition:background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);
}
.dn-paso.on .dn-pn{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.dn-paso.done .dn-pn{background:var(--success-soft);border-color:rgba(52,199,89,.34);color:var(--success-text);}
.dn-paso .dn-pc{flex:1;min-width:0;}
.dn-paso.off{opacity:.42;}
.dn-paso .field-label{margin-top:0;}
.sheet .dn-new input[type=text]{margin-bottom:0;}
.sheet .dn-new input[type=time]{width:100%;font-family:var(--font);font-size:15px;font-weight:600;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);}
.sheet .dn-new input[type=time]:focus{border-color:var(--accent);outline:none;}
.sheet .dn-new input[type=number]{font-size:20px;}
.dn-btns{display:flex;gap:7px;}
.dn-btn{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);padding:10px 8px;border-radius:var(--r-full);font-family:var(--font);font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:transform var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);}
.dn-btn:active{transform:scale(.96);}
.dn-btn.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent);}
.dn-btn.on.muted{background:var(--ink-soft);border-color:var(--ink-soft);color:#fff;box-shadow:none;}
.dn-btn:disabled{opacity:.45;cursor:default;}
.dn-help{font-size:11px;color:var(--ink-soft);line-height:1.5;margin:10px 0 0;display:flex;gap:6px;align-items:flex-start;}
.dn-help svg{flex:none;margin-top:1px;}

/* ---- La hoja de "toca pagar" ---- */
.nv-nota{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px;border-radius:var(--r-md);
  background:var(--danger-soft);border:1px solid var(--danger-line);margin-bottom:12px;}
.nv-hora{flex:none;font-size:11px;font-weight:800;color:#fff;background:var(--danger);border-radius:999px;padding:4px 9px;font-variant-numeric:tabular-nums;}
.nv-texto{flex:1;min-width:0;font-size:15px;font-weight:700;color:var(--ink);word-break:break-word;}
.nv-coste{flex:none;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;}
.nv-coste.set{color:var(--num-out);}
.nv-coste.undef{color:var(--ink-soft);font-size:12px;font-weight:700;}
.nv-aviso{font-size:11.5px;color:var(--ink-soft);line-height:1.5;margin:0;display:flex;gap:6px;align-items:flex-start;}
.nv-aviso svg{flex:none;margin-top:1px;}

/* ============================================================
   PANTALLA DE UN DÍA
   ============================================================ */
.dm-date{font-size:12px;color:var(--ink-soft);margin-bottom:12px;font-weight:500;}
.dm-sum{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px;}
.dm-pill{display:inline-flex;align-items:center;gap:5px;padding:7px 11px;border-radius:var(--r-full);font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.dm-pill.out{background:var(--num-out-bg);border-color:var(--num-out-line);color:var(--num-out);}
.dm-pill.in{background:var(--num-in-bg);border-color:var(--num-in-line);color:var(--num-in);}
.dm-pill.prev{background:rgba(255,149,0,.11);border-color:rgba(255,149,0,.30);color:#9A5B00;}
.dm-sec{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin:18px 0 9px;text-transform:none;}
.dm-sec .dm-n{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.dm-empty{font-size:12.5px;color:var(--ink-faint);background:var(--surface-2);border:1px dashed var(--line);border-radius:var(--r-md);padding:12px 14px;line-height:1.5;}
.dm-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft);margin-bottom:7px;}
.dm-row .dm-ico{width:28px;height:28px;border-radius:9px;flex:none;display:inline-flex;align-items:center;justify-content:center;}
.dm-row .dm-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.dm-row .dm-k{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dm-row .dm-s{font-size:10.5px;color:var(--ink-soft);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.dm-row .dm-a{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;flex:none;}
.dm-row .dm-a.neg{color:var(--num-out);}
.dm-row .dm-a.pos{color:var(--num-in);}
.dm-row .dm-a.sub{color:var(--accent);}


/* ============================================================
   TÍTULOS MÁS VISIBLES
   ============================================================ */
.card-title.big{font-size:17.5px;font-weight:800;letter-spacing:-.02em;gap:9px;margin-bottom:16px;}
.card-title.big .ct-ico{
  width:32px;height:32px;border-radius:10px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);
  box-shadow:0 1px 0 rgba(255,255,255,.6) inset;
}
.section-title{font-size:16.5px;font-weight:800;}

/* ============================================================
   NAVEGACIÓN DE 5 PESTAÑAS
   ============================================================ */
.nav-item .ni-label{font-size:9px;letter-spacing:-.01em;}
.nav-item .ni-ico{width:38px;height:30px;}
.bottom-nav{padding:8px 2px;}

/* ============================================================
   ANIMACIONES DE ENTRADA MÁS RICAS
   ============================================================ */
.ledger-card,.calendar-card,.analysis-card,.onboard-card,.list-card,.stat-row,.wallet-tabs,.period-chips,.section-title,.search-bar{
  animation:cardRise var(--dur-slow) var(--ease-out) both;
}
@keyframes cardRise{
  from{ opacity:0; transform:translateY(16px) scale(.972); filter:blur(4px); }
  60%{ filter:blur(0); }
  to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}
.ledger-card:nth-of-type(1){animation-delay:0ms;}
.ledger-card:nth-of-type(2){animation-delay:70ms;}
.stat-row{animation-delay:60ms;}
.section-title{animation-delay:90ms;}

/* el donut entra girando y creciendo, como si se montara la pieza */
.donut-wrap svg{animation:donutIn .8s var(--ease-spring) both;}
@keyframes donutIn{
  from{ opacity:0; transform:rotateX(16deg) rotate(-42deg) scale(.55); }
  to{ opacity:1; transform:rotateX(16deg) rotate(0) scale(1); }
}

/* las barras crecen desde cero */
.cat-bar-fill,.limit-bar-fill{animation:barGrow .8s var(--ease-out) both;transform-origin:left center;}
@keyframes barGrow{ from{ transform:scaleX(0); } to{ transform:scaleX(1); } }
.cat-bar-row:nth-child(1) .cat-bar-fill{animation-delay:60ms;}
.cat-bar-row:nth-child(2) .cat-bar-fill{animation-delay:120ms;}
.cat-bar-row:nth-child(3) .cat-bar-fill{animation-delay:180ms;}
.cat-bar-row:nth-child(n+4) .cat-bar-fill{animation-delay:230ms;}

/* la línea del histórico se dibuja sola */
@keyframes histDraw{ from{ stroke-dashoffset:1200; } to{ stroke-dashoffset:0; } }

/* transición direccional entre pestañas */
::view-transition-old(root){ animation:tabOut var(--dur-base) var(--ease-in-out) both; }
::view-transition-new(root){ animation:tabIn var(--dur-slow) var(--ease-out) both; }
@keyframes tabOut{ to{ opacity:0; transform:translateX(-16px) scale(.985); } }
@keyframes tabIn{ from{ opacity:0; transform:translateX(20px) scale(.985); } }
html[data-nav="back"]::view-transition-old(root){ animation:tabOutBack var(--dur-base) var(--ease-in-out) both; }
html[data-nav="back"]::view-transition-new(root){ animation:tabInBack var(--dur-slow) var(--ease-out) both; }
@keyframes tabOutBack{ to{ opacity:0; transform:translateX(16px) scale(.985); } }
@keyframes tabInBack{ from{ opacity:0; transform:translateX(-20px) scale(.985); } }

/* pulsación del FAB con muelle */
.fab{transition:transform var(--dur-base) var(--ease-spring), box-shadow var(--dur-base) var(--ease-out);}
.fab:active{transform:scale(.88) rotate(90deg);}

/* la hoja inferior sube con muelle */
.sheet{animation:sheetSpring .5s var(--ease-drawer) both;}
@keyframes sheetSpring{
  from{ transform:translateY(46px); opacity:0; }
  to{ transform:translateY(0); opacity:1; }
}

@media (prefers-reduced-motion: reduce){
  .metal-card,.metal-card .mc-sheen,.sub-card,.up-pill,.next-sub-card,.rg-fill,
  .donut-wrap svg,.cat-bar-fill,.limit-bar-fill,.sheet{
    animation-duration:1ms !important; animation-delay:0ms !important;
  }
  .fab:active{transform:none;}
  ::view-transition-old(root), ::view-transition-new(root){ animation:none; }
}

.sub-facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
/* Estas etiquetas llevan datos que se consultan (lo que cuesta al año, de qué
   cuenta sale), así que no pueden quedarse en gris de fondo: llevan borde,
   más cuerpo de letra y el icono con color. */
.sub-facts span{
  display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  color:var(--ink);background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-full);padding:6px 12px 6px 9px;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
}
.sub-facts span .ico{color:var(--ink-faint);}

/* pantallas estrechas: que nada se salga de la tarjeta */
@media (max-width:380px){
  .donut-wrap{gap:11px;}
  .donut-wrap svg{width:124px;height:124px;}
  .donut-figures .saldo-num{font-size:19px;}
  .donut-figures .saldo-label{font-size:11px;}
  .mini-stat{font-size:11.5px;}
  .legend-item .lamt{min-width:62px;}
  .legend-item .lpct{width:28px;}
  .ledger-card{padding:17px;}
  .card-title.big{font-size:15.5px;}
}

/* ============================================================
   CARTERAS DINÁMICAS, SUELDO MENSUAL Y TRANSFERENCIAS
   ============================================================ */
.wallet-tabs.scrollable{overflow-x:auto;scrollbar-width:none;justify-content:flex-start;}
.wallet-tabs.scrollable::-webkit-scrollbar{display:none;}
.wallet-tabs.scrollable .wallet-tab{flex:0 0 auto;padding:9px 15px;white-space:nowrap;}

/* --- pestañas fijas (Nómina · Patrimonio · Neo bancos) frente a las creadas por ti --- */
.wallet-tabs.scrollable .wallet-tab.fixed{display:flex;align-items:center;gap:6px;padding:9px 14px;}
.wallet-tab.fixed{
  font-weight:800;color:var(--ink);
  background:linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.55));
  border:1px solid var(--accent-line);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 14px -12px rgba(10,132,255,.55);
}
.wallet-tab.fixed .ico{color:var(--accent);transition:color var(--dur-base) var(--ease-out);}
.wallet-tab.fixed.active{
  background:linear-gradient(180deg, var(--accent), var(--accent-deep));
  border-color:transparent;color:#fff;box-shadow:var(--shadow-accent);
}
.wallet-tab.fixed.active .ico{color:#fff;}
.wallet-tab.custom{
  font-weight:600;color:var(--ink-soft);
  border:1px dashed var(--line-strong);background:transparent;
}
.wallet-tab.custom.active{background:var(--ink);border-color:transparent;color:#fff;box-shadow:0 8px 18px -12px rgba(28,28,30,.7);}

/* ---- la barra y su botón "+" ----
   Las pestañas se deslizan a lo ancho; el "+" se queda quieto a un lado, fuera
   del carrusel, para que siempre esté a mano por muchas carteras que tengas. */
.wallet-tabs-wrap{display:flex;align-items:center;gap:8px;margin-top:16px;}
.wallet-tabs-wrap > .wallet-tabs{margin-top:0;flex:1 1 auto;min-width:0;}
.wallet-tab.add{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:38px;height:38px;border-radius:50%;color:var(--accent);padding:0;
  background:var(--surface-2);border:1px solid var(--accent-line);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 6px 14px -12px rgba(10,132,255,.55);
  transition:transform var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out);
}
.wallet-tab.add:active{transform:scale(.9);}

.wallet-btn-row{display:flex;gap:9px;margin-top:14px;}
.wallet-btn-row .primary-btn{flex:1.4;}
.wallet-btn-row .ghost-btn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;}

.salary-row{display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);}
.salary-row .sr-k{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);text-transform:capitalize;}
.salary-row .sr-s{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.35;}
.salary-row input{width:104px;flex:none;font-family:var(--font);font-size:14px;font-weight:700;text-align:right;
  padding:9px 11px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);
  font-variant-numeric:tabular-nums;transition:border-color var(--dur-base) var(--ease-out);}
.salary-row input:focus{border-color:var(--accent);outline:none;}

.color-swatches{display:flex;flex-wrap:wrap;gap:9px;}
.color-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 3px 8px -3px rgba(30,30,45,.4);
  transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-base) var(--ease-out);}
.color-swatch.active{border-color:var(--ink);transform:scale(1.12);}
.color-swatch:active{transform:scale(.9);}

.transfer-arrow{display:flex;justify-content:center;color:var(--accent);margin:12px 0 2px;opacity:.75;}
.transfer-hint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
.transfer-hint b{color:var(--ink);font-variant-numeric:tabular-nums;}

/* ============================================================
   TEXTO METÁLICO ANIMADO (ayudas de los pasos)
   ============================================================ */
.metal-text{
  font-weight:700;
  background-image:linear-gradient(100deg,
    #262A30 0%,  #667180 7%,  #262A30 14%,     /* acero oscuro */
    #5E4708 21%, #A88526 28%, #5E4708 35%,     /* oro viejo */
    #6B2E13 42%, #B15F35 49%, #6B2E13 56%,     /* cobre */
    #16375C 63%, #4A7EB4 70%, #16375C 77%,     /* acero azul */
    #34194F 84%, #6E4C9B 91%, #262A30 100%);   /* violeta y vuelta */
  background-size:900% 100%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent; color:transparent;
  animation:metalShift 10s linear infinite;
  text-shadow:0 1px 0 rgba(255,255,255,.7);
  letter-spacing:-.005em;
}
@keyframes metalShift{ from{ background-position:0% 50%; } to{ background-position:900% 50%; } }
/* si el navegador no recorta el fondo al texto, se ve un gris legible igualmente */
@supports not ((-webkit-background-clip:text) or (background-clip:text)){
  .metal-text{ color:var(--ink-soft); -webkit-text-fill-color:currentColor; background:none; }
}
@media (prefers-reduced-motion: reduce){ .metal-text{ animation:none; } }

/* ============================================================
   FICHAS DE CATEGORÍA CON EJEMPLO
   ============================================================ */
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px;}
.cat-card{
  display:flex;flex-direction:column;gap:3px;cursor:pointer;position:relative;overflow:hidden;
  padding:12px 13px;border-radius:16px;
  background:var(--surface-2);border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
  transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
}
.cat-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cc);}
.cat-card:active{transform:scale(.96);}
.cat-card.active{border-color:var(--cc);background:color-mix(in srgb, var(--cc) 12%, transparent);}
.cc-ico{display:flex;color:var(--cc);}
.cc-name{font-size:13.5px;font-weight:700;color:var(--ink);line-height:1.2;}
.cc-ex{font-size:10.5px;color:var(--ink-soft);line-height:1.3;}

.other-split{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.other-split .chip{justify-content:center;padding:12px 10px;font-weight:700;}
.other-split.solo{grid-template-columns:1fr;}
.cat-card.cat-resto{border-style:dashed;background:transparent;}
.cat-card.cat-resto .cc-name{color:var(--ink-soft);}
.chip.new-cat{background:rgba(52,199,89,.12);border-color:rgba(52,199,89,.36);color:var(--success);}
.chip.kind-transfer{background:rgba(10,132,255,.12);border-color:var(--accent-line);color:var(--accent);}
.chip.kind-transfer.active{background:var(--accent);color:var(--on-accent);}
/* invertir se ve distinto: es dinero que sigue siendo tuyo, no un gasto */
.chip.kind-invest{background:rgba(48,176,199,.14);border-color:rgba(48,176,199,.42);color:#1F7F90;}
.chip.kind-invest.active{background:#30B0C7;border-color:transparent;color:#fff;}

/* ============================================================
   VALIDACIÓN DE FORMULARIOS
   ============================================================ */
.primary-btn.is-locked{
  background:var(--line-strong);color:rgba(60,60,67,.55);box-shadow:none;cursor:default;
}
.primary-btn.is-locked:active{transform:none;}
.sheet input.input-error, .sheet textarea.input-error{
  border-color:var(--danger) !important;
  box-shadow:0 0 0 3px rgba(255,59,48,.16);
  background:rgba(255,59,48,.05);
}
.form-error{
  display:flex;align-items:center;gap:7px;margin-top:14px;
  padding:11px 13px;border-radius:var(--r-md);
  background:var(--danger-soft);border:1px solid var(--danger-line);
  color:var(--danger-text);font-size:12.5px;font-weight:700;line-height:1.35;
}
.form-error.shake{animation:errShake .42s var(--ease-out);}
@keyframes errShake{
  0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);}
  40%{transform:translateX(5px);} 60%{transform:translateX(-3px);} 80%{transform:translateX(2px);}
}
@media (prefers-reduced-motion: reduce){ .form-error.shake{animation:none;} }

/* ---- un apartado que falta: se rodea en rojo y late despacio ---- */
.tf-field{position:relative;border-radius:var(--r-md);}
.tf-field .field-hint{font-size:11px;color:var(--ink-faint);line-height:1.4;margin:-3px 0 2px;}
.field-label .req{color:var(--danger);font-weight:800;}
.ring-alert::after{
  content:"";position:absolute;inset:-8px -9px;border-radius:20px;
  border:2.5px solid var(--danger);pointer-events:none;z-index:3;
  animation:ringAviso 1.6s var(--ease-in-out) infinite;
}
@keyframes ringAviso{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.42;transform:scale(1.015);}
}
@media (prefers-reduced-motion: reduce){ .ring-alert::after{animation:none;} }

/* ============================================================
   RUEDA CONSOLIDADA: BLOQUES Y NEGATIVOS EN ROJO
   ============================================================ */
.flow-chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px;padding-top:15px;border-top:1px solid var(--line-soft);}
.flow-chip{
  display:flex;flex-direction:column;gap:3px;padding:10px 12px;border-radius:14px;
  background:color-mix(in srgb, var(--fc) 9%, transparent);
  border:1px solid color-mix(in srgb, var(--fc) 30%, transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
}
.flow-chip .fc-k{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--fc);}
.flow-chip b{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.flow-chip.neg b{color:var(--danger);}
.legend-item .lamt.neg{color:var(--danger);}
.mini-stat b.neg{color:var(--danger);}

/* ============================================================
   BLOQUE INDEPENDIENTE DE SALDOS POR CARTERA
   ============================================================ */
.flow-chips.three{grid-template-columns:1fr 1fr 1fr;gap:7px;}
.flow-chips.three .flow-chip{padding:9px 10px;}
.flow-chips.three .flow-chip b{font-size:14.5px;}
.flow-chips.three .fc-k{font-size:9.5px;}

.balance-block{
  margin-top:14px;padding:16px 16px 14px;border-radius:var(--r-lg);
  background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow-sm);
  animation:cardRise var(--dur-slow) var(--ease-out) both;animation-delay:60ms;
}
.bb-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;}
.bb-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.bb-total{font-size:16px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.bb-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.bb-item{
  display:flex;flex-direction:column;gap:5px;cursor:pointer;position:relative;overflow:hidden;
  padding:10px 12px 11px 14px;border-radius:13px;
  background:var(--surface-2);border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
  transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
  animation:rowEnter var(--dur-base) var(--ease-out) both;
}
.bb-item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--bb);}
.bb-item:nth-child(1){animation-delay:0ms;}   .bb-item:nth-child(2){animation-delay:40ms;}
.bb-item:nth-child(3){animation-delay:80ms;}  .bb-item:nth-child(4){animation-delay:120ms;}
.bb-item:nth-child(5){animation-delay:155ms;} .bb-item:nth-child(n+6){animation-delay:185ms;}
.bb-item:active{transform:scale(.96);}
@media (hover:hover) and (pointer:fine){
  .bb-item:hover{border-color:color-mix(in srgb, var(--bb) 45%, transparent);box-shadow:0 6px 16px -10px var(--bb), 0 1px 0 rgba(255,255,255,.5) inset;}
}
.bb-top{display:flex;align-items:center;gap:6px;min-width:0;}
.bb-ico{display:flex;color:var(--bb);flex:none;}
.bb-name{flex:1;min-width:0;font-size:11px;font-weight:700;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bb-val{font-size:15px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em;}
.bb-item.neg .bb-val{color:var(--danger);}

/* ============================================================
   DINERO TOTAL CONSOLIDADO — rueda anotada
   ============================================================ */
.dtc-hint{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;font-weight:600;color:var(--ink-faint);}
.ad-wrap{margin:8px -14px 2px;}
.dtc-empty{margin:26px 6px;text-align:center;font-size:12.5px;line-height:1.55;color:var(--ink-soft);}
.ad-vtxt{font-size:11px;font-weight:600;fill:var(--ink-faint);}

/* ---- Rueda y columnas, deslizando de una a otra ---- */
.dtc-carrusel{
  display:flex;overflow-x:auto;overflow-y:hidden;align-items:center;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;
}
.dtc-carrusel::-webkit-scrollbar{display:none;}
.dtc-slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 14px;align-self:stretch;display:flex;flex-direction:column;justify-content:center;}
.dtc-dots{display:flex;align-items:center;justify-content:center;gap:7px;margin-top:6px;}
.dtc-dot{
  width:7px;height:7px;border-radius:var(--r-full);border:0;padding:0;cursor:pointer;
  background:var(--line);transition:width var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
}
.dtc-dot.on{width:20px;background:var(--ink-soft);}

/* ---- Las columnas (la rueda hecha tubos) ---- */
.cb-wrap{padding:14px 2px 4px;}
.cb-plot{display:flex;align-items:stretch;gap:10px;}
.cb-div{flex:none;width:1px;background:var(--line-soft);margin:22px 0 28px;}
.cb-group{flex:1 1 0;min-width:0;display:flex;flex-direction:column;}
.cb-ghead{display:flex;align-items:baseline;justify-content:space-between;gap:6px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid color-mix(in srgb,var(--gc) 35%,transparent);}
.cb-glab{font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--gc);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cb-gpct{font-size:14px;font-weight:800;color:var(--gc);font-variant-numeric:tabular-nums;flex:none;}
.cb-cols{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:5px;min-height:150px;}
.cb-col{flex:1 1 0;min-width:0;max-width:40px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;}
.cb-pct{font-size:8px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;}
.cb-tube{
  width:100%;max-width:22px;min-height:4px;border-radius:5px 5px 2px 2px;
  height:var(--h);box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  transform-origin:bottom;animation:cbGrow var(--dur-slow) var(--ease-out) backwards;animation-delay:var(--d,0ms);
}
.cb-name{font-size:8px;font-weight:600;line-height:1.15;color:var(--ink-soft);text-align:center;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;}
.cb-vacio{color:var(--ink-faint);font-size:11px;align-self:center;}
.cb-col:active .cb-tube{filter:brightness(1.08);}
@keyframes cbGrow{from{height:0;}to{height:var(--h);}}
@media (prefers-reduced-motion:reduce){ .cb-tube{animation-duration:1ms;} }
@media (max-width:360px){ .cb-cols{gap:3px;} .cb-name,.cb-pct{font-size:7px;} }

/* ---- Coste recurrente: tres pantallas que se deslizan ---- */
/* La altura la fija el JS con la de la pantalla que estés viendo: si todas
   midieran lo mismo, "pendientes" —que casi nunca tiene nada— dejaría media
   pantalla en blanco debajo. `align-items:flex-start` es lo que impide que las
   tres se estiren a la altura de la más larga. */
.sr-carrusel{
  display:flex;align-items:flex-start;overflow-x:auto;overflow-y:hidden;margin:10px -14px 0;
  scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;
  transition:height var(--dur-slow) var(--ease-out);
}
.sr-carrusel::-webkit-scrollbar{display:none;}
.sr-slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;padding:0 14px;}
@media (prefers-reduced-motion:reduce){ .sr-carrusel{transition:none;} }
/* Las cifras van en una línea propia y la rueda se queda con todo el ancho de
   la tarjeta. Puestas en una columna al lado le robaban un tercio del sitio y
   los nombres de las categorías salían tan pequeños que no se leían. */
.sr-top{display:flex;flex-direction:column-reverse;align-items:stretch;gap:2px;}
.sr-rueda{min-width:0;}
.sr-cifras{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;}
.sr-cifras .saldo-label{font-size:11px;color:var(--ink-soft);font-weight:500;line-height:1.3;}
.sr-cifras .saldo-num{
  font-family:var(--num);font-weight:650;font-size:clamp(19px,5.4vw,24px);margin:0;
  letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;
}
.sr-nota{display:flex;align-items:center;gap:4px;flex-basis:100%;margin-top:2px;
  font-size:10.5px;font-weight:700;line-height:1.35;color:var(--se,var(--ink-faint));}
.sr-nota .ico{flex:none;}
.sr-barras{margin-top:14px;padding-top:14px;}
/* Los puntitos van arriba, en la misma línea del título: así se ve de entrada
   que hay tres pantallas, sin tener que llegar al final del bloque. */
.sr-puntos{display:flex;align-items:center;gap:7px;margin-left:auto;}
.sr-punto{
  width:7px;height:7px;border-radius:var(--r-full);border:0;padding:0;cursor:pointer;
  background:var(--line);transition:width var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
}
.sr-punto.on{width:20px;background:var(--sp,var(--ink-soft));}

/* ---- La tira del periodo, una por pantalla y fuera de las tarjetas ---- */
.seg-barra{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:14px 0 2px;padding:8px 10px 8px 13px;border-radius:16px;
  background:var(--chrome);border:1px solid var(--line-soft);
}
.seg-barra .sb-k{
  display:flex;align-items:center;gap:6px;min-width:0;
  font-size:12.5px;color:var(--ink);white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;
}
.seg-barra .sb-k b{font-weight:700;}
.seg-barra .sb-k .ico{flex:none;color:var(--ink-faint);}
.seg-barra .seg{flex:none;}
@media (max-width:400px){
  .seg-barra{padding:8px 10px;}
  .seg-barra .sb-k{font-size:11px;}
}

/* Cuando una lista se queda sin nada por el periodo elegido. */
.sub-fuera{
  display:flex;align-items:center;gap:8px;padding:14px 16px;
  font-size:12.5px;line-height:1.45;color:var(--ink-soft);
}
.sub-fuera .ico{flex:none;color:var(--ink-faint);}

.ad-svg text{font-family:var(--font);}
.ad-gname{font-size:9.5px;font-weight:800;letter-spacing:.07em;}
.ad-gpct{font-size:17px;font-weight:800;letter-spacing:-.02em;}
.ad-cname{font-size:10px;font-weight:600;fill:var(--ink-soft);}
.ad-cpct{font-size:10px;font-weight:800;}
.ad-k{font-size:6.6px;font-weight:800;letter-spacing:.09em;fill:var(--ink-faint);}
.ad-v{font-weight:800;fill:var(--ink);letter-spacing:-.02em;}
.ad-p{font-size:8.5px;font-weight:700;fill:var(--ink-soft);}
.ad-center text{transition:opacity var(--dur-fast) var(--ease-out);}
.ad-zone{transition:opacity var(--dur-base) var(--ease-out);pointer-events:none;}

.ad-seg{transition:opacity var(--dur-base) var(--ease-out), stroke-width var(--dur-base) var(--ease-out);}
.ad-seg,.ad-lead,.ad-glab,.ad-clab,.ad-brk{transition:opacity var(--dur-base) var(--ease-out);}
.ad-focusing .ad-off{opacity:.16;}
.ad-focusing .ad-zone.ad-off{opacity:.02;}
.ad-focusing .ad-clab.ad-off,.ad-focusing .ad-glab.ad-off{opacity:.28;}
.ad-seg.ad-on{stroke-width:30;}
.ad-clab.ad-on .ad-cname{fill:var(--ink);font-weight:800;}
.ad-lead.ad-on{opacity:1;stroke-width:2;}
.ad-glab.ad-on .ad-gbg{opacity:.22;}
.ad-svg .ad-clab:active,.ad-svg .ad-glab:active{opacity:.55;}
@media (prefers-reduced-motion:reduce){ .ad-seg,.ad-lead,.ad-glab,.ad-clab,.ad-brk,.ad-zone{transition:none;} }

.dtc-extra{margin-top:2px;}
.dtc-neg{
  display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 11px;border-radius:12px;
  background:var(--danger-soft);border:1px solid var(--danger-line);
  font-size:11px;font-weight:700;color:var(--danger);
}
.dtc-neg b{margin-left:auto;font-variant-numeric:tabular-nums;}

/* --- los tres bloques, con la forma del boceto --- */
.tri{margin-top:10px;padding-top:16px;border-top:1px solid var(--line-soft);}
.tri-main{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;
  border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(100deg, color-mix(in srgb, #FF3B30 11%, var(--glass-strong)) 0%,
                                     var(--glass-strong) 46%, var(--glass-strong) 54%,
                                     color-mix(in srgb, #0A84FF 11%, var(--glass-strong)) 100%);
  border:1px solid var(--line);
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset, var(--shadow-sm);
  animation:cardRise var(--dur-slow) var(--ease-out) both;
}
.tri-side{
  --tk:#0A84FF;
  display:flex;flex-direction:column;gap:4px;min-width:0;padding:15px 14px 14px;
  border-radius:19px;
  transition:background var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
}
.tri-side.liq{--tk:#FF3B30;border-radius:19px 0 0 19px;}
.tri-side.cap{--tk:#0A84FF;text-align:right;align-items:flex-end;border-radius:0 19px 19px 0;}
.tri-side:active{background:color-mix(in srgb, var(--tk) 12%, transparent);}
.tri-side.ad-on{background:color-mix(in srgb, var(--tk) 15%, transparent);box-shadow:inset 0 0 0 2px var(--tk);}
/* la caja de inversión también redondea su realce */
.tri-inv.ad-on{box-shadow:inset 0 0 0 2px var(--tk);}
.tri-side.ad-off{opacity:.45;}
.tri-k{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--tk,var(--ink-soft));line-height:1.25;}
.tri-k .ico{flex:none;}
.tri-side.cap .tri-k{flex-direction:row-reverse;}
.tri-v{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.035em;font-variant-numeric:tabular-nums;white-space:nowrap;}
.tri-p{font-size:10px;font-weight:700;color:var(--ink-faint);}
.tri-mid{display:flex;align-items:center;justify-content:center;padding:0 4px;position:relative;}
.tri-mid::before{content:"";position:absolute;top:10px;bottom:10px;left:50%;width:1px;background:var(--line);}
.tri-badge{
  display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:13px;
  background:linear-gradient(160deg,#fff,var(--bg-2));border:1px solid var(--line);color:var(--ink-soft);
  box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 6px 14px -10px rgba(30,30,45,.5);position:relative;z-index:1;
}
/* las dos patillas que bajan hasta la inversión, como en el dibujo */
.tri-legs{display:grid;grid-template-columns:1fr 1fr;width:56%;margin:0 auto;height:12px;}
.tri-legs i{width:1px;height:100%;background:var(--line-strong);justify-self:center;}
.tri-inv{
  --tk:#5E5CE6;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  width:78%;margin:0 auto;padding:11px 16px;border-radius:16px;
  background:linear-gradient(120deg, color-mix(in srgb, var(--tk) 12%, var(--glass-strong)), var(--glass-strong));
  border:1px solid color-mix(in srgb, var(--tk) 26%, transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.75) inset;
  animation:cardRise var(--dur-slow) var(--ease-out) both;animation-delay:70ms;
}
.tri-inv b{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
@media (max-width:359px){
  .tri-v{font-size:17px;}
  .tri-inv{width:92%;}
}

/* ============================================================
   TARJETA DE BALANCE (entrado / salido del mes)
   ============================================================ */
.balance-card{
  margin-top:14px;padding:17px 17px 16px;border-radius:var(--r-lg);
  background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow-sm);
  animation:cardRise var(--dur-slow) var(--ease-out) both;animation-delay:40ms;
  transition:transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.bc-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
.bc-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.bc-val{font-size:23px;font-weight:800;color:var(--success-text);font-variant-numeric:tabular-nums;letter-spacing:-.03em;white-space:nowrap;}
.bc-val.neg{color:var(--danger);}
.bc-sub{margin-top:3px;font-size:11px;font-weight:600;color:var(--ink-faint);}
.bc-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:13px;}
.bc-row b{font-size:14px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.bc-row b.neg{color:var(--danger);}
.bc-k{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink-soft);}
.bc-track{
  margin-top:7px;height:8px;border-radius:var(--r-full);overflow:hidden;
  background:var(--surface-2);border:1px solid var(--line-soft);
  box-shadow:0 1px 2px rgba(30,30,45,.06) inset;
}
.bc-fill{
  height:100%;border-radius:var(--r-full);
  transform-origin:left center;animation:bcGrow 620ms var(--ease-out) both;
}
.bc-fill.in{background:linear-gradient(90deg, #34C759, #248A3D);}
.bc-fill.out{background:linear-gradient(90deg, #FF9500, #FF3B30);animation-delay:110ms;}
@keyframes bcGrow{from{transform:scaleX(0);}to{transform:scaleX(1);}}
@media (hover:hover) and (pointer:fine){
  .balance-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
}

/* origen fijo de la transferencia */
.transfer-from{
  display:flex;align-items:center;gap:11px;padding:13px 14px;border-radius:var(--r-md);
  background:color-mix(in srgb, var(--tf) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--tf) 34%, transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
}
.transfer-from .tf-ico{display:flex;color:var(--tf);flex:none;}
.transfer-from .tf-mid{flex:1;min-width:0;}
.transfer-from .tf-name{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.transfer-from .tf-bal{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.transfer-from .tf-bal b{color:var(--ink);font-variant-numeric:tabular-nums;}
.transfer-from .tf-lock{display:flex;color:var(--tf);flex:none;opacity:.8;}

/* ============================================================
   BIENVENIDA Y AVISO FLOTANTE
   ============================================================ */
.onboard-hero{text-align:center;padding:26px 12px 4px;animation:cardRise var(--dur-slow) var(--ease-out) both;}
.oh-badge{
  width:62px;height:62px;border-radius:20px;margin:0 auto 16px;
  display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,#4AA3FF,#0A84FF 55%,#0059B3);
  box-shadow:0 12px 26px -10px rgba(10,132,255,.65), 0 1px 0 rgba(255,255,255,.5) inset;
  animation:badgePop .7s var(--ease-spring) both;
}
@keyframes badgePop{ from{opacity:0;transform:scale(.5) rotate(-12deg);} to{opacity:1;transform:scale(1) rotate(0);} }
.onboard-hero h2{font-size:24px;font-weight:800;letter-spacing:-.03em;color:var(--ink);margin:0 0 8px;line-height:1.2;}
.onboard-hero p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin:0;max-width:330px;margin-inline:auto;}
.onboard-card{animation-delay:90ms;}
.big-money{display:flex;align-items:center;gap:8px;}
.big-money input{
  flex:1;min-width:0;width:auto;font-family:var(--font);font-size:34px;font-weight:800;letter-spacing:-.03em;
  padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink);font-variant-numeric:tabular-nums;
  transition:border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.big-money input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);outline:none;}
.big-money .bm-cur{font-size:26px;font-weight:800;color:var(--ink-faint);flex:none;}
.onboard-hint{font-size:11.5px;margin-top:9px;text-align:center;}
/* ---- ¿estás trabajando? las dos opciones del arranque ---- */
.work-opts{display:flex;flex-direction:column;gap:9px;margin-top:2px;}
.work-opt{display:flex;align-items:center;gap:11px;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:13px 14px;
  font-family:var(--font);color:var(--ink);
  transition:border-color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);}
.work-opt:active{transform:scale(.985);}
.work-opt.active{border-color:var(--accent);background:var(--accent-soft);}
.work-opt .wo-luz{width:10px;height:10px;border-radius:50%;flex:none;}
.work-opt .wo-luz.ok{background:#34C759;box-shadow:0 0 0 3px rgba(52,199,89,.18);}
.work-opt .wo-luz.no{background:#FF3B30;box-shadow:0 0 0 3px rgba(255,59,48,.16);}
.work-opt .wo-t{display:block;min-width:0;}
.work-opt .wo-t b{display:block;font-size:14px;font-weight:700;}
.work-opt .wo-t i{display:block;font-style:normal;font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.35;}

.onboard-steps{display:flex;gap:7px;justify-content:center;margin-top:20px;}
.onboard-steps i{width:26px;height:4px;border-radius:2px;background:var(--line-strong);transition:background var(--dur-base) var(--ease-out), width var(--dur-base) var(--ease-out);}
.onboard-steps i.on{background:var(--accent);width:34px;}

.idle-hint{
  position:sticky;bottom:6px;z-index:9;
  display:flex;align-items:center;gap:9px;margin:14px 0 0;
  padding:12px 15px;border-radius:var(--r-md);
  background:linear-gradient(135deg,#0A84FF,#5856D6);
  color:#fff;font-size:12.5px;font-weight:700;line-height:1.35;
  box-shadow:0 12px 26px -10px rgba(10,132,255,.7), 0 1px 0 rgba(255,255,255,.28) inset;
  opacity:0;transform:translateY(10px) scale(.96);
  transition:opacity var(--dur-base) var(--ease-out), transform var(--dur-slow) var(--ease-spring);
}
.idle-hint.show{opacity:1;transform:translateY(0) scale(1);}
.idle-hint .ih-ico{display:flex;flex:none;animation:hintPulse 1.8s var(--ease-in-out) infinite;}
@keyframes hintPulse{ 0%,100%{transform:scale(1);opacity:1;} 50%{transform:scale(1.18);opacity:.75;} }
@media (prefers-reduced-motion: reduce){ .idle-hint .ih-ico{animation:none;} .oh-badge{animation:none;} }

/* ============================================================
   PULIDO DE TARJETAS Y TRANSICIONES
   ============================================================ */
.ledger-card,.calendar-card,.analysis-card,.list-card,.balance-block{
  transition:transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
@media (hover:hover) and (pointer:fine){
  .ledger-card:hover,.analysis-card:hover,.balance-block:hover{
    transform:translateY(-2px);
    box-shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 22px 44px -22px rgba(30,30,45,.26);
  }
}
.stat-card{transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);}
.stat-card:active{transform:scale(.97);}
.flow-chip{transition:transform var(--dur-fast) var(--ease-out);}
.flow-chip:active{transform:scale(.97);}

/* la hoja inferior entra con un fundido del fondo más suave */
.overlay{transition:background var(--dur-base) var(--ease-out), backdrop-filter var(--dur-base) var(--ease-out);}
.overlay.show{animation:overlayIn var(--dur-base) var(--ease-out);}
@keyframes overlayIn{ from{ background:rgba(20,20,25,0); backdrop-filter:blur(0); } }

/* las fichas del asistente aparecen escalonadas */
.chip-grid .chip,.cat-grid .cat-card{animation:chipIn .34s var(--ease-out) both;}
@keyframes chipIn{ from{opacity:0;transform:translateY(8px) scale(.96);} to{opacity:1;transform:translateY(0) scale(1);} }
.chip-grid .chip:nth-child(1),.cat-grid .cat-card:nth-child(1){animation-delay:0ms;}
.chip-grid .chip:nth-child(2),.cat-grid .cat-card:nth-child(2){animation-delay:28ms;}
.chip-grid .chip:nth-child(3),.cat-grid .cat-card:nth-child(3){animation-delay:56ms;}
.chip-grid .chip:nth-child(4),.cat-grid .cat-card:nth-child(4){animation-delay:84ms;}
.chip-grid .chip:nth-child(5),.cat-grid .cat-card:nth-child(5){animation-delay:110ms;}
.chip-grid .chip:nth-child(6),.cat-grid .cat-card:nth-child(6){animation-delay:134ms;}
.chip-grid .chip:nth-child(n+7),.cat-grid .cat-card:nth-child(n+7){animation-delay:156ms;}

@media (prefers-reduced-motion: reduce){
  .chip-grid .chip,.cat-grid .cat-card,.bb-item,.overlay.show,.bc-fill{animation:none !important;}
  .bc-fill{transform:none !important;}
  .ledger-card:hover,.analysis-card:hover,.balance-block:hover{transform:none;}
}

/* ============================================================================
   INICIO · BLOQUES NUEVOS (boceto v1.8.2)
   Todo lo que va por debajo del gráfico circular: totales anual/mensual,
   balance con barra de dos tramos, inversión, movimientos e historial.
   ========================================================================== */
.nb-card{
  background:var(--glass); backdrop-filter:blur(26px) saturate(180%); -webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.55); border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
  margin-top:14px; padding:16px;
  animation:cardEnter var(--dur-slow) var(--ease-out) both;
}
.nb-h{display:flex;align-items:center;gap:7px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);margin:0 0 12px;}
.nb-h .nb-hico{display:inline-flex;width:23px;height:23px;border-radius:8px;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex:none;}
.nb-sub{font-size:11px;color:var(--ink-faint);font-weight:500;}

/* ---------- 1 · Rejilla 2x2 de totales, con el badge en el cruce ---------- */
.nb-grid{position:relative;display:grid;grid-template-columns:1fr 1fr;}
.nb-grid::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;width:1px;background:var(--line);transform:translateX(-.5px);}
.nb-cell{padding:13px 12px;cursor:pointer;border-radius:var(--r-sm);transition:background var(--dur-fast) var(--ease-out);min-width:0;}
.nb-cell:nth-child(2),.nb-cell:nth-child(3){border-bottom:1px solid var(--line);}
.nb-cell:active{background:var(--surface-2);}
.nb-cell.on{background:var(--accent-soft);}
.nb-cell.r{text-align:right;}
.nb-ck{display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:var(--ink-soft);line-height:1.25;}
.nb-cell.r .nb-ck{justify-content:flex-end;}
.nb-ck i{width:6px;height:6px;border-radius:50%;flex:none;background:currentColor;}
.nb-cv{font-family:var(--num);font-weight:650;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  letter-spacing:-.03em;
  font-size:clamp(16px,4.6vw,22px);margin:5px 0 4px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-cx{display:flex;gap:9px;font-size:10px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex-wrap:wrap;}
.nb-cell.r .nb-cx{justify-content:flex-end;}
.nb-cx b{font-weight:700;color:var(--ink-soft);}
.nb-cx .up{color:var(--success-text);}
.nb-cx .dn{color:var(--danger);}
.nb-badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;
  width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:var(--chrome-strong);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid var(--line);box-shadow:var(--shadow-xs);color:var(--accent);}

/* ---------- desplegable con la gráfica propia de cada bloque ---------- */
.nb-drop{overflow:hidden;max-height:0;transition:max-height var(--dur-slow) var(--ease-drawer);}
.nb-drop.open{max-height:760px;}
.nb-chart{margin-top:10px;padding:12px 12px 8px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft);}
.nb-chart .nb-ct{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:6px;}
.nb-chart .nb-ctk{font-size:11.5px;font-weight:700;color:var(--ink);}
.nb-chart .nb-ctv{font-size:11px;color:var(--ink-faint);font-weight:600;font-variant-numeric:tabular-nums;}
.nb-chart svg{display:block;width:100%;height:auto;}
.nb-svg .gl{stroke:var(--line-soft);stroke-width:1;}
.nb-svg .ax{fill:var(--ink-faint);font-size:8px;font-weight:600;font-family:var(--font);}
.nb-svg .ln{fill:none;stroke-linecap:round;stroke-linejoin:round;}
.nb-empty{font-size:11.5px;color:var(--ink-faint);text-align:center;padding:16px 6px;line-height:1.5;}

/* ---- navegación por la gráfica: cruz, punto vivo y globo de datos ---- */
.nb-plot{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none;cursor:crosshair;}
.nb-plot .cross{stroke:var(--ink-faint);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity var(--dur-fast) var(--ease-out);}
.nb-plot .hot{opacity:0;transition:opacity var(--dur-fast) var(--ease-out);}
.nb-plot.live .cross,.nb-plot.live .hot{opacity:1;}
/* el punto normal, el del máximo y el del mínimo */
.nb-svg .mk{stroke:#fff;stroke-width:1.2;}
.nb-svg .mk.big{stroke-width:2;}
.nb-svg .halo{fill:none;stroke-width:1.4;opacity:.45;}
.nb-tip{position:absolute;z-index:4;pointer-events:none;opacity:0;transform:translate(-50%,-114%) scale(.96);
  transition:opacity var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
  background:var(--chrome-strong);backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--shadow-md);
  padding:7px 10px;min-width:96px;white-space:nowrap;}
.nb-plot.live .nb-tip{opacity:1;transform:translate(-50%,-114%) scale(1);}
.nb-tip .t-d{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);}
.nb-tip .t-v{font-size:14px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--ink);margin:1px 0;}
.nb-tip .t-n{font-size:10px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
.nb-tip .t-n b{font-weight:700;}
.nb-tip .t-n .up{color:var(--success-text);}
.nb-tip .t-n .dn{color:var(--danger);}
.nb-leyenda{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:9.5px;font-weight:600;color:var(--ink-faint);}
.nb-leyenda span{display:flex;align-items:center;gap:4px;}
.nb-leyenda i{width:7px;height:7px;border-radius:50%;border:1.4px solid currentColor;}
.nb-leyenda .lmax{color:var(--success-text);}
.nb-leyenda .lmin{color:var(--danger);}

/* ---------- comparativa: dos gráficas encogidas + la comparativa ---------- */
.nb-pair{display:block;}
/* La comparativa baja a su propia fila, a todo lo ancho. Metida en media
   tarjeta no le cabían seis tramos sin que las barras volvieran a quedarse en
   una rayita; aquí cada columna tiene sitio de sobra. Las dos gráficas de
   línea se reparten la fila de arriba. */
.nb-pair.cmp{display:block;margin-top:10px;}
.nb-pair.cmp .nb-pair-l{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:stretch;min-width:0;}
.nb-pair.cmp .nb-pair-r{margin-top:10px;}
.nb-pair.cmp .nb-drop{max-height:none;overflow:visible;flex:1 1 0;display:flex;min-height:0;}
.nb-pair.cmp .nb-chart{flex:1;display:flex;flex-direction:column;margin-top:0;min-width:0;}
.nb-pair.cmp .nb-plot{flex:1;min-height:0;display:flex;align-items:center;}
.nb-pair.cmp .nb-plot svg{height:100%;width:100%;}
.nb-pair.cmp .nb-ctv{display:none;}
.nb-pair.cmp .nb-leyenda{display:none;}
.nb-pair.cmp .nb-ctk{font-size:10.5px;}
.nb-pair-r{display:flex;min-width:0;}

/* la comparativa se dibuja con cajas, no con svg: así llena el alto exacto */
.nb-bars{flex:1;display:flex;flex-direction:column;padding:12px 12px 10px;min-width:0;
  border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft);}
.nb-bars .bt{font-size:11.5px;font-weight:700;color:var(--ink);margin-bottom:8px;}
.nb-bplot{flex:1;display:flex;min-height:96px;gap:6px;}
.nb-baxis{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-end;flex:none;
  font-size:8px;font-weight:600;color:var(--ink-faint);font-variant-numeric:tabular-nums;padding-bottom:14px;}
.nb-bgrid{position:relative;flex:1;min-width:0;display:flex;align-items:flex-end;gap:2px;padding-bottom:14px;
  background-image:repeating-linear-gradient(to top,var(--line-soft) 0 1px,transparent 1px 25%);
  background-position:left bottom;background-size:100% calc(100% - 14px);background-repeat:no-repeat;}
.nb-bcol{flex:1;min-width:0;display:flex;align-items:flex-end;justify-content:center;gap:1.5px;height:100%;position:relative;}
.nb-bcol .bl{position:absolute;bottom:-13px;left:0;right:0;text-align:center;font-size:7.5px;font-weight:600;
  color:var(--ink-faint);white-space:nowrap;overflow:hidden;}
/* columnas finas y elegantes */
.nb-bar{width:3px;max-width:3px;border-radius:1.5px;min-height:3px;
  transition:height var(--dur-slow) var(--ease-out);}
.nb-bar.g{background:linear-gradient(180deg,#FF6961,#FF3B30);}
.nb-bar.c{background:linear-gradient(180deg,#4BA3FF,#0A84FF);}
/* Con pocos tramos las barras engordan: pasa de ser una tira de rayitas a una
   comparación que se lee. El ancho es elástico y con tope, para que con seis
   columnas sigan siendo gruesas sin salirse del panel. */
.nb-bars.pocas .nb-bplot{min-height:130px;}
.nb-bars.pocas .nb-bgrid{gap:10px;}
.nb-bars.pocas .nb-bcol{gap:4px;}
.nb-bars.pocas .nb-bar{flex:1 1 0;width:auto;max-width:16px;min-width:5px;border-radius:4px 4px 2px 2px;min-height:4px;}
.nb-bars.pocas .nb-bcol .bl{font-size:9.5px;font-weight:700;color:var(--ink-soft);text-transform:capitalize;}
.nb-bleg{display:flex;gap:12px;margin-top:16px;font-size:9.5px;font-weight:700;color:var(--ink-soft);}
.nb-bleg span{display:flex;align-items:center;gap:5px;}
.nb-bleg i{width:8px;height:8px;border-radius:2px;}

/* ---------- 2 · Balance: barra de dos tramos superpuestos ---------- */
.nb-bal{padding:11px 4px 4px;}
.nb-bal + .nb-bal{border-top:1px solid var(--line-soft);margin-top:6px;}
.nb-balk{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:7px;flex-wrap:wrap;}
.nb-balk .nb-tag{font-size:9.5px;font-weight:700;letter-spacing:.03em;padding:2px 6px;border-radius:var(--r-full);}
.nb-tag.g{background:var(--danger-soft);color:var(--danger-text);}
.nb-tag.c{background:var(--accent-soft);color:var(--accent-deep);}
.nb-balrow{display:flex;align-items:center;gap:12px;}
.nb-track{position:relative;flex:1;min-width:0;height:8px;border-radius:var(--r-full);cursor:pointer;
  background:var(--line-soft);box-shadow:inset 0 1px 2px rgba(30,30,45,.07);overflow:hidden;}
.nb-seg{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);
  transition:width var(--dur-slow) var(--ease-out);}
.nb-seg.back{opacity:.95;}
.nb-seg.front{box-shadow:0 0 0 1px rgba(255,255,255,.92);}
.nb-seg.gasto{background:linear-gradient(180deg,#FF6961,#FF3B30);}
.nb-seg.gasto::after{content:"";position:absolute;inset:0;border-radius:inherit;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.30) 0 2px,rgba(255,255,255,0) 2px 7px);}
.nb-seg.capital{background:linear-gradient(180deg,#4BA3FF,#0A84FF);}
.nb-track:active .nb-seg{filter:brightness(.94);}
.nb-balv{flex:none;min-width:104px;text-align:right;}
.nb-balv .v{display:block;font-family:var(--num);font-weight:620;font-size:16px;letter-spacing:-.028em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap;}
.nb-balv.pos .v{color:var(--num-in);}
.nb-balv.neg .v{color:var(--num-out);}
.nb-balhint{font-size:10px;color:var(--ink-faint);margin-top:7px;display:flex;align-items:center;gap:4px;}

/* filas del desglose: dos filas y, dentro, su sub-desglose */
.nb-det{margin-top:9px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft);overflow:hidden;}
.nb-drow{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;font-size:12px;
  transition:background var(--dur-fast) var(--ease-out);}
.nb-drow:active{background:var(--line-soft);}
.nb-drow + .nb-drow,.nb-dsub + .nb-drow{border-top:1px solid var(--line-soft);}
.nb-dot{width:9px;height:9px;border-radius:3px;flex:none;}
.nb-dname{flex:1;min-width:0;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-dpct{font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums;min-width:46px;text-align:right;}
.nb-dval{font-family:var(--num);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;letter-spacing:-.018em;min-width:80px;text-align:right;}
.nb-dchev{color:var(--ink-faint);display:inline-flex;transition:transform var(--dur-base) var(--ease-out);}
.nb-drow.open .nb-dchev{transform:rotate(90deg);}
.nb-dsub{background:rgba(255,255,255,.4);}
.nb-dsub .nb-drow{padding-left:30px;font-size:11.5px;cursor:default;}
.nb-dsub .nb-drow:active{background:none;}
.nb-drow.tot{background:var(--glass-soft);}
.nb-drow.tot .nb-dname{font-weight:800;}
.nb-drow.tot.pos .nb-dval,.nb-drow.tot.pos .nb-dpct{color:var(--num-in);}
.nb-drow.tot.neg .nb-dval,.nb-drow.tot.neg .nb-dpct{color:var(--num-out);}

/* ---------- 3 · Cartera de inversión: qué tienes, en qué y dónde ---------- */
.nb-cartera{margin-top:14px;}
/* La rueda ocupa 128px fijos: si al lado no quedan al menos 150 para las
   cifras, se pasan debajo en vez de partir el importe en dos líneas. */
.ic-top{display:flex;align-items:center;flex-wrap:wrap;gap:16px;margin:4px 0 14px;}
.ic-donut{flex:none;line-height:0;}
.ic-cifras{flex:1 1 150px;min-width:150px;}
.ic-cifras .ic-k{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:4px;}
.ic-cifras .ic-v{font-family:var(--num);font-size:24px;font-weight:700;letter-spacing:-.03em;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.1;}
.ic-cifras .ic-s{font-size:11px;font-weight:600;color:var(--ink-soft);margin-top:4px;}
.ic-lista{display:flex;flex-direction:column;gap:2px;}
.ic-row{display:flex;align-items:center;gap:9px;padding:8px 2px;border-top:1px solid var(--line-soft);}
.ic-row:first-child{border-top:none;}
.ic-dot{flex:none;width:3px;align-self:stretch;border-radius:2px;min-height:26px;}
.ic-ico{flex:none;width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;}
.ic-n{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:13px;font-weight:700;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ic-n i{font-style:normal;font-size:10px;font-weight:600;color:var(--ink-faint);}
.ic-a{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:1px;font-family:var(--num);
  font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.ic-a i{font-style:normal;font-size:10px;font-weight:700;color:var(--ink-faint);}
.ic-cuentas{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:12px;padding-top:11px;
  border-top:1px solid var(--line-soft);font-size:10.5px;font-weight:600;color:var(--ink-soft);
  font-variant-numeric:tabular-nums;}
.ic-cuentas b{color:var(--ink);font-weight:800;}
.ic-cuentas svg{color:var(--ink-faint);}

/* ---------- inversión antigua: dos cajas en fila ---------- */
.nb-inv2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
.nb-inv{padding:14px;margin-top:0;}
.nb-inv .nb-h{margin-bottom:9px;font-size:12.5px;align-items:flex-start;min-height:2.7em;line-height:1.25;}
.nb-invrow{display:flex;align-items:center;gap:9px;cursor:pointer;}
.nb-invtrack{position:relative;flex:1;min-width:0;height:8px;border-radius:var(--r-full);background:var(--line-soft);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(30,30,45,.07);}
.nb-invfill{position:absolute;left:0;top:0;bottom:0;border-radius:var(--r-full);
  background:linear-gradient(90deg,#32ADE6,#0A84FF);transition:width var(--dur-slow) var(--ease-out);}
.nb-invv{flex:none;font-family:var(--num);font-weight:620;font-size:14px;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--ink);white-space:nowrap;}
.nb-invfoot{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:var(--ink-faint);font-weight:600;margin-top:7px;}

/* ---------- 4 · Movimientos: buscador y los dos historiales ---------- */
.nb-mov{min-height:390px;}
.nb-search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r-full);padding:9px 14px;margin-bottom:13px;}
.nb-search input{flex:1;min-width:0;border:none;background:none;outline:none;font-family:var(--font);font-size:13.5px;color:var(--ink);}
.nb-search input::placeholder{color:var(--ink-faint);opacity:1;}
.nb-search .nb-sico{color:var(--ink-faint);display:inline-flex;}
.nb-search .nb-sclr{color:var(--ink-faint);cursor:pointer;display:inline-flex;padding:2px;}
.nb-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;}
.nb-col{border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface-2);padding:10px 9px;min-width:0;}
.nb-colh{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:800;letter-spacing:-.01em;color:var(--ink);margin-bottom:9px;}
.nb-colh.out{color:var(--danger-text);}
.nb-colh.in{color:var(--success-text);}
.nb-it{display:flex;align-items:center;gap:8px;padding:8px;border-radius:var(--r-sm);cursor:pointer;min-width:0;
  background:var(--glass-strong);border:1px solid var(--line-soft);transition:border-color var(--dur-fast) var(--ease-out);}
.nb-it + .nb-it,.nb-itx + .nb-it{margin-top:7px;}
.nb-it:active{border-color:var(--line-strong);}
.nb-it.compact{align-items:flex-start;padding:8px 7px;gap:7px;}
.nb-it.compact .nb-itd{width:22px;height:22px;}
.nb-it.compact .nb-ita{display:block;margin:2px 0 1px;font-size:12px;}
.nb-itd{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;}
.nb-itm{display:block;flex:1;min-width:0;}
.nb-itc{display:block;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-its{display:block;font-size:9.5px;color:var(--ink-faint);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nb-ita{font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none;}
.nb-ita.neg{color:var(--danger);}
.nb-ita.pos{color:var(--success-text);}
.nb-itx{margin-top:7px;padding:8px 10px;border-radius:var(--r-sm);background:var(--glass-soft);border:1px solid var(--line-soft);
  font-size:10.5px;color:var(--ink-soft);line-height:1.6;}
.nb-itx b{color:var(--ink);font-weight:700;}
.nb-itx .r{display:flex;justify-content:space-between;gap:8px;}
.nb-itx .r span{flex:none;}
.nb-itx .r b{text-align:right;min-width:0;}
.nb-del{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;margin-top:9px;
  border:1px solid var(--danger-line);background:var(--danger-soft);color:var(--danger);
  font-family:var(--font);font-size:11px;font-weight:700;border-radius:var(--r-full);padding:8px;cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out);}
.nb-del:active{background:rgba(255,59,48,.2);}
.nb-colf{font-size:9.5px;color:var(--ink-faint);font-weight:600;text-align:center;margin-top:9px;}

/* ---------- el historial completo, ahora en su propio panel ---------- */
.nb-histbtn{display:flex;align-items:center;gap:9px;width:100%;margin-top:13px;cursor:pointer;
  border:1px solid var(--line);background:var(--surface-2);border-radius:var(--r-md);padding:12px 14px;
  font-family:var(--font);text-align:left;transition:background var(--dur-fast) var(--ease-out), border-color var(--dur-fast) var(--ease-out);}
.nb-histbtn:active{background:var(--accent-soft);border-color:var(--accent-line);}
.nb-histbtn .hb-ico{display:inline-flex;width:28px;height:28px;border-radius:9px;align-items:center;justify-content:center;
  background:var(--accent-soft);color:var(--accent);flex:none;}
.nb-histbtn .hb-t{flex:1;min-width:0;}
.nb-histbtn .hb-k{display:block;font-size:12.5px;font-weight:700;color:var(--ink);}
.nb-histbtn .hb-s{display:block;font-size:10px;font-weight:600;color:var(--ink-faint);margin-top:1px;}
.nb-histbtn .hb-c{color:var(--ink-faint);display:inline-flex;flex:none;}

.nb-sheet h3{margin:0 0 4px;}
.nb-range{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:12px 0 10px;}
.nb-range label{display:flex;align-items:center;gap:5px;flex:1;min-width:130px;
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-full);padding:7px 12px;}
.nb-range label span{font-size:10px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.03em;}
.nb-range input{flex:1;min-width:0;border:none;background:none;outline:none;font-family:var(--font);font-size:12.5px;color:var(--ink);}
.nb-fchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:6px;}
.nb-fchip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);font-family:var(--font);
  font-size:11.5px;font-weight:700;border-radius:var(--r-full);padding:7px 13px;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:all var(--dur-fast) var(--ease-out);}
.nb-fchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent);}
.nb-rclr{border:none;background:var(--line-soft);color:var(--ink-soft);font-family:var(--font);font-size:11.5px;font-weight:700;
  border-radius:var(--r-full);padding:7px 13px;cursor:pointer;transition:background var(--dur-fast) var(--ease-out);
  display:flex;align-items:center;gap:5px;}
.nb-rclr:active{background:var(--line);}
.nb-resumen{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;
  background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:9px 13px;margin-bottom:12px;
  font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
.nb-resumen .i{color:var(--success-text);}
.nb-resumen .o{color:var(--danger);}
.nb-lista{max-height:52vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-right:2px;}
.nb-day{margin-bottom:10px;}
.nb-dayh{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line-soft);margin-bottom:7px;}
.nb-dayd{font-size:11.5px;font-weight:800;color:var(--ink);}
.nb-daysum{margin-left:auto;display:flex;gap:9px;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;}
.nb-daysum .i{color:var(--success-text);}
.nb-daysum .o{color:var(--danger);}
.nb-sheet .nb-itc{font-size:12.5px;}
.nb-sheet .nb-its{font-size:10px;}
.nb-sheet .nb-ita{font-size:12.5px;}
.nb-more{width:100%;border:1px dashed var(--line-strong);background:none;color:var(--accent);font-family:var(--font);
  font-size:12px;font-weight:700;border-radius:var(--r-full);padding:10px;cursor:pointer;margin-top:6px;
  transition:background var(--dur-fast) var(--ease-out);}
.nb-more:active{background:var(--accent-soft);}

.nb-card [hidden],.nb-sheet [hidden]{display:none !important;}

@media (max-width:400px){
  .nb-card{padding:13px;}
  .nb-cell{padding:10px 8px;}
  .nb-balv{min-width:86px;}
  .nb-balv .v{font-size:13.5px;}
  .nb-dval{min-width:66px;}
  .nb-dpct{min-width:38px;}
  .nb-inv2{gap:8px;}
  .nb-inv{padding:11px;}
  .nb-cols{gap:7px;}
  .nb-col{padding:8px 7px;}
  .nb-pair.cmp{gap:7px;}
  .nb-pair.cmp .nb-pair-l{gap:7px;}
  .nb-bars{padding:9px 8px 8px;}
  .nb-bar{width:4px;max-width:4px;}
}
@media (prefers-reduced-motion: reduce){
  .nb-card{animation-duration:1ms;}
  .nb-drop{transition:none;}
  .nb-balv .v{transition:none;}
  .nb-roll .r-i{transition:none;}
}

/* ============================================================================
   CARTERAS · cabecera con selector de periodo y desglose de gastos
   El mismo esqueleto para Nómina, Efectivo y cada neo banco.
   ========================================================================== */
.pc-head{display:flex;align-items:center;gap:10px;margin:0 0 14px;flex-wrap:wrap;}
.pc-head .card-title{margin:0;flex:1;min-width:0;}
.pc-head .seg{margin-left:auto;}

/* selector segmentado, al estilo de los de iOS: pista suave y pastilla blanca */
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--r-full);
  background:rgba(118,118,128,.12);border:1px solid var(--line-soft);
  -webkit-user-select:none;user-select:none;}
.seg-b{border:none;background:none;font-family:var(--font);font-size:10.5px;font-weight:600;
  color:var(--ink-soft);padding:5px 9px;border-radius:var(--r-full);cursor:pointer;white-space:nowrap;
  transition:color var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out),
             box-shadow var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);}
.seg-b:active{transform:scale(.95);}
.seg-b.on{background:var(--glass-strong);color:var(--ink);font-weight:700;
  box-shadow:0 1px 3px rgba(30,30,45,.13), 0 0 0 .5px rgba(60,60,67,.05);}

.pc-now{font-size:11px;color:var(--ink-faint);font-weight:600;margin-top:5px;font-variant-numeric:tabular-nums;}
.pc-now b{color:var(--ink-soft);font-weight:700;}
.pc-periodo{font-size:10px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);}

/* ---- desglose de gastos: total arriba y una barra fina bajo cada línea ---- */
.pc-gastos{margin-top:18px;padding-top:16px;border-top:1px solid var(--line-soft);}
.pc-gh{font-size:11px;font-weight:600;color:var(--ink-soft);}
.pc-gt{font-family:var(--font);font-weight:800;font-size:clamp(19px,5.6vw,25px);letter-spacing:-.03em;
  color:var(--ink);font-variant-numeric:tabular-nums;margin:2px 0 15px;}
.pc-row{margin-bottom:13px;}
.pc-row:last-child{margin-bottom:0;}
.pc-rt{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:6px;}
.pc-ri{display:inline-flex;color:var(--ink-faint);flex:none;}
.pc-rn{flex:1;min-width:0;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.pc-rv{font-family:var(--num);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;
  font-feature-settings:"tnum" 1;letter-spacing:-.015em;white-space:nowrap;flex:none;}
.pc-rv i{font-style:normal;color:var(--ink-faint);font-weight:600;}
.pc-tr{height:4px;border-radius:var(--r-full);background:var(--line-soft);overflow:hidden;}
.pc-fi{display:block;height:100%;border-radius:var(--r-full);min-width:3px;
  transition:width var(--dur-slow) var(--ease-out);}
.pc-vacio{font-size:12px;color:var(--ink-faint);padding:4px 0 2px;}

/* ---- desplegable de cada barra: los movimientos que la forman ---- */
.pc-row.desplegable{cursor:pointer;border-radius:10px;margin-left:-6px;margin-right:-6px;padding:4px 6px 0;
  transition:background var(--dur-base) var(--ease-out);}
.pc-row.desplegable:active{background:var(--surface-2);}
.pc-row.desplegable.on{background:var(--surface-2);}
.pc-rchev{flex:none;display:inline-flex;color:var(--ink-faint);transition:transform var(--dur-base) var(--ease-out);}
.pc-row.on .pc-rchev{transform:rotate(90deg);color:var(--accent);}
.pc-sub{margin:-6px 0 13px;padding:9px 11px 5px;border-radius:12px;background:var(--surface-2);
  border:1px solid var(--line-soft);animation:subIn var(--dur-base) var(--ease-out) both;}
@keyframes subIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.pc-subh{font-size:9.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
  color:var(--ink-faint);margin-bottom:7px;font-variant-numeric:tabular-nums;}
.pc-srow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line-soft);}
.pc-srow:first-of-type{border-top:none;}
.pc-sn{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;font-size:12.5px;font-weight:600;
  color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc-sn i{font-style:normal;font-size:10px;font-weight:600;color:var(--ink-faint);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pc-sv{flex:none;font-family:var(--num);font-size:12.5px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;}
.pc-sec.in .pc-sv{color:var(--num-in);}
.pc-sec.out .pc-sv{color:var(--num-out);}
.pc-sec.inv .pc-sv{color:var(--num-inv);}

/* ---- "Mostrar más" de una lista larga ---- */
.pc-mas{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:10px;
  padding:9px 12px;border-radius:var(--r-full);border:1px solid var(--line);background:var(--surface-2);
  font-family:var(--font);font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out), color var(--dur-base) var(--ease-out);}
.pc-mas:active{transform:scale(.98);}
.pc-mas i{display:inline-flex;transition:transform var(--dur-base) var(--ease-out);}
.pc-mas.on{color:var(--accent);}
.pc-mas.on i{transform:rotate(-90deg);}
/* Los dos botones de la lista de suscripciones, uno al lado del otro. */
.sub-acciones{display:flex;gap:8px;margin-top:12px;}
.sub-acciones .pc-mas{margin-top:0;}
.sub-acciones .pc-mas.hist{color:var(--accent);border-color:var(--accent-line);background:var(--accent-soft);}
.sub-acciones .pc-mas.hist i{transform:none;}

/* ---- historial de suscripciones: una línea por apunte ---- */
.sh-it{display:flex;align-items:center;gap:10px;padding:9px 2px;border-top:1px solid var(--line-soft);}
.sh-it:first-of-type{border-top:none;}
.sh-ico{flex:none;width:28px;height:28px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;}
.sh-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.sh-n{font-size:13px;font-weight:700;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sh-s{font-size:10.5px;font-weight:500;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sh-r{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.sh-a{font-family:var(--num);font-size:13px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;}
.sh-b{display:inline-flex;align-items:center;gap:3px;font-size:9px;font-weight:800;letter-spacing:.01em;
  padding:2px 6px;border-radius:999px;color:var(--sb);background:var(--surface-2);
  border:1px solid var(--line);white-space:nowrap;}

/* La rueda se apaga menos el trozo de la categoría abierta. */
.dseg{transition:opacity var(--dur-base) var(--ease-out);}
.donut-wrap.enfocando .dseg{opacity:.18;}
.donut-wrap.enfocando .dseg.on{opacity:1;}

@media (max-width:400px){
  .pc-head{gap:7px;}
  .seg-b{padding:5px 7px;}
}
@media (max-width:330px){
  .pc-head .seg{margin-left:0;width:100%;justify-content:space-between;}
  .seg-b{flex:1;padding:5px 3px;text-align:center;}
}

/* ============================================================================
   Barras que se llenan solas y valores que ruedan como un reloj digital
   ========================================================================== */
/* Cada barra entra creciendo desde cero, con una curva que frena al final. */
@keyframes nbCrece{ from{ width:0; } to{ width:var(--w,0%); } }
@keyframes nbSube { from{ height:0; } to{ height:var(--h,0%); } }
@keyframes nbBrillo{
  0%,58%{ transform:translateX(-120%); opacity:0; }
  74%{ opacity:.5; }
  100%{ transform:translateX(120%); opacity:0; }
}
.nb-seg,.nb-invfill,.pc-fi{
  width:var(--w,0%);
  animation:nbCrece 1500ms cubic-bezier(.16,1,.3,1) both;
  transition:none;
}
.nb-seg.front{ animation-delay:150ms; }
.nb-bar{
  height:var(--h,0%);
  animation:nbSube 1100ms cubic-bezier(.16,1,.3,1) both;
  animation-delay:var(--d,0ms);
  transition:none;
}
/* un brillo corto recorre la barra cuando acaba de llenarse */
.nb-track::after,.nb-invtrack::after{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(100deg,transparent 0%,rgba(255,255,255,.55) 50%,transparent 100%);
  animation:nbBrillo 2100ms var(--ease-out) both;
}

/* el valor rueda: el que sale sube y el que entra asoma por debajo.
   La curva no tiene tirón en ninguna punta: sale despacio, cruza entero y
   frena largo, para que el cambio se lea sin sobresaltos. */
.nb-roll{display:inline-block;overflow:hidden;height:1.16em;line-height:1.16em;vertical-align:bottom;}
.nb-roll .r-i{display:block;transition:transform 1250ms cubic-bezier(.32,.72,.2,1);will-change:transform;}
.nb-roll .r-i > span{display:block;height:1.16em;line-height:1.16em;}
.nb-roll.pct .r-i{transform:translateY(-1.16em);}

@media (prefers-reduced-motion: reduce){
  .nb-seg,.nb-invfill,.pc-fi,.nb-bar{animation-duration:1ms;}
  .nb-track::after,.nb-invtrack::after{display:none;}
  .nb-roll .r-i{transition:none;}
}

/* ---- disponible real de la cuenta, con la inversión apartada ---- */
.pc-disp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px;padding:11px 13px;
  border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft);}
.pc-disp .pd-k{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--ink);}
.pc-disp .pd-v{margin-left:auto;font-family:var(--num);font-weight:640;font-size:15.5px;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;color:var(--num-in);}
.pc-disp .pd-s{flex-basis:100%;display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;color:var(--accent);}

/* ---- lo que ha hecho la cuenta dentro del tramo elegido ---- */
.pc-var{margin-top:10px;padding:11px 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft);}
.pc-var .pv-h{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.02em;
  text-transform:uppercase;color:var(--ink-faint);margin-bottom:9px;}
.pc-var .pv-row{display:flex;gap:7px;}
.pc-var .pv-b{flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:2px;
  padding:8px 9px;border-radius:var(--r-sm);background:var(--glass-soft);border:1px solid var(--line-soft);}
.pc-var .pv-b i{font-style:normal;font-size:9.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.02em;}
