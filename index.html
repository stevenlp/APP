     hacer con la categoría recién creada y a dónde vuelve Atrás. */
  function openNewCategory(alCrear, alVolver){
    const taken = new Set(Object.keys(gastoCats()).concat(Object.keys(CAT_INGRESO), Object.keys(CAT_LEGACY)).map(s=>s.toLowerCase()));
    let icon = 'sparkle', hex = WALLET_PALETTE[customCats().length % WALLET_PALETTE.length];
    function draw(){
      openOverlay(`<h3>Nueva categoría</h3>
        <div class="field-label">Nombre</div>
        <input type="text" id="ncName" maxlength="26" placeholder="Ej. Mascotas, Viajes, Regalos...">
        <div class="field-label">Ejemplo corto (opcional)</div>
        <input type="text" id="ncEx" maxlength="40" placeholder="Ej. Pienso, veterinario, juguetes">
        <div class="field-label">Icono</div>
        <div class="chip-grid">${WALLET_ICONS.concat(['fork','film','bus','cpu','home','drop','leaf','trending']).filter((v,i,a)=>a.indexOf(v)===i)
          .map(k=>`<div class="chip small ${icon===k?'active':''}" data-ncicon="${k}">${ic(k,15)}</div>`).join('')}</div>
        <div class="field-label" style="margin-top:12px;">Color</div>
        <div class="color-swatches">${WALLET_PALETTE.map(c=>`<div class="color-swatch ${hex===c?'active':''}" data-nccolor="${c}" style="background:${c}"></div>`).join('')}</div>
        <div class="sheet-actions">
          <button class="ghost-btn" id="ncCancel">Atrás</button>
          <button class="primary-btn glass-tap" id="ncSave" style="margin-top:0;">Crear y usar</button>
        </div>`);
      const keep = ()=>({n:(sheetBody.querySelector('#ncName')||{}).value||'', e:(sheetBody.querySelector('#ncEx')||{}).value||''});
      const restore = k=>{ sheetBody.querySelector('#ncName').value = k.n; sheetBody.querySelector('#ncEx').value = k.e; };
      sheetBody.querySelectorAll('[data-ncicon]').forEach(el=>{ el.onclick = ()=>{ const k=keep(); icon = el.dataset.ncicon; draw(); restore(k); }; });
      sheetBody.querySelectorAll('[data-nccolor]').forEach(el=>{ el.onclick = ()=>{ const k=keep(); hex = el.dataset.nccolor; draw(); restore(k); }; });
      sheetBody.querySelector('#ncCancel').onclick = ()=>alVolver();
      sheetBody.querySelector('#ncSave').onclick = async ()=>{
        const input = sheetBody.querySelector('#ncName');
        const name = input.value.trim().slice(0,26);
        if(!name){ markInvalid(input, 'Ponle un nombre a la categoría'); return; }
        if(taken.has(name.toLowerCase())){ markInvalid(input, 'Esa categoría ya existe, elígela de la lista'); return; }
        const ex = sheetBody.querySelector('#ncEx').value.trim().slice(0,40);
        abreTicket({
          titulo:'Nueva categoría', icono:icon, hex, importe:name,
          filas:[['Ejemplos', ex]],
          confirmar:'Crear y usar',
          onVolver: ()=>{ draw(); restore({n:name, e:ex}); },
          onConfirmar: async ()=>{
            state.customCategories.push({name, icon, hex, ex});
            await saveState();
            alCrear(name);
          },
        });
      };
    }
    draw();
  }

  /* Marca un campo en rojo y explica qué falta, justo encima de los botones. */
  function markInvalid(input, msg){
    if(!input) return;
    input.classList.add('input-error');
    /* El aviso se pega al apartado que falla, justo debajo del recuadro rojo,
       para que se lea al lado de lo que hay que rellenar. Si el campo no vive
       en un apartado propio, el aviso se queda encima de los botones. */
    const casa = input.closest('.tf-field');
    let box = sheetBody.querySelector('.form-error');
    if(box && casa && box.parentNode !== casa){ box.remove(); box = null; }
    if(!box){
      box = document.createElement('div');
      box.className = 'form-error';
      if(casa) casa.appendChild(box);
      else {
        const actions = sheetBody.querySelector('.sheet-actions');
        if(actions) actions.parentNode.insertBefore(box, actions);
        else sheetBody.appendChild(box);
      }
    }
    box.innerHTML = `${ic('warning',14)} <span></span>`;
    box.querySelector('span').textContent = msg;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    input.focus();
  }
  function clearInvalid(input){
    if(input) input.classList.remove('input-error');
    const box = sheetBody.querySelector('.form-error');
    if(box) box.remove();
  }

  function stepDescription(){
    const required = descRequired();
    const isNominaIngreso = esNomina(wizard.account) && wizard.kind === 'ingreso';
    const label = wizard.category === 'Otro tipo' ? 'Escribe la categoría' : 'Descripción rápida';
    openOverlay(`${crumb()}<h3>Describe el movimiento</h3>
      <div class="step-label metal-text">${required
        ? 'Obligatorio' : 'Opcional'}</div>
      <div class="field-label">${label}${required?' *':''}</div>
      <input type="text" id="descInput" placeholder="${isNominaIngreso ? 'Ej. Nómina de agosto, paga extra...' : (wizard.category === 'Otro tipo' ? 'Ej. Mascotas, multa, préstamo...' : 'Ej. Café con amigos')}" maxlength="60" value="${escapeHTML(wizard.description || '')}" />

      <textarea id="noteInput" placeholder="Añade más detalles si quieres..."></textarea>
      <div class="sheet-actions">
        <button class="ghost-btn" id="backBtn">Atrás</button>
        <button class="primary-btn glass-tap ${required?'is-locked':''}" id="nextBtn" style="margin-top:0;">Continuar</button>
      </div>`);
    const desc = sheetBody.querySelector('#descInput');
    const next = sheetBody.querySelector('#nextBtn');
    /* El botón se mantiene apagado hasta que hay descripción. */
    const sync = ()=>{
      if(!required) return;
      const ok = desc.value.trim().length > 0;
      next.classList.toggle('is-locked', !ok);
      if(ok) clearInvalid(desc);
    };
    desc.addEventListener('input', sync);
    sync();

    next.onclick = ()=>{
      const v = desc.value.trim();
      if(required && !v){ markInvalid(desc, 'Inserta una descripción rápida en el recuadro rojo'); return; }

      wizard.note = sheetBody.querySelector('#noteInput').value.trim();

    /* Si el importe viene de una nota del calendario llega ya escrito: solo
       hay que confirmarlo o corregirlo. */
    const previo = wizard.amount != null ? wizard.amount : '';
    openOverlay(`${crumb()}<h3>Importe</h3>
      <input type="number" inputmode="decimal" id="amountInput" placeholder="0.00" value="${previo}" />

    const amount = sheetBody.querySelector('#amountInput');
    const save = sheetBody.querySelector('#saveTxBtn');

      const ok = parseFloat(amount.value) > 0;
      save.classList.toggle('is-locked', !ok);
      if(ok) clearInvalid(amount);

    sync();

      abreTicket({

        filas: [
          ['Cuenta', accountMeta(wizard.account).label],
          [gasto ? 'Categoría' : 'Origen', cat],
          ['Descripción', wizard.category === 'Otro tipo' ? '' : wizard.description],
          ['Explicación', wizard.note],
        ],
        confirmar: 'Guardar',
        onVolver: stepAmount,
        onConfirmar: async ()=>{ await commitTransaction(); closeOverlay(); render(); showToast('Movimiento guardado'); },
      });

  async function commitTransaction(){
    const isPlatform = wizard.account.startsWith('platform:');
    let category = wizard.category;
    let description = wizard.description || '';
    if(isPlatform && wizard.kind === 'ingreso') category = 'Aporte';
    if(!category){
      if(esNomina(wizard.account) && wizard.kind === 'ingreso') category = 'Nómina';
      else category = wizard.kind === 'ingreso' ? 'Otro' : 'Compras';
    }
    if(category==='Otro tipo'){ category = (description || 'Otro').slice(0,60); description = ''; }
    const stamp = Date.now();   /* hora exacta de la operación */
    const tx = {
      id: stamp + '-' + Math.random().toString(36).slice(2,7),
      ts: stamp, account: wizard.account, kind: wizard.kind, category,
      description: description, note: wizard.note || '',
      amount: wizard.amount, remaining: wizard.kind==='gasto' ? wizard.amount : 0, compensated: false,
    };
    dismissedAlert = false; lastAlertMsg = null;
    if(!esNomina(wizard.account)){
      adjustAccount(wizard.account, wizard.kind==='ingreso' ? wizard.amount : -wizard.amount);
    }
    /* El aviso de límite superado se mira para cualquier cartera, no solo para
       la Nómina: un gasto de comida pagado en efectivo consume el límite de
       comida igual que si lo pagaras con la tarjeta. Y respeta si ese límite lo
       tienes puesto al mes o al año. */
    if(wizard.kind === 'gasto'){
      const limit = state.limits[category];
      if(limit > 0){
        /* El tramo que se mira es el del gasto que acabas de apuntar, no el mes
           que tengas abierto en el calendario. */
        const r = limiteRango(category, new Date(tx.ts));
        const gastado = +(limiteGastado(category, r) + wizard.amount).toFixed(2);
        if(gastado > limit){
          lastAlertMsg = `Presupuesto de "${escapeHTML(category)}" superado en ${r.texto}: ${fmt(gastado)} de ${fmt(limit)}.`;
        }
      }
    }
    state.transactions.push(tx);
    await saveState();
  }

  /* ---- Recorrer la barra de carteras ----
     En el móvil ya se desliza con el dedo. Con ratón, la rueda de arriba abajo
     la mueve de izquierda a derecha y también se puede arrastrar, para llegar a
     Nómina aunque tengas muchas carteras. */
  function bindTabsScroll(bar){
    if(!bar) return;
    const haySobra = ()=> bar.scrollWidth > bar.clientWidth + 1;
    bar.addEventListener('wheel', (e)=>{
      if(!haySobra()) return;
      const paso = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
      if(!paso) return;
      e.preventDefault();
      bar.scrollLeft += paso;
    }, {passive:false});
    /* Arrastrar con el ratón. El dedo no entra aquí: el táctil ya desliza solo
       y estorbaría al toque de las pestañas. */
    let x0 = 0, s0 = 0, cogido = false, recorrido = 0;
    bar.addEventListener('pointerdown', (e)=>{
      if(e.pointerType === 'touch' || !haySobra()) return;
      cogido = true; recorrido = 0; x0 = e.clientX; s0 = bar.scrollLeft;
    });
    bar.addEventListener('pointermove', (e)=>{
      if(!cogido) return;
      const dx = e.clientX - x0;
      if(Math.abs(dx) > 3){ recorrido = Math.abs(dx); bar.scrollLeft = s0 - dx; }
    });
    const soltar = ()=>{ cogido = false; };
    bar.addEventListener('pointerup', soltar);
    bar.addEventListener('pointerleave', soltar);
    bar.addEventListener('pointercancel', soltar);
    /* Si has arrastrado, ese toque no cuenta como clic en la pestaña. */
    bar.addEventListener('click', (e)=>{
      if(recorrido > 6){ e.stopPropagation(); e.preventDefault(); recorrido = 0; }
    }, true);
  }

  /* ============ CARTERAS: alta, baja y transferencias ============ */
  /* ---- El "+" de la barra: una cartera más, y nada más ----
     Solo pide nombre e icono. El color se lo pone la app y el saldo arranca a
     cero: lo que entre y salga se apunta luego desde el botón de abajo. */
  /* ---- Crear una cartera desde los bloques predeterminados ----
     Tres moldes: Neo banco (con sus tarjetas dentro), Nómina (con su propio
     sueldo, aviso de cobro y contrato) y Básico (un saldo sencillo, como
     Efectivo o las Pagas). Primero eliges el molde y luego el nombre. */
  const PLANTILLAS = [
    {id:'neo',    label:'Neo banco', icon:'card',   ex:'Con tus tarjetas dentro, igual que el bloque de Neo bancos'},
    {id:'nomina', label:'Nómina',    icon:'bank',   ex:'Con su propio sueldo, su aviso de cobro y su contrato'},
    {id:'base',   label:'Básico',    icon:'wallet', ex:'Un saldo sencillo: efectivo, pagas, una hucha…'},
  ];
  function openAddWallet(){
    let tipo = null, icon = 'wallet', nombre = '';
    const hex = nextWalletColor();
    function paso1(){
      openOverlay(`<h3>Nueva cartera</h3><div class="step-label metal-text">Elige un bloque predeterminado</div>
        <div class="tpl-list">${PLANTILLAS.map(t=>`
          <button type="button" class="tpl-card" data-tpl="${t.id}">
            <span class="tpl-ico" style="--tc:${t.id==='neo'?'#0A84FF':t.id==='nomina'?'#34C759':'#FF9F0A'}">${ic(t.icon,20)}</span>
            <span class="tpl-t"><b>${t.label}</b><i>${t.ex}</i></span>
            <span class="tpl-c">${ic('chevronRight',14)}</span>
          </button>`).join('')}</div>
        <div class="sheet-actions"><button class="ghost-btn" id="wCancel">Cancelar</button></div>`);
      sheetBody.querySelector('#wCancel').onclick = closeOverlay;
      sheetBody.querySelectorAll('[data-tpl]').forEach(el=>{ el.onclick = ()=>{ tipo = el.dataset.tpl; paso2(); }; });
    }
    function paso2(){
      const t = PLANTILLAS.find(x=>x.id === tipo);
      const ph = tipo === 'neo' ? 'Revolut, N26, Trade Republic…' : tipo === 'nomina' ? 'Segundo trabajo, pensión…' : 'Efectivo, hucha, sobre de viaje…';
      openOverlay(`<h3>${ic(t.icon,17)} ${t.label}</h3>
        <div class="field-label">Nombre</div>
        <input type="text" id="walletName" maxlength="24" placeholder="${ph}" value="${escapeHTML(nombre)}">
        ${tipo === 'base' ? `<div class="field-label" style="margin-top:12px;">Icono</div>
        <div class="chip-grid">${WALLET_ICONS.map(k=>`<div class="chip small ${icon===k?'active':''}" data-wicon="${k}">${ic(k,15)}</div>`).join('')}</div>` : ''}
        <div class="sheet-actions">
          <button class="ghost-btn" id="wBack">Atrás</button>
          <button class="primary-btn glass-tap" id="wSave" style="margin-top:0;">Crear</button>
        </div>`);
      const inp = sheetBody.querySelector('#walletName');
      setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 80);
      inp.addEventListener('input', ()=>{ nombre = inp.value; });
      inp.addEventListener('keydown', e=>{ if(e.key === 'Enter'){ e.preventDefault(); sheetBody.querySelector('#wSave').click(); } });
      sheetBody.querySelectorAll('[data-wicon]').forEach(el=>{ el.onclick = ()=>{ nombre = inp.value; icon = el.dataset.wicon; paso2(); }; });
      sheetBody.querySelector('#wBack').onclick = ()=>{ nombre = inp.value; paso1(); };
      sheetBody.querySelector('#wSave').onclick = async ()=>{
        const name = inp.value.trim().slice(0,24);
        if(!name){ markInvalid(inp, 'Ponle un nombre'); return; }
        nombre = name;
        const tpl = PLANTILLAS.find(x=>x.id === tipo);
        abreTicket({
          titulo:'Nueva cartera', icono: tipo === 'base' ? icon : tpl.icon, importe: name,
          filas:[['Bloque', tpl.label], ['Saldo inicial', fmt(0)]],
          confirmar:'Crear', onVolver: paso2, onConfirmar: crea,
        });
      };
      async function crea(){
        const name = nombre;
        const sello = Date.now().toString(36);
        if(tipo === 'neo'){
          if(!Array.isArray(state.neoGroups)) state.neoGroups = [];
          state.neoGroups.push({id:'ng' + sello, name});
          walletTab = 'neo:ng' + sello;
        } else if(tipo === 'nomina'){
          if(!Array.isArray(state.nominas)) state.nominas = [];
          /* Este mes no te pregunta nada: el sueldo lo pones tú en "Sueldo y
             contrato" y el aviso empieza el mes que viene. */
          state.nominas.push({id:'nm' + sello, name, icon:'bank', hex:'#248A3D',
            monthlySalaries:{}, salaryMonthly:0, working:true, contrato:{tipo:'indefinido'},
            salaryAsk:Object.assign(defaultSalaryAsk(), {lastAskedMonth:monthKey()})});
          walletTab = 'nomina:nm' + sello;
        } else {
          const id = 'w' + sello;
          state.wallets.push({id, name, icon, hex, balance:0});
          walletTab = id;
        }
        await saveState(); closeOverlay(); render();
        showToast(`"${name}" creada`);
      }
    }
    paso1();
  }

  function confirmRemoveWallet(id){
    if(id.startsWith('nomina:')){
      const idx = (state.nominas || []).findIndex(n=>'nomina:' + n.id === id);
      if(idx < 0) return;
      const n = state.nominas[idx];
      const movs = state.transactions.filter(t=>t.account === id).length;
      confirmSheet(`Eliminar "${n.name}"`,
        (movs ? `Tiene ${movs} movimiento${movs===1?'':'s'}: se conservan en el historial. ` : '') + 'Su sueldo y su saldo dejarán de contar en el total.',
        'Eliminar', async ()=>{
          state.nominas.splice(idx, 1); walletTab = 'nomina';
          await saveState(); render();
          showUndoToast('Nómina eliminada', async ()=>{ state.nominas.splice(idx, 0, n); walletTab = id; await saveState(); render(); });
        }, true);
      return;
    }
    if(id.startsWith('neo:')){
      const idx = (state.neoGroups || []).findIndex(g=>'neo:' + g.id === id);
      if(idx < 0) return;
      const g = state.neoGroups[idx];
      const tarjetas = state.platforms.filter(p=>p.group === g.id);
      confirmSheet(`Eliminar "${g.name}"`,
        tarjetas.length
          ? `Sus ${tarjetas.length} tarjeta${tarjetas.length===1?'':'s'} pasan a Neo bancos con su saldo y sus movimientos: no se pierde nada.`
          : 'Se quitará de tus carteras.',
        'Eliminar', async ()=>{
          tarjetas.forEach(p=>{ p.group = null; });
          state.neoGroups.splice(idx, 1); walletTab = 'plataformas';
          await saveState(); render();
          showUndoToast('Neo banco eliminado', async ()=>{
            state.neoGroups.splice(idx, 0, g); tarjetas.forEach(p=>{ p.group = g.id; });
            walletTab = id; await saveState(); render();
          });
        }, true);
      return;
    }
    const w = state.wallets.find(x=>x.id === id);
    if(!w) return;
    const movs = state.transactions.filter(t=>t.account === id).length;
    confirmSheet(
      `Eliminar "${w.name}"`,
      movs
        ? `Esta cartera tiene ${movs} movimiento${movs===1?'':'s'} registrado${movs===1?'':'s'}. Se conservan en el historial, pero la cartera dejará de aparecer y su saldo de ${fmt(w.balance)} ya no contará en el total.`
        : `Se quitará de tus carteras. Su saldo de ${fmt(w.balance)} dejará de contar en el total.`,
      'Eliminar',
      async ()=>{
        const idx = state.wallets.findIndex(x=>x.id === id);
        const removed = state.wallets[idx];
        state.wallets.splice(idx, 1);
        walletTab = 'nomina';
        await saveState(); render();
        showUndoToast('Cartera eliminada', async ()=>{
          state.wallets.splice(idx, 0, removed);
          walletTab = removed.id;
          await saveState(); render();
        });
      },
      true
    );
  }

  /* Transferencia entre carteras: sale de una y entra en otra. No cuenta como
     gasto ni como ingreso, solo mueve el dinero de sitio. */
  function openTransferSheet(presetFrom){
    const accounts = allAccounts();
    /* El origen viene dado por la pantalla desde la que has pulsado Transferir:
       no se puede cambiar aquí, se cambia yendo a esa cartera. */
    const from = presetFrom && accounts.some(a=>a.id===presetFrom) ? presetFrom : accounts[0].id;
    const fromAcc = findAccount(from);
    const destinos = accounts.filter(a=>a.id !== from);
    if(!destinos.length){
      showToast('Necesitas al menos otra cartera para poder transferir.', true);
      return;
    }
    let to = destinos[0].id;
    /* El concepto es obligatorio: sin él no se puede mandar el dinero, para que
       dentro de un mes se sepa de qué iba cada traspaso. */
    let concepto = '';
    function draw(keepAmount){
      const disponible = accountBalance(from);
      openOverlay(`<h3>Transferir dinero</h3>

        <div class="field-label">Desde</div>
        <div class="transfer-from" style="--tf:${fromAcc.hex}">
          <span class="tf-ico">${ic(fromAcc.icon,18)}</span>
          <div class="tf-mid">
            <div class="tf-name">${escapeHTML(fromAcc.name)}</div>
            <div class="tf-bal">Disponible: <b>${fmt(disponible)}</b></div>
          </div>
          <span class="tf-lock">${ic('check',14)}</span>
        </div>

        <div class="transfer-arrow">${ic('arrowDown',20)}</div>

        <div class="field-label">Hasta</div>
        ${accountChipsHTML({exclude:from, selected:to, small:true})}

        <div class="tf-field" id="tfConceptWrap">
          <div class="field-label" style="margin-top:12px;">Concepto <b class="req">· obligatorio</b></div>
          <input type="text" id="tfConcept" maxlength="60" placeholder="Ej. ahorro del mes, pagar el alquiler, meter en inversión..." value="${escapeHTML(concepto)}">
        </div>

        <div class="tf-field" id="tfAmountWrap">
          <div class="field-label" style="margin-top:12px;">Importe</div>
          <input type="number" inputmode="decimal" id="tfAmount" placeholder="0.00" value="${keepAmount||''}">
        </div>

        <div class="sheet-actions">
          <button class="ghost-btn" id="tfCancel">Cancelar</button>
          <button class="primary-btn glass-tap is-locked" id="tfSave" style="margin-top:0;">${ic('repeat',15)} Transferir</button>
        </div>`);

      const amountEl = sheetBody.querySelector('#tfAmount');
      const conceptEl = sheetBody.querySelector('#tfConcept');
      const saveEl = sheetBody.querySelector('#tfSave');
      /* Rodea en rojo el apartado que falta y deja el aviso debajo. */
      const ringOff = wrap=>{ if(wrap) wrap.classList.remove('ring-alert'); };
      const ringOn = (wrap, input, msg)=>{
        ringOff(sheetBody.querySelector('#tfConceptWrap'));
        ringOff(sheetBody.querySelector('#tfAmountWrap'));
        if(wrap) wrap.classList.add('ring-alert');
        markInvalid(input, msg);
      };
      const sync = ()=>{
        const okImporte = parseFloat(amountEl.value) > 0;
        const okConcepto = conceptEl.value.trim().length > 0;
        saveEl.classList.toggle('is-locked', !(okImporte && okConcepto));
        if(okConcepto){ clearInvalid(conceptEl); ringOff(sheetBody.querySelector('#tfConceptWrap')); }
        if(okImporte){ clearInvalid(amountEl); ringOff(sheetBody.querySelector('#tfAmountWrap')); }
      };
      amountEl.addEventListener('input', sync);
      conceptEl.addEventListener('input', ()=>{ concepto = conceptEl.value; sync(); });
      sync();

      /* Mantener pulsado un destino enseña cuánto hay ahora mismo en él. */
      bindAccountChips(sheetBody, (id)=>{
        to = id;
        markAccountChip(sheetBody, id);
      }, (id)=>{
        const acc = findAccount(id);
        if(acc) showSheetHint(`${acc.name}: ${fmt(accountBalance(acc.id))} ahora mismo`, acc.icon);
      });
      /* A los 5 segundos sin tocar nada, se recuerda el truco del saldo. */
      startIdleHint('Mantén pulsada una cuenta para ver su saldo', 5000);
      sheetBody.querySelector('#tfCancel').onclick = closeOverlay;
      saveEl.onclick = async ()=>{
        const texto = conceptEl.value.trim();
        if(!texto){
          ringOn(sheetBody.querySelector('#tfConceptWrap'), conceptEl,
            'Hace falta un concepto: escribe de qué trata la transferencia en el recuadro rojo');
          return;
        }
        const v = parseFloat(amountEl.value);
        if(!(v > 0)){
          ringOn(sheetBody.querySelector('#tfAmountWrap'), amountEl,
            'Escribe un importe mayor que cero en el recuadro rojo');
          return;
        }
        const amount = +v.toFixed(2);
        const toAcc = findAccount(to);
        clearIdleHint();
        abreTicket({
          titulo:'Transferencia', icono:'repeat', hex:'#8E8E93', importe: fmt(amount),
          filas:[['Desde', fromAcc.name], ['Hacia', toAcc.name], ['Concepto', texto]],
          confirmar:'Transferir', onVolver: ()=>draw(amount),
          onConfirmar: async ()=>{
            const snapshot = JSON.stringify({w:state.wallets, p:state.platforms, t:state.transactions});
            doTransfer(from, to, amount, texto);
            await saveState(); closeOverlay(); render();
            showUndoToast(`${fmt(amount)} de ${fromAcc.name} a ${toAcc.name} · ${texto}`, async ()=>{
              const prev = JSON.parse(snapshot);
              state.wallets = prev.w; state.platforms = prev.p; state.transactions = prev.t;
              await saveState(); render();
            });
          },
        });
      };
    }
    draw();
  }

  function doTransfer(from, to, amount, concepto){
    const fromAcc = findAccount(from), toAcc = findAccount(to);
    const ts = Date.now();
    const uid = s=> 'tf' + s + ts.toString(36) + Math.random().toString(36).slice(2,6);
    /* El concepto viaja en las dos patas del traspaso: así en el historial se
       ve de qué iba, además de de dónde salió y dónde entró. */
    const texto = String(concepto || '').trim();
    /* Las dos patas comparten marca: así borrar una se lleva la otra. */
    const tfId = uid('p');
    adjustAccount(from, -amount);
    adjustAccount(to, amount);
    state.transactions.push({
      id: uid('o'), ts, account: from, kind:'gasto', category:'Transferencia',
      description:'Hacia ' + (toAcc ? toAcc.name : to) + (texto ? ' · ' + texto : ''),
      note: texto, concept: texto, transfer:true, tfId,
      amount, remaining:0, compensated:true,
    });
    state.transactions.push({
      id: uid('i'), ts: ts+1, account: to, kind:'ingreso', category:'Transferencia',
      description:'Desde ' + (fromAcc ? fromAcc.name : from) + (texto ? ' · ' + texto : ''),
      note: texto, concept: texto, transfer:true, tfId,
      amount, remaining:0, compensated:true,
    });
  }

  /* ============ export / import ============ */
  function exportarJSON(){
    const fecha = new Date().toISOString().slice(0,10);
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `datos_finanzas_${fecha}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    showToast('Datos exportados correctamente.');
  }
  function importarJSON(event){
    const file = event.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = (e)=>{
      let parsed;
      try{ parsed = JSON.parse(e.target.result); }
      catch(err){ showToast('Ese archivo no es un backup válido de esta app.', true); event.target.value=''; return; }
      if(!parsed || typeof parsed !== 'object' || Array.isArray(parsed)){
        showToast('Ese archivo no es un backup válido de esta app.', true); event.target.value=''; return;
      }
      confirmSheet(
        'Importar datos',
        'Esto reemplazará todos tus datos actuales por los del archivo importado. Esta acción no se puede deshacer.',
        'Reemplazar datos',
        async ()=>{
          state = normalizeState(parsed);
          await saveState();
          render();
          const n = state.transactions.length;
          showToast(`Datos importados: ${n} movimiento${n===1?'':'s'} restaurado${n===1?'':'s'}.`);
        },
        true
      );
      event.target.value = '';
    };
    reader.readAsText(file);
  }
  function exportarAppCompleta(){
    const fecha = new Date().toISOString().slice(0,10);
    const clone = document.documentElement.cloneNode(true);
    /* fuera cualquier copia anterior incrustada, para no duplicar datos */
    const oldSeed = clone.querySelector('#__seedStateData');
    if(oldSeed) oldSeed.remove();
    const seed = document.createElement('script');
    seed.id = '__seedStateData';
    seed.type = 'application/json';
    seed.textContent = JSON.stringify(state);
    /* va en el head: así ya está en el documento cuando arranca la app */
    const head = clone.querySelector('head') || clone.firstElementChild;
    head.appendChild(seed);
    let html = '<!DOCTYPE html>' + clone.outerHTML;
    const blob = new Blob([html], {type:'text/html'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `control-financiero_${fecha}.html`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1000);
    showToast('App exportada con tus datos incluidos.');
  }

  /* ============================================================
     PERSONALIZACIÓN DE LOS BLOQUES
     ============================================================
     El tiempo lo manda un único selector (CART_PERIODOS · cartPeriodo ·
     cartRango): aquí ya no vive ningún otro reloj. */
  let editMode = false;          /* mover, renombrar y quitar bloques */

  /* ---------- ajustes de aspecto, guardados junto a los datos ---------- */
  function defaultUI(){ return {order:{}, hidden:{}, labels:{}, free:{}}; }
  function uiCfg(){
    if(!state.ui || typeof state.ui !== 'object') state.ui = defaultUI();
    if(!state.ui.order  || typeof state.ui.order  !== 'object') state.ui.order = {};
    if(!state.ui.hidden || typeof state.ui.hidden !== 'object') state.ui.hidden = {};
    if(!state.ui.labels || typeof state.ui.labels !== 'object') state.ui.labels = {};
    if(!state.ui.free   || typeof state.ui.free   !== 'object') state.ui.free = {};
    return state.ui;
  }
  /* Textos que se pueden reescribir desde el propio bloque. */
  const LABEL_DEF = {};
  function LT(key, texto){
    LABEL_DEF[key] = texto;
    const v = uiCfg().labels[key];
    return (v == null || v === '') ? texto : v;
  }
  function L(key, texto){ return '<span data-lbl="'+key+'">' + escapeHTML(LT(key, texto)) + '</span>'; }

  function bloqueOculto(scope, id){
    const l = uiCfg().hidden[scope];
    return Array.isArray(l) && l.indexOf(id) >= 0;
  }
  /* Ordena los bloques como los hayas dejado y los envuelve con su barrita. */
  function renderBloques(scope, bloques){
    const cfg = uiCfg();
    const orden = Array.isArray(cfg.order[scope]) ? cfg.order[scope] : [];
    const vivos = bloques.filter(b=>b && b.html && String(b.html).trim());
    const puestos = [];
    orden.forEach(id=>{ const b = vivos.find(x=>x.id===id); if(b && puestos.indexOf(b)<0) puestos.push(b); });
    vivos.forEach(b=>{ if(puestos.indexOf(b)<0) puestos.push(b); });
    const ocultos = puestos.filter(b=>bloqueOculto(scope,b.id));
    const cuerpo = puestos.filter(b=>!bloqueOculto(scope,b.id)).map(b=>`
      <section class="blk" data-blk="${b.id}">
        <div class="blk-bar">
          <span class="bb-grip">${ic('chip',13)} ${escapeHTML(b.name || b.id)}</span>
          <button type="button" class="bb-up" title="Subir">↑</button>
          <button type="button" class="bb-down" title="Bajar">↓</button>
          <button type="button" class="bb-hide del" title="Quitar">Quitar</button>
        </div>
        ${b.html}
      </section>`).join('');
    const banner = `<div class="edit-banner">
        <span>${ic('edit',14)} <b>Modo edición.</b> Arrastra ⠿ para mover un bloque, toca cualquier texto marcado para reescribirlo y usa "Quitar" para esconderlo.</span>
        <span class="eb-btns">
          <button type="button" id="ebReset">Restablecer</button>
          <button type="button" id="ebDone">Listo</button>
        </span>
      </div>`;
    const escondidos = ocultos.length ? `<div class="hidden-blocks">
        <span class="hb-k">Bloques quitados · toca para recuperarlos</span>
        ${ocultos.map(b=>`<button type="button" class="hb-back" data-back="${b.id}">${ic('plus',12)} ${escapeHTML(b.name||b.id)}</button>`).join('')}
      </div>` : '';
    return banner + cuerpo + escondidos;
  }

  async function guardaOrden(scope, cont){
    const ids = Array.from(cont.querySelectorAll(':scope > .blk')).map(el=>el.dataset.blk);
    const cfg = uiCfg();
    const previos = Array.isArray(cfg.order[scope]) ? cfg.order[scope] : [];
    /* los que están escondidos conservan su sitio en la lista */
    const resto = previos.filter(id=>ids.indexOf(id) < 0);
    cfg.order[scope] = ids.concat(resto);
    await saveState();
  }

  /* Arrastrar con el dedo: el bloque sigue al dedo y los vecinos se apartan. */
  function bindBloques(scope, cont){
    cont.querySelectorAll(':scope > .blk .bb-hide').forEach(btn=>{
      btn.onclick = async (e)=>{
        e.stopPropagation();
        const id = btn.closest('.blk').dataset.blk;
        const cfg = uiCfg();
        if(!Array.isArray(cfg.hidden[scope])) cfg.hidden[scope] = [];
        if(cfg.hidden[scope].indexOf(id) < 0) cfg.hidden[scope].push(id);
        await saveState(); render();
      };
    });
    const mover = async (blk, dir)=>{
      const hermanos = Array.from(cont.querySelectorAll(':scope > .blk'));
      const i = hermanos.indexOf(blk), j = i + dir;
      if(j < 0 || j >= hermanos.length) return;
      if(dir < 0) cont.insertBefore(blk, hermanos[j]);
      else cont.insertBefore(hermanos[j], blk);
      await guardaOrden(scope, cont);
    };
    cont.querySelectorAll(':scope > .blk .bb-up').forEach(b=>{ b.onclick = e=>{ e.stopPropagation(); mover(b.closest('.blk'), -1); }; });
    cont.querySelectorAll(':scope > .blk .bb-down').forEach(b=>{ b.onclick = e=>{ e.stopPropagation(); mover(b.closest('.blk'), 1); }; });
    cont.querySelectorAll('.hb-back').forEach(b=>{
      b.onclick = async ()=>{
        const cfg = uiCfg();
        cfg.hidden[scope] = (cfg.hidden[scope]||[]).filter(x=>x !== b.dataset.back);
        await saveState(); render();
      };
    });
    const eb = document.getElementById('ebDone');
    if(eb) eb.onclick = ()=>{ editMode = false; document.body.classList.remove('editing'); render(); };
    const er = document.getElementById('ebReset');
    if(er) er.onclick = ()=>{
      confirmSheet('Restablecer el aspecto',
        'Los bloques vuelven a su sitio original, se recuperan los quitados y los textos recuperan su nombre. Tus movimientos y saldos no se tocan.',
        'Restablecer',
        async ()=>{ state.ui = defaultUI(); await saveState(); render(); showToast('Aspecto restablecido.'); });
    };

    cont.querySelectorAll(':scope > .blk .bb-grip').forEach(grip=>{
      const blk = grip.closest('.blk');
      grip.addEventListener('pointerdown', ev=>{
        if(!editMode) return;
        ev.preventDefault();
        /* Los eventos van a la ventana: al recolocar el bloque en el DOM se
           pierde la captura del puntero y el arrastre se cortaría a medias. */
        let startY = ev.clientY, dy = 0, autoScroll = 0;
        blk.classList.add('dragging');
        document.body.style.userSelect = 'none';
        const recoloca = (clientY)=>{
          const r = blk.getBoundingClientRect();
          const centro = r.top + r.height/2;
          const hermanos = Array.from(cont.querySelectorAll(':scope > .blk')).filter(x=>x !== blk);
          for(const h of hermanos){
            const hr = h.getBoundingClientRect();
            if(centro > hr.top && centro < hr.bottom){
              const antes = centro < hr.top + hr.height/2;
              const visualTop = r.top;
              blk.style.transform = 'none';
              cont.insertBefore(blk, antes ? h : h.nextSibling);
              const nuevo = blk.getBoundingClientRect().top;
              dy = visualTop - nuevo;
              startY = clientY - dy;
              blk.style.transform = 'translateY(' + dy + 'px)';
              return;
            }
          }
        };
        const mueve = (e)=>{
          e.preventDefault();
          dy = e.clientY - startY;
          blk.style.transform = 'translateY(' + dy + 'px)';
          recoloca(e.clientY);
          /* cerca de los bordes la pantalla acompaña al dedo */
          const alto = window.innerHeight;
          if(e.clientY < 90) autoScroll = -12;
          else if(e.clientY > alto - 90) autoScroll = 12;
          else autoScroll = 0;
        };
        const tick = ()=>{
          if(autoScroll){ window.scrollBy(0, autoScroll); startY -= autoScroll; recoloca(startY + dy); }
          if(vivo) requestAnimationFrame(tick);
        };
        let vivo = true;
        const suelta = async ()=>{
          vivo = false; autoScroll = 0;
          window.removeEventListener('pointermove', mueve);
          window.removeEventListener('pointerup', suelta);
          window.removeEventListener('pointercancel', suelta);
          document.body.style.userSelect = '';
          blk.classList.remove('dragging');
          blk.style.transform = '';
          await guardaOrden(scope, cont);
        };
        window.addEventListener('pointermove', mueve, {passive:false});
        window.addEventListener('pointerup', suelta);
        window.addEventListener('pointercancel', suelta);
        requestAnimationFrame(tick);
      });
    });
  }

  /* ---------- textos reescribibles ---------- */
  async function renombrarCategoria(viejo, nuevo){
    nuevo = String(nuevo||'').trim().slice(0,40);
    if(!nuevo || nuevo === viejo) return;
    state.transactions.forEach(t=>{ if(t.category === viejo) t.category = nuevo; });
    state.subscriptions.forEach(su=>{ if(su.category === viejo) su.category = nuevo; });
    if(state.limits && state.limits[viejo] != null){ state.limits[nuevo] = state.limits[viejo]; delete state.limits[viejo]; }
    state.limitCategories = (state.limitCategories||[]).map(c=>c===viejo?nuevo:c);
    state.customCategories = (state.customCategories||[]).map(c=> (c && c.name===viejo) ? Object.assign({}, c, {name:nuevo}) : c);
    await saveState(); render();
    showToast('Categoría renombrada a "' + nuevo + '".');
  }
  /* ---------- cualquier texto de la pantalla se puede reescribir ----------
     Cada render vuelve a pintar el texto de fábrica, así que la clave de cada
     texto es el propio texto original: basta con volver a sustituirlo. */
  const NO_EDIT_SEL = 'input,textarea,select,option,svg,.blk-bar,.edit-banner,.hidden-blocks,.head-actions,[data-lbl],[data-cat]';
  /* Los nombres que has escrito tú (carteras, categorías, notas) no son textos
     de la app: se cambian en su propia ficha, no desde aquí. */
  function nombresDeDatos(){
    const set = new Set();
    const add = v=>{ const t = String(v==null?'':v).trim(); if(t) set.add(t); };
    (state.wallets||[]).forEach(w=>add(w.name));
    (state.platforms||[]).forEach(p=>add(p.name));
    (state.subscriptions||[]).forEach(su=>{ add(su.name); add(su.category); });
    (state.transactions||[]).forEach(t=>{ add(t.category); add(t.description); add(t.note); });
    Object.keys(gastoCats()).forEach(add);
    Object.keys(CAT_INGRESO).forEach(add);
    (state.limitCategories||[]).forEach(add);
    return set;
  }
  function textoDirecto(el){
    let txt = '';
    el.childNodes.forEach(nd=>{ if(nd.nodeType === 3) txt += nd.nodeValue; });
    return txt.replace(/\s+/g,' ').trim();
  }
  function ponTextoDirecto(el, nuevo){
    let puesto = false;
    Array.from(el.childNodes).forEach(nd=>{
      if(nd.nodeType !== 3 || !nd.nodeValue.trim()) return;
      if(puesto){ nd.nodeValue = ''; return; }
      nd.nodeValue = nd.nodeValue.replace(/^(\s*).*?(\s*)$/s, '$1' + nuevo.replace(/\$/g,'$$$$') + '$2');
      puesto = true;
    });
    if(!puesto) el.textContent = nuevo;
  }
  /* Sitios donde vive una cifra: ahí no se escribe. */
  const NUM_SEL = '.tri-v,.tri-p,.cti-v,.saldo-num,.analysis-total,.wl-v,.bb-val,.lamt,.lpct,'
    + '.tx-amt,.tx-comp,.ns-amt,.ns-num,.mov-month,.ms-in,.ms-out,.up-days,.up-amt,.up-name,'
    + '.mini-stat,.cbr-top b,.limit-foot,.ac-sub,.sr-s,.ss-top,.ns-sub,.sub-next,.bb-name,.tx-cat,.tx-desc,.tx-note';
  function esTextoEditable(el, datos){
    if(el.closest(NO_EDIT_SEL) || el.closest(NUM_SEL)) return false;
    const txt = textoDirecto(el);
    if(txt.length < 2 || txt.length > 90) return false;
    if(/[€%]/.test(txt)) return false;                         /* dinero y porcentajes */
    if(/^[\s+\-–—0-9.,:·/]+$/.test(txt)) return false;          /* solo cifras */
    if(/\d{1,2}:\d{2}/.test(txt)) return false;                /* horas */
    if(/\b\d{1,2}\s*(ene|feb|mar|abr|may|jun|jul|ago|sep|oct|nov|dic)/i.test(txt)) return false;
    if(datos.has(txt)) return false;
    return true;
  }
  /* Las cifras que lleve dentro un rótulo no forman parte de su nombre: así
     "3 pagos" y "4 pagos" siguen siendo el mismo texto para la app. */
  function claveTexto(t){ return t.replace(/\d+([.,]\d+)?/g, '#'); }
  /* Pinta los textos que hayas reescrito y marca cuáles se pueden tocar. */
  function aplicaTextosLibres(zona){
    const cfg = uiCfg();
    if(!cfg.free || typeof cfg.free !== 'object') cfg.free = {};
    const datos = nombresDeDatos();
    (zona || document).querySelectorAll('#mainRoot *, .bottom-nav *, .sheet *, .modal *').forEach(el=>{
      if(el.dataset.free) return;
      if(!esTextoEditable(el, datos)) return;
      const base = textoDirecto(el);
      const key = activeTab + '·' + claveTexto(base);
      el.dataset.free = key;
      el.dataset.freeDef = base;
      const val = cfg.free[key];
      if(val != null && val !== base) ponTextoDirecto(el, val);
    });
  }
  /* Hoja para escribir el texto nuevo: nada de escribir sobre la pantalla, así
     ningún icono ni ningún botón se rompe por el camino. */
  function openTextSheet(titulo, actual, original, onSave, onReset){
    openOverlay(`<h3>${escapeHTML(titulo)}</h3>
      <input type="text" id="txtNuevo" maxlength="60" value="${escapeHTML(actual)}" autocomplete="off">
      <div class="sheet-actions">
        <button class="ghost-btn" id="txtCancel">Cancelar</button>
        <button class="primary-btn glass-tap" id="txtSave" style="margin-top:0;">Guardar</button>
      </div>
      ${actual !== original ? `<div class="settings-link" id="txtReset" style="margin-top:14px;">Volver a "${escapeHTML(original)}"</div>` : ''}`);
    const input = sheetBody.querySelector('#txtNuevo');
    setTimeout(()=>{ input.focus(); input.select(); }, 120);
    sheetBody.querySelector('#txtCancel').onclick = closeOverlay;
    const guarda = async ()=>{ const v = input.value.trim().slice(0,60); closeOverlay(); await onSave(v); };
    sheetBody.querySelector('#txtSave').onclick = guarda;
    input.onkeydown = e=>{ if(e.key === 'Enter'){ e.preventDefault(); guarda(); } };
    if(sheetBody.querySelector('#txtReset')) sheetBody.querySelector('#txtReset').onclick = async ()=>{ closeOverlay(); await onReset(); };
  }
  /* En modo edición, el primer clic sobre cualquier texto abre esa hoja en vez
     de hacer lo que haría el botón. Fuera del modo edición no estorba nada. */
  document.addEventListener('click', e=>{
    if(!editMode) return;
    if(e.target.closest('.blk-bar, .edit-banner, .hidden-blocks, .overlay, .modal-overlay, .head-actions, .toast')) return;
    const el = e.target.closest('[data-lbl],[data-cat],[data-free]');
    if(!el) return;
    e.preventDefault(); e.stopPropagation();
    const cfg = uiCfg();
    if(el.dataset.cat != null){
      const cat = el.dataset.cat;
      openTextSheet('Renombrar categoría', cat, cat,
        async v=>{ await renombrarCategoria(cat, v); }, async ()=>{});
      return;
    }
    if(el.dataset.lbl != null){
      const key = el.dataset.lbl, def = LABEL_DEF[key] != null ? LABEL_DEF[key] : el.textContent.trim();
      openTextSheet('Cambiar texto', LT(key, def), def,
        async v=>{ if(!v || v === def) delete cfg.labels[key]; else cfg.labels[key] = v; await saveState(); render(); },
        async ()=>{ delete cfg.labels[key]; await saveState(); render(); });
      return;
    }
    const key = el.dataset.free, def = el.dataset.freeDef || textoDirecto(el);
    openTextSheet('Cambiar texto', textoDirecto(el), def,
      async v=>{ if(!v || v === def) delete cfg.free[key]; else cfg.free[key] = v; await saveState(); render(); },
      async ()=>{ delete cfg.free[key]; await saveState(); render(); });
  }, true);

  function bindTextosEditables(){ aplicaTextosLibres(); }

  /* ---------- cabecera: nombres de las pestañas y botón de editar ---------- */
  function pintaCabecera(){
    const NAV_DEF = {'nav.inicio':'Inicio','nav.carteras':'Carteras','nav.suscripciones':'Pagos',
                     'nav.limites':'Límites'};
    Object.keys(NAV_DEF).forEach(k=>{
      const el = document.querySelector('[data-lbl="'+k+'"]');
      if(el) el.textContent = LT(k, NAV_DEF[k]);
    });
    const hd = document.getElementById('hdrDate');
    if(hd){
      const f = new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'});
      hd.textContent = f.charAt(0).toUpperCase() + f.slice(1);
      hd.hidden = activeTab !== 'inicio';
    }
  }

  /* ---- Tema claro / oscuro ----
     El botón sol/luna sustituye al antiguo lápiz. Un toque pasa a oscuro (luna
     y tonos negro+verde); otro toque vuelve a claro (sol y azul). La elección
     se guarda, así que la app abre siempre en el tema que dejaste. */
  const THEME_KEY = 'finanzas:theme';
  function temaActual(){ return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function pintaThemeBtn(){
    const dark = temaActual() === 'dark';
    const btn = document.getElementById('themeBtn');
    if(!btn) return;
    /* Se enseña el icono del tema al que vas a cambiar: en claro, la luna. */
    btn.innerHTML = '<span class="th-ico">' + ic(dark ? 'sun' : 'moon', 18) + '</span>';
    btn.setAttribute('aria-label', dark ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
  }
  function aplicaTema(t, persistir){
    document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
    const meta = document.querySelector('meta[name="theme-color"]:not([media])') || document.getElementById('metaTheme');
    if(meta) meta.setAttribute('content', t === 'dark' ? '#0B0B0C' : '#F5F7FC');
    pintaThemeBtn();
    if(persistir){ try{ localStorage.setItem(THEME_KEY, t); }catch(e){} }
    /* Las gráficas llevan colores dentro del dibujo: se repinta para que cambien. */
    if(persistir && typeof state !== 'undefined' && state && state.onboarded) render();
  }
  (function initTema(){
    let t = 'light';
    try{ t = localStorage.getItem(THEME_KEY) || 'light'; }catch(e){}
    aplicaTema(t, false);
  })();
  document.getElementById('themeBtn').onclick = ()=>{
    const btn = document.getElementById('themeBtn');
    const siguiente = temaActual() === 'dark' ? 'light' : 'dark';
    btn.classList.remove('spin'); void btn.offsetWidth; btn.classList.add('spin');
    if(navigator.vibrate) navigator.vibrate(8);
    aplicaTema(siguiente, true);
  };

  document.getElementById('settingsBtn').onclick = openSettings;
  fab.onclick = ()=>startWizard(null);

  (async ()=>{
    state = await loadState();
    /* El tramo de tiempo con el que te fuiste es con el que vuelves. */
    if(periodoValido(state.periodo)) cartPeriodo = state.periodo;
    await aplicaContrato();
    for(const n of (state.nominas || [])) await aplicaContrato('nomina:' + n.id);
    const charged = await processDueSubscriptions();
    render();
    if(charged){
      setTimeout(()=>showToast(charged===1
        ? 'Se ha registrado 1 pago de suscripción que vencía.'
        : `Se han registrado ${charged} pagos de suscripciones que vencían.`), 700);
    }
    /* Las notas del calendario que ya han llegado a su hora se sacan a pantalla
       en cuanto se abre la app, y a partir de ahí se vigilan cada medio minuto. */
    arrancaVigilanteNotas();
    setTimeout(compruebaNotasVencidas, charged ? 3600 : 900);
  })();
})();
</script>
</body>
</html>
