<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control Financiero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&family=League+Gothic&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<meta id="metaTheme" name="theme-color" content="#F5F7FC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Control Financiero">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  color-scheme: light;
  /* ---- MODO CLARO · azul luminoso (el acento único de interacción) ---- */
  --accent:#1C8EFF; --accent-strong:#0A84FF; --accent-deep:#0059B3;
  --accent-soft:rgba(28,142,255,.12); --accent-soft-strong:rgba(28,142,255,.20); --accent-line:rgba(28,142,255,.32);
  --on-accent:#FFFFFF;
  --sky:#5EB0FF; --ice:#E9F2FF;
  --success:#2DB24E; --success-text:#1E7A35; --success-soft:rgba(48,200,90,.14);
  --danger:#FF4034; --danger-soft:rgba(255,64,52,.11); --danger-line:rgba(255,64,52,.28); --danger-text:#B4271C;
  --warn:#FF9F0A; --info:#36B8F0;

  /* ---- neutros claros (un pelín más luminosos) ---- */
  --bg:#F5F7FC; --bg-2:#ECEFF6;
  --glass:rgba(255,255,255,.66); --glass-strong:rgba(255,255,255,.84); --glass-soft:rgba(255,255,255,.44);
  --surface-2:rgba(255,255,255,.62);
  --line:rgba(56,64,82,.12); --line-soft:rgba(56,64,82,.07); --line-strong:rgba(56,64,82,.19);
  --ink:#16202E; --ink-soft:rgba(40,52,70,.62); --ink-faint:rgba(40,52,70,.36);

  /* ---- chrome (nav, sheets, halo del fab) ---- */
  --chrome:rgba(255,255,255,.74); --chrome-strong:rgba(255,255,255,.90);

  /* ---- forma: esquinas generosas y continuas ---- */
  --r-lg:22px; --r-md:16px; --r-sm:12px; --r-full:999px;

  /* ---- elevación: suave, sin glow ---- */
  --shadow-xs:0 1px 2px rgba(22,32,46,.07);
  --shadow-sm:0 1px 0 rgba(255,255,255,.55) inset, 0 10px 26px -14px rgba(22,32,46,.18);
  --shadow-md:0 1px 0 rgba(255,255,255,.6) inset, 0 24px 48px -20px rgba(22,32,46,.24);
  --shadow-lg:0 1px 0 rgba(255,255,255,.6) inset, 0 36px 70px -24px rgba(22,32,46,.3);
  --shadow-accent:0 10px 22px -8px rgba(28,142,255,.42);
  --shadow-danger:0 10px 20px -8px rgba(255,64,52,.4);

  /* ---- motion ---- */
  --ease-out:cubic-bezier(.23,1,.32,1);
  --ease-in-out:cubic-bezier(.65,0,.35,1);
  --ease-drawer:cubic-bezier(.32,.72,0,1);
  --ease-spring:cubic-bezier(.2,1.4,.4,1);
  --dur-fast:130ms; --dur-base:220ms; --dur-slow:420ms;

  /* ---- tipografía: Inter para interfaz, Sora para cifras y titulares ---- */
  --font: 'Manrope', -apple-system, BlinkMacSystemFont, system-ui, 'Segoe UI', sans-serif;
  --font-display: 'Inter Tight', 'Inter', -apple-system, system-ui, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  /* Las cifras usan Sora: geométrica, limpia y con dígitos de ancho fijo. */
  --num: 'Inter Tight', 'Inter', -apple-system, system-ui, sans-serif;
  /* Escala tipográfica base, para que cada texto tenga su tamaño coherente. */
  --fs-hero:30px; --fs-h1:19px; --fs-title:15.5px; --fs-body:14px;
  --fs-sub:12.5px; --fs-cap:11px; --fs-micro:9.5px;
  /* Tonos de los importes: el color se nota, pero no chilla. */
  --num-in:#0B7A46; --num-out:#C0362A; --num-inv:#1668C7;
  --num-in-bg:rgba(48,200,90,.10);  --num-in-line:rgba(48,200,90,.20);
  --num-out-bg:rgba(255,64,52,.09); --num-out-line:rgba(255,64,52,.18);
  --num-inv-bg:rgba(28,142,255,.09);--num-inv-line:rgba(28,142,255,.18);
}

/* ================= MODO OSCURO · negro suave + verde ================= */
:root[data-theme="dark"]{
  color-scheme: dark;
  --accent:#3EE07D; --accent-strong:#22C86A; --accent-deep:#16BC4E;
  --accent-soft:rgba(62,224,125,.15); --accent-soft-strong:rgba(62,224,125,.24); --accent-line:rgba(62,224,125,.34);
  --on-accent:#05210F;
  --sky:#8BE6A6; --ice:#17241C;
  --success:#3EE07D; --success-text:#63E793; --success-soft:rgba(62,224,125,.16);
  --danger:#FF5A4E; --danger-soft:rgba(255,90,78,.16); --danger-line:rgba(255,90,78,.34); --danger-text:#FF9A90;
  --warn:#FFB23E; --info:#49C6F0;

  --bg:#14161A; --bg-2:#1B1E24;
  --glass:rgba(30,34,40,.66); --glass-strong:rgba(32,37,43,.82); --glass-soft:rgba(30,34,40,.46);
  --surface-2:rgba(255,255,255,.055);
  --line:rgba(255,255,255,.10); --line-soft:rgba(255,255,255,.055); --line-strong:rgba(255,255,255,.17);
  --ink:#EAEFEC; --ink-soft:rgba(226,235,229,.62); --ink-faint:rgba(226,235,229,.36);

  --chrome:rgba(24,27,32,.80); --chrome-strong:rgba(27,31,37,.92);

  --shadow-xs:0 1px 2px rgba(0,0,0,.4);
  --shadow-sm:0 1px 0 rgba(255,255,255,.04) inset, 0 10px 26px -14px rgba(0,0,0,.6);
  --shadow-md:0 1px 0 rgba(255,255,255,.05) inset, 0 24px 48px -20px rgba(0,0,0,.66);
  --shadow-lg:0 1px 0 rgba(255,255,255,.05) inset, 0 36px 70px -24px rgba(0,0,0,.72);
  --shadow-accent:0 10px 24px -8px rgba(62,224,125,.4);
  --shadow-danger:0 10px 20px -8px rgba(255,90,78,.42);

  --num-in:#5BE88F; --num-out:#FF7A70; --num-inv:#5AC8F0;
  --num-in-bg:rgba(62,224,125,.14);  --num-in-line:rgba(62,224,125,.26);
  --num-out-bg:rgba(255,90,78,.14);  --num-out-line:rgba(255,90,78,.26);
  --num-inv-bg:rgba(90,200,240,.12); --num-inv-line:rgba(90,200,240,.24);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(620px 420px at 14% -6%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 60%),
    radial-gradient(540px 400px at 104% 4%, color-mix(in srgb, var(--accent-deep) 9%, transparent), transparent 58%),
    radial-gradient(640px 480px at 50% 120%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink); font-family:var(--font); min-height:100vh;
  -webkit-font-smoothing:antialiased; padding-bottom:186px;
  letter-spacing:-.01em; overflow-x:hidden;
  transition:background-color var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out);
}
.display{font-family:var(--font); letter-spacing:-.02em;}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums; font-feature-settings:"tnum";}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

/* ---- line-icon system: black by default, flips to white on solid accent surfaces ---- */
.ico{vertical-align:-4px; flex-shrink:0; display:inline-block;}

header.app, main, .fab, .bottom-nav, .overlay, .modal-overlay, .toast{position:relative; z-index:1;}

header.app{padding:22px 18px 8px; display:flex; align-items:flex-start; justify-content:space-between;}
header.app h1{font-family:var(--font);font-weight:700;font-size:23px;margin:0;line-height:1.15;letter-spacing:-.03em;color:var(--ink);}
header.app .period{margin-top:9px;font-size:12.5px;font-weight:600;color:var(--ink-soft);background:var(--surface-2);
  display:inline-block;padding:5px 13px;border-radius:var(--r-full);text-transform:capitalize;border:1px solid var(--line);}
.head-actions{display:flex;align-items:center;gap:8px;flex:none;}
.icon-btn.small{width:38px;height:38px;padding:7px;}
.icon-btn.on{background:var(--accent);border-color:transparent;color:var(--on-accent);}

/* --- modo edición: bloques que se arrastran, se renombran y se quitan --- */
.blk{position:relative;}
body.editing .blk{
  outline:1.5px dashed color-mix(in srgb, var(--accent) 55%, transparent);
  outline-offset:4px;border-radius:var(--r-lg);
  transition:transform var(--dur-base) var(--ease-out), opacity var(--dur-base) var(--ease-out);
}
body.editing .blk.dragging{opacity:.9;z-index:60;outline-style:solid;box-shadow:var(--shadow-lg);transform:scale(1.02);transition:none;}
body.editing .blk::after{content:"";position:absolute;inset:0;border-radius:var(--r-lg);pointer-events:none;}
.blk-bar{
  display:none;align-items:center;gap:8px;margin:0 2px 6px;padding:5px 8px;border-radius:12px;
  background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow-xs);
  font-size:11px;font-weight:700;color:var(--ink-soft);
}
body.editing .blk-bar{display:flex;}
.blk-bar .bb-grip{display:flex;align-items:center;gap:5px;flex:1;min-width:0;cursor:grab;touch-action:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.blk-bar .bb-grip:active{cursor:grabbing;}
.blk-bar button{font-family:var(--font);font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--surface-2);
  color:var(--ink-soft);border-radius:9px;padding:4px 9px;cursor:pointer;flex:none;}
.blk-bar button.del{color:var(--danger);}
.blk-drop{height:0;border-radius:14px;background:color-mix(in srgb,var(--accent) 22%,transparent);transition:height var(--dur-fast) var(--ease-out);}
.blk-drop.on{height:56px;margin:6px 0;}
.edit-banner{
  position:sticky;top:6px;z-index:40;display:none;align-items:center;gap:10px;flex-wrap:wrap;
  margin:0 0 14px;padding:11px 13px;border-radius:16px;
  background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 14%,var(--glass-strong)),var(--glass-strong));
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);box-shadow:var(--shadow-sm);
  font-size:11.5px;font-weight:600;color:var(--ink-soft);line-height:1.35;
}
body.editing .edit-banner{display:flex;}
.edit-banner b{color:var(--ink);}
.edit-banner .eb-btns{display:flex;gap:6px;margin-left:auto;}
.edit-banner button{font-family:var(--font);font-size:11px;font-weight:700;border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink);border-radius:9px;padding:5px 10px;cursor:pointer;}
.hidden-blocks{display:none;flex-wrap:wrap;gap:6px;margin:14px 0 0;}
body.editing .hidden-blocks{display:flex;}
.hidden-blocks .hb-k{width:100%;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-faint);}
.hidden-blocks button{font-family:var(--font);font-size:11px;font-weight:700;border:1px dashed var(--line-strong);
  background:transparent;color:var(--ink-soft);border-radius:10px;padding:6px 10px;cursor:pointer;}
body.editing [data-lbl],body.editing [data-free]{
  cursor:text;border-radius:5px;
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--accent) 40%,transparent);
}
body.editing [data-lbl]:active,body.editing [data-free]:active{box-shadow:0 0 0 2px var(--accent);background:var(--surface-2);}
body.editing [data-cat]{cursor:text;box-shadow:0 0 0 1.5px color-mix(in srgb,#FF9500 45%,transparent);border-radius:5px;}
body.editing .blk *{user-select:text;}
.icon-btn{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);
  box-shadow:var(--shadow-xs);color:var(--ink);
  width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:8px;
  transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-base) var(--ease-out);}
.icon-btn:active{transform:scale(.93);}
button.icon-btn{font-family:inherit;outline:none;}
/* El sol/luna gira y se funde al cambiar de tema. */
.theme-toggle .th-ico{display:flex;align-items:center;justify-content:center;}
.theme-toggle.spin .th-ico{animation:themeSpin var(--dur-slow) var(--ease-spring);}
@keyframes themeSpin{
  0%{transform:rotate(-120deg) scale(.5);opacity:0;}
  60%{opacity:1;}
  100%{transform:rotate(0) scale(1);opacity:1;}
}
@media (prefers-reduced-motion:reduce){ .theme-toggle.spin .th-ico{animation:none;} }

/* ---- Pantalla de inicio: estilo póster, blanco → azul, "L.P" gigante ---- */
#splash{position:fixed;inset:0;z-index:9999;overflow:hidden;
  background:linear-gradient(178deg,#FFFFFF 0%,#F4F7FF 16%,#D2E0FF 34%,#8FB0FF 52%,#4D7DFF 66%,#2457FA 80%,#1640E6 92%,#1236D0 100%);
  transition:opacity .6s cubic-bezier(.16,1,.3,1), transform .6s cubic-bezier(.16,1,.3,1);}
#splash.hide{opacity:0;transform:scale(1.03);pointer-events:none;}
.sp-top{position:absolute;left:24px;right:24px;top:calc(18px + env(safe-area-inset-top));display:flex;justify-content:space-between;
  padding-bottom:10px;border-bottom:1px solid rgba(11,18,48,.14);
  font-family:'Manrope',sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:rgba(11,18,48,.72);
  animation:spTxt .8s cubic-bezier(.16,1,.3,1) .1s both;}
.sp-claim{position:absolute;left:24px;top:37%;font-family:'Manrope',sans-serif;font-weight:300;font-size:34px;line-height:1.05;
  letter-spacing:-.04em;color:#0A1640;animation:spTxt .9s cubic-bezier(.16,1,.3,1) .35s both;}
.sp-claim b{font-weight:800;}
.sp-meta{position:absolute;font-family:'Manrope',sans-serif;font-weight:700;font-size:10.5px;line-height:1.5;letter-spacing:.16em;
  text-transform:uppercase;color:rgba(10,22,64,.75);animation:spTxt .8s cubic-bezier(.16,1,.3,1) both;}
.sp-m1{left:24px;top:calc(37% + 92px);animation-delay:.5s;}
.sp-m2{right:24px;top:calc(37% + 92px);text-align:right;animation-delay:.6s;}
@keyframes spTxt{from{opacity:0;transform:translateY(10px);clip-path:inset(0 0 100% 0);}to{opacity:1;transform:none;clip-path:inset(0);}}
.sp-stage{position:absolute;top:calc(9% + env(safe-area-inset-top));right:4%;width:170px;height:170px;perspective:900px;}
.sp-3d{position:absolute;inset:0;transform-style:preserve-3d;animation:spTumba 2.1s cubic-bezier(.16,1,.3,1) .1s both;}
@keyframes spTumba{
  0%{transform:rotateX(0deg) rotateZ(0deg) scale(.6);opacity:0;}
  35%{opacity:1;}
  100%{transform:rotateX(60deg) rotateZ(-24deg) scale(1.1);opacity:1;}
}
.sp-layer{position:absolute;inset:0;transform:translateZ(calc(var(--z) * -3px));}
.sp-layer:first-child{filter:drop-shadow(0 6px 14px rgba(29,91,255,.35));}
.sp-logo{width:100%;height:100%;}
/* El "L.P" enorme, estirado en vertical como el "DESIGN" de la referencia */
.sp-lp{position:absolute;left:5vw;right:0;bottom:calc(-1.5vh + env(safe-area-inset-bottom));
  font-family:'League Gothic','Inter Tight',sans-serif;font-weight:400;
  font-size:min(92vw, 52vh);line-height:.76;letter-spacing:.005em;white-space:nowrap;
  transform-origin:bottom left;transform:scaleY(1.18);
  background:linear-gradient(180deg,#1E4BE8 0%,#1438C6 45%,#0B2392 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:spLP 1.1s cubic-bezier(.16,1,.3,1) .35s both;}
@keyframes spLP{from{opacity:0;transform:translateY(40px) scaleY(1);}to{opacity:1;transform:scaleY(1.18);}}
@media (prefers-reduced-motion:reduce){ .sp-3d,.sp-top,.sp-claim,.sp-meta,.sp-lp{animation:none !important;} .sp-3d{transform:rotateX(60deg) rotateZ(-24deg);} }

/* ---- shared tap / press feedback ---- */
.glass-tap{position:relative;overflow:hidden;transition:transform var(--dur-fast) var(--ease-out);}
.glass-tap::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 32% 22%, rgba(255,255,255,.55), transparent 60%);opacity:0;transition:opacity var(--dur-base) var(--ease-out);pointer-events:none;}
.glass-tap:active{transform:scale(.965);}
.glass-tap:active::after{opacity:1;}
.ripple-drop{position:absolute;border-radius:50%;background:radial-gradient(circle, rgba(10,132,255,.30) 0%, rgba(10,132,255,.10) 45%, transparent 72%);
  transform:scale(0);animation:rippleAnim .5s var(--ease-out) forwards;pointer-events:none;}
@keyframes rippleAnim{ to{ transform:scale(1); opacity:0; } }

.tilt3d{transition:transform var(--dur-base) var(--ease-out);}
.tilt3d:active{transform:scale(.99);}

main{padding:0 18px;max-width:480px;margin:0 auto;}

/* ---- entrance choreography (content is re-rendered per tab; replays each time) ---- */
@keyframes cardEnter{
  from{ opacity:0; transform:translateY(12px) scale(.975); filter:blur(3px); }
  to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}
@keyframes rowEnter{
  from{ opacity:0; transform:translateY(7px); }
  to{ opacity:1; transform:translateY(0); }
}
.ledger-card,.calendar-card,.analysis-card,.onboard-card,.list-card,.stat-row,.wallet-tabs,.period-chips,.section-title,.search-bar{
  animation:cardEnter var(--dur-slow) var(--ease-out) both;
}
.list-row,.legend-item,.cat-bar-row,.stat-card{ animation:rowEnter var(--dur-base) var(--ease-out) both; }
.list-row:nth-child(1),.legend-item:nth-child(1),.stat-card:nth-child(1){animation-delay:0ms;}
.list-row:nth-child(2),.legend-item:nth-child(2),.stat-card:nth-child(2){animation-delay:35ms;}
.list-row:nth-child(3),.legend-item:nth-child(3){animation-delay:70ms;}
.list-row:nth-child(4),.legend-item:nth-child(4){animation-delay:105ms;}
.list-row:nth-child(5),.legend-item:nth-child(5){animation-delay:140ms;}
.list-row:nth-child(6),.legend-item:nth-child(6){animation-delay:175ms;}
.list-row:nth-child(7),.legend-item:nth-child(7){animation-delay:210ms;}
.list-row:nth-child(8),.legend-item:nth-child(8){animation-delay:240ms;}
.list-row:nth-child(n+9),.legend-item:nth-child(n+9){animation-delay:260ms;}
.cat-bar-row:nth-child(1){animation-delay:0ms;} .cat-bar-row:nth-child(2){animation-delay:30ms;}
.cat-bar-row:nth-child(3){animation-delay:60ms;} .cat-bar-row:nth-child(n+4){animation-delay:90ms;}
@media (prefers-reduced-motion: reduce){
  .ledger-card,.calendar-card,.analysis-card,.onboard-card,.list-card,.stat-row,.wallet-tabs,.period-chips,.section-title,.search-bar,
  .list-row,.legend-item,.cat-bar-row,.stat-card{ animation-duration:1ms; animation-delay:0ms !important; }
  .glass-tap:active, .icon-btn:active, .tilt3d:active, .primary-btn:active, .ghost-btn:active{ transform:none; }
}

/* ---- view-transition (tab switches): quick, directional cross-fade ---- */
::view-transition-old(root), ::view-transition-new(root){ animation-duration:var(--dur-base); animation-timing-function:var(--ease-in-out); }
@media (prefers-reduced-motion: reduce){ ::view-transition-old(root), ::view-transition-new(root){ animation:none; } }

.alert-banner{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger-text);border-radius:var(--r-md);padding:12px 15px;margin-top:10px;font-size:12.5px;display:flex;align-items:center;gap:8px;
  animation:rowEnter var(--dur-base) var(--ease-out) both;}
.alert-banner .x{margin-left:auto;cursor:pointer;opacity:.7;transition:opacity var(--dur-fast) var(--ease-out);color:var(--danger-text);}
.alert-banner .x:active{opacity:.4;}

/* ---- toast (replaces alert()) ---- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);z-index:80;
  background:var(--chrome-strong);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid var(--line-strong);color:var(--ink);font-size:13px;font-weight:500;
  padding:12px 18px;border-radius:var(--r-full);box-shadow:var(--shadow-md);
  max-width:88vw;text-align:center;
  transition:transform var(--dur-slow) var(--ease-spring);}
.toast.show{transform:translate(-50%,0);}
.toast.error{border-color:var(--danger-line);color:var(--danger);}
.undo-toast{display:flex;align-items:center;gap:14px;text-align:left;padding-right:8px;}
.undo-toast .undo-msg{flex:1;white-space:nowrap;}
.undo-btn{background:none;border:none;color:var(--accent);font-weight:700;font-size:13px;font-family:var(--font);cursor:pointer;display:flex;align-items:center;gap:4px;padding:6px 10px;margin:-6px -10px -6px 0;border-radius:var(--r-full);transition:background var(--dur-fast) var(--ease-out);}
.undo-btn:active{background:var(--accent-soft);}

.ledger-card,.calendar-card,.analysis-card,.onboard-card,.list-card{
  background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.55); border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);
}

.onboard-card{padding:26px 22px;margin-top:10px;}
.onboard-card h2{font-family:var(--font);font-weight:700;margin:0 0 6px;font-size:21px;letter-spacing:-.02em;color:var(--ink);}
.onboard-card p{margin:0 0 16px;color:var(--ink-soft);font-size:14px;line-height:1.5;}
.onboard-card input{width:100%;font-family:var(--font);font-variant-numeric:tabular-nums;font-size:21px;font-weight:700;padding:13px 15px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);transition:border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);}
.onboard-card input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
.onboard-card input::placeholder, .sheet input::placeholder, .sheet textarea::placeholder{color:var(--ink-faint); opacity:1;}
.primary-btn{margin-top:14px;width:100%;background:var(--accent);color:var(--on-accent);border:none;padding:14px;border-radius:var(--r-full);font-family:var(--font);font-weight:700;font-size:15.5px;cursor:pointer;box-shadow:var(--shadow-accent);transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);display:flex;align-items:center;justify-content:center;gap:6px;}
.primary-btn:active{transform:scale(.975);}
.primary-btn.small{margin-top:0;width:auto;padding:9px 18px;font-size:13.5px;}
.danger-btn{flex:1;background:var(--danger);color:#fff;border:none;padding:13px;border-radius:var(--r-full);font-family:var(--font);font-weight:700;font-size:14px;cursor:pointer;box-shadow:var(--shadow-danger);transition:transform var(--dur-fast) var(--ease-out);}
.danger-btn:active{transform:scale(.975);}

.ledger-card{padding:22px;margin-top:14px;position:relative;}
.card-title{font-family:var(--font);font-size:15px;font-weight:700;margin:0 0 14px;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:7px;}
.donut-wrap{display:flex;align-items:center;gap:18px;position:relative;perspective:600px;}
.donut-wrap svg{transform:rotateX(16deg); transform-origin:50% 55%;}
.donut-figures{flex:1;min-width:0;}
.donut-figures .saldo-label{font-size:12px;color:var(--ink-soft);font-weight:500;}
.donut-figures .saldo-num{font-family:var(--num);font-weight:650;font-size:clamp(22px,6.6vw,29px);margin:3px 0 13px;letter-spacing:-.03em;color:var(--ink);font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;white-space:nowrap;}
.donut-figures .saldo-num.negative{color:var(--danger);}
.mini-stat{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;font-size:12.5px;padding:6px 0;color:var(--ink-soft);border-top:1px solid var(--line-soft);}
.mini-stat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.legend{display:flex;flex-direction:column;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);}
.legend-label{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin:8px 0 2px;font-weight:600;line-height:1.35;}
.legend-item{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink-soft);min-width:0;}
.legend-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 3px var(--line-soft);}
.legend-item .lname{flex:1;min-width:0;color:var(--ink);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.legend-item .lpct{color:var(--ink-soft);font-size:11px;width:36px;flex:none;text-align:right;}
.legend-item .lamt{font-weight:600;color:var(--ink);min-width:76px;flex:none;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
/* cuántos son y de qué tramo hablan, en la leyenda de los tres estados */
.legend-item .lcount{font-style:normal;font-size:10.5px;font-weight:800;color:var(--ink-faint);
  background:var(--line-soft);border-radius:var(--r-full);padding:1px 7px;margin-left:5px;}
.legend-item .lnota{flex-basis:100%;font-size:10.5px;color:var(--ink-faint);margin:-4px 0 2px 18px;}
.legend-item{flex-wrap:wrap;}

/* ---- month-over-month delta badge (Inicio) ---- */
.delta-badge{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 8px 2px 6px;border-radius:var(--r-full);flex-basis:100%;justify-content:flex-end;margin-top:3px;}
.delta-badge.delta-up{background:var(--danger-soft);color:var(--danger);}
.delta-badge.delta-down{background:var(--success-soft);color:var(--success);}
.delta-badge.delta-flat{background:var(--line-soft);color:var(--ink-soft);}

.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.stat-card{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.5);border-radius:var(--r-md);padding:13px 15px;box-shadow:var(--shadow-xs);}
.stat-card .k{font-size:11px;color:var(--ink-soft);font-weight:500;}
.stat-card .v{font-weight:700;font-size:17px;margin-top:3px;letter-spacing:-.01em;font-family:var(--font);color:var(--ink);}

.period-chips{display:flex;gap:7px;margin-top:16px;overflow-x:auto;padding-bottom:2px;}
.p-chip{flex:none;padding:8px 15px;border-radius:var(--r-full);background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);font-size:12.5px;cursor:pointer;font-weight:500;transition:background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);position:relative;overflow:hidden;}
.p-chip.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:var(--shadow-accent);}
.analysis-card{padding:18px;margin-top:8px;}
.analysis-total{font-family:var(--font);font-size:25px;font-weight:800;margin:2px 0 13px;letter-spacing:-.02em;color:var(--ink);}
.cat-bar-row{margin-bottom:12px;}
.cat-bar-row .cbr-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px;color:var(--ink-soft);}
.cat-bar-row .cbr-top span{display:flex;align-items:center;gap:6px;}
.cat-bar-row .cbr-top b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;}
.cat-bar-track{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden;box-shadow:inset 0 2px 3px rgba(30,30,45,.16);}
.cat-bar-fill{height:100%;border-radius:4px;transition:width var(--dur-slow) var(--ease-out);box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 3px rgba(0,0,0,.30);}

.calendar-card{padding:22px;margin-top:14px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.cal-head .cal-title{font-family:var(--font);font-weight:700;font-size:15px;text-transform:capitalize;letter-spacing:-.01em;color:var(--ink);}
.cal-nav{display:flex;gap:8px;}
.cal-nav div{width:28px;height:28px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:transform var(--dur-fast) var(--ease-out);}
.cal-nav div:active{transform:scale(.9);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.cal-dow{font-size:9.5px;text-align:center;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;padding-bottom:5px;font-weight:600;}
.cal-day{aspect-ratio:1;border-radius:11px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--ink-soft);position:relative;border:1px solid transparent;}
.cal-day.empty{background:transparent;}
.cal-day.today{background:var(--accent);color:var(--on-accent);font-weight:700;box-shadow:var(--shadow-accent);}
.cal-day.marked-red{background:var(--danger-soft);border-color:var(--danger-line);}
.cal-day.marked-blue{background:rgba(50,173,230,.12);border-color:rgba(50,173,230,.34);}
.cal-day .demo{margin-top:1px;line-height:1;color:var(--ink);}
.cal-day.today .demo{color:#fff;}
.cal-badge{font-size:8.5px;font-weight:800;margin-top:1px;line-height:1;}
.cal-badge.red{color:var(--danger);}
.cal-badge.blue{color:var(--info);}

.section-title{margin:28px 0 10px 2px;font-family:var(--font);font-size:16px;font-weight:700;color:var(--ink);display:flex;justify-content:flex-start;align-items:center;gap:8px;letter-spacing:-.01em;}
/* el contador va siempre pegado a la derecha; el título, a la izquierda */
.section-title span.count{font-family:var(--font);font-size:11.5px;color:var(--ink-faint);font-weight:500;margin-left:auto;text-align:right;}

/* ---- search bar (Movimientos filter) ---- */
.search-bar{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-full);padding:9px 14px;margin:2px 0 14px;}
.search-ico{color:var(--ink-faint);display:flex;flex:none;}
.search-input{flex:1;min-width:0;border:none;background:transparent;outline:none;font-family:var(--font);font-size:14px;color:var(--ink);}
.search-input::placeholder{color:var(--ink-faint);}
.search-clear{color:var(--ink-faint);cursor:pointer;display:flex;flex:none;padding:3px;border-radius:50%;transition:background var(--dur-fast) var(--ease-out);}
.search-clear:active{background:var(--line-soft);}

.list-card{overflow:hidden;}
.list-row{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line-soft);position:relative;overflow:hidden;}
.list-row:last-child{border-bottom:none;}
.tx-empty{background:var(--glass);backdrop-filter:blur(20px) saturate(180%);border:1px dashed var(--line-strong);border-radius:var(--r-lg);padding:26px;text-align:center;color:var(--ink-soft);font-size:13px;}

.row-delete-overlay{position:absolute;inset:0;background:rgba(255,59,48,.20);backdrop-filter:blur(8px);box-shadow:inset 0 0 0 2px rgba(255,59,48,.55);border-radius:inherit;display:flex;align-items:center;justify-content:flex-end;padding-right:14px;z-index:2;animation:fadeInRow var(--dur-base) var(--ease-out);}
@keyframes fadeInRow{ from{opacity:0;} to{opacity:1;} }
.del-confirm-btn{background:var(--danger);color:#fff;padding:8px 15px;border-radius:var(--r-full);font-size:12px;font-weight:700;box-shadow:var(--shadow-danger);white-space:nowrap;display:inline-flex;align-items:center;gap:5px;}
.list-row.deleting,.platform-card.deleting{animation:rowDelete .38s var(--ease-in-out) forwards;}
@keyframes rowDelete{
  0%{background:rgba(255,59,48,.04);}
  40%{background:rgba(255,59,48,.12); transform:scale(1.006);}
  100%{background:rgba(255,59,48,.20); transform:scale(.94); opacity:0;}
}

.tx-dot{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ink);border:1px solid var(--line);}
.tx-mid{flex:1;min-width:0;}
.tx-cat{color:var(--ink);font-weight:600;font-size:14px;}
.tx-desc{color:var(--ink);font-size:12.5px;margin-top:1px;font-weight:500;opacity:.85;}
.tx-note{color:var(--ink-soft);font-size:11.5px;margin-top:2px;line-height:1.35;}
.tx-sub{color:var(--ink-soft);font-size:11.5px;margin-top:4px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;}
.tx-tag{background:var(--line-soft);border-radius:6px;padding:2px 8px 2px 6px;font-size:10px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:4px;}
.tx-amt{font-weight:700;font-size:14.5px;text-align:right;flex:none;font-variant-numeric:tabular-nums;font-family:var(--font);}
.tx-amt.pos{color:var(--success);}
.tx-amt.neg{color:var(--ink);}
.tx-comp{font-size:10px;color:var(--accent);margin-top:3px;text-align:right;}
.tx-check{color:var(--on-accent);background:var(--accent);border-radius:50%;width:15px;height:15px;display:inline-flex;align-items:center;justify-content:center;margin-left:4px;}

.limit-row{display:block;padding:15px 16px;}
.limit-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px;}
.limit-cat{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;color:var(--ink);}
.limit-input{width:104px;font-variant-numeric:tabular-nums;font-family:var(--font);font-size:12.5px;padding:7px 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);text-align:right;transition:border-color var(--dur-base) var(--ease-out);}
.limit-input::placeholder{color:var(--ink-faint);}
.limit-input:focus{border-color:var(--accent);}
.limit-bar-track{height:9px;border-radius:5px;background:var(--line-soft);overflow:hidden;box-shadow:inset 0 2px 3px rgba(30,30,45,.16);}
.limit-bar-fill{height:100%;border-radius:5px;transition:width var(--dur-slow) var(--ease-out);box-shadow:inset 0 1px 0 rgba(255,255,255,.7), inset 0 -3px 3px rgba(0,0,0,.30);}
.limit-foot{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--ink-soft);margin-top:6px;}
.limit-foot.over{color:var(--danger);font-weight:600;}
/* La fila de en medio: si el límite es al mes o al año, y de qué tramo habla
   ahora mismo, que depende del mes que tengas abierto en el calendario. */
.limit-mid{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;flex-wrap:wrap;}
.lim-seg{flex:none;}
.lim-seg .seg-b{font-size:11px;padding:5px 11px;}
.lim-tramo{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--ink-faint);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.lim-intro{color:var(--ink-soft);font-size:12.5px;line-height:1.5;margin:0 0 14px;}
.lim-vacio{display:flex;align-items:center;gap:8px;padding:16px;font-size:12.5px;line-height:1.45;color:var(--ink-soft);}
.lim-vacio .ico{flex:none;color:var(--ink-faint);}
.lim-mes{margin:0 0 10px;}
.lim-hoy{margin-left:6px;font-size:11px;font-weight:700;text-transform:none;color:var(--accent);cursor:pointer;}
.add-tile{margin-top:10px;padding:18px;text-align:center;cursor:pointer;border-style:dashed !important;}
.add-tile .plus{color:var(--accent);display:flex;align-items:center;justify-content:center;}
.add-tile .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:4px;font-weight:500;}

.wallet-tabs{display:flex;gap:6px;margin-top:16px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-full);padding:4px;}
.wallet-tab{flex:1;text-align:center;padding:9px 4px;border-radius:var(--r-full);font-size:11.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;transition:background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out);position:relative;overflow:hidden;}
.wallet-tab.active{background:var(--accent);color:var(--on-accent);}

/* ---- CARTERA: tarjetas metalizadas, una por plataforma, cada una con su acabado ---- */
.wallet-lead{margin:16px 0 12px;padding:0 2px;}
.wallet-lead .wl-k{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-faint);}
.wallet-lead .wl-v{font-family:var(--num);font-size:31px;font-weight:650;letter-spacing:-.03em;color:var(--ink);margin-top:2px;font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
.wallet-lead .wl-s{font-size:11.5px;color:var(--ink-soft);margin-top:3px;}

/* ---- las tarjetas, apiladas como en una cartera de verdad ----
   Cada una tapa la de arriba y deja asomar su canto (chip, nombre y saldo).
   Con el ratón encima el montón se abre y se ven enteras. */
.platform-cards{display:flex;flex-direction:column;gap:16px;perspective:1400px;}
.platform-cards.apilada{gap:0;padding-bottom:4px;}
.platform-cards.apilada > .metal-card + .metal-card{
  margin-top:-31%;
  transition:margin-top 560ms var(--ease-drawer),
             transform var(--dur-base) var(--ease-out),
             box-shadow var(--dur-base) var(--ease-out);
}
.platform-cards.apilada > .metal-card{z-index:1;}
.platform-cards.apilada > .metal-card:nth-child(2){z-index:2;}
.platform-cards.apilada > .metal-card:nth-child(3){z-index:3;}
.platform-cards.apilada > .metal-card:nth-child(4){z-index:4;}
.platform-cards.apilada > .metal-card:nth-child(n+5){z-index:5;}
@media (hover:hover) and (pointer:fine){
  .platform-cards.apilada:hover > .metal-card + .metal-card{margin-top:16px;}
}
/* sin ratón (móvil), el montón se abre al tocar el asa de abajo */
.platform-cards.apilada.abierta > .metal-card + .metal-card{margin-top:16px;}
.cards-toggle{
  display:flex;align-items:center;justify-content:center;gap:6px;margin:12px auto 0;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-soft);
  font-family:var(--font);font-size:11.5px;font-weight:700;letter-spacing:.01em;
  padding:8px 15px;border-radius:var(--r-full);cursor:pointer;
  transition:transform var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out);
}
.cards-toggle:active{transform:scale(.96);}
.cards-toggle .ct-chev{display:inline-flex;transition:transform 420ms var(--ease-drawer);}
.cards-toggle.on .ct-chev{transform:rotate(90deg);}
@media (prefers-reduced-motion: reduce){
  .platform-cards.apilada > .metal-card + .metal-card{transition:none;}
  .cards-toggle .ct-chev{transition:none;}
}
.metal-card{
  position:relative; overflow:hidden; border-radius:18px; padding:16px 18px 14px;
  /* proporción de una tarjeta de verdad (85,6 × 53,98 mm) */
  aspect-ratio:1.586/1; min-height:0; width:100%; max-width:380px; margin-inline:auto;
  display:flex; flex-direction:column; cursor:pointer;
  background:var(--mc-bg); color:var(--mc-ink);
  box-shadow:
    0 1px 0 rgba(255,255,255,.42) inset,
    0 -1px 0 rgba(0,0,0,.30) inset,
    0 22px 40px -20px var(--mc-shadow),
    0 4px 10px -4px var(--mc-shadow);
  transform-style:preserve-3d;
  transition:transform var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
  animation:cardDeal .62s var(--ease-out) both;
}
.platform-cards > .metal-card:nth-child(1){animation-delay:0ms;}
.platform-cards > .metal-card:nth-child(2){animation-delay:80ms;}
.platform-cards > .metal-card:nth-child(3){animation-delay:160ms;}
.platform-cards > .metal-card:nth-child(4){animation-delay:230ms;}
.platform-cards > .metal-card:nth-child(n+5){animation-delay:290ms;}
/* El reparto de las tarjetas solo se ve al entrar en Neo bancos. Si la
   pantalla se vuelve a pintar (cambio de periodo, abrir un desplegable), las
   tarjetas se quedan quietas: así el movimiento nunca da tirones. */
.platform-cards.no-deal .metal-card{animation:none;}
.platform-cards.no-deal .mc-sheen{display:none;}
@keyframes cardDeal{
  from{ opacity:0; transform:translateY(26px) rotateX(14deg) scale(.94); }
  to{ opacity:1; transform:translateY(0) rotateX(0) scale(1); }
}
.metal-card:active{transform:scale(.985) rotateX(3deg);}
@media (hover:hover) and (pointer:fine){
  .metal-card:hover{transform:translateY(-3px) rotateX(-3deg); box-shadow:0 1px 0 rgba(255,255,255,.45) inset, 0 -1px 0 rgba(0,0,0,.3) inset, 0 30px 50px -22px var(--mc-shadow);}
}
/* barrido de luz que recorre la tarjeta al aparecer */
.metal-card .mc-sheen{
  position:absolute; inset:-70% -40%; pointer-events:none; z-index:1;
  background:linear-gradient(112deg, transparent 26%, var(--mc-sheen) 45%, rgba(255,255,255,.06) 54%, transparent 70%);
  mix-blend-mode:overlay;
  transform:translateX(-28%);
  animation:sheenSweep 1.5s var(--ease-out) .28s both;
}
@keyframes sheenSweep{
  0%{ transform:translateX(-70%); opacity:0; }
  22%{ opacity:1; }
  100%{ transform:translateX(34%); opacity:1; }
}
/* logo grande "grabado" en el metal, integrado en el propio acabado */
.mc-watermark{
  position:absolute; right:-30px; top:50%; width:168px; height:auto; z-index:0;
  opacity:.13; pointer-events:none; filter:var(--mc-logo);
  transform:translateY(-46%) rotate(-7deg);
}
.mc-head{display:flex;align-items:flex-start;justify-content:space-between;position:relative;z-index:2;}
/* El chip, desnudo y en su sitio: arriba a la izquierda, como en una tarjeta
   de verdad. Sin recuadro ni fondo, solo grabado sobre el metal. */
.mc-chip{
  display:flex;align-items:center;justify-content:center;flex:none;
  color:var(--mc-ink); opacity:.92;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.28));
}
.mc-brand{width:46px;height:auto;flex:none;filter:var(--mc-logo) drop-shadow(0 1px 3px rgba(0,0,0,.22));opacity:.95;}
.mc-name{
  position:relative;z-index:2;margin-top:14px;
  font-size:16.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;
  color:var(--mc-ink); text-shadow:0 1px 3px rgba(0,0,0,.22);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.mc-bal{
  position:relative;z-index:2;margin-top:2px;
  font-family:var(--num);font-size:24px;font-weight:650;letter-spacing:-.028em;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  color:var(--mc-ink); text-shadow:0 2px 5px rgba(0,0,0,.20);
}
.mc-bal.negative{color:#FFB4AC;}
/* El pie solo lleva el logo: el "Ver detalle" sobraba, porque la tarjeta
   entera ya es el botón que abre el detalle. */
.mc-foot{display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;position:relative;z-index:2;margin-top:auto;padding-top:8px;}

/* ---- el detalle del neo banco, dentro de su hoja ---- */
.plat-sheet{margin:2px 0 4px;}
.plat-sheet .ledger-card{margin:0;}
.metal-card .row-delete-overlay{border-radius:18px;}
.metal-card.deleting{animation:rowDelete .38s var(--ease-in-out) forwards;}

/* muestrario de acabados al crear una plataforma */
.metal-swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px;}
.metal-swatch{
  flex:1 1 92px;height:46px;border-radius:12px;cursor:pointer;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 4px 10px -4px rgba(30,30,45,.4);
  border:2px solid transparent;
  transition:transform var(--dur-fast) var(--ease-out), border-color var(--dur-base) var(--ease-out);
}
.metal-swatch span{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;text-shadow:0 1px 2px rgba(0,0,0,.2);}
.metal-swatch.active{border-color:var(--accent);transform:scale(1.04);}
.metal-swatch:active{transform:scale(.95);}

.p-act-btn{width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform var(--dur-fast) var(--ease-out);}
.p-act-btn:active{transform:scale(.9);}

/* ---- FAB: calm solid accent, soft shadow, no idle glow ---- */
.fab{position:fixed;right:20px;bottom:112px;width:58px;height:58px;border-radius:50%;
  background:var(--accent);color:var(--on-accent);border:none;font-weight:600;
  box-shadow:var(--shadow-accent); cursor:pointer;z-index:40;
  display:flex;align-items:center;justify-content:center;
  transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);}
.fab:active{transform:scale(.93);}
@media (hover:hover) and (pointer:fine){
  .fab:hover{transform:translateY(-1px); box-shadow:0 14px 26px -8px rgba(10,132,255,.5);}
}

.bottom-nav{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));
  background:var(--chrome);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.6); border-radius:28px;
  box-shadow:var(--shadow-md);
  display:flex; padding:8px 4px; z-index:39;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 0 5px;cursor:pointer;}
.nav-item .ni-ico{color:var(--ink-soft);width:40px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:background var(--dur-base) var(--ease-in-out), color var(--dur-base) var(--ease-in-out), transform var(--dur-base) var(--ease-spring);position:relative;overflow:hidden;}
.nav-item .ni-label{font-size:10px;font-weight:600;color:var(--ink-faint);transition:color var(--dur-base) var(--ease-in-out);}
.nav-item.active .ni-ico{background:var(--accent);color:var(--on-accent);transform:scale(1.04);}
.nav-item.active .ni-label{color:var(--accent);}
.nav-item .ni-ico:active{transform:scale(.9);}

.overlay{position:fixed;inset:0;background:rgba(20,20,25,.32);display:none;align-items:flex-end;justify-content:center;z-index:50;backdrop-filter:blur(3px);}
.overlay.show{display:flex;}
.sheet{background:var(--chrome-strong);backdrop-filter:blur(34px) saturate(180%);-webkit-backdrop-filter:blur(34px) saturate(180%);color:var(--ink);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;border-top:1px solid rgba(255,255,255,.6);box-shadow:0 -24px 60px rgba(30,30,45,.18);animation:sheetIn var(--dur-slow) var(--ease-drawer);}
@keyframes sheetIn{
  from{ transform:translateY(30px); opacity:0; }
  to{ transform:translateY(0); opacity:1; }
}
.sheet-handle{width:36px;height:5px;background:var(--line-strong);border-radius:3px;margin:0 auto 16px;}
.sheet h3{font-family:var(--font);margin:0 0 4px;font-size:19px;font-weight:700;letter-spacing:-.02em;color:var(--ink);}
.sheet .step-label{font-size:12px;color:var(--ink-soft);margin-bottom:14px;font-weight:500;}
.chip-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
.chip{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px 16px;border-radius:var(--r-full);font-size:13.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:7px;transition:background var(--dur-base) var(--ease-out), color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);position:relative;overflow:hidden;}
.chip:active{transform:scale(.96);}
.chip.active{border-color:var(--accent);background:var(--accent);color:var(--on-accent);font-weight:700;}
.chip.other-type{background:rgba(175,82,222,.12);border-color:rgba(175,82,222,.36);color:#8E3FB8;}
.chip.other-type.active{background:#AF52DE;color:#fff;}
.other-type-wrap{margin-top:6px;padding-top:10px;border-top:1px dashed var(--line);}

/* ---- lista de cuentas agrupada: Nómina, Neo bancos (desplegable) y el resto ---- */
.acc-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
.acc-group{flex:1 1 100%;display:flex;flex-direction:column;gap:8px;min-width:0;}
.acc-parent{align-self:flex-start;}
.acc-parent .acc-count{font-size:10.5px;font-weight:800;min-width:17px;height:17px;border-radius:9px;
  display:inline-flex;align-items:center;justify-content:center;padding:0 5px;
  background:var(--line-soft);color:var(--ink-soft);}
.acc-parent .acc-chev{display:inline-flex;color:var(--ink-faint);transition:transform 380ms var(--ease-drawer);}
.acc-group.open .acc-parent .acc-chev{transform:rotate(90deg);}
.acc-parent.has-sel{border-color:var(--accent-line);background:var(--accent-soft);color:var(--accent);font-weight:700;}
.acc-parent.has-sel .acc-count{background:rgba(10,132,255,.16);color:var(--accent);}
.acc-children{display:grid;grid-template-rows:0fr;pointer-events:none;
  transition:grid-template-rows 420ms var(--ease-drawer);}
.acc-children > .acc-cin{overflow:hidden;min-height:0;display:flex;flex-wrap:wrap;gap:8px;
  padding-left:13px;border-left:2px solid var(--line);margin-left:6px;}
.acc-group.open .acc-children{grid-template-rows:1fr;pointer-events:auto;}
.acc-empty{font-size:11.5px;color:var(--ink-faint);line-height:1.45;padding:3px 0;}
@media (prefers-reduced-motion: reduce){
  .acc-children{transition:none;}
  .acc-parent .acc-chev{transition:none;}
}
.sheet-actions{display:flex;gap:10px;margin-top:18px;}
.sheet-actions .primary-btn,.sheet-actions .ghost-btn,.sheet-actions .danger-btn{flex:1;width:auto;margin-top:0;}
.ghost-btn{flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);padding:13px;border-radius:var(--r-full);font-weight:600;font-size:14px;cursor:pointer;position:relative;overflow:hidden;transition:transform var(--dur-fast) var(--ease-out);}
.ghost-btn:active{transform:scale(.97);}
.sheet input[type=number]{width:100%;font-variant-numeric:tabular-nums;font-family:var(--font);font-size:27px;font-weight:800;padding:13px 15px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);transition:border-color var(--dur-base) var(--ease-out);}
.sheet input[type=number]:focus{border-color:var(--accent);}
.sheet input[type=text], .sheet textarea{width:100%;font-family:var(--font);font-size:15px;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);margin-bottom:9px;transition:border-color var(--dur-base) var(--ease-out);}
.sheet input[type=text]:focus, .sheet textarea:focus{border-color:var(--accent);}
.sheet textarea{resize:vertical;min-height:64px;font-size:13.5px;}
.field-label{font-size:11.5px;color:var(--ink-soft);margin:4px 0 5px;font-weight:600;}
.breadcrumb{font-size:12px;color:var(--ink-soft);margin-bottom:9px;display:flex;align-items:center;gap:5px;}
.breadcrumb b{color:var(--ink);}
.settings-link{text-align:center;margin-top:18px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;font-weight:500;}
.loading{text-align:center;padding:64px 20px;color:var(--ink-soft);font-size:13px;}

.modal-overlay{position:fixed;inset:0;background:rgba(20,20,25,.32);display:none;align-items:center;justify-content:center;z-index:60;padding:26px;backdrop-filter:blur(4px);}
.modal-overlay.show{display:flex;}
.example-modal{background:var(--chrome-strong);backdrop-filter:blur(28px) saturate(180%);border-radius:24px;padding:22px;max-width:340px;width:100%;box-shadow:0 24px 60px rgba(30,30,45,.22);animation:sheetIn var(--dur-base) var(--ease-drawer);}
.example-modal h4{margin:0 0 4px;font-size:17px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:7px;}
.example-modal p.sub{margin:0 0 14px;color:var(--ink-soft);font-size:12.5px;}
.example-list{display:flex;flex-wrap:wrap;gap:7px;max-height:280px;overflow-y:auto;margin-bottom:16px;}
.example-chip{background:var(--line-soft);border-radius:var(--r-full);padding:6px 12px;font-size:12.5px;color:var(--ink);}

/* ============================================================
   SUSCRIPCIONES
   ============================================================ */
.sub-list{display:flex;flex-direction:column;gap:12px;}
.sub-card{
  position:relative;overflow:hidden;border-radius:var(--r-lg);padding:16px 16px 14px;
  background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:var(--shadow-sm);
  animation:cardDeal .5s var(--ease-out) both;
}
.sub-card::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:linear-gradient(180deg, var(--su), color-mix(in srgb, var(--su) 55%, transparent));
  box-shadow:0 0 12px -2px var(--su);
}
.sub-card:nth-child(1){animation-delay:0ms;}
.sub-card:nth-child(2){animation-delay:60ms;}
.sub-card:nth-child(3){animation-delay:110ms;}
.sub-card:nth-child(4){animation-delay:155ms;}
.sub-card:nth-child(n+5){animation-delay:195ms;}
.sub-card.deleting{animation:rowDelete .38s var(--ease-in-out) forwards;}

.sub-main{display:flex;align-items:center;gap:14px;}
.sub-ring{position:relative;flex:none;width:62px;height:62px;display:flex;align-items:center;justify-content:center;}
.sub-ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;pointer-events:none;}
.sub-ring-num b{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.sub-ring-num span{font-size:8.5px;font-weight:600;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.sub-info{flex:1;min-width:0;}
.sub-name{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sub-meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px;}
.sub-chip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;color:var(--ink-soft);background:var(--line-soft);border-radius:var(--r-full);padding:3px 9px 3px 7px;}
.sub-chip.inv{background:rgba(10,132,255,.12);color:var(--accent);}
.sub-note{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.35;}
.sub-amount{flex:none;text-align:right;}
.sub-amount b{display:block;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.sub-amount span{font-size:10.5px;font-weight:600;color:var(--ink-faint);}

.sub-status{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);}
.sub-when{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--su);}
.sub-date{font-size:11.5px;font-weight:600;color:var(--ink-soft);}

/* Todos los botones en una sola fila y todos del mismo tamaño: "Pagar ahora"
   ya no es más grande ni va en una fila para él solo. Si no caben —cuando
   aparece "Finalizar"— bajan a la siguiente línea con la misma medida. */
.sub-actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px;}
/* "Finalizar" va debajo y centrado entre los dos de arriba, con la misma
   medida que cada uno de ellos. */
.sub-actions.centrada{justify-content:center;}
.sub-actions.centrada .sub-btn{flex:0 1 calc(50% - 3.5px);}
.sub-btn.aplazar{color:#4B49C9;border-color:rgba(94,92,230,.32);background:rgba(94,92,230,.10);}

/* ---- Los días que llevas sin pagar, bien visibles ---- */
.sub-ring-num.tarde b{color:var(--danger);}
.sub-ring-num.tarde span{color:var(--danger);opacity:.85;}
/* "días tarde" en dos líneas, centrado dentro del aro */
.sub-ring-num span{max-width:44px;text-align:center;line-height:1.08;white-space:normal;}
.sub-ring-num.tarde span{font-size:7.5px;letter-spacing:.04em;}
.sub-ring-num.hecho b{color:var(--success-text);font-size:17px;}
.sub-when.tarde{color:var(--danger);}
.sub-retraso{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px;padding:9px 11px;
  border-radius:var(--r-md);background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger);
}
.sub-retraso b{font-size:13px;font-weight:800;letter-spacing:-.01em;}
.sub-retraso span{font-size:11px;font-weight:600;color:var(--ink-soft);margin-left:auto;}

/* ---- Dos columnas: lo pagado contra lo que queda ---- */
.sub-barras{margin-top:12px;padding:11px 12px 10px;border-radius:var(--r-md);
  background:var(--surface-2);border:1px solid var(--line-soft);}
.sub-barras .sb-h{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;
  letter-spacing:.03em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:10px;}
.sub-barras .sb-plot{display:flex;gap:14px;align-items:flex-end;}
.sub-barras .sb-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;}
.sub-barras .sb-tubo{width:100%;height:76px;display:flex;align-items:flex-end;justify-content:center;
  border-radius:8px;background:var(--glass-soft);border:1px solid var(--line-soft);padding:4px;}
.sub-barras .sb-barra{display:block;width:34px;max-width:70%;min-height:3px;height:var(--h);border-radius:5px 5px 2px 2px;
  transition:height var(--dur-slow) var(--ease-out);}
.sub-barras .sb-barra.ok{background:linear-gradient(180deg,#5FD37C,#248A3D);}
.sub-barras .sb-barra.falta{background:linear-gradient(180deg,#FF9F6B,#FF3B30);}
.sub-barras .sb-v{font-family:var(--num);font-size:13px;font-weight:700;color:var(--ink);
  font-variant-numeric:tabular-nums;}
.sub-barras .sb-k{font-size:10.5px;font-weight:700;color:var(--ink-soft);}
.sub-barras .sb-n{font-size:9.5px;font-weight:600;color:var(--ink-faint);text-align:center;}
.sub-barras .sb-sin .sb-tubo{border-style:dashed;align-items:center;}
.sub-barras .sb-interr{color:var(--ink-faint);display:inline-flex;}
.sub-barras .sb-sin .sb-v{color:var(--ink-faint);}
.sub-barras .sb-pie{display:flex;gap:6px;align-items:flex-start;margin-top:10px;padding-top:9px;
  border-top:1px solid var(--line-soft);font-size:10.5px;font-weight:600;color:var(--ink-faint);line-height:1.45;}
.sub-barras .sb-pie svg{flex:none;margin-top:1px;}

/* ---- La banda que dice qué rueda estás viendo ---- */
.sr-banda{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding:9px 11px;
  border-radius:var(--r-md);background:color-mix(in srgb, var(--se) 10%, transparent);
  border:1px solid color-mix(in srgb, var(--se) 28%, transparent);}
.sr-banda .sb-ico{flex:none;width:26px;height:26px;border-radius:8px;display:inline-flex;
  align-items:center;justify-content:center;background:var(--se);color:#fff;}
.sr-banda .sb-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;}
.sr-banda .sb-t b{font-size:13px;font-weight:800;letter-spacing:-.01em;color:var(--ink);}
.sr-banda .sb-t i{font-style:normal;font-size:10px;font-weight:600;color:var(--ink-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sr-banda .sb-pos{flex:none;font-size:9.5px;font-weight:800;color:var(--se);
  background:var(--glass-strong);border-radius:999px;padding:3px 8px;font-variant-numeric:tabular-nums;}

/* ---- Aplazar ---- */
.ap-actual{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 14px;
  padding:10px 12px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line-soft);}
.ap-actual span{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--ink-soft);}
.ap-actual b{font-family:var(--num);font-size:14px;font-weight:700;color:var(--ink);}

/* ---- Un bloque del formulario que falta por rellenar ---- */
.sf-step.sf-falta{animation:sfFalta .5s var(--ease-out);}
.sf-step.sf-falta .field-label{color:var(--danger);}
@keyframes sfFalta{
  0%,100%{transform:translateX(0);}
  20%{transform:translateX(-5px);} 40%{transform:translateX(5px);}
  60%{transform:translateX(-3px);} 80%{transform:translateX(3px);}
}
.chip.small.unico{border-style:dashed;}
.chip.small.unico.active{border-style:solid;}

/* ---- El asistente paso a paso ---- */
.w-pasos{display:flex;gap:4px;margin:0 0 14px;}
.w-pasos i{flex:1;height:3px;border-radius:2px;background:var(--line);transition:background var(--dur-base) var(--ease-out);}
.w-pasos i.ok{background:var(--success-text);}
.w-pasos i.on{background:var(--accent);}
.w-catextra{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line-soft);}
.chip.small.ghost{background:transparent;border-style:dashed;color:var(--ink-soft);}
.chip.small.cita{border-color:rgba(255,149,0,.40);background:rgba(255,149,0,.10);color:#9A5B00;}
.chip.small.cita.active{background:var(--warn);border-color:var(--warn);color:#fff;}
.chip.small.active.muted{background:var(--ink-soft);border-color:var(--ink-soft);color:#fff;}
.sheet .w-pasos + h3{margin-top:0;}

/* ---- El botón largo de añadir, en la pantalla de un día ---- */
.dm-add{display:flex;align-items:center;gap:11px;width:100%;margin-top:16px;padding:13px 14px;
  border-radius:var(--r-md);border:1px dashed var(--accent-line);background:var(--accent-soft);
  font-family:var(--font);cursor:pointer;text-align:left;
  transition:transform var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out);}
.dm-add:active{transform:scale(.985);background:var(--accent-soft-strong);}
.dm-add .da-ico{flex:none;width:32px;height:32px;border-radius:10px;display:inline-flex;align-items:center;
  justify-content:center;background:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent);}
.dm-add .da-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
.dm-add .da-t b{font-size:13.5px;font-weight:700;color:var(--ink);}
.dm-add .da-t i{font-style:normal;font-size:10.5px;font-weight:600;color:var(--ink-soft);}
.dm-add .da-c{flex:none;color:var(--accent);display:inline-flex;}
.dm-row .dm-chev{flex:none;color:var(--ink-faint);display:inline-flex;}
.dm-row[data-irsub]{cursor:pointer;}
.dm-row[data-irsub]:active{transform:scale(.99);}

/* El selector Calendario / Suscripciones va pegado arriba del mando del tiempo. */
.sub-switch{margin-top:0;margin-bottom:12px;}
/* La pestaña recorta lo que se sale (lleva el destello del toque dentro), así
   que el aviso no puede flotar fuera: va en línea, detrás del nombre. */
.sub-switch .wallet-tab{position:relative;gap:6px;}
.sub-switch .wallet-tab .ni-badge{position:static;margin-left:2px;box-shadow:none;height:15px;min-width:15px;}
.sub-switch .wallet-tab.active .ni-badge{background:#fff;color:var(--accent);}
.sub-switch .wallet-tab.active .ni-badge.due{background:#fff;color:var(--danger);}

/* ---- Reembolsos dentro del historial general ---- */
.nb-it.ref .nb-ita.ref{color:var(--warn);}
.nb-resumen .rf{color:var(--warn);font-weight:700;}
.nb-refnota{display:flex;gap:6px;align-items:flex-start;margin-top:10px;padding:9px 10px;
  border-radius:10px;background:rgba(255,149,0,.10);border:1px solid rgba(255,149,0,.26);
  font-size:10.5px;font-weight:600;color:#9A5B00;line-height:1.45;}
.nb-refnota svg{flex:none;margin-top:1px;}
/* La ficha del movimiento admite ahora un segundo renglón por dato. */
.nb-itx .r b i{display:block;font-style:normal;font-size:10px;font-weight:600;color:var(--ink-faint);margin-top:1px;}
.nb-itx .r.neg b{color:var(--num-out);}
.nb-itx .r.pos b{color:var(--num-in);}
.sub-btn{
  flex:1 1 120px;min-width:0;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  font-family:var(--font);font-size:12.5px;font-weight:700;cursor:pointer;
  padding:10px 8px;border-radius:var(--r-full);
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink-soft);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset;
  transition:transform var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out);
}
.sub-btn:active{transform:scale(.96);}
.sub-btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent);}
.sub-btn:disabled{opacity:.45;cursor:default;box-shadow:none;}
/* El lápiz, arriba a la derecha de la tarjeta: se llega a él sin desplegar. Va
   en columna con la flecha para no robarle ancho al nombre, que es lo primero
   que se corta cuando la tarjeta va justa. */
.sub-tools{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;margin-left:6px;}
.sub-tools .sub-chev{margin-left:0;}
.sub-edit{
  flex:none;display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;padding:0;cursor:pointer;
  border-radius:var(--r-full);border:1px solid var(--line);
  background:var(--surface-2);color:var(--ink-soft);
  transition:transform var(--dur-fast) var(--ease-out), color var(--dur-base) var(--ease-out);
}
.sub-edit:active{transform:scale(.92);}
.sub-edit:hover{color:var(--ink);}

/* ---- la tarjeta como desplegable ----
   Arriba siempre lo mismo: cuenta atrás, nombre e importe. Lo demás baja al
   tocarla, como un cajón. */
.sub-head{display:block;width:100%;text-align:left;background:none;border:0;padding:0;
  font-family:var(--font);cursor:pointer;color:inherit;}
.sub-chev{display:inline-flex;color:var(--ink-faint);flex:none;margin-left:4px;
  transition:transform 420ms var(--ease-drawer);}
.sub-card.open .sub-chev{transform:rotate(90deg);}
.sub-drop{overflow:hidden;height:0;opacity:0;
  transition:height 460ms var(--ease-drawer), opacity 300ms var(--ease-out);}
.sub-card.open > .sub-drop{height:auto;opacity:1;}
/* aviso de que ese pago está esperando a que lo hagas tú */
.sub-alerta{
  display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;
  border-radius:var(--r-md);background:var(--danger-soft);border:1px solid var(--danger-line);
  color:var(--danger-text);font-size:12px;font-weight:700;line-height:1.35;
}
.sub-alerta .sa-ico{display:inline-flex;flex:none;}
/* el botón de pagar late cuando ya toca */
@keyframes pagoLatido{
  0%,100%{ box-shadow:var(--shadow-accent); transform:scale(1); }
  50%{ box-shadow:0 0 0 6px rgba(255,59,48,.16), 0 10px 22px -12px rgba(255,59,48,.9); transform:scale(1.025); }
}
.sub-btn.toca{background:var(--danger);border-color:var(--danger);color:#fff;
  animation:pagoLatido 1.7s var(--ease-in-out) infinite;}
.sub-btn.finalizar{background:var(--ink);border-color:var(--ink);color:#fff;}
.sub-btn.reembolso{color:var(--danger);}
@media (prefers-reduced-motion: reduce){
  .sub-btn.toca{animation:none;}
  .sub-chev,.sub-drop{transition:none;}
}
/* ---- el formulario que se va abriendo por bloques ---- */
.sf-step{margin-top:14px;transition:opacity var(--dur-base) var(--ease-out);}
.sf-step:first-child{margin-top:2px;}
.sf-step.bloqueado{opacity:.32;pointer-events:none;filter:grayscale(1);}
.sf-step.activo > .field-label{color:var(--accent);font-weight:700;}
.sf-paso{display:flex;align-items:center;gap:8px;}
/* Sin números: basta con que el bloque que toca esté encendido. Un punto
   delante dice en qué estás y cuáles ya has dejado resueltos. */
.sf-paso::before{
  content:'';width:8px;height:8px;border-radius:50%;flex:none;
  background:var(--line-strong);
  transition:background var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.sf-step.activo .sf-paso::before{background:var(--accent);box-shadow:0 0 0 3px rgba(10,132,255,.18);}
.sf-step.listo .sf-paso::before{background:#248A3D;}
.sf-hint{font-size:11px;color:var(--ink-faint);line-height:1.4;margin:5px 0 0;}
.sf-dos{display:flex;gap:9px;}
.sf-dos > div{flex:1;min-width:0;}
.sf-dos input{width:100%;}

.sub-salary{margin-top:16px;padding-top:14px;border-top:1px solid var(--line-soft);}
.sub-salary .ss-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink-soft);margin-bottom:7px;}
.sub-salary .ss-top b{font-size:16px;font-weight:800;color:var(--ink);}

/* tira de próximos cobros */
.upcoming-strip{display:flex;gap:9px;overflow-x:auto;padding:2px 2px 6px;margin-bottom:2px;}
.up-pill{
  flex:none;display:flex;flex-direction:column;gap:2px;min-width:104px;
  padding:11px 13px;border-radius:16px;
  background:var(--glass);backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset, 0 8px 18px -12px var(--su);
  border-left:3px solid var(--su);
  animation:rowEnter var(--dur-base) var(--ease-out) both;
}
.up-days{font-size:17px;font-weight:800;color:var(--su);letter-spacing:-.02em;line-height:1;}
.up-name{font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px;}
.up-amt{font-size:11px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums;}

/* aviso del próximo cobro en Inicio */
.next-sub-card{
  display:flex;align-items:center;gap:13px;margin-top:14px;padding:13px 15px;
  border-radius:var(--r-lg);cursor:pointer;
  background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);border-left:4px solid var(--su);
  box-shadow:var(--shadow-sm);
  animation:cardEnter var(--dur-slow) var(--ease-out) both;
}
.ns-ring{position:relative;width:52px;height:52px;flex:none;display:flex;align-items:center;justify-content:center;}
.ns-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;}
.ns-mid{flex:1;min-width:0;}
.ns-k{display:flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--su);}
.ns-name{font-size:15.5px;font-weight:700;color:var(--ink);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ns-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px;}
.ns-amt{flex:none;font-size:17px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

/* anillo de progreso: se dibuja al aparecer */
.ring-gauge{display:block;overflow:visible;}
.rg-fill{stroke-dasharray:var(--rg-c) var(--rg-c);stroke-dashoffset:var(--rg-c);animation:ringDraw 1s var(--ease-out) .12s forwards;}
@keyframes ringDraw{ to{ stroke-dashoffset:var(--rg-end); } }

/* interruptor */
.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:16px;padding:13px 15px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line);cursor:pointer;}
.tr-title{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:700;color:var(--ink);}
.tr-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;line-height:1.35;}
.switch{width:48px;height:29px;border-radius:var(--r-full);background:var(--line-strong);flex:none;position:relative;transition:background var(--dur-base) var(--ease-out);box-shadow:inset 0 1px 3px rgba(30,30,45,.2);}
.switch span{position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(30,30,45,.3);transition:transform var(--dur-base) var(--ease-spring);}
.switch.on{background:var(--success);}
.switch.on span{transform:translateX(19px);}

/* --- ajustes de la pregunta automática del sueldo --- */
.ask-card{
  margin-top:14px;padding:16px 16px 15px;border-radius:var(--r-lg);
  background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);
  border:1px solid rgba(255,255,255,.55);box-shadow:var(--shadow-sm);
  animation:cardRise var(--dur-slow) var(--ease-out) both;animation-delay:80ms;
}
.ac-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ac-title{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
.ac-sub{margin-top:5px;font-size:11.5px;font-weight:500;color:var(--ink-soft);line-height:1.45;letter-spacing:0;}
.ac-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px;transition:opacity var(--dur-base) var(--ease-out);}
.ac-grid.off{opacity:.45;}
.ac-field{display:flex;flex-direction:column;gap:6px;}
.ac-field span{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.04em;}
.ac-field input{
  width:100%;padding:11px 12px;border-radius:var(--r-sm);
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  font-family:var(--font);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;
  transition:border-color var(--dur-base) var(--ease-out), box-shadow var(--dur-base) var(--ease-out);
}
.ac-field input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
.ac-field input:disabled{cursor:not-allowed;}

/* --- pregunta del sueldo, versión mínima --- */
.ask-card.mini{margin-top:12px;padding:10px 12px 11px;border-radius:16px;}
.ask-card.mini .ac-line{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.ask-card.mini .ac-title{font-size:12.5px;font-weight:700;color:var(--ink-soft);gap:6px;letter-spacing:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ask-card.mini .ac-mini{display:flex;align-items:center;gap:6px;flex:none;}
.ask-card.mini .ac-mini input{
  width:42px;padding:5px 4px;text-align:center;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  font-family:var(--font);font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;
}
.ask-card.mini .ac-mini input[type=time]{width:auto;min-width:60px;padding-left:6px;padding-right:6px;}
.ask-card.mini .ac-mini input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft);}
.ask-card.mini.off .ac-mini input{opacity:.4;}
.ask-card.mini .ac-sub{margin-top:6px;font-size:10.5px;line-height:1.35;color:var(--ink-faint);}
.switch.mini{width:36px;height:21px;cursor:pointer;}
.switch.mini span{width:16px;height:16px;top:2.5px;left:2.5px;}
.switch.mini.on span{transform:translateX(15px);}

/* --- C.T.I y Balance, bajo el dinero total consolidado --- */
.cti-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.cti-box{
  --tk:#5E5CE6;
  padding:12px 13px;border-radius:16px;min-width:0;
  background:linear-gradient(140deg, color-mix(in srgb, var(--tk) 10%, var(--glass-strong)), var(--glass-strong));
  border:1px solid color-mix(in srgb, var(--tk) 24%, transparent);
  box-shadow:0 1px 0 rgba(255,255,255,.7) inset;
  animation:cardRise var(--dur-slow) var(--ease-out) both;animation-delay:110ms;
}
.cti-box.bal{--tk:#34C759;}
.cti-k{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--tk);}
.cti-v{margin-top:4px;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.03em;font-variant-numeric:tabular-nums;white-space:nowrap;}
.cti-s{margin-top:3px;font-size:9.5px;font-weight:600;color:var(--ink-faint);line-height:1.3;}

/* --- desglose del saldo y de los gastos --- */
.legend-group{display:flex;flex-direction:column;gap:8px;}
.legend-group + .legend-group{margin-top:6px;padding-top:10px;border-top:1px solid var(--line-soft);}
.lg-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);}
.lg-head b{font-size:13.5px;font-weight:800;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums;text-transform:none;}
.lg-head.in b{color:var(--success);}
.lg-head.out b{color:var(--danger);}
.legend-item.empty{color:var(--ink-faint);font-size:11.5px;}
.legend-item.total{margin-top:6px;padding-top:10px;border-top:1px solid var(--line-soft);font-weight:700;}
.legend-item.total .lname{font-weight:800;}
.lchip{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:1px 5px;border-radius:6px;
  background:color-mix(in srgb,#0A84FF 15%,transparent);color:#0A84FF;vertical-align:middle;}

/* --- movimientos: cabecera con mes y flechas --- */
.mov-head{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.mov-head .mh-l{display:flex;align-items:center;gap:7px;min-width:0;}
.mov-nav{display:flex;align-items:center;gap:6px;flex:none;text-transform:none;letter-spacing:0;}
.mov-arrow{width:26px;height:26px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;padding:0;
  transition:transform var(--dur-fast) var(--ease-out);}
.mov-arrow:active{transform:scale(.9);}
.mov-month{font-size:11.5px;font-weight:700;color:var(--ink-soft);text-transform:capitalize;}
.mov-sum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 2px 8px;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums;}
.mov-sum .ms-in{color:var(--success);}
.mov-sum .ms-out{color:var(--danger);}
.mov-sum .ms-n{font-weight:600;}
.tx-tag.tipo{font-weight:800;text-transform:uppercase;letter-spacing:.03em;font-size:9px;}
.tx-tag.tipo.ingreso{color:var(--success);}
.tx-tag.tipo.gasto{color:var(--danger);}
.tx-tag.tipo.inversion{color:#0A84FF;}
.tx-tag.tipo.transfer{color:var(--ink-faint);}
.tx-tag.tipo.pago{color:#AF52DE;}

/* fichas compactas para formularios largos */
.chip.small{padding:8px 13px;font-size:12.5px;gap:5px;}

/* campo de fecha */
.sheet input[type=date]{width:100%;font-family:var(--font);font-size:15px;font-weight:600;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);margin-bottom:9px;transition:border-color var(--dur-base) var(--ease-out);}
.sheet input[type=date]:focus{border-color:var(--accent);outline:none;}

/* ============================================================
   CALENDARIO: marcas de suscripción
   ============================================================ */
.cal-day.marked-sub{background:rgba(10,132,255,.13);border-color:rgba(10,132,255,.34);}
.cal-day.marked-sub .demo{color:var(--accent);}
.cal-badge.sub{color:var(--accent);}
.cal-day.today-ring{box-shadow:0 0 0 2px var(--accent) inset;font-weight:700;}
.cal-subdot{position:absolute;right:4px;top:4px;width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px rgba(255,255,255,.7);}
.cal-legend{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-soft);font-size:10.5px;font-weight:600;color:var(--ink-soft);}
.cal-legend span{display:inline-flex;align-items:center;gap:5px;}
.cl-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.cl-dot.red{background:var(--danger);}
.cl-dot.blue{background:var(--info);}
.cl-dot.sub{background:var(--accent);}
.cal-legend .cl-total{margin-left:auto;color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}

/* ============================================================
   CALENDARIO: sello de notas y día pulsable
   ============================================================ */
/* Cualquier casilla con día se puede pulsar para abrir su pantalla. */
.cal-day:not(.empty){cursor:pointer;transition:transform var(--dur-fast) var(--ease-out), background var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out);}
.cal-day:not(.empty):active{transform:scale(.92);}
.cal-day:not(.empty):focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
/* El sello: una marca horizontal en la base de la casilla. Se ve de un vistazo
   que ese día tiene algo apuntado sin tener que abrirlo. */
.cal-day.has-note{padding-bottom:5px;}
.cal-day .cal-notestamp{position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:58%;height:3px;border-radius:2px;background:var(--warn);box-shadow:0 0 0 1.5px rgba(255,255,255,.6);}
/* Con más de una nota el sello se dobla: dos rayas en vez de una. */
.cal-day .cal-notestamp.multi::after{content:'';position:absolute;left:14%;right:14%;top:-4px;height:2px;border-radius:2px;background:var(--warn);opacity:.6;}
/* Un día cuyas notas ya están todas cobradas o canceladas baja el tono: sigue
   marcado, pero ya no reclama nada. */
.cal-day .cal-notestamp.hecha{background:var(--ink-faint);opacity:.75;}
.cal-day .cal-notestamp.hecha.multi::after{background:var(--ink-faint);}
/* Si el día solo tiene notas (ni movimientos ni cobros) la casilla se tiñe. */
.cal-day.has-pend:not(.marked-red):not(.marked-blue):not(.marked-sub){background:rgba(255,149,0,.11);border-color:rgba(255,149,0,.30);}
.cal-day.today .cal-notestamp{background:#fff;box-shadow:none;}
.cl-bar{width:13px;height:3px;border-radius:2px;display:inline-block;}
.cl-bar.note{background:var(--warn);}

/* ---- El punto de aviso en la pestaña del calendario ---- */
.nav-item{position:relative;}
.nav-item .ni-badge{
  position:absolute;top:1px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;
  border-radius:999px;background:var(--warn);color:#fff;font-size:9.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none;
