  function nominaIds(){ return ['banco'].concat((state.nominas || []).map(n=>'nomina:' + n.id)); }
  /* La primera nómina a la que le toca preguntar el sueldo de este mes. */
  function nominaPendiente(){ return nominaIds().find(id=>salaryAskDue(id)) || null; }
  function salaryForMonth(ref, accId){
    const N = nomCfg(accId);
    const k = monthKey(ref);
    const m = N.monthlySalaries || {};
    if(Object.prototype.hasOwnProperty.call(m, k)) return m[k];
    /* Con la pregunta periódica apagada no se supone ningún sueldo: los meses
       que no hayas rellenado a mano valen 0. */
    if(N.salaryAsk && N.salaryAsk.enabled === false) return 0;
    return N.salaryMonthly || 0;
  }
  /* Fecha y hora en la que toca volver a preguntar el sueldo de este mes. */
  function salaryAskDate(ref, accId){
    const N = nomCfg(accId);
    const d = ref ? new Date(ref) : now();
    const cfg = N.salaryAsk || defaultSalaryAsk();
    const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    const day = Math.min(Math.max(parseInt(cfg.day,10) || 1, 1), lastDay);
    return new Date(d.getFullYear(), d.getMonth(), day,
      Math.min(Math.max(parseInt(cfg.hour,10) || 0, 0), 23),
      Math.min(Math.max(parseInt(cfg.minute,10) || 0, 0), 59), 0, 0);
  }
  function salaryAskDue(accId){
    const N = nomCfg(accId);
    if(!state.onboarded) return false;
    const cfg = N.salaryAsk || defaultSalaryAsk();
    if(!cfg.enabled) return false;
    if(cfg.lastAskedMonth === monthKey()) return false;
    return now().getTime() >= salaryAskDate(undefined, accId).getTime();
  }
  function pad2(n){ return String(n).padStart(2,'0'); }
  function setSalaryForMonth(value, ref, accId){
    const N = nomCfg(accId);
    if(!N.monthlySalaries) N.monthlySalaries = {};
    N.monthlySalaries[monthKey(ref)] = value;
  }

  /* Deja cualquier copia de datos con la forma que espera la app: añade lo que
     falte y migra lo antiguo, sin perder nunca movimientos. */
  function normalizeState(d){
    const merged = Object.assign(freshState(), d || {});
    merged.version = CURRENT_VERSION;
    if(!Array.isArray(merged.platforms) || !merged.platforms.length) merged.platforms = defaultPlatforms();
    if(!Array.isArray(merged.history)) merged.history = [];
    if(!Array.isArray(merged.limitCategories)) merged.limitCategories = defaultLimitCategories();
    if(!Array.isArray(merged.transactions)) merged.transactions = [];
    if(!Array.isArray(merged.subscriptions)) merged.subscriptions = [];
    if(!Array.isArray(merged.customCategories)) merged.customCategories = [];
    /* El tramo de tiempo guardado: si viene de una copia vieja o con un valor
       que ya no existe, se vuelve al mes en curso. */
    if(!periodoValido(merged.periodo)) merged.periodo = 'mes';
    /* ---- Mudanza de los límites a la pantalla del calendario ----
       El bloque nuevo hay que meterlo JUSTO detrás del calendario dentro del
       orden que ya tuvieras guardado. Si se dejara al criterio de siempre, los
       ids que no aparecen en la lista se añaden al final, y a quien hubiera
       reordenado el Calendario le saldrían los límites debajo del historial.
       De paso se tira lo que quedaba de la pestaña vieja. */
    if(!merged.ui || typeof merged.ui !== 'object') merged.ui = {order:{},hidden:{},labels:{},free:{}};
    const orden = merged.ui.order || (merged.ui.order = {});
    if(Array.isArray(orden.calendario) && orden.calendario.indexOf('limites') < 0){
      const iCal = orden.calendario.indexOf('calendario');
      if(iCal >= 0) orden.calendario.splice(iCal + 1, 0, 'limites');
      else orden.calendario.unshift('limites');
    }
    delete orden.limites;
    ['hidden','labels','free'].forEach(k=>{ if(merged.ui[k]) delete merged.ui[k].limites; });
    /* Cada límite guarda si es mensual o anual. Los que ya tenías eran todos
       mensuales, así que al actualizar no cambia de significado ninguno. */
    if(!merged.limitPeriods || typeof merged.limitPeriods !== 'object') merged.limitPeriods = {};
    merged.limitCategories.forEach(c=>{ if(merged.limitPeriods[c] !== 'anio') merged.limitPeriods[c] = 'mes'; });
    /* Las suscripciones de versiones anteriores se ponen al día: ya no hay
       pausa (las que estaban pausadas vuelven a estar vivas) y las aportaciones
       que apuntaban a otra plataforma pasan a pagarse desde ella. */
    merged.subscriptions.forEach(s=>{
      if(!s || typeof s !== 'object') return;
      s.active = true;
      if(typeof s.indefinido !== 'boolean') s.indefinido = false;
      if(s.kind === 'inversion'){
        if(s.targetPlatform && !String(s.account||'').startsWith('platform:')){
          s.account = 'platform:' + s.targetPlatform;
        }
        s.targetPlatform = null;
        if(typeof s.fee !== 'number') s.fee = 0;
        if(!s.invType) s.invType = 'otro';
        if(!s.invLabel) s.invLabel = 'Inversión';
      }
    });
    merged.platforms.forEach((p,i)=>{
      if(!p.metal) p.metal = METAL_KEYS[i % METAL_KEYS.length];
      if(typeof p.balance !== 'number') p.balance = 0;
      if(!p.icon) p.icon = 'coin';
    });
    /* Migración: los saldos sueltos de efectivo y pagas pasan a ser carteras.
       Se mira lo que traía la copia, no el resultado ya mezclado, porque
       freshState() siempre aporta las dos carteras vacías. */
    const traeCarteras = d && Array.isArray(d.wallets) && d.wallets.length;
    if(traeCarteras){
      merged.wallets = d.wallets;
    } else {
      merged.wallets = defaultWallets();
      if(d && typeof d.efectivoBalance === 'number') merged.wallets[0].balance = d.efectivoBalance;
      if(d && typeof d.pagasBalance === 'number') merged.wallets[1].balance = d.pagasBalance;
    }
    delete merged.efectivoBalance; delete merged.pagasBalance;
    merged.wallets.forEach((w,i)=>{
      if(typeof w.balance !== 'number') w.balance = 0;
      if(!w.hex) w.hex = WALLET_PALETTE[i % WALLET_PALETTE.length];
      if(!w.icon) w.icon = 'wallet';
      if(!w.name) w.name = 'Cartera';
      delete w.builtin;   /* ya no hay carteras del sistema: solo Nómina, Patrimonio y Neo bancos */
    });
    /* Efectivo viene de serie, pero ahora se puede borrar como cualquier
       cartera tuya: ya no se vuelve a crear sola. */
    if(!Array.isArray(merged.nominas)) merged.nominas = [];
    if(!Array.isArray(merged.neoGroups)) merged.neoGroups = [];
    if(!merged.monthlySalaries || typeof merged.monthlySalaries !== 'object') merged.monthlySalaries = {};
    if(!merged.limits || typeof merged.limits !== 'object') merged.limits = {};
    if(typeof merged.salaryMonthly !== 'number') merged.salaryMonthly = 0;
    if(typeof merged.initialAmount !== 'number') merged.initialAmount = 0;
    if(typeof merged.ctiPeak !== 'number') merged.ctiPeak = 0;
    if(typeof merged.working !== 'boolean') merged.working = true;
    if(!merged.ui || typeof merged.ui !== 'object') merged.ui = {order:{},hidden:{},labels:{}};
    if(!merged.ui.order  || typeof merged.ui.order  !== 'object') merged.ui.order = {};
    if(!merged.ui.hidden || typeof merged.ui.hidden !== 'object') merged.ui.hidden = {};
    if(!merged.ui.labels || typeof merged.ui.labels !== 'object') merged.ui.labels = {};
    if(!merged.ui.free   || typeof merged.ui.free   !== 'object') merged.ui.free = {};
    if(!Array.isArray(merged.subRefunds)) merged.subRefunds = [];
    if(!Array.isArray(merged.subDelays)) merged.subDelays = [];
    /* Importes en negativo guardados por copias anteriores: se enderezan. El
       signo lo pone el tipo de movimiento, nunca el número. */
    merged.transactions.forEach(t=>{ if(typeof t.amount === 'number' && t.amount < 0) t.amount = Math.abs(t.amount); });
    merged.subscriptions.forEach(s=>{
      if(!s || typeof s !== 'object') return;
      if(typeof s.amount === 'number' && s.amount < 0) s.amount = Math.abs(s.amount);
      if(typeof s.fee === 'number' && s.fee < 0) s.fee = Math.abs(s.fee);
      if(typeof s.units === 'number' && s.units < 0) s.units = Math.abs(s.units);
    });
    /* ---- Las notas sueltas del calendario pasan a ser bloques ----
       Existieron como lista aparte durante dos versiones. Eran lo mismo que una
       cita —algo con fecha, hora y un coste que a veces aún no sabes— pero
       guardado en otro sitio y con su propio flujo. Al unificarlo, lo que
       quedara apuntado se convierte en bloque y la lista vieja se vacía: esta
       migración corre una sola vez, porque después ya no queda nada que migrar. */
    if(merged.dayNotes && typeof merged.dayNotes === 'object' && !Array.isArray(merged.dayNotes)){
      Object.keys(merged.dayNotes).forEach(k=>{
        const lista = Array.isArray(merged.dayNotes[k]) ? merged.dayNotes[k] : [];
        lista.forEach((n,i)=>{
          if(!n || typeof n !== 'object') return;
          const texto = String(n.text || '').trim();
          if(!texto) return;
          /* Las ya cobradas dejaron su movimiento en el historial y las
             canceladas no van a pasar: no hay nada que seguir esperando. */
          if(n.status === 'cobrado' || n.status === 'cancelado') return;
          const time = typeof n.time === 'string' && /^\d{1,2}:\d{2}$/.test(n.time) ? n.time : '09:00';
          const p = String(k).split('-').map(Number);
          const h = time.split(':').map(Number);
          const cuando = typeof n.dueTs === 'number' && n.dueTs > 0 ? n.dueTs
            : new Date(p[0], (p[1]||1)-1, p[2]||1, h[0]||0, h[1]||0, 0, 0).getTime();
          merged.subscriptions.push({
            id: 'cita' + (n.id || (k + '-' + i)),
            name: texto.slice(0,34), kind:'otro', otroLabel:'Cita o consulta',
            cita:true, time:time, category:CITA_CAT,
            amount: typeof n.cost === 'number' && n.cost >= 0 ? n.cost : 0,
            costUndefined: !(typeof n.cost === 'number' && n.cost >= 0),
            cycle:'puntual', nextTs:cuando, anchorDay:new Date(cuando).getDate(),
            account:'banco', note:'', active:true, autoCharge:false,
            indefinido:false, done:false, lastChargedTs:null,
          });
        });
      });
    }
    merged.dayNotes = {};
    /* Cada cita se vuelve a dejar coherente: fecha con hora, una sola vez y
       nunca cobro automático. */
    merged.subscriptions.forEach(s=>{
      if(!s || !s.cita) return;
      s.cycle = 'puntual';
      s.autoCharge = false;
      s.indefinido = false;
      if(!s.category) s.category = CITA_CAT;
      if(typeof s.time !== 'string' || !/^\d{1,2}:\d{2}$/.test(s.time)){
        s.time = new Date(s.nextTs).toTimeString().slice(0,5);
      }
      if(typeof s.amount !== 'number' || !isFinite(s.amount) || s.amount < 0) s.amount = 0;
      if(s.amount === 0) s.costUndefined = true;
    });
    merged.salaryAsk = Object.assign(defaultSalaryAsk(), merged.salaryAsk || {});
    /* Una copia antigua no sabe nada de la pregunta mensual. Se da por hecha la
       de este mes: así al restaurar no salta de golpe, y empieza el mes que viene. */
    if(!(d && d.salaryAsk) && merged.salaryAsk.lastAskedMonth == null) merged.salaryAsk.lastAskedMonth = monthKey();
    /* Quien ya venía usando la app no tiene que volver a pasar por la bienvenida. */
    /* Se mira lo que traía la copia: freshState() siempre aporta onboarded:false,
       así que preguntar por merged nunca detectaría una copia antigua. */
    if(!d || typeof d.onboarded !== 'boolean'){
      merged.onboarded = merged.salaryMonthly > 0 || merged.transactions.length > 0
        || (merged.initialAmount || 0) > 0
        || merged.wallets.some(w=>w.balance !== 0) || merged.platforms.some(p=>p.balance !== 0);
    }
    return merged;
  }

  async function loadState(){
    /* Una app exportada entera trae los datos incrustados: se usan la primera vez. */
    try{
      const seed = document.getElementById('__seedStateData');
      if(seed && seed.textContent.trim()){
        const stored = await appStorage.get(STORAGE_KEY);
        if(!stored || !stored.value){
          const seeded = normalizeState(JSON.parse(seed.textContent));
          try{ await appStorage.set(STORAGE_KEY, JSON.stringify(seeded)); }catch(e){}
          return seeded;
        }
      }
    }catch(e){}
    try{
      const r = await appStorage.get(STORAGE_KEY);
      if(r && r.value){
        const d = JSON.parse(r.value);
        const merged = normalizeState(d);
        if(d.version !== CURRENT_VERSION){
          try{ await appStorage.set(STORAGE_KEY, JSON.stringify(merged)); }catch(e){}
        }
        return merged;
      }
    }catch(e){}
    return freshState();
  }

  /* El historial apunta cuánto dinero había, no cuántas veces se guardó.
     Guardar pasa continuamente (cambiar un ajuste, abrir un desplegable,
     apuntar una nota...) y antes cada guardado dejaba su punto: la gráfica de
     capital acababa contando visitas a la app en vez de euros, el máximo del
     periodo podía salir de un punto repetido y el tope de 800 se comía
     historial de verdad. Ahora, si nada ha cambiado, no se apunta nada.

     Cada punto guarda el capital con lo invertido dentro, igual que la rueda
     del Dinero Total Consolidado y el "saldo ahora" de cada cuenta. Antes lo
     guardaba sin la inversión, y al invertir la gráfica de capital caía
     aunque el capital no hubiera cambiado. */
  function recordHistory(){
    if(!state.onboarded) return;
    const by = {};
    allAccounts().forEach(a=>{ by[a.id] = accountTotal(a.id); });
    const total = patrimonioTotal();
    const ultimo = state.history[state.history.length - 1];
    /* Se mira también el reparto por cuentas: un traspaso deja el total igual
       pero sí cambia dónde está el dinero, y eso sí merece un punto. */
    if(ultimo && ultimo.total === total && JSON.stringify(ultimo.by || {}) === JSON.stringify(by)) return;
    state.history.push({ ts: Date.now(), total, by });
    if(state.history.length > 800) state.history = state.history.slice(-800);
  }
  async function saveState(){
    try{ recordHistory(); await appStorage.set(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){
      console.error('No se pudo guardar', e);
      showToast('No se pudieron guardar los cambios en este dispositivo. Vuelve a intentarlo.', true);
    }
  }

  /* ---------- toast (sustituye a alert() para que el aviso combine con el resto de la interfaz) ---------- */
  let toastEl = null, toastTimer = null;
  function showToast(msg, isError){
    if(!toastEl){
      toastEl = document.createElement('div');
      toastEl.className = 'toast';
      document.body.appendChild(toastEl);
    }
    toastEl.textContent = msg;
    toastEl.classList.toggle('error', !!isError);
    toastEl.classList.remove('show');
    void toastEl.offsetWidth;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 3200);
  }

  /* ---------- toast con acción "Deshacer" tras un borrado ---------- */
  let undoToastEl = null, undoToastTimer = null;
  function showUndoToast(msg, onUndo){
    if(!undoToastEl){
      undoToastEl = document.createElement('div');
      undoToastEl.className = 'toast undo-toast';
      undoToastEl.innerHTML = `<span class="undo-msg"></span><button type="button" class="undo-btn">${ic('undo',15)} Deshacer</button>`;
      document.body.appendChild(undoToastEl);
    }
    undoToastEl.querySelector('.undo-msg').textContent = msg;
    const btn = undoToastEl.querySelector('.undo-btn');
    const freshBtn = btn.cloneNode(true); // evita acumular listeners de deshaces anteriores
    btn.replaceWith(freshBtn);
    freshBtn.onclick = async ()=>{
      undoToastEl.classList.remove('show');
      clearTimeout(undoToastTimer);
      await onUndo();
    };
    undoToastEl.classList.remove('show');
    void undoToastEl.offsetWidth;
    undoToastEl.classList.add('show');
    clearTimeout(undoToastTimer);
    undoToastTimer = setTimeout(()=> undoToastEl.classList.remove('show'), 5000);
  }


  /* ---------- confirmación en el propio estilo de la app (sustituye a confirm()) ---------- */
  function confirmSheet(title, message, confirmLabel, onConfirm, danger){
    openOverlay(`<h3>${title}</h3><p style="color:var(--ink-soft);font-size:13px;line-height:1.5;margin:0 0 4px;">${message}</p>
      <div class="sheet-actions">
        <button class="ghost-btn" id="confirmCancelBtn">Cancelar</button>
        <button class="${danger?'danger-btn':'primary-btn'} glass-tap" id="confirmOkBtn" style="margin-top:0;">${confirmLabel}</button>
      </div>`);
    sheetBody.querySelector('#confirmCancelBtn').onclick = closeOverlay;
    sheetBody.querySelector('#confirmOkBtn').onclick = ()=>{ closeOverlay(); onConfirm(); };
  }

  function now(){ return new Date(); }
  function sameMonth(ts,ref){ ref = ref||now(); const d=new Date(ts); return d.getFullYear()===ref.getFullYear() && d.getMonth()===ref.getMonth(); }
  function sameYear(ts){ return new Date(ts).getFullYear() === now().getFullYear(); }
  function fmtDateTime(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('es-ES',{day:'2-digit',month:'short'}) + ' · ' + d.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
  }
  function accountMeta(acc){
    if(ACCOUNTS[acc]) return ACCOUNTS[acc];
    const w = state.wallets.find(x=>x.id===acc);
    if(w) return {label:w.name, icon:w.icon};
    if(acc && acc.startsWith('nomina:')){
      const n = (state.nominas || []).find(x=>'nomina:' + x.id === acc);
      return n ? {label:n.name, icon:n.icon || 'bank'} : {label:'Nómina', icon:'bank'};
    }
    if(acc && acc.startsWith('platform:')){
      const id = acc.slice(9);
      const p = state.platforms.find(x=>x.id===id);
      return p ? {label:p.name, icon:p.icon} : {label:'Neo banco', icon:'card'};
    }
    return {label:acc, icon:'coin'};
  }

  /* Una salida es inversión si viene de una suscripción de tipo inversión o si
     se apuntó directamente en la categoría Inversión. */
  function txEsInversion(t){
    if(!t || t.kind !== 'gasto' || t.transfer) return false;
    if(t.subId){
      const sub = state.subscriptions.find(x=>x.id === t.subId);
      if(sub) return sub.kind === 'inversion';
    }
    return t.category === 'Inversión';
  }
  /* Etiqueta que se ve en cada fila de Movimientos. */
  function txTipo(t){
    if(t.transfer) return {key:'transfer', label:'Transferencia'};
    if(txEsInversion(t)) return {key:'inversion', label:'Inversión'};
    if(t.subId) return {key:'pago', label:'Pago recurrente'};
    return t.kind === 'ingreso' ? {key:'ingreso', label:'Ingreso'} : {key:'gasto', label:'Gasto'};
  }

  /* Las transferencias mueven saldo pero no son gasto ni ingreso reales, así que
     cuentan para el saldo y se quedan fuera de todos los análisis. */
  function computeStatsBanco(ref, accId){
    const acc = accId || 'banco';
    const salary = salaryForMonth(ref, acc);
    const txMes = state.transactions.filter(t => sameMonth(t.ts, ref) && t.account===acc);
    const salidasTodas = txMes.filter(t=>t.kind==='gasto').reduce((s,t)=>s+t.amount,0);
    const entradasTodas = txMes.filter(t=>t.kind==='ingreso').reduce((s,t)=>s+t.amount,0);
    const gastoMes = txMes.filter(t=>t.kind==='gasto' && !t.transfer).reduce((s,t)=>s+t.amount,0);
    const ingresoMes = txMes.filter(t=>t.kind==='ingreso' && !t.transfer).reduce((s,t)=>s+t.amount,0);
    const gastoAnio = state.transactions.filter(t=>sameYear(t.ts) && t.account===acc && t.kind==='gasto' && !t.transfer).reduce((s,t)=>s+t.amount,0);
    const saldo = +(salary + entradasTodas - salidasTodas).toFixed(2);
    const porCategoria = {}, porCategoriaIngreso = {};
    txMes.forEach(t=>{
      if(t.transfer) return;
      if(t.kind==='gasto') porCategoria[t.category] = (porCategoria[t.category]||0) + t.amount;
      else porCategoriaIngreso[t.category] = (porCategoriaIngreso[t.category]||0) + t.amount;
    });
    return {salary, gastoMes, ingresoMes, gastoAnio, saldo, porCategoria, porCategoriaIngreso};
  }

  /* ============ SUSCRIPCIONES: núcleo ============ */
  const CYCLES = {
    semanal:   {label:'Semanal',    short:'/sem',  days:7, months:0, perYear:52},
    quincenal: {label:'Quincenal',  short:'/15d',  days:14,months:0, perYear:26},
    mensual:   {label:'Mensual',    short:'/mes',  days:0, months:1, perYear:12},
    bimestral: {label:'Bimestral',  short:'/2m',   days:0, months:2, perYear:6},
    trimestral:{label:'Trimestral', short:'/3m',   days:0, months:3, perYear:4},
    semestral: {label:'Semestral',  short:'/6m',   days:0, months:6, perYear:2},
    anual:     {label:'Anual',      short:'/año',  days:0, months:12,perYear:1},
    /* El pago puntual no es un ritmo: es una sola fecha. Se cobra una vez y se
       acabó. Por eso nunca se adelanta, nunca se cobra solo —al llegar el día
       pregunta qué hacer— y, una vez pagado, el bloque sale de la lista
       dejando su movimiento en el historial. */
    puntual:   {label:'Pago puntual', short:'una vez', days:0, months:0, perYear:1, unico:true},
  };
  const CYCLE_KEYS = Object.keys(CYCLES);
  function cycleOf(k){ return CYCLES[k] || CYCLES.mensual; }
  function subPuntual(sub){ return !!sub && sub.cycle === 'puntual'; }
  function startOfDay(ts){ const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }
  function daysUntil(ts){ return Math.round((startOfDay(ts) - startOfDay(Date.now())) / 86400000); }
  /* Avanza una fecha un ciclo. `anchorDay` es el día de cobro original: si cobras
     el 31 y pasas por febrero, el mes siguiente vuelve al 31 en vez de quedarse
     anclado al 28 para siempre. */
  function advanceDate(ts, cycleKey, anchorDay){
    const c = cycleOf(cycleKey);
    const d = new Date(ts);
    /* Un pago puntual no tiene "siguiente": su fecha es la única que hay. Se
       devuelve tal cual para que ningún bucle que adelante ciclos se quede
       dando vueltas sin avanzar. */
    if(c.unico) return ts;
    if(c.days){ d.setDate(d.getDate() + c.days); return d.getTime(); }
    const day = anchorDay || d.getDate();
    d.setDate(1);
    d.setMonth(d.getMonth() + c.months);
    const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return d.getTime();
  }
  function subAdvance(sub, ts){ return advanceDate(ts != null ? ts : sub.nextTs, sub.cycle, sub.anchorDay); }
  /* Un pago puntual no tiene coste recurrente: pasa una vez y se acaba. Meterlo
     en el "cuánto me cuesta al mes" inflaría esa cifra con algo que no se
     repite, así que cuenta cero. */
  function subMonthlyCost(sub){ return subPuntual(sub) ? 0 : sub.amount * cycleOf(sub.cycle).perYear / 12; }
  function subYearlyCost(sub){ return subPuntual(sub) ? sub.amount : sub.amount * cycleOf(sub.cycle).perYear; }
  /* Cuánto llevas pagado ya en esta suscripción desde que la creaste. */
  function subHistory(sub){
    const txs = state.transactions.filter(t=>t.subId === sub.id && t.kind === 'gasto');
    return { count: txs.length, total: +txs.reduce((s,t)=>s+t.amount,0).toFixed(2) };
  }
  function activeSubs(){ return state.subscriptions.filter(s=>s.active !== false); }
  function subsSorted(){
    return state.subscriptions.slice().sort((a,b)=>{
      const aa = a.active===false, bb = b.active===false;
      if(aa !== bb) return aa ? 1 : -1;
      return a.nextTs - b.nextTs;
    });
  }
  function subTotals(){
    const list = activeSubs();
    const mesGasto = list.filter(s=>s.kind!=='inversion').reduce((s,x)=>s+subMonthlyCost(x),0);
    const mesInv   = list.filter(s=>s.kind==='inversion').reduce((s,x)=>s+subMonthlyCost(x),0);
    return {
      mesGasto:+mesGasto.toFixed(2), mesInv:+mesInv.toFixed(2),
      mes:+(mesGasto+mesInv).toFixed(2), anio:+((mesGasto+mesInv)*12).toFixed(2),
      count:list.length,
      pctSueldo: salaryForMonth()>0 ? Math.round(((mesGasto+mesInv)/salaryForMonth())*100) : 0,
    };
  }
  /* ---- Las suscripciones dentro del tramo de tiempo elegido ----
     Tres cajones: lo que ya se ha pagado dentro del tramo (sale del historial
     de movimientos, no de una estimación), lo que venció y sigue sin pagarse, y
     lo que va a tocar en un tramo igual de largo hacia delante. */
  /* La categoría con la que una suscripción o inversión entra en la rueda. La
     inversión apunta sus movimientos siempre como "Inversión", así que el tipo
     de aportación real (Ahorro, Plan de pensiones) hay que leerlo de la ficha. */
  function subCategoria(sub){
    if(!sub) return 'Otros gastos';
    if(sub.kind === 'inversion') return sub.category || 'Inversión';
    return sub.category || sub.name || 'Otros gastos';
  }
  /* Reparte una lista de importes en las dos mitades de la rueda —lo que es
     suscripción por un lado y lo que es inversión por otro, sin mezclarse
     nunca— y dentro de cada mitad junta por categoría. */
  function srGrupos(filas){
    const cajas = {sub:{}, inv:{}};
    filas.forEach(f=>{
      if(!(f.amount > 0)) return;
      const caja = cajas[f.inv ? 'inv' : 'sub'];
      const c = caja[f.cat] || (caja[f.cat] = {label:f.cat, amount:0});
      c.amount += f.amount;
    });
    const lista = obj => separaTonos(Object.keys(obj).map(k=>{
        const x = obj[k], info = catInfo(x.label, 'gasto');
        return {label:x.label, amount:+x.amount.toFixed(2), hex:info.hex, icon:info.icon};
      }).filter(x=>x.amount > 0.005).sort((a,b)=>b.amount-a.amount));
    const subs = lista(cajas.sub), invs = lista(cajas.inv);
    separaJunta(subs, invs);
    const suma = l => +l.reduce((s,x)=>s+x.amount,0).toFixed(2);
    const tSub = suma(subs), tInv = suma(invs);
    return {subs, invs, totalSub:tSub, totalInv:tInv, total:+(tSub+tInv).toFixed(2)};
  }
  function subsRango(r){
    const ahora = now().getTime();
    const porSub = {};
    const filasHechas = [];
    state.transactions.forEach(t=>{
      if(!t.subId || t.kind !== 'gasto') return;
      if(t.ts < r.from || t.ts > r.to) return;
      const c = porSub[t.subId] || (porSub[t.subId] = {count:0, total:0});
      c.count++; c.total += t.amount;
      /* La comisión del bróker va en su propia porción: es un coste de la
         operación, no dinero invertido, y así se ve por separado. */
      const sub = state.subscriptions.find(x=>x.id === t.subId);
      const esInv = sub ? sub.kind === 'inversion' : txEsInversion(t);
      filasHechas.push({
        inv: esInv,
        cat: t.category === 'Comisión' ? 'Comisión' : (sub ? subCategoria(sub) : (t.category || 'Otros gastos')),
        amount: t.amount,
      });
    });
    Object.keys(porSub).forEach(k=>{ porSub[k].total = +porSub[k].total.toFixed(2); });
    const vivas = activeSubs();
    /* Pendiente es lo que venció y sigue sin pagarse, pero solo si venció
       dentro del tramo que estás mirando: con "Sem" no tiene sentido sacar un
       recibo que se quedó a medias hace cuatro meses. */
    const pendientes = vivas.filter(s=>subVencida(s) && s.nextTs >= r.from);
    /* ---- La ventana de futuro ----
       Mide lo que dura el tramo elegido, no lo que llevamos de él. Antes se
       calculaba restando "desde" a "ahora", y eso en un día 3 dejaba el mes en
       dos días de futuro: una cita del día 8 no salía por ninguna parte. Se
       mira la duración nominal del periodo, con tope de un año para que "Todo"
       no se convierta en una lista sin fin. */
    const ANCHO_PERIODO = {sem:7, mes:31, '90d':90, anio:366, todo:366};
    const ancho = (ANCHO_PERIODO[r.id] || 31) * 86400000;
    const hasta = ahora + ancho;
    /* Solo el siguiente cobro de cada bloque, no todos los que caben en la
       ventana: la rueda contesta a "cuánto tengo pendiente de pagar ahora
       mismo", no a "cuánto me voy a gastar en un año". */
    const futuros = vivas.filter(s=>!subLibre(s) && !subCompletada(s) && s.nextTs > ahora && s.nextTs <= hasta);
    const suma = l => +l.reduce((s,x)=>s+(x.amount||0),0).toFixed(2);
    const filasDe = lista => lista.map(s=>({
      inv: s.kind === 'inversion', cat: subCategoria(s), amount: s.amount || 0,
    }));
    const claves = Object.keys(porSub);
    const pagos = claves.reduce((s,k)=>s+porSub[k].count,0);
    const realizado = +claves.reduce((s,k)=>s+porSub[k].total,0).toFixed(2);
    const diasFuturo = Math.max(Math.round(ancho/86400000), 1);
    const textoTramo = tramoFrase(r);
    /* Quién "es de este tramo": el que movió dinero dentro, el que venció sin
       pagarse dentro y el que toca pagar en el tramo equivalente hacia
       delante. Con esto se filtran las listas de abajo. */
    const enTramo = new Set(claves);
    pendientes.forEach(s=>enTramo.add(s.id));
    futuros.forEach(s=>enTramo.add(s.id));
    /* Los tres estados, cada uno con su propia rueda y sus propias barras. El
       selector de tiempo manda sobre los tres: hacia atrás en lo ya pagado y en
       lo vencido, y hacia delante, en un tramo igual de largo, en lo futuro. */
    const estados = [
      {key:'realizado', label:'Pagos realizados', hex:'#248A3D', icon:'check',
       cifra:'Pagado', nota:'ya cobrados y apuntados', total:realizado,
       cuenta:pagos, unidad:'pago', grupos:srGrupos(filasHechas),
       vacio:'Ningún pago registrado ' + textoTramo + '.'},
      {key:'pendiente', label:'Pagos pendientes', hex:'#FF3B30', icon:'warning',
       cifra:'Pendiente', nota:'vencidos y sin pagar', total:suma(pendientes),
       cuenta:pendientes.length, unidad:'recibo', grupos:srGrupos(filasDe(pendientes)),
       vacio:'Nada vencido sin pagar ' + textoTramo + '. Al día.'},
      /* El rótulo decía "próximos N días" pero la cifra solo suma un cobro por
         bloque, no todos los que caben en N días. Ahora dice lo que hace. */
      {key:'futuro', label:'Pagos futuros', hex:'#0A84FF', icon:'calendar',
       cifra:'Por pagar', nota:'el siguiente cobro de cada bloque', total:suma(futuros),
       cuenta:futuros.length, unidad:'cobro', grupos:srGrupos(filasDe(futuros)),
       vacio:'No tienes ningún cobro a la vista en los próximos ' + diasFuturo + ' días.'},
    ];
    return {
      porSub, pagos, realizado,
      pendientes, futuros, estados,
      totalPendiente: suma(pendientes), totalFuturo: suma(futuros),
      enTramo, enTexto: textoTramo,
      hasta, rango:r,
    };
  }
  /* Progreso dentro del ciclo actual (0 = acaba de pagarse, 1 = toca pagar ya). */
  function subCycleProgress(sub){
    const prev = sub.lastChargedTs || subPrevDate(sub);
    const span = sub.nextTs - prev;
    if(!(span > 0)) return 1;
    return clamp01((Date.now() - prev) / span);
  }
  function subPrevDate(sub){
    const c = cycleOf(sub.cycle);
    const d = new Date(sub.nextTs);
    if(c.days){ d.setDate(d.getDate() - c.days); return d.getTime(); }
    const day = sub.anchorDay || d.getDate();
    d.setDate(1); d.setMonth(d.getMonth() - c.months);
    const lastDay = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
    d.setDate(Math.min(day, lastDay));
    return d.getTime();
  }
  /* Una aportación sin fecha no corre prisa nunca: ni vence ni avisa. */
  function subLibre(sub){ return !!sub.indefinido; }
  function subVencida(sub){
    if(subLibre(sub) || sub.done) return false;
    return startOfDay(sub.nextTs) <= startOfDay(now().getTime());
  }
  /* Un pago puntual ya cobrado: sigue en la lista para que veas lo que costó,
     pero ya no vence, ni se cobra, ni cuenta como pago futuro. */
  function subCompletada(sub){ return !!(sub && sub.done); }
  function subUrgency(sub){
    if(subLibre(sub)) return 'libre';
    const d = daysUntil(sub.nextTs);
    if(d <= 0) return 'due';
    if(d <= 3) return 'soon';
    if(d <= 7) return 'near';
    return 'ok';
  }
  function fmtDateShort(ts){
    return new Date(ts).toLocaleDateString('es-ES',{day:'2-digit', month:'short'});
  }

  /* Registra el cobro real: sale el dinero de la cuenta de la que se paga y, si
     es una inversión, se apunta además qué se compró y lo que costó la operación. */
  function registerSubscriptionPayment(sub, ts){
    const acc = sub.account || 'banco';
    const amount = sub.amount;
    const esInv = sub.kind === 'inversion';
    const cat = esInv ? 'Inversión' : (sub.category || sub.name);
    const uid = ()=> 'sub' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
    adjustAccount(acc, -amount);
    const mov = {
      id: uid(), ts, account: acc, kind:'gasto', category: cat,
      description: sub.name,
      note: esInv ? 'Aportación periódica' : 'Suscripción',
      amount, remaining: esInv ? 0 : amount, compensated: esInv, subId: sub.id,
    };
    /* La inversión guarda de qué era y cuánto se compró, igual que cuando la
       registras a mano desde el neo banco. Ese dinero no se pierde: sigue en la
       cuenta, pero deja de poder gastarse. */
    if(esInv){
      mov.invType = sub.invType || 'otro';
      mov.invLabel = sub.invLabel || 'Inversión';
      mov.units = sub.units || null;
      mov.fee = sub.fee || 0;
    }
    state.transactions.push(mov);
    /* Lo que se lleva el bróker sí es un gasto de verdad, y va aparte. */
    if(esInv && sub.fee > 0){
      adjustAccount(acc, -sub.fee);
      state.transactions.push({
        id: uid(), ts: ts + 1, account: acc, kind:'gasto', category:'Comisión',
        description: 'Coste de la operación · ' + (sub.invLabel || sub.name),
        note: sub.note || '', amount: +Number(sub.fee).toFixed(2),
        remaining: +Number(sub.fee).toFixed(2), compensated:false, subId: sub.id,
      });
    }
  }
  /* Al abrir la app, cobra automáticamente lo que haya vencido mientras no estaba abierta. */
  async function processDueSubscriptions(){
    let charged = 0, guard = 0;
    const today = startOfDay(Date.now());
    state.subscriptions.forEach(sub=>{
      /* El pago puntual nunca se cobra solo: al llegar el día te pregunta. */
      if(subLibre(sub) || subPuntual(sub) || sub.active === false || sub.autoCharge === false) return;
      while(startOfDay(sub.nextTs) <= today && guard++ < 400){
        registerSubscriptionPayment(sub, sub.nextTs);
        sub.lastChargedTs = sub.nextTs;
        sub.nextTs = subAdvance(sub);
        charged++;
      }
    });
    if(charged) await saveState();
    return charged;
  }

  /* ============ SVG helpers ============ */
  let svgUidCounter = 0;
  function shadeHex(hex, amt){
    hex = String(hex).replace('#','');
    if(hex.length===3) hex = hex.split('').map(c=>c+c).join('');
    const num = parseInt(hex,16);
    if(isNaN(num)) return hex;
    let r = (num>>16)+amt, g = ((num>>8)&0xff)+amt, b = (num&0xff)+amt;
    r = Math.max(0,Math.min(255,r)); g = Math.max(0,Math.min(255,g)); b = Math.max(0,Math.min(255,b));
    return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
  }
  /* Segmentos con volumen limpio: un degradado suave de luz a sombra y un filo
     claro arriba. Menos brillo de plástico, más nitidez. */
  /* ---- Icono encapsulado o "montañita" en cada trozo de un aro ----
     `segs`: [{mid, span, hex, icon}] en grados, en sentido horario desde arriba.
     Trozo con sitio: el color se ensancha en un círculo que abraza una chapita
     blanca con el icono. Trozo pequeño: un bultito hacia fuera, más pequeño
     cuanto más pequeño es el trozo. */
  const SEG_MIN_ICONO = 32;
  function segDecor(cx, cy, r, stroke, segs, opts){
    opts = opts || {};
    const maxBump = opts.maxBump || 9;
    const polar = (deg, rad)=>{ const a = (deg - 90) * Math.PI / 180; return [cx + rad*Math.cos(a), cy + rad*Math.sin(a)]; };
    let out = '';
    segs.forEach((g,i)=>{
      const d = (i*60 + (opts.delay || 380)) + 'ms';
      const icon = ICON_PATHS[g.icon] ? g.icon : 'coin';
      if(g.span >= SEG_MIN_ICONO){
        const [x, y] = polar(g.mid, r);
        const R = Math.max(stroke * 0.62, 8);          /* chapita blanca */
        const C = R + Math.max(stroke * 0.24, 3);       /* el color que la abraza */
        const sz = R * 1.25;
        out += `<g class="dseg-ico" style="--d:${d}">
          <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${C.toFixed(1)}" fill="${g.hex}"/>
          <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R.toFixed(1)}" fill="#fff"/>
          <svg x="${(x-sz/2).toFixed(1)}" y="${(y-sz/2).toFixed(1)}" width="${sz.toFixed(1)}" height="${sz.toFixed(1)}" viewBox="0 0 24 24" fill="none" stroke="#1C1C1E" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">${ICON_PATHS[icon]}</svg></g>`;
      } else if(g.span > 0.5){
        const h = 2.5 + Math.min(g.span / SEG_MIN_ICONO, 1) * (maxBump - 2.5);
        const base = r + stroke/2 - 0.5;
        const ext = Math.max(g.span, 6) / 2 + 3;
        let p = '';
        for(let k=0;k<=12;k++){
          const t = k/12, ang = g.mid - ext + 2*ext*t;
          const [px, py] = polar(ang, base + h * Math.pow(Math.sin(Math.PI*t), 1.6));
          p += (k ? ' L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1);
        }
        out += `<path class="dseg-bump" style="--d:${d}" d="${p} Z" fill="${g.hex}"/>`;
      }
    });
    return out;
  }
  function ringArcs(cx,cy,r,stroke,entries,total,extra,uid,trackAlpha,gapUnits){
    const c = 2*Math.PI*r;
    const gap = gapUnits == null ? 0 : gapUnits;
    let defs = '';
    let segs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(20,23,20,${trackAlpha==null?'.10':trackAlpha})" stroke-width="${stroke}"/>`;
    const list = entries.slice().filter(e=>e.amount > 0);
    if(extra && extra.amount > 0) list.push(extra);
    /* Se aparta primero el espacio de los huecos y el mínimo visible de cada
       trozo; el resto se reparte proporcionalmente. Así ninguna categoría, por
       pequeña que sea, se queda fuera del círculo. */
    const minArc = Math.min(5, c / Math.max(list.length * 2, 1));
    const gapsTotal = gap ? list.filter(e=>e.gapBefore).length * gap : 0;
    const usable = Math.max(c - gapsTotal - minArc * list.length, 1);
    const sum = list.reduce((s,e)=>s+e.amount, 0) || 1;
    const scaleTotal = Math.max(total, sum);
    let offset = 0;
    /* ---- Iconos dentro de los trozos y "montañitas" ----
       Un trozo con sitio de sobra lleva su icono encima, en una chapita
       blanca. Los que son demasiado pequeños para un icono sacan un bultito
       hacia fuera del aro: cuanto más pequeño el trozo, más pequeño el bulto. */
    const decor = [];
    if(total > 0){
      list.forEach((e,i)=>{
        const len = minArc + (e.amount / scaleTotal) * usable;
        offset += (e.gapBefore ? gap : 0);
        const draw = Math.max(len - (gap ? gap*0.45 : 1.2), 1.6);
        const span = draw / c * 360;
        decor.push({mid: offset / c * 360 + span/2, span, hex:e.hex, icon:e.icon});
        const gradId = `dg${uid}_${r}_${i}`;
        defs += `<linearGradient id="${gradId}" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0%" stop-color="${shadeHex(e.hex,34)}"/>
          <stop offset="55%" stop-color="${e.hex}"/>
          <stop offset="100%" stop-color="${shadeHex(e.hex,-30)}"/>
        </linearGradient>`;
        /* `key` permite que el desglose de abajo señale su trozo en la rueda. */
        segs += `<circle class="dseg" ${e.key ? `data-pcid="${escapeHTML(e.key)}"` : ''} cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#${gradId})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${draw} ${c-draw}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})"/>`;
        offset += len;
      });
    }
    ringArcs.overlay = segDecor(cx, cy, r, stroke, decor);
    return defs + segs;
  }
  function donutSVG(entries, total, extra){
    const size=128, stroke=15, r=(size-stroke)/2, cx=size/2, cy=size/2;
    const uid = ++svgUidCounter;
    const arcos = ringArcs(cx,cy,r,stroke,entries,total,extra,uid);
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="overflow:visible;">
      <defs>
        <filter id="dsh${uid}" x="-60%" y="-60%" width="220%" height="220%">
          <feDropShadow dx="0" dy="6" stdDeviation="5.5" flood-color="#1c1c1e" flood-opacity="0.34"/>
        </filter>
        <radialGradient id="dsn${uid}" cx="30%" cy="22%" r="62%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
          <stop offset="50%" stop-color="#ffffff" stop-opacity="0.10"/>
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="dao${uid}" cx="74%" cy="80%" r="60%">
          <stop offset="0%" stop-color="#000000" stop-opacity="0.30"/>
          <stop offset="60%" stop-color="#000000" stop-opacity="0.06"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <g filter="url(#dsh${uid})">${arcos}</g>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#dao${uid})" stroke-width="${stroke}" style="mix-blend-mode:multiply;pointer-events:none;"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="url(#dsn${uid})" stroke-width="${stroke}" style="mix-blend-mode:overlay;pointer-events:none;"/>
      <g class="dseg-over" style="pointer-events:none;">${ringArcs.overlay || ''}</g>
    </svg>`;
  }

  /* Suaviza la línea con curvas, en vez de picos rectos. */
  /* Línea recta de un punto a otro, estilo Trade Republic. Antes se trazaba
     con curvas Bézier que sobrepasaban los puntos y formaban bultos y lazos
     raros cuando el gasto subía o bajaba de golpe. Una polilínea recta no
     inventa valores entre dos días: solo une lo que de verdad pasó. */
  function smoothPath(pts){
    if(pts.length < 2) return pts.length ? `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)} l0.01,0` : '';
    let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
    for(let i = 1; i < pts.length; i++){
      d += ` L${pts[i].x.toFixed(1)},${pts[i].y.toFixed(1)}`;
    }
    return d;
  }

  /* ============ PATRIMONIO ============ */
  function patrimonioTotal(){
    const stats = computeStatsBanco();
    return +((state.initialAmount || 0) + stats.saldo
      + state.wallets.reduce((s,w)=>s+w.balance,0)
      + state.platforms.reduce((s,p)=>s+p.balance,0)
      + (state.nominas || []).reduce((s,n)=>s+computeStatsBanco(undefined, 'nomina:' + n.id).saldo,0)
      + invertidoTotal()).toFixed(2);
  }
  /* ---- DINERO TOTAL CONSOLIDADO ----
     Todo el dinero que has manejado se parte en dos mitades que no se solapan:
     lo que ya se ha gastado y lo que todavía conservas. La suma de las dos es el
     Capital Total Inicial, y de ahí sale la resta:
        Capital Total Inicial - Gastos Totales = Balance                      */
  function consolidadoData(){
    const subById = {};
    state.subscriptions.forEach(x=>{ subById[x.id] = x; });
    const porCategoria = {};
    let gastosTotales = 0, inversionTotal = 0;
    /* Lo invertido no es gasto: es capital que ya no se puede tocar, así que
       sale de esta mitad y entra en la otra. */
    state.transactions.forEach(t=>{
      if(t.transfer || t.kind !== 'gasto') return;
      if(txEsInversion(t)){ inversionTotal += t.amount; return; }
      gastosTotales += t.amount;
      const label = t.category || 'Otros gastos';
      porCategoria[label] = (porCategoria[label] || 0) + t.amount;
    });
    gastosTotales = +gastosTotales.toFixed(2);
    inversionTotal = +inversionTotal.toFixed(2);

    /* Lo que todavía conservas, apartado por apartado. Cada cuenta aporta su
       disponible y la inversión va como un trozo propio, intocable. */
    const statsBanco = computeStatsBanco();
    const capitalPartes = [];
    const base = state.initialAmount || 0;
    if(base > 0) capitalPartes.push({id:'__base__', label:'Saldo inicial', hex:'#8E8E93', icon:'archive', amount:+base.toFixed(2), raw:+base.toFixed(2)});
    allAccounts().forEach(a=>{
      const v = a.id === 'banco' ? statsBanco.saldo : accountBalance(a.id);
      capitalPartes.push({id:a.id, label:a.name, hex:a.hex, icon:a.icon,
        amount:+Math.max(v,0).toFixed(2), raw:+v.toFixed(2)});
    });
    if(inversionTotal > 0) capitalPartes.push({id:'__inv__', label:'Inversión', hex:'#0A84FF',
      icon:'trending', amount:inversionTotal, raw:inversionTotal});
    const capitalTotal = patrimonioTotal();

    const gastoPartes = Object.entries(porCategoria)
      .map(([label,amount])=>({id:'cat:'+label, label, hex:catInfo(label,'gasto').hex,
        icon:catInfo(label,'gasto').icon, amount:+amount.toFixed(2), raw:+amount.toFixed(2)}))
      .sort((a,b)=>b.amount-a.amount);

    const capitalInicial = +(capitalTotal + gastosTotales).toFixed(2);
    /* C.T.I = Capital Total Inicial: el máximo dinero total que has llegado a
       manejar. Nunca baja, aunque el dinero de hoy sí cambie. */
    const cti = +Math.max(capitalInicial, state.ctiPeak || 0).toFixed(2);
    if(cti > (state.ctiPeak || 0)) state.ctiPeak = cti;
    const balance = +(cti - gastosTotales).toFixed(2);
    return {
      gastoPartes, capitalPartes,
      gastosTotales, capitalTotal, capitalInicial, cti, balance,
      inversionTotal,
    };
  }

  /* ---- RUEDA ANOTADA ----
     La rueda se parte por arriba: a la izquierda crece la liquidez que ya se ha
     ido y a la derecha el capital que conservas. De cada trozo sale una línea
     hasta su nombre, con el porcentaje que ocupa dentro del total. */
  function adPolar(cx, cy, r, deg){
    const a = deg * Math.PI / 180;
    return {x: cx + r*Math.cos(a), y: cy + r*Math.sin(a)};
  }
  function adArc(cx, cy, r, a0, a1){
    const p0 = adPolar(cx,cy,r,a0), p1 = adPolar(cx,cy,r,a1);
    const large = Math.abs(a1-a0) > 180 ? 1 : 0;
    const sweep = a1 > a0 ? 1 : 0;
    return `M${p0.x.toFixed(2)},${p0.y.toFixed(2)} A${r},${r} 0 ${large} ${sweep} ${p1.x.toFixed(2)},${p1.y.toFixed(2)}`;
  }
  /* ---- Reparto vertical de las etiquetas de un lado ----
     Cada nombre quiere estar a la altura por la que sale su trozo, pero dos
     nombres no pueden pisarse. El reparto anterior hacía dos pasadas, una
     empujando hacia abajo y otra hacia arriba, y cuando había más nombres que
     espacio la segunda deshacía lo de la primera y se amontonaban.

     Este junta los que se pisan en un bloque y centra el bloque entero en la
     media de donde querían estar. Al no haber dos pasadas no puede anularse a
     sí mismo, y el hueco mínimo queda garantizado siempre. Como además el
     orden de las alturas es el mismo que el de los ángulos, las líneas guía
     salen ordenadas y no se cruzan entre ellas. */
  function adReparte(ideales, minY, gap){
    const n = ideales.length;
    if(!n) return [];
    /* Se le descuenta a cada uno el hueco que le toca: así el problema se
       reduce a dejar la lista creciente moviéndola lo menos posible. */
    const t = ideales.map((y,i)=> y - i*gap);
    const bloques = [];
    for(let i=0;i<n;i++){
      const b = {suma:t[i], n:1};
      while(bloques.length && (bloques[bloques.length-1].suma/bloques[bloques.length-1].n) > (b.suma/b.n)){
        const p = bloques.pop(); b.suma += p.suma; b.n += p.n;
      }
      bloques.push(b);
    }
    const planas = [];
    bloques.forEach(b=>{ const v = b.suma/b.n; for(let i=0;i<b.n;i++) planas.push(v); });
    const ys = planas.map((v,i)=> v + i*gap);
    const desfase = ys[0] < minY ? minY - ys[0] : 0;
    return ys.map(y=> y + desfase);
  }
  /* Mide el ancho de verdad del texto en vez de calcularlo a ojo con
     (letras+5)*5,5, que fallaba con nombres de letras anchas y dejaba que la
     etiqueta se saliera del recuadro. */
  let adMedidor = null;
  function adAncho(txt, px, peso){
    txt = String(txt);
    try{
      if(!adMedidor) adMedidor = document.createElement('canvas').getContext('2d');
      if(adMedidor){
        const fam = getComputedStyle(document.body).fontFamily || 'system-ui, sans-serif';
        adMedidor.font = (peso || 600) + ' ' + px + 'px ' + fam;
        const w = adMedidor.measureText(txt).width;
        if(w > 0) return w;
      }
    }catch(e){ /* sin canvas se vuelve a la estimación de siempre */ }
    return txt.length * px * 0.56;
  }
  /* Recorta un texto hasta que quepa en el ancho que le queda. */
  function adCabe(txt, ancho, px, peso){
    txt = String(txt);
    if(adAncho(txt, px, peso) <= ancho) return txt;
    let lo = 1, hi = txt.length;
    while(lo < hi){
      const m = Math.ceil((lo+hi)/2);
      if(adAncho(txt.slice(0,m) + '…', px, peso) <= ancho) lo = m; else hi = m-1;
    }
    return txt.slice(0, Math.max(lo,1)) + '…';
  }
  /* El nombre del centro se parte en dos líneas cortas para que quepa en el
     hueco de la rueda por largo que sea. */
  function adCenterLines(txt){
    const MAX = 13;
    const palabras = String(txt).toUpperCase().split(' ');
    const lineas = [];
    palabras.forEach(w=>{
      const ult = lineas[lineas.length-1];
      if(ult != null && (ult + ' ' + w).length <= MAX) lineas[lineas.length-1] = ult + ' ' + w;
      else lineas.push(w.length > MAX ? w.slice(0,MAX-1)+'…' : w);
    });
    if(lineas.length > 2){
      const resto = lineas.slice(1).join(' ');
      lineas.length = 1;
      lineas.push(resto.length > MAX ? resto.slice(0,MAX-1)+'…' : resto);
    }
    return lineas;
  }
  /* Los colores muy claros (plata, cian pálido) se oscurecen solo para el
     texto: en el círculo se ven bien, pero escritos no se leerían. */
  function adReadable(hex){
    let h = String(hex).replace('#','');
    if(h.length===3) h = h.split('').map(c=>c+c).join('');
    const n = parseInt(h,16);
    if(isNaN(n)) return hex;
    const lum = (0.2126*((n>>16)&255) + 0.7152*((n>>8)&255) + 0.0722*(n&255))/255;
    if(lum <= 0.56) return '#'+h;
    return shadeHex('#'+h, -Math.round((lum-0.56)*255*1.25));
  }
  /* Reparte un descubierto entre las partes positivas, empezando por la mayor,
     para que la suma de los trozos cuadre con el total del grupo. */
  function adNeto(partes, objetivo){
    const pos = partes.filter(p=>p.amount > 0).map(p=>Object.assign({}, p));
    const suma = pos.reduce((s,p)=>s+p.amount, 0);
    let exceso = +(suma - Math.max(objetivo, 0)).toFixed(2);
    if(exceso <= 0.005) return pos;
    pos.sort((a,b)=>b.amount-a.amount);
    for(const p of pos){
      if(exceso <= 0.005) break;
      const quita = Math.min(p.amount, exceso);
      p.amount = +(p.amount - quita).toFixed(2);
      exceso = +(exceso - quita).toFixed(2);
    }
    return pos.filter(p=>p.amount > 0.005);
  }

  function annotatedDonutSVG(groups, total, opts){
    opts = opts || {};
    const uid = ++svgUidCounter;
    const ref = total > 0 ? total : 1;
    const pctTxt = v => { const p = (v/ref)*100; return (Math.round(p*10)/10).toFixed(p >= 10 || p === 0 ? 0 : 1).replace('.', ',') + '%'; };

    const GAP = 3;                      /* hueco entre las dos mitades */
    const MINSPAN = 8;
    const disponible = 360 - GAP*2;

    /* ---- 1. Cuánto abre cada mitad ----
       Aunque una mitad sea diminuta se le reserva un trozo mínimo: si no, un
       gasto pequeño desaparecería del círculo y no habría forma de tocarlo. */
    let spans = groups.map(g => g.total > 0 ? (g.total/ref)*disponible : 0);
    const falta = spans.reduce((s,v,i)=> s + (groups[i].total > 0 && v < MINSPAN ? MINSPAN - v : 0), 0);
    const sobra = spans.reduce((s,v)=> s + (v > MINSPAN ? v - MINSPAN : 0), 0);
    if(falta > 0 && sobra > 0){
      spans = spans.map((v,i)=> groups[i].total <= 0 ? 0
        : (v < MINSPAN ? MINSPAN : v - falta*(v-MINSPAN)/sobra));
    }

    /* ---- 2. El ángulo de cada trozo ----
       Los ángulos no dependen del tamaño del dibujo, así que se sacan primero:
       con ellos ya se sabe cuántos nombres caen a cada lado y, con eso, de qué
       tamaño hace falta el círculo. */
    const trozos = [];
    groups.forEach((g, gi)=>{
      const left = g.side === 'left';
      const dir  = left ? -1 : 1;
      const span = spans[gi];
      const a0   = -90 + dir*(GAP/2);
      g._dir = dir; g._left = left; g._span = span; g._a0 = a0; g._aEnd = a0 + dir*span;
      /* Reparto interno: cada trozo tiene un mínimo visible. */
      const items = g.items.filter(x=>x.amount > 0);
      const sum = items.reduce((s,x)=>s+x.amount, 0) || 1;
      const minDeg = items.length ? Math.min(2.6, span/(items.length*1.6)) : 0;
      const usable = Math.max(span - minDeg*items.length, 0);
      let cum = 0;
      items.forEach(it=>{
        const deg = minDeg + (it.amount/sum)*usable;
        const from = a0 + dir*cum;
        const to   = a0 + dir*(cum + deg);
        trozos.push({it, grupo:g, from, to, mid:(from+to)/2});
        cum += deg;
      });
    });

    /* Cada nombre va al lado por el que DE VERDAD asoma su trozo: el signo de la
       x de su punto en el borde del círculo. Si la x es positiva, el trozo sale
       por la derecha y su nombre va a la derecha; si es negativa, a la izquierda.
       Así la línea que une trozo y nombre nunca tiene que cruzar el círculo para
       llegar al otro lado, que es lo que pasaba cuando una mitad era enorme
       (p. ej. Suscripciones al 86 %): su arco daba la vuelta y algunos trozos
       asomaban por la derecha, pero el nombre se forzaba a la izquierda y la
       línea cruzaba el dibujo entero.

       Antes se reequilibraba el número de nombres de cada lado moviendo los más
       verticales al lado menos lleno; eso es justo lo que provocaba los cruces,
       así que se quita: si un lado queda con más nombres, el círculo crece y los
       reparte en vertical, pero ninguna línea cruza. */
    const norm = a => { let x = a % 360; if(x < -180) x += 360; if(x > 180) x -= 360; return x; };
    trozos.forEach(sg=>{
      sg.a = norm(sg.mid);
      sg.lado = Math.cos(sg.a*Math.PI/180) >= 0 ? 'der' : 'izq';
    });
    const cuenta = l => trozos.filter(t=>t.lado === l).length;

    /* ---- 3. La geometría, que crece con la cantidad de nombres ----
       Cuantos más nombres hay, más grande se hace el círculo: los puntos por
       donde salen las líneas quedan más repartidos y las etiquetas se pisan
       menos. Crece poco a poco y con tope, porque el ancho de la tarjeta no
       cambia y un círculo demasiado grande dejaría a los nombres sin sitio. */
    const W = 410, SW = 24;
    const porLado = Math.max(cuenta('izq'), cuenta('der'));
    const R = Math.round(Math.min(74, Math.max(56, 56 + (porLado - 5)*2.4)));
    const outer = R + SW/2;
    const cx = W/2;
    /* El círculo se sube hasta justo debajo de las cajas de grupo: antes había
       un palmo de espacio muerto ahí arriba que no aprovechaba nadie. */
    const cy = 70 + outer;
    const LX = Math.round(cx - outer - 10), RX = Math.round(cx + outer + 10);
    const FS = 10;                     /* tamaño de los nombres, en unidades del dibujo */
    const SEP = 14;                    /* lo que se separa el texto del círculo */
    const MINY = 76;                   /* por debajo de las cajas de grupo */
    const PASO = 18;                   /* hueco mínimo entre dos nombres */
    const ESP = 2;                     /* la línea arranca pegada al borde */
    let maxLabelY = 0;
    let defs = '', arcs = '', leaders = '', labels = '', brackets = '', zonas = '';

    /* ---- 4. Las dos mitades: zona de color, corchete y caja con el nombre ---- */
    groups.forEach(g=>{
      const span = g._span;
      if(!(span > 0.5)) return;
      const left = g._left, a0 = g._a0, bEnd = g._aEnd;
      const br = outer + 7;
      /* Una zona de color detrás de cada mitad: de un vistazo se ve dónde
         acaba una y dónde empieza la otra. */
      const rz = outer + 21, ri = R - SW/2 - 7;
      const z0 = adPolar(cx,cy,rz,a0),  z1 = adPolar(cx,cy,rz,bEnd);
      const i0 = adPolar(cx,cy,ri,a0),  i1 = adPolar(cx,cy,ri,bEnd);
      const largeZ = span > 180 ? 1 : 0;
      const sw = left ? 0 : 1;
      zonas += `<path class="ad-zone" data-adid="${g.id}" fill="${g.hex}" opacity=".08"
        d="M${z0.x.toFixed(1)},${z0.y.toFixed(1)} A${rz},${rz} 0 ${largeZ} ${sw} ${z1.x.toFixed(1)},${z1.y.toFixed(1)}
           L${i1.x.toFixed(1)},${i1.y.toFixed(1)} A${ri},${ri} 0 ${largeZ} ${1-sw} ${i0.x.toFixed(1)},${i0.y.toFixed(1)} Z"/>`;

      const t0 = adPolar(cx,cy,br,a0), t0b = adPolar(cx,cy,br+6,a0);
      const t1 = adPolar(cx,cy,br,bEnd), t1b = adPolar(cx,cy,br+6,bEnd);
      const chipY = 46;
      const chipX = left ? LX : RX;
      brackets += `<g class="ad-brk" data-adid="${g.id}">
        <path d="${adArc(cx,cy,br,a0,bEnd)}" fill="none" stroke="${g.hex}" stroke-width="2" opacity=".8"/>
        <line x1="${t0.x.toFixed(1)}" y1="${t0.y.toFixed(1)}" x2="${t0b.x.toFixed(1)}" y2="${t0b.y.toFixed(1)}" stroke="${g.hex}" stroke-width="2"/>
        <line x1="${t1.x.toFixed(1)}" y1="${t1.y.toFixed(1)}" x2="${t1b.x.toFixed(1)}" y2="${t1b.y.toFixed(1)}" stroke="${g.hex}" stroke-width="2"/>
        <path d="M${t0b.x.toFixed(1)},${t0b.y.toFixed(1)} L${(left?chipX+18:chipX-18)},${chipY+4} L${chipX},${chipY+4}" fill="none" stroke="${g.hex}" stroke-width="2" opacity=".6"/>
      </g>`;
      const cw = left ? LX : W-RX;
      const nombreG = adCabe(g.label.toUpperCase(), cw-22, 9.5, 800);
      labels += `<g class="ad-glab" data-adid="${g.id}" data-adk="${escapeHTML(g.label)}" data-adv="${fmt(g.total)}" data-adp="${pctTxt(g.total)}">
        <rect class="ad-gbg" x="${left?LX-cw:RX}" y="14" width="${cw}" height="42" rx="12" fill="${g.hex}" opacity=".1"/>
        <text class="ad-gname" x="${left?chipX-10:chipX+10}" y="32" text-anchor="${left?'end':'start'}" fill="${adReadable(g.hex)}">${escapeHTML(nombreG)}</text>
        <text class="ad-gpct" x="${left?chipX-10:chipX+10}" y="50" text-anchor="${left?'end':'start'}" fill="${adReadable(g.hex)}">${pctTxt(g.total)}</text>
      </g>`;
    });

    /* ---- 5. Los trozos del círculo ---- */
    trozos.forEach((sg,i)=>{
      const gid = `dg${uid}_${i}`;
      defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="0.35" y2="1">
        <stop offset="0%" stop-color="${shadeHex(sg.it.hex,34)}"/>
        <stop offset="55%" stop-color="${sg.it.hex}"/>
        <stop offset="100%" stop-color="${shadeHex(sg.it.hex,-30)}"/>
      </linearGradient>`;
      arcs += `<path class="ad-seg" data-adid="${sg.it.adid}" data-adgrp="${sg.grupo.id}" data-adk="${escapeHTML(sg.it.label)}" data-adv="${fmt(sg.it.amount)}" data-adp="${pctTxt(sg.it.amount)}"
         d="${adArc(cx,cy,R,sg.from,sg.to)}" fill="none" stroke="url(#${gid})" stroke-width="${SW}"/>`;
    });

    /* ---- 6. Colocación de los nombres ----
       El ancho de cada texto se mide de verdad, así que el recorte es el justo
       para que quepa entero en su columna y nunca se salga del recuadro. */
    const colLado = LX - SEP - 8;
    const pinta = (sg, x, y, anchor, ancho)=>{
      /* Línea recta del borde del círculo al nombre, sin codo. El codo radial
         que llevaba antes sobresalía lo justo para que la línea larga de un
         vecino lo atravesara, y esos eran los últimos cruces que quedaban. */
      const p1 = adPolar(cx,cy,outer+ESP,sg.mid);
      const dx = anchor === 'end' ? 5 : anchor === 'start' ? -5 : 0;
      const px = x + dx, py = anchor === 'middle' ? y - 9 : y - 3;
      leaders += `<path class="ad-lead" data-adid="${sg.it.adid}" data-adgrp="${sg.grupo.id}"
        d="M${p1.x.toFixed(1)},${p1.y.toFixed(1)} L${px.toFixed(1)},${py.toFixed(1)}"
        fill="none" stroke="${sg.it.hex}" stroke-width="1.3" opacity=".7"/>
        <circle class="ad-lead" data-adid="${sg.it.adid}" data-adgrp="${sg.grupo.id}" cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2" fill="${sg.it.hex}"/>`;
      const hx = anchor === 'end' ? x-ancho+6 : anchor === 'start' ? x-6 : x-ancho/2;
      labels += `<g class="ad-clab" data-adid="${sg.it.adid}" data-adgrp="${sg.grupo.id}">
        <rect x="${hx.toFixed(1)}" y="${(y-11).toFixed(1)}" width="${(ancho+12).toFixed(1)}" height="17" fill="transparent"/>
        <text class="ad-cname" x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}">${escapeHTML(sg.txt)} <tspan class="ad-cpct" fill="${adReadable(sg.it.hex)}">${sg.pct}</tspan></text>
      </g>`;
      maxLabelY = Math.max(maxLabelY, y);
    };
    /* Nombre recortado y ancho real que va a ocupar, con su porcentaje. */
    const prepara = (sg, hueco)=>{
      sg.pct = pctTxt(sg.it.amount);
      const wPct = adAncho(' ' + sg.pct, FS, 800);
      sg.txt = adCabe(sg.it.label, Math.max(hueco - wPct, 16), FS, 600);
      sg.w = adAncho(sg.txt, FS, 600) + wPct;
    };


    /* Laterales: cada nombre a la altura por la que sale su trozo y, cuando dos
       caerían encima, el grupo entero se centra repartiendo el hueco. El alto
       del dibujo crece con ellos, así que nunca hay que apretarlos. */
    ['izq','der'].forEach(lado=>{
      const lista = trozos.filter(t=>t.lado === lado)
        .map(t=>({t, y: cy + (outer+12)*Math.sin(t.a*Math.PI/180)}))
        .sort((a,b)=>a.y-b.y);
      if(!lista.length) return;
      lista.forEach(r=>prepara(r.t, colLado));
      const ys = adReparte(lista.map(r=>r.y), MINY, PASO);
      const x = lado === 'izq' ? cx-outer-SEP : cx+outer+SEP;
      /* ---- Deshacer los cruces que queden ----
         Colocar cada nombre a su altura no basta: los trozos de la parte de
         abajo salen todos a una altura parecida pero por sitios muy separados,
         y sus líneas se cruzaban. Cuando dos se cruzan se les intercambia la
         altura, que siempre las deja mejor que estaban, y se repite hasta que
         no queda ninguna. */
      const puntaX = x + (lado === 'izq' ? 5 : -5);
      const lado3 = (o,u,v)=>Math.sign((v.x-u.x)*(o.y-u.y)-(v.y-u.y)*(o.x-u.x));
      const seCruzan = (ra, ya, rb, yb)=>{
        const A = adPolar(cx,cy,outer+ESP,ra.t.mid), B = adPolar(cx,cy,outer+ESP,rb.t.mid);
        const P = {x:puntaX, y:ya-3}, Q = {x:puntaX, y:yb-3};
        return lado3(A,B,Q)*lado3(P,B,Q) < 0 && lado3(B,A,P)*lado3(Q,A,P) < 0;
      };
      for(let vuelta=0, tope=lista.length*lista.length+4; vuelta<tope; vuelta++){
        let cambio = false;
        for(let i=0;i<lista.length-1;i++){
          if(seCruzan(lista[i], ys[i], lista[i+1], ys[i+1])){
            const tmp = lista[i]; lista[i] = lista[i+1]; lista[i+1] = tmp; cambio = true;
          }
        }
        if(!cambio) break;
      }
      lista.forEach((r,i)=>pinta(r.t, x, ys[i], lado === 'izq' ? 'end' : 'start', r.t.w));
    });

    const H = Math.max(cy + outer + 26, maxLabelY + 18);
    const centroK = opts.centroK || 'Capital total inicial';
    const totalTxt = opts.centroV || fmt(total);
    /* El número del centro se mide de verdad contra el ancho del agujero y se
       encoge hasta que cabe entero: así nunca se sale del círculo por grande
       que sea la cifra, en vez de fiarse de contar letras. */
    const holeW = 2*(R - SW/2) - 12;
    let vSize = 15;
    while(vSize > 8 && adAncho(totalTxt, vSize, 700) > holeW) vSize -= 0.5;
    return `<svg class="ad-svg" viewBox="0 0 ${W} ${H}" style="width:100%;display:block;overflow:visible;">
      <defs>${defs}
        <filter id="adsh${uid}" x="-40%" y="-40%" width="180%" height="180%">
          <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#1c1c1e" flood-opacity="0.20"/>
        </filter>
        <linearGradient id="adgl${uid}" x1="0.2" y1="0" x2="0.7" y2="1">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
        </linearGradient>
      </defs>
      ${zonas}
      ${brackets}
      ${leaders}
      <g filter="url(#adsh${uid})">
        <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="rgba(20,23,20,.07)" stroke-width="${SW}"/>
        ${arcs}
      </g>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="url(#adgl${uid})" stroke-width="${SW}" style="mix-blend-mode:overlay;pointer-events:none;"/>
      <g class="ad-center" style="pointer-events:none;">
        <text class="ad-k" x="${cx}" y="${cy-16}" text-anchor="middle" data-base="${escapeHTML(centroK)}">${adCenterLines(centroK).map((l,i)=>`<tspan x="${cx}" dy="${i?8:0}">${escapeHTML(l)}</tspan>`).join('')}</text>
        <text class="ad-v" id="${opts.numId || 'patrimonioNum'}" x="${cx}" y="${cy+7}" text-anchor="middle" style="font-size:${vSize}px;">${totalTxt}</text>
        <text class="ad-p" x="${cx}" y="${cy+22}" text-anchor="middle">${opts.centroP || '100%'}</text>
      </g>
      ${labels}
    </svg>`;
  }
  /* Cuando en un tramo no hay nada que enseñar, el sitio de la rueda no se deja
     en blanco: se pinta el círculo apagado con el motivo escrito dentro. */
  function adVaciaSVG(mensaje){
    /* El aro se dibuja fino y ancho a propósito: el mensaje va dentro del
       agujero, y con el grosor de una rueda normal no cabría ni media frase. */
    const FS = 11, ANCHO = 150, SALTO = 15;
    const R = 84, SW = 14, W = 410, cx = W/2;
    /* Se parte en líneas midiendo el texto de verdad, no contando letras. */
    const lineas = [];
    String(mensaje).split(' ').forEach(w=>{
      const u = lineas[lineas.length-1];
      if(u != null && adAncho(u + ' ' + w, FS, 600) <= ANCHO) lineas[lineas.length-1] = u + ' ' + w;
      else lineas.push(w);
    });
    const cy = R + SW/2 + 12, H = cy + R + SW/2 + 12;
    const y0 = cy + FS/3 - (lineas.length-1)*SALTO/2;
    return `<svg class="ad-svg ad-vacia" viewBox="0 0 ${W} ${H}" style="width:100%;display:block;">
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line-soft)" stroke-width="${SW}"/>
      <circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="var(--line)" stroke-width="1.4" stroke-dasharray="3 7" opacity=".7"/>
      <text class="ad-vtxt" x="${cx}" y="${y0.toFixed(1)}" text-anchor="middle">${
        lineas.map((l,i)=>`<tspan x="${cx}" dy="${i?SALTO:0}">${escapeHTML(l)}</tspan>`).join('')}</text>
    </svg>`;
  }

  /* ---- La rueda, pero en columnas ----
     Los mismos datos del círculo puestos en tubos verticales: una columna por
     categoría, con su color, agrupadas en las dos mitades (lo gastado y lo que
     conservas) igual que en la rueda. La altura de cada tubo es su importe y
     todas se miden contra el tubo más alto de las dos mitades, así se comparan
     de un vistazo. Se enseña deslizando, al lado de la rueda. */
  function annotatedColumnsHTML(groups, total, opts){
    opts = opts || {};
    const activos = groups.filter(g=>g.items && g.items.some(x=>x.amount > 0));
    if(!activos.length) return adVaciaSVG(opts.vacio || 'Todavía no hay nada que repartir en columnas.');
    const pct = v => { const p = total > 0 ? (v/total)*100 : 0; return (Math.round(p*10)/10).toFixed(p >= 10 || p === 0 ? 0 : 1).replace('.', ',') + '%'; };
    /* El tope es el tubo más alto de cualquier mitad: a partir de ahí cada uno
       ocupa la fracción que le toca, nunca por debajo de un hilo visible. */
    let tope = 1;
    activos.forEach(g=>g.items.forEach(x=>{ if(x.amount > tope) tope = x.amount; }));
    const panel = g=>{
      const items = g.items.filter(x=>x.amount > 0).sort((a,b)=>b.amount-a.amount);
      const cols = items.map((x,i)=>`<div class="cb-col" data-adid="${x.adid||''}" data-adgrp="${g.id}"
          data-adk="${escapeHTML(x.label)}" data-adv="${fmt(x.amount)}" data-adp="${pct(x.amount)}"
          title="${escapeHTML(x.label)} · ${fmt(x.amount)} · ${pct(x.amount)}">
          <span class="cb-pct">${pct(x.amount)}</span>
          <span class="cb-tube" style="--h:${((x.amount/tope)*100).toFixed(2)}%;--d:${(i*30)}ms;background:linear-gradient(180deg,${shadeHex(x.hex,26)},${shadeHex(x.hex,-18)});"></span>
          <span class="cb-name">${escapeHTML(x.label)}</span>
        </div>`).join('');
      return `<div class="cb-group" data-adid="${g.id}" data-adk="${escapeHTML(g.label)}" data-adv="${fmt(g.total)}" data-adp="${pct(g.total)}" style="--gc:${g.hex};">
        <div class="cb-ghead"><span class="cb-glab">${escapeHTML(g.label)}</span><b class="cb-gpct">${pct(g.total)}</b></div>
        <div class="cb-cols">${cols || '<div class="cb-vacio">—</div>'}</div>
      </div>`;
    };
    return `<div class="cb-wrap">
      <div class="cb-plot">${activos.map(panel).join('<div class="cb-div"></div>')}</div>
    </div>`;
  }

  /* La tarjeta del gráfico principal. Es la misma en Inicio y en Patrimonio. */
  /* El color del "capital" sigue al tema: azul en claro, verde lima en oscuro.
     `suave` da el tono secundario (lo mensual frente a lo anual). */
  function capHex(suave){
    const dark = document.documentElement.getAttribute('data-theme') === 'dark';
    return dark ? (suave ? '#9CCB0C' : '#C6F432') : (suave ? '#5E5CE6' : '#0A84FF');
  }
  function patrimonioCard(opts){
    opts = opts || {};
    const d = consolidadoData();
    const ref = d.capitalInicial > 0 ? d.capitalInicial : 1;
    const pctNum = v => (v/ref)*100;
    const pctTxt = v => { const p = pctNum(v); return (Math.round(p*10)/10).toFixed(p >= 10 || p === 0 ? 0 : 1).replace('.', ',') + '%'; };

    /* El tope por lado existía para tapar que el etiquetado se amontonaba a
       partir de seis nombres. Ahora la rueda crece y reparte las alturas ella
       sola, así que se puede subir bastante: solo se junta en "Otros" lo que ya
       sería ilegible por cantidad. */
    const MAXL = 11;
    const recorta = (lista, hex, etiqueta)=>{
      /* Los trozos grandes se quedan siempre con su propio nombre. */
      const arr = lista.slice().filter(x=>x.amount > 0).sort((a,b)=>b.amount-a.amount);
      if(arr.length <= MAXL) return arr;
      const top = arr.slice(0, MAXL-1);
      const resto = arr.slice(MAXL-1).reduce((s,x)=>s+x.amount, 0);
      if(resto > 0) top.push({id:'__otros_'+etiqueta, label:etiqueta, hex, icon:'sparkle', amount:+resto.toFixed(2), raw:+resto.toFixed(2)});
      return top;
    };
    /* Si alguna cuenta está en números rojos, ese agujero se descuenta del
       montón más grande: así los trozos del círculo suman exactamente lo que
       dice la caja de Capital Total y ningún porcentaje miente. */
    const capitalNeto = adNeto(d.capitalPartes, d.capitalTotal);
    const gastoItems   = recorta(d.gastoPartes, '#FF9F0A', 'Otros gastos');
    const capitalItems = recorta(capitalNeto,   '#5E5CE6', 'Otras cuentas');
    gastoItems.forEach((x,i)=>{ x.adid = 'ig'+i; });
    capitalItems.forEach((x,i)=>{ x.adid = 'ic'+i; });

    const grupos = [
      {id:'gGasto',   side:'left',  label:'Gastos Totales', hex:'#FF3B30', total:d.gastosTotales,             items:gastoItems},
      {id:'gCapital', side:'right', label:'Capital Total',  hex:capHex(), total:Math.max(d.capitalTotal,0),  items:capitalItems},
    ];
    const vacia = d.gastosTotales <= 0 && d.capitalTotal <= 0;

    const negativos = d.capitalPartes.filter(x=>x.raw < 0).map(x=>`<div class="dtc-neg">
        ${ic(x.icon,12)} ${escapeHTML(x.label)} en negativo <b>${fmt(x.raw)}</b>
      </div>`).join('');

    return `<div class="ledger-card tilt3d dtc-card">
      <div class="card-title big"><span class="ct-ico">${ic('globe')}</span> ${L('dtc.title', opts.title || 'Dinero Total Consolidado')}</div>
      <div class="ad-wrap">
        ${vacia
          ? `<p class="dtc-empty">Todavía no hay dinero registrado. En cuanto añadas tu saldo o un movimiento, la rueda se reparte sola.</p>`
          : `<div class="dtc-seg" role="tablist" aria-label="Vista del gráfico"><button type="button" role="tab" class="dtc-segb on" data-dtcp="0">${ic('globe',14)}Rueda</button><button type="button" role="tab" class="dtc-segb" data-dtcp="1">${ic('chartBar',14)}Columnas</button></div>
            <div class="dtc-carrusel">
              <div class="dtc-slide cur">${annotatedDonutSVG(grupos, ref, {numId: opts.numId})}</div>
              <div class="dtc-slide">${annotatedColumnsHTML(grupos, ref)}</div>
            </div>
            <div class="dtc-dots">
              <button type="button" class="dtc-dot on" data-dtcp="0" aria-label="Ver la rueda"></button>
              <button type="button" class="dtc-dot" data-dtcp="1" aria-label="Ver las columnas"></button>
            </div>`}
      </div>
      ${opts.soloGrafico ? '' : `${opts.extra ? `<div class="dtc-extra">${opts.extra}</div>` : ''}
      ${negativos}

      <div class="tri">
        <div class="tri-main">
          <div class="tri-side liq" data-adid="gGasto" data-adk="Gastos Totales" data-adv="${fmt(d.gastosTotales)}" data-adp="${pctTxt(d.gastosTotales)}">
            <div class="tri-k">${ic('arrowUp',12)}${L('dtc.gastos','Gastos Totales')}</div>
            <div class="tri-v">${fmt(d.gastosTotales)}</div>
            <div class="tri-p">${pctTxt(d.gastosTotales)} del total</div>
          </div>
          <div class="tri-mid"><span class="tri-badge">${ic('receipt',17)}</span></div>
          <div class="tri-side cap" data-adid="gCapital" data-adk="Capital Total" data-adv="${fmt(d.capitalTotal)}" data-adp="${pctTxt(Math.max(d.capitalTotal,0))}">
            <div class="tri-k">${ic('chartBar',12)}${L('dtc.capital','Capital Total')}</div>
            <div class="tri-v">${fmt(d.capitalTotal)}</div>
            <div class="tri-p">${pctTxt(Math.max(d.capitalTotal,0))} del total</div>
          </div>
        </div>
        <div class="tri-legs"><i></i><i></i></div>
        <div class="tri-inv">
          <span class="tri-k">${ic('trending',12)}${L('dtc.inversion','Inversión')}</span>
          <b>${fmt(d.inversionTotal)}</b>
        </div>
      </div>

      <div class="cti-row">
        <div class="cti-box">
          <div class="cti-k">${ic('archive',11)} ${L('cti.k','C.T.I')}</div>
          <div class="cti-v">${fmt(d.cti)}</div>
          <div class="cti-s">${L('cti.s','Capital total inicial · el máximo que has llegado a tener')}</div>
        </div>
        <div class="cti-box bal">
          <div class="cti-k">${ic('scale',11)} ${L('bal.k','Balance')}</div>
          <div class="cti-v">${fmt(d.balance)}</div>
          <div class="cti-s">${L('bal.s','C.T.I − Gastos totales')}</div>
        </div>
      </div>`}
    </div>`;
  }

  /* Al tocar un trozo, una línea o una caja, la rueda se centra en esa parte y
     el corazón del círculo pasa a contar cuánto es y qué porcentaje ocupa. */
  /* Vale para cualquier caja que lleve una rueda anotada: la de Inicio y cada
     una de las tres del coste recurrente. Se le pasa la caja concreta. */
  function bindConsolidadoCard(scope, cardEl){
    const card = cardEl || scope.querySelector('.dtc-card');
    if(!card) return;
    const kEl = card.querySelector('.ad-k'), vEl = card.querySelector('.ad-v'), pEl = card.querySelector('.ad-p');
    if(!kEl) return;
    const base = {k:kEl.dataset.base || 'Capital total inicial', v:vEl.textContent, p:pEl.textContent};
    const cxAttr = kEl.getAttribute('x');
    /* Ancho real del agujero de la rueda, para encoger el número del centro
       igual que al pintarla: así tampoco se sale al fijarse en un trozo. */
    const aro = [...card.querySelectorAll('.ad-svg circle')]
      .find(c=>parseFloat(c.getAttribute('stroke-width')||0) >= 10);
    const holeW = aro
      ? 2*(parseFloat(aro.getAttribute('r')) - parseFloat(aro.getAttribute('stroke-width'))/2) - 12
      : 80;
    const ajustaV = (txt)=>{
      let sz = 15;
      while(sz > 8 && adAncho(txt, sz, 700) > holeW) sz -= 0.5;
      vEl.style.fontSize = sz + 'px';
    };
    const pintaK = (txt)=>{
      kEl.textContent = '';
      adCenterLines(txt).forEach((l,i)=>{
        const ts = document.createElementNS('http://www.w3.org/2000/svg','tspan');
        ts.setAttribute('x', cxAttr); ts.setAttribute('dy', i ? 8 : 0);
        ts.textContent = l;
        kEl.appendChild(ts);
      });
    };
    const marcas = Array.from(card.querySelectorAll('[data-adid]'));
    let focus = null;
    const apply = ()=>{
      card.classList.toggle('ad-focusing', !!focus);
      let src = null;
      const elFoco = focus ? marcas.find(el=>el.dataset.adid === focus) : null;
      /* Al fijarse en un grupo se queda encendido todo lo que hay dentro; al
         fijarse en una categoría, su grupo sigue visible a su alrededor. */
      const grupo = elFoco ? (elFoco.dataset.adgrp || elFoco.dataset.adid) : null;
      marcas.forEach(el=>{
        const on = !!focus && el.dataset.adid === focus;
        const dentro = !!grupo && (el.dataset.adgrp || el.dataset.adid) === grupo;
        el.classList.toggle('ad-on', on);
        el.classList.toggle('ad-off', !!focus && !dentro);
        if(on && el.dataset.adk && !src) src = el;
      });
      const txt = src ? {k:src.dataset.adk, v:src.dataset.adv, p:src.dataset.adp} : base;
      pintaK(txt.k);
      vEl.textContent = txt.v;
      pEl.textContent = txt.p;
      ajustaV(txt.v);
    };
    marcas.forEach(el=>{
      el.style.cursor = 'pointer';
      el.addEventListener('click', e=>{
        e.stopPropagation();
        focus = (focus === el.dataset.adid) ? null : el.dataset.adid;
        apply();
      });
    });
    const svg = card.querySelector('.ad-svg');
    if(svg) svg.addEventListener('click', ()=>{ if(focus){ focus = null; apply(); } });
    bindDtcCarrusel(card);
  }

  /* Desliza entre la rueda y las columnas, con puntitos que llevan a cada una
     de un toque. En el móvil lo lleva el propio navegador; en escritorio se
     arrastra con el ratón, igual que la barra de carteras. */
  function bindDtcCarrusel(card){
    const car = card.querySelector('.dtc-carrusel');
    if(!car || car._dtcBound) return;
    car._dtcBound = true;
    const dots = Array.prototype.slice.call(card.querySelectorAll('[data-dtcp]'));
    const slides = Array.prototype.slice.call(car.querySelectorAll('.dtc-slide'));
    if(slides.length < 2) return;
    const marca = i=>{ dots.forEach((d,k)=>d.classList.toggle('on', k === i)); slides.forEach((s,k)=>s.classList.toggle('cur', k === i)); };
    const paso = ()=>Math.max(slides[1].offsetLeft - slides[0].offsetLeft, 1);
    const irA = i=>{
      i = Math.max(0, Math.min(slides.length-1, i));
      car.scrollTo({left: paso() * i, behavior:'smooth'});
      marca(i);
    };
    dots.forEach((d,i)=>d.addEventListener('click', ()=>irA(i)));
    let raf;
    car.addEventListener('scroll', ()=>{
      cancelAnimationFrame(raf);
      raf = requestAnimationFrame(()=>marca(Math.round(car.scrollLeft / paso())));
    }, {passive:true});
    /* Arrastre con ratón para el escritorio. No se engancha a un toque: ahí el
       scroll nativo ya hace el trabajo y robarle el gesto rompería el tap. */
    let down = false, x0 = 0, sl0 = 0, movido = false;
    car.addEventListener('mousedown', e=>{ down = true; movido = false; x0 = e.pageX; sl0 = car.scrollLeft; });
    window.addEventListener('mousemove', e=>{
      if(!down) return;
      const dx = e.pageX - x0;
