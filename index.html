      const vencida = startOfDay(s.nextTs) < hoy0;
      out.push({ts:s.nextTs, estado: vencida ? 'sinpagar' : 'porpagar',
        tipo: esInv(s) ? 'inversion' : 'suscripcion', nombre:s.name, amount:s.amount,
        detalle: vencida ? 'Se pasó la fecha y sigue sin cobrarse' : 'Siguiente cobro previsto',
        subId:s.id});
    });
    /* 4 · Las que ya no están en la lista.
       La app no tiene "pausa": una suscripción o vive o la quitas. Así que
       "finalizada" se deduce de los hechos: si quedan cobros suyos en el
       historial pero la suscripción ya no existe, se acabó. La fecha es la de
       su último cobro, que es cuando de verdad dejó de correr. */
    const vivas = new Set(state.subscriptions.map(s=>s.id));
    const huerfanas = {};
    state.transactions.filter(t=>t.subId && !vivas.has(t.subId)).forEach(t=>{
      const h = huerfanas[t.subId];
      if(!h || t.ts > h.ts) huerfanas[t.subId] = {ts:t.ts, nombre:t.description || 'Suscripción',
        amount:t.amount, inv:txEsInversion(t)};
    });
    Object.keys(huerfanas).forEach(id=>{
      const h = huerfanas[id];
      out.push({ts:h.ts, estado:'finalizada', tipo: h.inv ? 'inversion' : 'suscripcion',
        nombre:h.nombre, amount:h.amount, detalle:'Ya no está en tu lista · último cobro', subId:id});
    });
    /* Por si alguna versión futura vuelve a permitir darlas de baja sin borrarlas. */
    state.subscriptions.filter(s=>s.active === false).forEach(s=>{
      out.push({ts: s.lastChargedTs || s.nextTs || Date.now(), estado:'finalizada',
        tipo: esInv(s) ? 'inversion' : 'suscripcion', nombre:s.name, amount:s.amount,
        detalle:'Ya no está activa', subId:s.id});
    });
    return out.sort((a,b)=>b.ts - a.ts);
  }

  function subHistFiltrado(){
    let lista = subEventos();
    const f = subHistFiltro;
    if(f === 'suscripcion' || f === 'inversion') lista = lista.filter(e=>e.tipo === f);
    else if(f !== 'todo') lista = lista.filter(e=>e.estado === f);
    if(subHistFrom){
      const d = new Date(subHistFrom + 'T00:00:00').getTime();
      if(!isNaN(d)) lista = lista.filter(e=>e.ts >= d);
    }
    if(subHistTo){
      const d = new Date(subHistTo + 'T23:59:59').getTime();
      if(!isNaN(d)) lista = lista.filter(e=>e.ts <= d);
    }
    return lista;
  }

  /* ---- Aplazar un pago ----
     Mover la fecha no es pagar ni cancelar: el bloque sigue exactamente igual,
     con su importe y su ritmo, solo que el cobro cae otro día. Se guarda el
     salto (de qué fecha a qué fecha) para que el historial pueda contarlo:
     si no, dentro de dos meses nadie se acuerda de por qué aquello se movió. */
  function abreAplazar(sub){
    const sugerida = Math.max(sub.nextTs + 7*86400000, Date.now() + 86400000);
    openOverlay(`<h3>${ic('clock',17)} Aplazar "${escapeHTML(sub.name)}"</h3>
      <div class="ap-actual">
        <span>${ic('calendar',12)} Fecha de ahora</span>
        <b>${escapeHTML(fmtDateShort(sub.nextTs))}</b>
      </div>
      <div class="field-label">¿A qué día lo mueves?</div>
      <input type="date" id="apFecha" value="${toDateInput(sugerida)}">
      <p class="nv-aviso">${ic('bolt',12)} El importe y el ritmo no cambian: ${fmt(sub.amount)} · ${escapeHTML(cycleOf(sub.cycle).label)}.</p>
      <div class="sheet-actions">
        <button class="ghost-btn" id="apCancel">Cancelar</button>
        <button class="primary-btn glass-tap" id="apOk" style="margin-top:0;">${ic('check',15)} Confirmar aplazamiento</button>
      </div>`);
    sheetBody.querySelector('#apCancel').onclick = closeOverlay;
    sheetBody.querySelector('#apOk').onclick = async ()=>{
      const campo = sheetBody.querySelector('#apFecha');
      const ts = fromDateInput(campo.value);
      if(!ts){ markInvalid(campo, 'Elige la fecha nueva en el recuadro rojo'); return; }
      if(startOfDay(ts) <= startOfDay(sub.nextTs)){
        markInvalid(campo, 'La fecha nueva tiene que ser posterior a la de ahora'); return;
      }
      const antes = sub.nextTs, anchorAntes = sub.anchorDay;
      sub.nextTs = ts;
      /* Solo se mueve este cobro: el siguiente vuelve a su día de siempre. Antes
         el día de cobro pasaba a ser el nuevo para todos los meses que vinieran,
         aunque la hoja dijera que el ritmo no cambiaba. */
      if(!sub.anchorDay) sub.anchorDay = new Date(antes).getDate();
      if(!Array.isArray(state.subDelays)) state.subDelays = [];
      const apunte = {id:'ap'+Date.now().toString(36), subId:sub.id, name:sub.name,
        amount:sub.amount, de:antes, a:ts, ts:Date.now(),
        tipo: sub.kind === 'inversion' ? 'inversion' : 'suscripcion'};
      state.subDelays.push(apunte);
      await saveState();
      closeOverlay(); render();
      showUndoToast(`"${sub.name}" aplazado al ${fmtDateShort(ts)}`, async ()=>{
        sub.nextTs = antes; sub.anchorDay = anchorAntes;
        state.subDelays = state.subDelays.filter(x=>x.id !== apunte.id);
        await saveState(); render();
      });
    };
  }

  /* ---- La descripción de un bloque que se finaliza ----
     Finalizar es el punto final de algo que llevaba meses en la lista. Justo
     después de confirmarlo se pregunta por qué, porque es el único momento en
     el que uno se acuerda; luego ya nadie lo escribe. Se puede saltar. */
  function pideDescripcionFinal(sub, yaPagado){
    openOverlay(`<h3>${ic('edit',17)} ¿Quieres añadir una descripción?</h3>
      <div class="step-label metal-text">Para "${escapeHTML(sub.name)}" · opcional</div>
      <div class="field-label">Por qué lo finalizas</div>
      <input type="text" id="finDesc" maxlength="80" placeholder="Ej. me he dado de baja, ya no lo uso, se acabó el contrato..." autocomplete="off">
      <p class="nv-aviso">${ic('bolt',12)} Se guardará junto al movimiento, así que lo verás en el historial cuando lo busques.</p>
      <div class="sheet-actions">
        <button class="ghost-btn" id="finSkip">Sin descripción</button>
        <button class="primary-btn glass-tap" id="finOk" style="margin-top:0;">${ic('check',15)} Finalizar</button>
      </div>`);
    const cierra = async (texto)=>{
      const copia = JSON.stringify({s:state.subscriptions, t:state.transactions,
                                    w:state.wallets, p:state.platforms});
      /* Si ya estaba pagado no se cobra otra vez: solo sale de la lista. */
      if(!yaPagado){
        registerSubscriptionPayment(sub, Date.now());
        if(texto){
          const ultimo = state.transactions.filter(t=>t.subId === sub.id).sort((a,b)=>b.ts-a.ts)[0];
          if(ultimo) ultimo.note = texto;
        }
      } else if(texto){
        const ultimo = state.transactions.filter(t=>t.subId === sub.id).sort((a,b)=>b.ts-a.ts)[0];
        if(ultimo) ultimo.note = texto;
      }
      state.subscriptions = state.subscriptions.filter(s=>s.id !== sub.id);
      if(openSubId === sub.id) openSubId = null;
      await saveState(); closeOverlay(); render();
      showUndoToast(`"${sub.name}" finalizada`, async ()=>{
        const prev = JSON.parse(copia);
        state.subscriptions = prev.s; state.transactions = prev.t;
        state.wallets = prev.w; state.platforms = prev.p;
        await saveState(); render();
      });
    };
    sheetBody.querySelector('#finSkip').onclick = ()=>cierra('');
    sheetBody.querySelector('#finOk').onclick = ()=>cierra(sheetBody.querySelector('#finDesc').value.trim());
    const campo = sheetBody.querySelector('#finDesc');
    if(campo) campo.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ e.preventDefault(); cierra(campo.value.trim()); }
    });
  }

  function abreSubHistorial(){
    const lista = subHistFiltrado();
    const visibles = lista.slice(0, subHistLimit);
    const pagado   = lista.filter(e=>e.estado === 'pagada').reduce((s,e)=>s+e.amount,0);
    const pendiente= lista.filter(e=>e.estado === 'porpagar' || e.estado === 'sinpagar').reduce((s,e)=>s+e.amount,0);

    /* Agrupado por mes, que es como se miran las suscripciones. */
    const porMes = [];
    visibles.forEach(e=>{
      const d = new Date(e.ts);
      const clave = d.getFullYear() + '-' + d.getMonth();
      let g = porMes.find(x=>x.clave === clave);
      if(!g){ g = {clave, ts:e.ts, label:nbMayus(MESES[d.getMonth()]) + ' de ' + d.getFullYear(), items:[], suma:0}; porMes.push(g); }
      g.items.push(e);
      if(e.estado === 'pagada') g.suma += e.amount;
    });
    const mesesHTML = porMes.map(g=>`<div class="nb-day">
        <div class="nb-dayh">
          <span class="nb-dayd">${escapeHTML(g.label)}</span>
          <span class="nb-daysum">${g.suma > 0 ? `<span class="o">-${fmt(g.suma)}</span>` : `<span>${g.items.length} apunte${g.items.length===1?'':'s'}</span>`}</span>
        </div>
        ${g.items.map(e=>{
          const est = SUB_ESTADOS[e.estado] || SUB_ESTADOS.pagada;
          const icono = e.tipo === 'inversion' ? 'trending' : 'repeat';
          return `<div class="sh-it">
            <span class="sh-ico" style="background:${est.hex}1c;color:${est.hex}">${ic(icono,13)}</span>
            <span class="sh-txt">
              <span class="sh-n">${escapeHTML(e.nombre)}</span>
              <span class="sh-s">${escapeHTML(fmtDateShort(e.ts) + ' · ' + e.detalle)}</span>
            </span>
            <span class="sh-r">
              <span class="sh-a">${fmt(e.amount)}</span>
              <span class="sh-b" style="--sb:${est.hex}">${ic(est.icon,10)} ${est.label}</span>
            </span>
          </div>`;
        }).join('')}
      </div>`).join('');

    const chip = (id, icono, txt) => `<button type="button" class="nb-fchip ${subHistFiltro===id?'on':''}" data-shf="${id}">${ic(icono,12)} ${txt}</button>`;

    openOverlay(`<div class="nb-sheet">
      <h3>${ic('repeat',17)} Historial de suscripciones</h3>
      <p style="color:var(--ink-soft);font-size:12.5px;line-height:1.5;margin:0;">Todo lo que ha pasado con tus suscripciones e inversiones recurrentes, mes a mes. Acota el rango y filtra por estado.</p>
      <div class="nb-range">
        <label><span>Desde</span><input type="date" id="shFrom" value="${escapeHTML(subHistFrom)}"></label>
        <label><span>Hasta</span><input type="date" id="shTo" value="${escapeHTML(subHistTo)}"></label>
      </div>
      <div class="nb-fchips">
        ${chip('todo','globe','Todo')}
        ${chip('suscripcion','repeat','Suscripciones')}
        ${chip('inversion','trending','Inversiones')}
        ${chip('pagada','check','Pagadas')}
        ${chip('porpagar','clock','Por pagar')}
        ${chip('sinpagar','warning','Sin pagar')}
        ${chip('aplazada','clock','Aplazadas')}
        ${chip('finalizada','archive','Finalizadas')}
        ${chip('reembolsada','undo','Reembolsadas')}
        ${(subHistFrom || subHistTo) ? `<button type="button" class="nb-rclr" id="shRangeClear">${ic('close',11)} Quitar fechas</button>` : ''}
      </div>
      <div class="nb-resumen">
        <span>${lista.length} apunte${lista.length===1?'':'s'}</span>
        ${pagado>0?`<span class="o">-${fmt(pagado)} pagado</span>`:''}
        ${pendiente>0?`<span class="i">${fmt(pendiente)} por pagar</span>`:''}
      </div>
      <div class="nb-lista">
        ${lista.length
          ? mesesHTML + (lista.length > visibles.length
              ? `<button type="button" class="nb-more" id="shMore">Ver ${Math.min(lista.length - visibles.length, 30)} más · ${lista.length} en total</button>`
              : '')
          : `<p class="nb-empty">No hay nada con estos filtros.${(subHistFrom||subHistTo)?' Prueba a ampliar el rango de fechas.':''}</p>`}
      </div>
      <div class="sheet-actions"><button class="ghost-btn" id="shCerrar">Cerrar</button></div>
    </div>`);

    const cont = sheetBody;
    const desde = cont.querySelector('#shFrom');
    if(desde) desde.onchange = ()=>{ subHistFrom = desde.value; subHistLimit = 30; abreSubHistorial(); };
    const hasta = cont.querySelector('#shTo');
    if(hasta) hasta.onchange = ()=>{ subHistTo = hasta.value; subHistLimit = 30; abreSubHistorial(); };
    const quita = cont.querySelector('#shRangeClear');
    if(quita) quita.onclick = ()=>{ subHistFrom = ''; subHistTo = ''; subHistLimit = 30; abreSubHistorial(); };
    cont.querySelectorAll('[data-shf]').forEach(b=>{
      b.onclick = ()=>{ subHistFiltro = b.dataset.shf; subHistLimit = 30; abreSubHistorial(); };
    });
    const mas = cont.querySelector('#shMore');
    if(mas) mas.onclick = ()=>{ subHistLimit += 30; abreSubHistorial(); };
    const cerrar = cont.querySelector('#shCerrar');
    if(cerrar) cerrar.onclick = closeOverlay;
  }

  /* ---- El selector entre Calendario y Suscripciones ----
     Mismo aspecto que las pestañas de Carteras, pero con dos botones: son las
     dos caras de lo mismo, porque lo que apuntas en el calendario acaba siendo
     un bloque de la lista. */
  let subTab = 'suscripciones';
  function subSwitchHTML(){
    const b = (id, label, icono) =>
      `<div class="wallet-tab fixed ${subTab===id?'active':''}" data-subtab="${id}">${ic(icono,12)} ${label}</div>`;
    return `<div class="wallet-tabs-wrap sub-switch">
      <div class="wallet-tabs">
        ${b('calendario','Calendario','calendar')}
        ${b('suscripciones','Pagos y citas','repeat')}
      </div>
    </div>`;
  }
  function bindSubSwitch(cont){
    cont.querySelectorAll('[data-subtab]').forEach(el=>{
      el.onclick = ()=>{
        if(editMode || subTab === el.dataset.subtab) return;
        subTab = el.dataset.subtab;
        render();
      };
    });
  }

  function renderSuscripciones(){
    const list = subsSorted();
    const tot = subTotals();
    const active = activeSubs();
    /* Todo lo de esta pantalla habla del mismo tramo que el resto de la app. */
    const r = cartRango();
    const sr = subsRango(r);

    let head;
    if(!state.subscriptions.length){
      head = `<div class="ledger-card tilt3d" style="text-align:center;padding:30px 22px;">
        <div style="opacity:.35;">${ic('repeat',34)}</div>
        <div style="font-weight:700;font-size:17px;margin-top:10px;">Aún no tienes pagos ni citas</div>
        <p style="color:var(--ink-soft);font-size:13px;line-height:1.5;margin:8px 0 0;">Añade Netflix, el gimnasio, el móvil, una cita o tu aportación mensual a inversión. La app llevará la cuenta atrás, lo marcará en el calendario y registrará el pago por ti.</p>
      </div>`;
    } else {
      const pctBar = Math.min(tot.pctSueldo, 100);
      head = `<div class="ledger-card tilt3d sr-card">
        <div class="pc-head">
          <div class="card-title big"><span class="ct-ico">${ic('repeat')}</span> Coste recurrente</div>
          <div class="sr-puntos" id="srPuntos">
            ${sr.estados.map((e,i)=>`<button type="button" class="sr-punto ${i===srEstado?'on':''}" data-srp="${i}" style="--sp:${e.hex}" aria-label="${escapeHTML(e.label)}"></button>`).join('')}
          </div>
        </div>
        <div class="sr-carrusel" id="srCarrusel">
          ${sr.estados.map((e,i)=>srPantallaHTML(e, r, tot, i, sr.estados.length)).join('')}
        </div>
        <div class="sr-hint">Desliza · <b>pendientes</b> y futuros ›</div>
        ${salaryForMonth()>0?`<div class="sub-salary">
          <div class="ss-top"><span>Coste mensual estimado sobre tu sueldo</span><b>${tot.pctSueldo}%</b></div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${pctBar}%;background:${tot.pctSueldo>=35?'#FF3B30':tot.pctSueldo>=20?'#FF9500':'#34C759'}"></div></div>
          <div class="pc-now">${fmt(tot.mes)} al mes · ${fmt(tot.anio)} al año si todo sigue igual</div>
        </div>`:''}
      </div>`;
    }

    const upcoming = active.filter(s=>!subLibre(s) && daysUntil(s.nextTs) <= 7).sort((a,b)=>a.nextTs-b.nextTs);
    const upcomingHTML = upcoming.length ? `<div class="upcoming-strip">
      ${upcoming.slice(0,4).map(s=>{
        const uc = URGENCY[subUrgency(s)];
        const dU = daysUntil(s.nextTs), citaU = subEsCita(s);
        const etU = dU < 0 ? 'Tarde' : dU === 0 ? 'Hoy' : dU === 1 ? 'Mañana' : dU + ' días';
        const icU = citaU ? 'calendar' : (s.kind === 'inversion' ? 'trending' : getCatIcon(s.category, 'gasto'));
        return `<div class="up-pill" style="--su:${uc.hex};">
          <span class="up-ico">${ic(icU,18)}</span>
          <span class="up-name">${escapeHTML(s.name)}</span>
          <span class="up-amt">${fmt(s.amount)}</span>
          <span class="up-days">${etU}${citaU ? ' · cita' : ''}</span>
        </div>`;
      }).join('')}
    </div>` : '';

    /* Dos listas separadas: las suscripciones por un lado y las inversiones que
       se repiten por otro. Se pagan igual, pero no son lo mismo. */
    /* Las listas también hablan del tramo elegido: sale lo que pagó dentro del
       tramo o lo que le toca pagar en él. Las de fecha libre ("Indefinido") no
       entran en ninguna de las dos cuentas —no tienen fecha que mirar— así que
       salen siempre: si no, no habría forma de llegar a ellas para pagarlas. */
    const enPeriodo = s => sr.enTramo.has(s.id) || subLibre(s);
    const subsNormales = list.filter(s=>s.kind !== 'inversion' && enPeriodo(s));
    const inversiones  = list.filter(s=>s.kind === 'inversion' && enPeriodo(s));
    const hayNormales  = list.some(s=>s.kind !== 'inversion');
    const hayInv       = list.some(s=>s.kind === 'inversion');
    /* La lista se corta a las primeras y el resto entra con "Mostrar más", para
       que la pantalla no sea un bloque interminable. Al lado, el acceso al
       historial completo, que no depende del tramo ni de cuántas se vean. */
    const botonHistorial = `<button type="button" class="pc-mas hist" id="subHistBtn">
      <i>${ic('calendar',12)}</i>Historial</button>`;
    const listaHTML = (titulo, icono, arr, nota, hayAlguna, vacio, opts) => {
      opts = opts || {};
      const acciones = [];
      if(arr.length){
        const tope = opts.tope || 0;
        const todas = !tope || !!pcMas[opts.clave];
        const visibles = todas ? arr : arr.slice(0, tope);
        const ocultas = arr.length - visibles.length;
        if(tope && arr.length > tope){
          acciones.push(`<button type="button" class="pc-mas ${todas?'on':''}" data-pcmas="${escapeHTML(opts.clave)}">
            <i>${ic('chevronRight',12)}</i>${todas ? 'Mostrar menos' : 'Mostrar ' + ocultas + ' más'}</button>`);
        }
        if(opts.historial) acciones.push(botonHistorial);
        return `<div class="section-title"><span class="pg-chip pgc-${icono}">${ic(icono,16)}</span> ${titulo} <span class="count metal-text">${nota}</span></div>
          <div class="sub-list">${visibles.map(s=>subCardHTML(s, sr)).join('')}</div>
          ${acciones.length ? `<div class="sub-acciones">${acciones.join('')}</div>` : ''}`;
      }
      /* Si hay de estas pero ninguna cae en el tramo, se dice; si no, el bloque
         entero desaparece como antes. */
      if(!hayAlguna) return '';
      return `<div class="section-title"><span class="pg-chip pgc-${icono}">${ic(icono,16)}</span> ${titulo}</div>
        <div class="ledger-card sub-fuera">${ic('clock',14)} ${escapeHTML(vacio)}</div>
        ${opts.historial ? `<div class="sub-acciones">${botonHistorial}</div>` : ''}`;
    };

    /* ---- Calendario y lista, dos caras de lo mismo ----
       Lo que apuntas en un día acaba siendo un bloque de esta lista, así que
       las dos vistas van juntas y se cambia entre ellas con el mismo selector
       que las carteras. Encima del mando del tiempo, porque manda sobre él. */
    if(subTab === 'calendario'){
      /* Sin el selector Sem/Mes/90d/Año/Todo: el calendario se mueve con sus
         propias flechas y aquel selector no le cambiaba nada. */
      root.innerHTML = subSwitchHTML()
        + renderBloques('calendario', [
            {id:'calendario', name:'Calendario del mes', html:renderCalendar()},
          ]);
      bindBloques('calendario', root);
      bindSubSwitch(root);
      bindCalendarioVista(root);
      aplicaMinCero(root);
      pintaAvisoNotas();
      return;
    }

    root.innerHTML = subSwitchHTML() + segBarraHTML('subs') + renderBloques('suscripciones', [
      {id:'coste', name:'Coste recurrente', html:head},
      {id:'proximos', name:'Próximos 7 días', html: upcoming.length
        ? `<div class="section-title"><span class="pg-chip pgc-bell">${ic('bell',16)}</span> Próximos 7 días <span class="count">${upcoming.length} pago${upcoming.length===1?'':'s'}</span></div>${upcomingHTML}` : ''},
      {id:'lista', name:'Tus pagos y citas',
        html: listaHTML('Tus pagos y citas', 'receipt', subsNormales,
          '', hayNormales,
          'Ninguna suscripción se movió ni toca pagarla ' + sr.enTexto + '. Cambia el periodo de arriba para verlas.',
          {tope:3, clave:'subs-lista', historial:true})},
      {id:'inversiones', name:'Tus inversiones',
        html: listaHTML('Tus inversiones', 'trending', inversiones,
          'aportaciones que se repiten', hayInv,
          'Ninguna aportación se movió ni toca hacerla ' + sr.enTexto + '.',
          {tope:3, clave:'subs-inv'})},
      {id:'anadir', name:'Botón añadir', html:`<button class="primary-btn glass-tap" id="addSubBtn" style="margin-top:16px;">${ic('plus',15)} Añadir pago, cita o inversión</button>`},
    ]);
    bindBloques('suscripciones', root);

    bindSegPeriodo(root, null);
    root.querySelectorAll('.saldo-num').forEach(fitBigNumber);
    bindSubSwitch(root);
    bindSrCarrusel(root);
    bindDesglose(root);
    const histBtn = document.getElementById('subHistBtn');
    if(histBtn) histBtn.onclick = ()=>{ if(!editMode){ subHistLimit = 30; abreSubHistorial(); } };
    if(document.getElementById('addSubBtn')) document.getElementById('addSubBtn').onclick = ()=>{ if(!editMode) openSubWizard(null); };

    /* Abrir y cerrar el detalle sin repintar la lista entera, para que el
       movimiento sea continuo. Solo una abierta a la vez. */
    root.querySelectorAll('[data-subopen]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        if(editMode) return;
        /* El lápiz vive dentro de la cabecera: al tocarlo no se despliega. */
        if(e.target.closest && e.target.closest('[data-subedit]')) return;
        const card = el.closest('.sub-card');
        if(!card) return;
        if(wasLongPress(card)) return;
        if(armedSubId === card.dataset.subid){ armedSubId = null; renderSuscripciones(); return; }
        const id = el.dataset.subopen;
        const yaEstaba = openSubId === id;
        const abierta = root.querySelector('.sub-card.open');
        if(abierta && abierta !== card) cierraCajon(abierta, '.sub-drop');
        openSubId = yaEstaba ? null : id;
        if(yaEstaba) cierraCajon(card, '.sub-drop');
        else abreCajon(card, '.sub-drop');
      };
      /* La cabecera ya no es un <button>, así que el teclado hay que atenderlo
         a mano para que siga abriéndose con Intro o con la barra espaciadora. */
      el.onkeydown = (e)=>{
        if(e.key !== 'Enter' && e.key !== ' ') return;
        if(e.target !== el) return;
        e.preventDefault();
        el.click();
      };
    });

    /* Apuntar el pago: sale el dinero, se guarda la fecha y el bloque salta al
       siguiente ciclo. */
    const pagaSub = async (sub)=>{
      const ts = Date.now();
      registerSubscriptionPayment(sub, ts);
      sub.lastChargedTs = ts;
      /* Un pago puntual no tiene siguiente: al pagarlo queda completado y se
         queda en la lista enseñando lo que costó, hasta que lo finalices. */
      if(subPuntual(sub)) sub.done = true;
      else if(!subLibre(sub)) sub.nextTs = subAdvance(sub);
      await saveState(); render();
      showToast(subPuntual(sub)
        ? `${sub.name}: ${fmt(sub.amount)} pagado. Era un pago único, ya está completado.`
        : subLibre(sub)
          ? `${sub.name}: ${fmt(sub.amount)} apuntado.`
          : `${sub.name}: ${fmt(sub.amount)} registrado. Próximo pago el ${fmtDateShort(sub.nextTs)}.`);
    };
    root.querySelectorAll('[data-subpay]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const sub = state.subscriptions.find(s=>s.id===el.dataset.subpay);
        if(!sub) return;
        /* Si el bloque aún está en verde, se pregunta: pagar de más es fácil y
           deshacerlo, engorroso. */
        if(subUrgency(sub) === 'ok'){
          const ult = sub.lastChargedTs
            ? 'Tu último pago fue el ' + fmtDateShort(sub.lastChargedTs) + '.'
            : 'Todavía no has registrado ningún pago de esto.';
          confirmSheet('¿Seguro que quieres pagar ahora?',
            `Aún faltan ${daysUntil(sub.nextTs)} días para el próximo cobro de "${escapeHTML(sub.name)}". ${ult}`,
            'Sí, pagar ahora', ()=>pagaSub(sub));
          return;
        }
        pagaSub(sub);
      };
    });

    /* Devolver el último pago y quitar el bloque. */
    root.querySelectorAll('[data-subrefund]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const sub = state.subscriptions.find(s=>s.id===el.dataset.subrefund);
        if(!sub) return;
        const suyos = state.transactions.filter(t=>t.subId === sub.id).sort((a,b)=>b.ts-a.ts);
        const ultimo = suyos.find(t=>t.category !== 'Comisión') || null;
        /* La comisión de esa misma compra vuelve con ella. */
        const comision = ultimo ? suyos.find(t=>t.category === 'Comisión' && Math.abs(t.ts - ultimo.ts) <= 2) : null;
        const total = +((ultimo ? ultimo.amount : 0) + (comision ? comision.amount : 0)).toFixed(2);
        const cuenta = accountMeta(sub.account).label;
        confirmSheet('Reembolsar',
          ultimo
            ? `Se devuelven ${fmt(total)} a ${escapeHTML(cuenta)}, se borra ese movimiento del historial y "${escapeHTML(sub.name)}" desaparece de la lista.`
            : `"${escapeHTML(sub.name)}" no tiene ningún pago registrado, así que solo desaparece de la lista.`,
          'Reembolsar', async ()=>{
            const copia = JSON.stringify({s:state.subscriptions, t:state.transactions, w:state.wallets,
                                          p:state.platforms, rf:state.subRefunds || []});
            if(ultimo){
              adjustAccount(sub.account || 'banco', total);
              const fuera = [ultimo.id].concat(comision ? [comision.id] : []);
              state.transactions = state.transactions.filter(t=>fuera.indexOf(t.id) < 0);
              /* El reembolso se anota aparte: al borrar el movimiento y la
                 suscripción no quedaría ni rastro de que aquello existió, y el
                 historial tiene que poder enseñarlo. */
              if(!Array.isArray(state.subRefunds)) state.subRefunds = [];
              state.subRefunds.push({id:'rf'+Date.now().toString(36), subId:sub.id, name:sub.name,
                amount:total, ts:Date.now(), cuenta:cuenta,
                tipo: sub.kind === 'inversion' ? 'inversion' : 'suscripcion'});
            }
            state.subscriptions = state.subscriptions.filter(s=>s.id !== sub.id);
            if(openSubId === sub.id) openSubId = null;
            await saveState(); render();
            showUndoToast(ultimo ? `${fmt(total)} devueltos a ${cuenta}` : 'Bloque eliminado', async ()=>{
              const prev = JSON.parse(copia);
              state.subscriptions = prev.s; state.transactions = prev.t;
              state.wallets = prev.w; state.platforms = prev.p;
              if(prev.rf) state.subRefunds = prev.rf;
              await saveState(); render();
            });
          }, true);
      };
    });

    /* Finalizar: se cobra por última vez y el bloque se va. */
    /* ---- Aplazar: mover la fecha sin pagar nada ----
       El bloque sigue vivo e igual que estaba; lo único que cambia es su día.
       Queda anotado para poder verlo luego en el historial. */
    root.querySelectorAll('[data-subdelay]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        if(editMode) return;
        const sub = state.subscriptions.find(s=>s.id===el.dataset.subdelay);
        if(sub) abreAplazar(sub);
      };
    });

    root.querySelectorAll('[data-subend]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        if(editMode) return;
        const sub = state.subscriptions.find(s=>s.id===el.dataset.subend);
        if(!sub) return;
        /* Un pago puntual ya cobrado no tiene nada que cobrar: finalizar es
           solo quitarlo de la lista. */
        const yaPagado = subCompletada(sub);
        confirmSheet('Finalizar',
          yaPagado
            ? `"${escapeHTML(sub.name)}" ya está pagado. Al finalizar sale de la lista; el movimiento se queda en el historial.`
            : `Se registra el cobro de ${fmt(sub.amount)} y "${escapeHTML(sub.name)}" desaparece de la lista. El movimiento se queda en el historial.`,
          yaPagado ? 'Finalizar' : 'Cobrar y finalizar', ()=>{
            /* Antes de cerrar, se pregunta por la descripción: es el último
               momento en el que uno se acuerda de por qué lo finalizó. */
            pideDescripcionFinal(sub, yaPagado);
          });
      };
    });

    root.querySelectorAll('[data-subedit]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        openSubWizard(state.subscriptions.find(s=>s.id===el.dataset.subedit));
      };
    });
    root.querySelectorAll('[data-subid]').forEach(el=>{
      attachLongPress(el, ()=>{ armedSubId = el.dataset.subid; armedSubAt = Date.now(); renderSuscripciones(); });
    });
    root.querySelectorAll('[data-delconfirm-sub]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const id = el.dataset.delconfirmSub;
        deletingSubId = id; renderSuscripciones();
        setTimeout(async ()=>{
          const removed = state.subscriptions.find(s=>s.id===id);
          state.subscriptions = state.subscriptions.filter(s=>s.id!==id);
          armedSubId=null; deletingSubId=null;
          if(openSubId === id) openSubId = null;
          await saveState(); render();
          if(removed){
            showUndoToast('Suscripción eliminada', async ()=>{
              state.subscriptions.push(removed);
              await saveState(); render();
            });
          }
        }, 420);
      };
    });
  }

  /* ---- Alta y edición: una suscripción o una inversión que se repite ----
     El formulario se abre por bloques. Hasta que no dices qué es el pago no se
     enciende el siguiente, y cada bloque espera a que el anterior esté resuelto.
     Si es una inversión cambian las preguntas: el tipo, lo que pagas, lo que se
     lleva el bróker y cuántas participaciones te quedan. */
  /* ============ LAS CATEGORÍAS QUE DE VERDAD USAS ============
     La rejilla entera de categorías obliga a buscar entre quince cosas para
     elegir la de siempre. Aquí salen las seis que más veces has usado —contando
     tus propios movimientos, no lo que costaron— y el resto queda a un toque.
     Mientras no haya historial suficiente se rellena con las de arranque, que
     son las que casi todo el mundo acaba usando. */
  const CAT_ARRANQUE = ['Vivienda','Comida','Transporte','Ocio','Compras','Salud y cuidado'];
  function catsMasUsadas(n){ return catsPorUso().slice(0, n || 6); }
  /* Todas las categorías de gasto, de la más usada a la que menos. */
  function catsPorUso(){
    const disponibles = gastoCats();
    const veces = {};
    state.transactions.forEach(t=>{
      if(t.kind !== 'gasto' || t.transfer) return;
      if(!disponibles[t.category]) return;
      veces[t.category] = (veces[t.category] || 0) + 1;
    });
    state.subscriptions.forEach(s=>{
      if(!s || !disponibles[s.category]) return;
      veces[s.category] = (veces[s.category] || 0) + 1;
    });
    const orden = Object.keys(veces).sort((a,b)=>veces[b] - veces[a]);
    const fuera = new Set(orden);
    CAT_ARRANQUE.forEach(c=>{ if(disponibles[c] && !fuera.has(c)){ orden.push(c); fuera.add(c); } });
    Object.keys(disponibles).forEach(c=>{ if(!fuera.has(c)){ orden.push(c); fuera.add(c); } });
    return orden;
  }

  /* ============ EL ASISTENTE DE UN BLOQUE NUEVO ============
     Antes todo el formulario cabía en una sola hoja larguísima: diez apartados
     uno detrás de otro, con los de abajo apagados hasta que rellenabas los de
     arriba. Funcionaba, pero obligaba a mirar diez cosas para contestar una.

     Ahora es una pregunta por pantalla, como el botón de añadir un movimiento:
     contestas, pulsas Continuar y aparece la siguiente. Continuar no se
     enciende hasta que lo que pide está, así que no hay forma de llegar al
     final con un hueco. Atrás te devuelve a la anterior sin perder nada.

     El recorrido cambia según lo que sea: una inversión pregunta por el bróker
     y una cita por la hora exacta; una suscripción no tiene pago puntual,
     porque lo que no se repite no es una suscripción. */
  function openSubWizard(existing, preset){
    const isNew = !existing;
    const base = {fee:null, units:null, invType:null, indefinido:false, cita:false, costUndefined:false, time:''};
    const draft = existing
      ? Object.assign({}, base, existing)
      : Object.assign({}, base, {
          id:'s'+Date.now().toString(36), name:'', amount:null, cycle:'mensual', kind:null,
          category:'Ocio', account:'banco', targetPlatform:null,
          nextTs: advanceDate(Date.now(), 'mensual'), lastChargedTs:null, note:'',
          active:true, autoCharge:true, done:false,
        }, preset || {});
    const cuentasGasto = allAccounts().map(a=>({v:a.id, label:a.name, icon:a.icon}));
    const cuentasInv = state.platforms.map(p=>({v:'platform:'+p.id, label:p.name, icon:p.icon || 'card'}));
    let verTodas = false;      /* la rejilla completa de categorías */
    let i = 0;                 /* en qué paso estamos */

    const esInv  = ()=> draft.kind === 'inversion';
    const esOtro = ()=> draft.kind === 'otro';
    const esCita = ()=> !!draft.cita;
    const cuentas = ()=> esInv() ? cuentasInv : cuentasGasto;

    /* El recorrido, en orden. Se recalcula en cada paso porque lo que elijas
       cambia lo que viene después. */
    function pasos(){
      const p = ['tipo'];
      if(esOtro()) p.push('tipoOtro');
      p.push(esInv() ? 'invTipo' : 'nombre');
      p.push('importe');
      if(esInv()) p.push('broker');
      if(!esCita()) p.push('ritmo');
      p.push('categoria');
      if(esCita()){
        p.push('hora');
        p.push('coste');
      }
      p.push('cuenta');
      if(!esCita()) p.push('cuando');
      p.push('nota');
      return p;
    }

    /* ---- Qué pide cada paso y cuándo se da por contestado ---- */
    const DEF = {
      tipo: {
        t:'¿Qué es este pago?', s:'Elige primero: el resto cambia según lo que sea',
        ok: ()=> !!draft.kind,
        html: ()=>`<div class="chip-grid">
          <div class="chip ${draft.kind==='gasto'?'active':''}" data-w="kind:gasto">${ic('repeat',14)} Suscripción</div>
          <div class="chip ${draft.kind==='inversion'?'active':''}" data-w="kind:inversion">${ic('trending',14)} Inversión</div>
          <div class="chip ${draft.kind==='otro'?'active':''}" data-w="kind:otro">${ic('sparkle',14)} Otro tipo</div>
        </div>`,
      },
      tipoOtro: {
        t:'¿Qué tipo es?', s:'Lo que escribas saldrá como etiqueta en la tarjeta',
        ok: ()=> !!String(draft.otroLabel||'').trim(),
        html: ()=>`<input type="text" id="wOtro" maxlength="24" placeholder="Cuota, préstamo, seguro, membresía..." value="${escapeHTML(draft.otroLabel||'')}">`,
        lee: ()=>{ const e = sheetBody.querySelector('#wOtro'); if(e) draft.otroLabel = e.value; },
      },
      nombre: {
        t:'¿Cómo se llama?', s:'El nombre con el que lo reconocerás en la lista',
        ok: ()=> !!String(draft.name||'').trim(),
        html: ()=>`<input type="text" id="wName" maxlength="34" placeholder="Netflix, gimnasio, el dentista..." value="${escapeHTML(draft.name||'')}">`,
        lee: ()=>{ const e = sheetBody.querySelector('#wName'); if(e) draft.name = e.value; },
      },
      invTipo: {
        t:'Tipo de inversión', s:'Qué clase de activo es',
        ok: ()=> !!draft.invType,
        html: ()=>`<div class="chip-grid">${INV_TIPOS.map(t=>
          `<div class="chip small ${draft.invType===t.id?'active':''}" data-w="invType:${t.id}">${ic(t.icon,13)} ${t.label}</div>`).join('')}</div>`,
      },
      importe: {
        t: ()=> esInv() ? 'Precio de inversión' : 'Importe de cada pago',
        s: ()=> esInv() ? 'Lo que pones de tu bolsillo, sin contar la comisión' : 'Cuánto cuesta cada vez',
        ok: ()=> draft.amount > 0,
        html: ()=>`<input type="number" inputmode="decimal" id="wAmount" placeholder="0.00" value="${draft.amount!=null?draft.amount:''}">`,
        lee: ()=>{ const e = sheetBody.querySelector('#wAmount'); if(e) draft.amount = e.value===''?null:parseFloat(e.value); },
      },
      broker: {
        t:'Comisión y cantidad', s:'La comisión se apunta como gasto aparte, no como dinero invertido',
        ok: ()=> draft.fee != null && String(draft.fee) !== '' && draft.units > 0,
        html: ()=>`<div class="sf-dos">
          <div><input type="number" inputmode="decimal" id="wFee" placeholder="0.00" value="${draft.fee!=null?draft.fee:''}">
            <div class="sf-hint">Comisión del bróker</div></div>
          <div><input type="number" inputmode="decimal" id="wUnits" placeholder="0" value="${draft.units!=null?draft.units:''}">
            <div class="sf-hint">Cantidad adquirida</div></div>
        </div>`,
        lee: ()=>{
          const f = sheetBody.querySelector('#wFee'), u = sheetBody.querySelector('#wUnits');
          if(f) draft.fee = f.value===''?null:parseFloat(f.value);
          if(u) draft.units = u.value===''?null:parseFloat(u.value);
        },
      },
      ritmo: {
        t:'¿Cada cuánto se paga?', s: ()=> esOtro() ? 'Si pasa una sola vez, elige Pago puntual' : 'Con qué frecuencia te lo cobran',
        ok: ()=> !!draft.cycle,
        /* Pago puntual solo para "Otro tipo": una suscripción o una aportación
           que no se repiten no son una suscripción ni una aportación. */
        html: ()=>`<div class="chip-grid">${CYCLE_KEYS
          .filter(k => esOtro() || !CYCLES[k].unico)
          .map(k=>`<div class="chip small ${CYCLES[k].unico?'unico ':''}${draft.cycle===k?'active':''}" data-w="cycle:${k}">${CYCLES[k].unico?ic('calendar',13)+' ':''}${CYCLES[k].label}</div>`).join('')}</div>`,
      },
      categoria: {
        t: ()=> esInv() ? 'Tipo de aportación' : '¿Qué categoría?',
        s: ()=> esInv() ? 'Dónde encaja esta aportación' : 'Mantén pulsado para ver ejemplos',
        ok: ()=> !!draft.category,
        html: ()=>{
          if(esInv()) return `<div class="chip-grid">${['Inversión','Ahorro','Plan de pensiones']
            .map(c=>`<div class="chip small ${draft.category===c?'active':''}" data-w="cat:${escapeHTML(c)}">${escapeHTML(c)}</div>`).join('')}</div>`;
          return catFichasHTML(k=>`data-w="cat:${escapeHTML(k)}"`, esCita() ? null : draft.category) + `
            <div class="other-type-wrap">
              <div class="other-split">
                <div class="chip other-type ${(!esCita() && draft.category==='Otro tipo')?'active':''}" data-w="cat:Otro tipo">${ic('sparkle')} Otro</div>
                <div class="chip new-cat" id="wNewCat" role="button" tabindex="0">${ic('plus')} Nueva categoría</div>
              </div>
              ${esOtro() ? `<div class="chip cita w-cita ${esCita()?'active':''}" data-w="cita:1">${ic('calendar',13)} Citas y consultas</div>` : ''}
            </div>`;
        },
      },
      hora: {
        t:'¿A qué hora?', s:'Te avisaré ese día a esa hora exacta',
        ok: ()=> /^\d{1,2}:\d{2}$/.test(draft.time || ''),
        html: ()=>`<div class="field-label">Día</div>
          <input type="date" id="wFecha" value="${toDateInput(draft.nextTs)}">
          <div class="field-label">Hora</div>
          <input type="time" id="wHora" value="${escapeHTML(draft.time||'')}">`,
        lee: ()=>{
          const f = sheetBody.querySelector('#wFecha'), h = sheetBody.querySelector('#wHora');
          if(f && fromDateInput(f.value)) draft.nextTs = fromDateInput(f.value);
          if(h) draft.time = h.value;
        },
      },
      coste: {
        t:'¿Cuánto va a costar?', s:'Si todavía no lo sabes, déjalo sin definir',
        ok: ()=> draft.costUndefined === true || draft.amount > 0,
        html: ()=>`<div class="chip-grid">
            <div class="chip small ${!draft.costUndefined?'active':''}" data-w="coste:valor">${ic('coin',13)} Coste de la acción</div>
            <div class="chip small ${draft.costUndefined?'active muted':''}" data-w="coste:sin">${ic('clock',13)} Sin definir</div>
          </div>
          ${draft.costUndefined ? `<div class="sf-hint">Lo apuntas sin importe; cuando llegue el día te lo preguntaré.</div>`
            : `<input type="number" inputmode="decimal" id="wCoste" placeholder="0.00" style="margin-top:9px;" value="${draft.amount!=null?draft.amount:''}">`}`,
        lee: ()=>{ const e = sheetBody.querySelector('#wCoste'); if(e && !draft.costUndefined) draft.amount = e.value===''?null:parseFloat(e.value); },
      },
      cuenta: {
        t:'¿Desde dónde se paga?', s: ()=> esInv() ? 'Solo se puede invertir desde un neo banco' : 'La cuenta de la que sale el dinero',
        ok: ()=> cuentas().some(c=>c.v === draft.account),
        html: ()=> cuentas().length
          ? `<div class="chip-grid">${cuentas().map(a=>
              `<div class="chip small ${draft.account===a.v?'active':''}" data-w="acc:${escapeHTML(a.v)}">${ic(a.icon,13)} ${escapeHTML(a.label)}</div>`).join('')}</div>`
          : `<div class="sf-hint">Todavía no tienes ningún neo banco. Añade uno desde Carteras › Neo bancos y vuelve aquí.</div>`,
      },
      cuando: {
        t:'¿Cuándo es el próximo pago?', s:'La fecha a partir de la que empieza a contar',
        ok: ()=> !!draft.indefinido || !!draft.nextTs,
        html: ()=>`${draft.cycle === 'puntual' ? '' : `<div class="chip-grid">
            <div class="chip small ${!draft.indefinido?'active':''}" data-w="when:fecha">${ic('calendar',13)} Elegir fecha</div>
            <div class="chip small ${draft.indefinido?'active':''}" data-w="when:libre">${ic('clock',13)} Indefinido</div>
          </div>`}
          ${draft.indefinido
            ? `<div class="sf-hint">Sin fecha: no se cobra solo ni te avisa. Lo apuntas tú cuando quieras.</div>`
            : `<input type="date" id="wFecha2" style="margin-top:9px;" value="${toDateInput(draft.nextTs)}">`}`,
        lee: ()=>{ const e = sheetBody.querySelector('#wFecha2'); if(e && fromDateInput(e.value)) draft.nextTs = fromDateInput(e.value); },
      },
      nota: {
        t: ()=> esInv() ? 'Concepto' : 'Una nota (opcional)',
        s: ()=> esInv() ? 'Obligatorio: es lo que verás como nombre de la inversión' : 'Puedes dejarlo en blanco',
        ok: ()=> esInv() ? !!String(draft.note||'').trim() : true,
        html: ()=>`<input type="text" id="wNota" maxlength="70" placeholder="${esInv()?'Aportación mensual al fondo indexado...':'Plan familiar, cuota anual del club...'}" value="${escapeHTML(draft.note||'')}">
          ${(!esCita() && !draft.indefinido && draft.cycle !== 'puntual') ? `<div class="toggle-row" id="wAutoRow" style="margin-top:14px;">
            <div>
              <div class="tr-title">${ic('bolt',14)} Registrar el pago solo</div>
              <div class="tr-sub">Al llegar la fecha, la app apunta el movimiento sin que hagas nada.</div>
            </div>
            <div class="switch ${draft.autoCharge!==false?'on':''}" id="wAutoSw"><span></span></div>
          </div>` : ''}`,
        lee: ()=>{ const e = sheetBody.querySelector('#wNota'); if(e) draft.note = e.value; },
      },
    };
    const val = (x)=> typeof x === 'function' ? x() : x;

    function leeActual(){
      const def = DEF[pasos()[i]];
      if(def && def.lee) def.lee();
    }

    function pinta(){
      clearIdleHint();
      const lista = pasos();
      if(i >= lista.length) i = lista.length - 1;
      if(i < 0) i = 0;
      const id = lista[i];
      const def = DEF[id];
      const ultimo = i === lista.length - 1;
      const listo = def.ok();
      openOverlay(`
        <div class="w-pasos">${lista.map((p,n)=>`<i class="${n<i?'ok':n===i?'on':''}"></i>`).join('')}</div>
        <h3>${escapeHTML(val(def.t))}</h3>
        <div class="step-label metal-text">Paso ${i+1} de ${lista.length}</div>
        ${val(def.html)}
        <div class="sheet-actions">
          <button class="ghost-btn" id="wBack">${i === 0 ? 'Cancelar' : 'Atrás'}</button>
          <button class="primary-btn glass-tap ${listo?'':'is-locked'}" id="wNext" style="margin-top:0;">${ultimo ? (isNew?'Añadir':'Guardar') : 'Continuar'}</button>
        </div>`);

      /* Escribir no repinta la hoja (perderías el cursor): solo enciende o
         apaga el botón de continuar. */
      sheetBody.querySelectorAll('input').forEach(el=>{
        el.addEventListener('input', ()=>{
          leeActual();
          const b = sheetBody.querySelector('#wNext');
          if(b) b.classList.toggle('is-locked', !def.ok());
        });
        el.addEventListener('change', ()=>{
          leeActual();
          const b = sheetBody.querySelector('#wNext');
          if(b) b.classList.toggle('is-locked', !def.ok());
        });
        el.addEventListener('keydown', (e)=>{
          if(e.key === 'Enter'){ e.preventDefault(); sheetBody.querySelector('#wNext').click(); }
        });
      });

      /* Todas las opciones de todos los pasos pasan por el mismo sitio. */
      sheetBody.querySelectorAll('[data-w]').forEach(el=>{
        el.onclick = ()=>{
          if(wasLongPress(el)) return;
          leeActual();
          /* Elegir una opción puede cambiar el recorrido entero (una cita se
             salta el ritmo, una inversión añade el bróker). Se guarda en qué
             paso estábamos por su nombre, no por su número, y después se vuelve
             a buscar: así el índice nunca apunta a otro paso distinto. */
          const idAntes = pasos()[i];
          const [k, v] = el.dataset.w.split(':');
          if(k === 'kind'){
            draft.kind = v;
            draft.cita = false;
            if(v === 'inversion'){
              if(!['Inversión','Ahorro','Plan de pensiones'].includes(draft.category)) draft.category = 'Inversión';
              if(!cuentasInv.some(c=>c.v === draft.account)) draft.account = cuentasInv.length ? cuentasInv[0].v : '';
            } else {
              if(!gastoCats()[draft.category]) draft.category = 'Ocio';
              if(!cuentasGasto.some(c=>c.v === draft.account)) draft.account = 'banco';
            }
            /* Ni una inversión ni una suscripción pueden ser de una sola vez. */
            if(v !== 'otro' && draft.cycle === 'puntual') draft.cycle = 'mensual';
          }
          else if(k === 'invType') draft.invType = v;
          else if(k === 'cycle') draft.cycle = v;
          else if(k === 'cat'){ draft.category = v; draft.cita = false; }
          else if(k === 'verTodas'){ verTodas = v === '1'; pinta(); return; }
          else if(k === 'cita'){
            /* Una cita es siempre de una sola vez y nunca se cobra sola. */
            draft.cita = true; draft.category = CITA_CAT;
            draft.cycle = 'puntual'; draft.autoCharge = false; draft.indefinido = false;
            if(!draft.time) draft.time = '09:00';
          }
          else if(k === 'acc') draft.account = v;
          else if(k === 'when'){ draft.indefinido = v === 'libre'; }
          else if(k === 'coste'){
            draft.costUndefined = v === 'sin';
            if(draft.costUndefined) draft.amount = 0;
          }
          const iNuevo = pasos().indexOf(idAntes);
          if(iNuevo >= 0) i = iNuevo;
          /* Elegir una opción ya es contestar: se pasa sola a la siguiente,
             menos en los pasos que además piden escribir algo después. */
          const quedarse = (k === 'when' && !draft.indefinido) || (k === 'coste' && !draft.costUndefined);
          if(quedarse){ pinta(); return; }
          avanza();
        };
      });

      /* En el paso de categoría: ejemplos al mantener pulsado, categoría nueva
         sin salir del asistente y el aviso de ayuda si te quedas parado. */
      if(id === 'categoria' && !esInv()){
        sheetBody.querySelectorAll('.cat-card[data-w]').forEach(el=>{
          const cat = el.dataset.w.slice(4);
          if(CAT_EXAMPLES[cat]) attachLongPress(el, ()=>openCategoryExamples(cat));
        });
        const nc = sheetBody.querySelector('#wNewCat');
        if(nc) nc.onclick = ()=>openNewCategory(
          nombre=>{ draft.category = nombre; draft.cita = false; avanza(); }, ()=>pinta());
        startIdleHint('Mantén pulsado en una de las categorías para ver más ejemplos', 5000);
      }

      const sw = sheetBody.querySelector('#wAutoRow');
      if(sw) sw.onclick = ()=>{
        draft.autoCharge = !(draft.autoCharge !== false);
        sheetBody.querySelector('#wAutoSw').classList.toggle('on', draft.autoCharge !== false);
      };

      sheetBody.querySelector('#wBack').onclick = ()=>{
        if(i === 0){ closeOverlay(); return; }
        leeActual(); i--; pinta();
      };
      sheetBody.querySelector('#wNext').onclick = ()=>{
        leeActual();
        if(!def.ok()){
          const campo = sheetBody.querySelector('input');
          if(campo) markInvalid(campo, 'Rellena esto para poder continuar');
          else showToast('Elige una opción para continuar.', true);
          return;
        }
        avanza();
      };
      const primero = sheetBody.querySelector('input[type=text],input[type=number]');
      if(primero) primero.focus();
    }

    function avanza(){
      const lista = pasos();
      if(i >= lista.length - 1){ ticketPago(); return; }
      i++; pinta();
    }
    function ticketPago(){
      clearIdleHint();
      const inv = esInv();
      const tipo = inv ? 'Inversión' : draft.cita ? 'Cita' : draft.kind === 'otro' ? 'Otro pago' : 'Suscripción';
      const nombre = inv ? (String(draft.note||'').trim() || (INV_TIPOS.find(t=>t.id === draft.invType) || {label:'Inversión'}).label) : draft.name;
      const info = draft.category ? catInfo(draft.category, 'gasto') : null;
      const fechaTxt = draft.indefinido ? 'Cuando tú quieras' : fmtDateShort(draft.nextTs) + (draft.cita && draft.time ? ' · ' + draft.time : '');
      abreTicket({
        titulo: tipo + (nombre ? ' · ' + nombre : ''), icono: inv ? 'trending' : draft.cita ? 'calendar' : (info ? info.icon : 'repeat'),
        hex: info ? info.hex : null,
        importe: draft.costUndefined ? 'Coste sin definir' : fmt(+Number(draft.amount||0).toFixed(2)),
        filas: [
          ['Ritmo', draft.cita ? 'Una vez' : cycleOf(draft.cycle).label],
          [inv ? 'Tipo de aportación' : 'Categoría', draft.cita ? '' : draft.category],
          ['Cuenta', draft.account ? accountMeta(draft.account).label : ''],
          [draft.cita ? 'Día y hora' : 'Próximo pago', fechaTxt],
          ['Cobro automático', draft.cita || inv ? '' : siNo(draft.autoCharge !== false)],
          ['Comisión', inv && draft.fee ? fmt(+draft.fee) : ''],
          ['Nota', inv ? '' : draft.note],
        ],
        confirmar: isNew ? 'Añadir' : 'Guardar cambios',
        onVolver: pinta, onConfirmar: guarda,
      });
    }

    async function guarda(){
      const inv = esInv();
      const etiqueta = inv ? (INV_TIPOS.find(t=>t.id === draft.invType) || {label:'Inversión'}).label : '';
      draft.note = String(draft.note||'').slice(0,70);
      draft.name = inv ? (draft.note.trim() || etiqueta).slice(0,34) : String(draft.name||'').trim().slice(0,34);
      draft.amount = +Number(draft.amount || 0).toFixed(2);
      draft.fee = inv ? +Number(draft.fee || 0).toFixed(2) : null;
      draft.units = inv ? +Number(draft.units) : null;
      draft.invLabel = inv ? etiqueta : null;
      draft.invType = inv ? draft.invType : null;
      draft.otroLabel = draft.kind === 'otro' ? (draft.cita ? 'Cita o consulta' : String(draft.otroLabel||'').trim().slice(0,24)) : null;
      draft.targetPlatform = null;
      draft.active = true;
      /* Una cita guarda su hora dentro de la fecha: es lo que la hace sonar al
         minuto exacto y no al empezar el día. */
      if(draft.cita){
        const h = String(draft.time||'09:00').split(':').map(Number);
        const d0 = new Date(draft.nextTs);
        draft.nextTs = new Date(d0.getFullYear(), d0.getMonth(), d0.getDate(), h[0]||0, h[1]||0, 0, 0).getTime();
        draft.cycle = 'puntual';
        draft.category = CITA_CAT;
      }
      draft.anchorDay = new Date(draft.nextTs).getDate();
      if(draft.indefinido || draft.cycle === 'puntual') draft.autoCharge = false;

      let cobradaAlVuelo = false;
      if(isNew) state.subscriptions.push(draft);
      else {
        const k = state.subscriptions.findIndex(s=>s.id===draft.id);
        if(k >= 0) state.subscriptions[k] = Object.assign(state.subscriptions[k], draft);
      }
      const guardada = state.subscriptions.find(s=>s.id === draft.id) || draft;
      if(!guardada.indefinido && guardada.autoCharge !== false && subVencida(guardada)){
        registerSubscriptionPayment(guardada, Date.now());
        guardada.lastChargedTs = Date.now();
        guardada.nextTs = subAdvance(guardada);
        cobradaAlVuelo = true;
      }
      await saveState(); closeOverlay();
      /* Lo que se crea desde el calendario se ve en la lista, que es donde vive. */
      if(isNew) subTab = 'suscripciones';
      render();
      showToast(cobradaAlVuelo
        ? `Pago de "${guardada.name}" registrado. El siguiente es el ${fmtDateShort(guardada.nextTs)}.`
        : (isNew
            ? `"${draft.name}" añadido${draft.cita ? ' · te avisaré el ' + fmtDateShort(draft.nextTs) + ' a las ' + draft.time : (draft.indefinido ? ' sin fecha: lo pagas cuando quieras' : '. Próximo pago el ' + fmtDateShort(draft.nextTs))}.`
            : 'Guardado.'));
    }

    /* Editando algo que ya existe se entra por el primer paso igualmente, pero
       todos vienen contestados: es pulsar Continuar hasta lo que quieras tocar. */
    pinta();
  }

  /* ============ BIENVENIDA ============ */
  let onboardStep = 1;
  let askingSalary = false;
  let onboardDraft = { inicial:null, sueldo:null, trabajando:null };
  /* ---- El cierre de la bienvenida, en un solo sitio ----
     Antes esto vivía dentro del botón del último paso. Ahora se entra por dos
     caminos —contestando el sueldo o diciendo que no trabajas— y los dos tienen
     que guardar exactamente lo mismo: si no, `onboarded` se queda en false y la
     bienvenida vuelve a salir al recargar. */
  async function finalizaOnboarding(sueldo){
    state.salaryMonthly = (sueldo > 0) ? +Number(sueldo).toFixed(2) : 0;
    /* El saldo base es una porción propia del patrimonio, separada del sueldo. */
    state.initialAmount = onboardDraft.inicial || 0;
    /* Lo que has contestado en el paso 2 alimenta la luz del semáforo: si no
       trabajas, el contrato arranca en "sin contrato" y el cobro apagado. */
    state.working = onboardDraft.trabajando !== false;
    if(!state.working){
      contratoCfg().tipo = 'ninguno';
      state.salaryAsk.enabled = false;
    }
    setSalaryForMonth(state.salaryMonthly);
    /* Se marca el mes como ya preguntado: si no, nada más entrar saltaría la
       pantalla de "Nómina del mes" que acabas de decir que no te hace falta. */
    state.salaryAsk.lastAskedMonth = monthKey();
    state.onboarded = true;
    await saveState(); render();
  }
  function renderOnboarding(){
    /* Tres puntitos siempre: son los pasos que tiene la bienvenida, aunque
       contestando que no trabajas se termine antes. */
    const puntos = n => `<div class="onboard-steps">${
      [1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`;
    if(onboardStep === 1){
      root.innerHTML = `
        <div class="onboard-hero">
          <div class="oh-badge">${ic('wallet',26)}</div>
          <h2>¿Cuánto dinero tienes ahora mismo?</h2>
          <p>Suma lo del banco, el efectivo y lo demás.</p>
        </div>
        <div class="onboard-card">
          <div class="field-label">Cantidad inicial</div>
          <div class="big-money">
            <input type="number" inputmode="decimal" id="initialInput" placeholder="0.00" value="${onboardDraft.inicial != null ? onboardDraft.inicial : ''}" />
            <span class="bm-cur">€</span>
          </div>
          <button class="primary-btn glass-tap is-locked" id="initialNext">Continuar</button>
        </div>
        ${puntos(1)}`;
      const inp = document.getElementById('initialInput');
      const btn = document.getElementById('initialNext');
      const sync = ()=>{
        const ok = inp.value.trim() !== '' && parseFloat(inp.value) >= 0;
        btn.classList.toggle('is-locked', !ok);
      };
      inp.addEventListener('input', sync); sync();
      setTimeout(()=>inp.focus(), 120);
      btn.onclick = ()=>{
        const v = parseFloat(inp.value);
        if(!(v >= 0)){ markInvalidEl(inp, 'Escribe la cantidad que tienes ahora, aunque sea 0'); return; }
        onboardDraft.inicial = +v.toFixed(2);
        onboardStep = 2; renderOnboarding();
      };
      return;
    }
    /* Paso 2 · ¿estás trabajando? Es obligatorio: de aquí sale la luz verde o
       roja del bloque de sueldo y contrato. */
    if(onboardStep === 2){
      const sel = onboardDraft.trabajando;
      root.innerHTML = `
        <div class="onboard-hero">
          <div class="oh-badge">${ic('briefcase',26)}</div>
          <h2>¿Estás trabajando actualmente?</h2>
        </div>
        <div class="onboard-card">
          <div class="field-label">Tu situación ahora mismo</div>
          <div class="work-opts">
            <button type="button" class="work-opt ${sel===true?'active':''}" data-work="1">
              <span class="wo-luz ok"></span>
              <span class="wo-t"><b>Sí, estoy trabajando</b><i>Cobro un sueldo o una ayuda cada mes</i></span>
            </button>
            <button type="button" class="work-opt ${sel===false?'active':''}" data-work="0">
              <span class="wo-luz no"></span>
              <span class="wo-t"><b>No, ahora mismo no</b><i>Sin contrato o en paro: el cobro queda apagado</i></span>
            </button>
          </div>
          <div class="wallet-btn-row" style="margin-top:14px;">
            <button class="ghost-btn glass-tap" id="workBack">Atrás</button>
            <button class="primary-btn glass-tap ${sel===null?'is-locked':''}" id="workNext" style="margin-top:0;flex:1.6;">${sel === false ? 'Empezar' : 'Continuar'}</button>
          </div>
        </div>
        ${puntos(2)}`;
      root.querySelectorAll('[data-work]').forEach(b=>{
        b.onclick = ()=>{
          onboardDraft.trabajando = b.dataset.work === '1';
          renderOnboarding();
        };
      });
      document.getElementById('workBack').onclick = ()=>{ onboardStep = 1; renderOnboarding(); };
      document.getElementById('workNext').onclick = async ()=>{
        if(onboardDraft.trabajando === null){
          showToast('Dime si estás trabajando ahora mismo para seguir.', true);
          return;
        }
        /* Diciendo que no trabajas, la bienvenida se acaba aquí: preguntarte el
           sueldo no tendría sentido. Se guarda todo igual que si hubieras
           llegado al final, con el sueldo a cero. */
        if(onboardDraft.trabajando === false){ await finalizaOnboarding(0); return; }
        onboardStep = 3; renderOnboarding();
      };
      return;
    }
    root.innerHTML = `
      <div class="onboard-hero">
        <div class="oh-badge">${ic('briefcase',26)}</div>
        <h2>¿Cuánto sueles cobrar al mes?</h2>
      </div>
      <div class="onboard-card">
        <div class="field-label">Sueldo mensual de referencia</div>
        <div class="big-money">
          <input type="number" inputmode="decimal" id="salaryInput" placeholder="0.00" value="${onboardDraft.sueldo != null ? onboardDraft.sueldo : ''}" />
          <span class="bm-cur">€</span>
        </div>
        <div class="onboard-hint metal-text">Déjalo en 0 si aún no tienes un sueldo fijo.</div>
        <div class="wallet-btn-row" style="margin-top:14px;">
          <button class="ghost-btn glass-tap" id="salaryBack">Atrás</button>
          <button class="primary-btn glass-tap" id="saveSalaryBtn" style="margin-top:0;flex:1.6;">Empezar</button>
        </div>
      </div>
      ${puntos(3)}`;
    const sInp = document.getElementById('salaryInput');
    setTimeout(()=>sInp.focus(), 120);
    document.getElementById('salaryBack').onclick = ()=>{ onboardStep = 2; renderOnboarding(); };
    document.getElementById('saveSalaryBtn').onclick = ()=>finalizaOnboarding(parseFloat(sInp.value));
  }
  /* Pregunta mensual del sueldo. Aparece sola cuando llega el día y la hora
     que hayas configurado, y no vuelve a salir hasta el mes siguiente. */
  function renderSalaryAsk(){
    const acc = nominaPendiente() || 'banco';
    const N = nomCfg(acc);
    const nombreNom = acc === 'banco' ? 'Nómina' : accountMeta(acc).label;
    const n = now();
    const sugerido = N.salaryMonthly || 0;
    root.innerHTML = `
      <div class="onboard-hero">
        <div class="oh-badge">${ic('briefcase',26)}</div>
        <h2>¿Cuánto has cobrado en ${MESES[n.getMonth()]}?</h2>${acc === 'banco' ? '' : `<p class="oh-sub"><b>${escapeHTML(nombreNom)}</b></p>`}
      </div>
      <div class="onboard-card">
        <div class="field-label">Sueldo de ${MESES[n.getMonth()]} ${n.getFullYear()}</div>
        <div class="big-money">
          <input type="number" inputmode="decimal" id="askSalaryInput" placeholder="0.00" value="${sugerido || ''}" />
          <span class="bm-cur">€</span>
        </div>
        <div class="wallet-btn-row" style="margin-top:14px;">
          <button class="ghost-btn glass-tap" id="askSalaryZero">Este mes no cobro</button>
          <button class="primary-btn glass-tap" id="askSalarySave" style="margin-top:0;flex:1.6;">Guardar</button>
        </div>
      </div>`;
    const inp = document.getElementById('askSalaryInput');
    setTimeout(()=>inp.focus(), 120);
    const commit = async (value)=>{
      setSalaryForMonth(value, undefined, acc);
      if(value > 0) N.salaryMonthly = value;
      N.salaryAsk.lastAskedMonth = monthKey();
      askingSalary = false;
      await saveState(); render();
      showToast(value > 0 ? `Sueldo de ${MESES[n.getMonth()]} guardado.` : `${MESES[n.getMonth()]} queda sin sueldo.`);
    };
    document.getElementById('askSalaryZero').onclick = ()=>commit(0);
    document.getElementById('askSalarySave').onclick = ()=>{
      const v = parseFloat(inp.value);
      commit(v > 0 ? +v.toFixed(2) : 0);
    };
  }

  /* Igual que markInvalid pero para pantallas que no son una hoja. */
  function markInvalidEl(input, msg){
    if(!input) return;
    input.classList.add('input-error');
    let box = input.closest('.onboard-card').querySelector('.form-error');
    if(!box){
      box = document.createElement('div');
      box.className = 'form-error';
      input.closest('.onboard-card').insertBefore(box, input.closest('.onboard-card').querySelector('.primary-btn'));
    }
    box.innerHTML = `${ic('warning',14)} <span></span>`;
    box.querySelector('span').textContent = msg;
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
    input.focus();
  }

  /* ============ ROOT RENDER / NAV ============ */
  function render(){
    /* En Inicio la cabecera va encima del bloque de saldo con degradado. */
    document.body.classList.toggle('on-inicio', !!state.onboarded && !(askingSalary || nominaPendiente()) && activeTab === 'inicio');
    if(!state.onboarded){
      fab.style.display='none'; bottomNav.style.display='none';
      document.getElementById('headerTitle').textContent = 'Control Financiero';
      document.getElementById('themeBtn').style.display = 'flex';
      renderOnboarding();
      return;
    }
    if(askingSalary || nominaPendiente()){
      askingSalary = true;
      fab.style.display='none'; bottomNav.style.display='none';
      document.getElementById('headerTitle').textContent = 'Nómina del mes';
      document.getElementById('themeBtn').style.display = 'flex';
      renderSalaryAsk();
      return;
    }
    fab.style.display='flex'; bottomNav.style.display='flex';
    document.getElementById('themeBtn').style.display = 'flex';
    document.getElementById('headerTitle').textContent =
      activeTab==='inicio' ? saludoHora() :
      activeTab==='limites' ? 'Límites' :
      activeTab==='suscripciones' ? (subTab==='calendario' ? 'Calendario' : 'Pagos') : 'Carteras';
    if(activeTab==='inicio') renderInicio();
    else if(activeTab==='limites') renderLimitesTab();
    else if(activeTab==='suscripciones') renderSuscripciones();
    else renderCarteras();
    bottomNav.querySelectorAll('.nav-item').forEach(el=>{ el.classList.toggle('active', el.dataset.tab===activeTab); });
    aplicaMinCero(root);
    pintaAvisoNotas();
    pintaCabecera();
    bindTextosEditables();
  }
  /* Cambio de pestaña con transición direccional: el contenido entra por el lado
     hacia el que te mueves, igual que en las apps nativas. El calendario ya no
     es una pestaña —vive dentro de Suscripciones, que es donde acaban las cosas
     que apuntas en él— y la cuarta pasa a ser Límites. */
  const TAB_ORDER = ['inicio','carteras','suscripciones','limites'];
  function goTab(tab){
    if(tab === activeTab) return;
    /* Al salir de Carteras, la próxima vez que entres las tarjetas vuelven a
       repartirse, para que la entrada se vea igual de bien siempre. */
    if(activeTab === 'carteras') platDealt = false;
    const dir = TAB_ORDER.indexOf(tab) > TAB_ORDER.indexOf(activeTab) ? 'fwd' : 'back';
    document.documentElement.dataset.nav = dir;
    activeTab = tab;
    if(document.startViewTransition && !prefersReducedMotion()){
      document.startViewTransition(()=>render());
    } else render();
  }
  bottomNav.querySelectorAll('.nav-item').forEach(el=>{
    el.onclick = ()=>goTab(el.dataset.tab);
  });

  /* ============ CATEGORY EXAMPLES MODAL ============ */
  function openCategoryExamples(cat){
    const info = catInfo(cat, 'gasto');
    const items = CAT_EXAMPLES[cat] || [];
    exampleModalBody.innerHTML = `
      <h4>${ic(info.icon)} ${cat}</h4>
      <p class="sub">Algunas cosas que suelen contar como "${cat}":</p>
      <div class="example-list">${items.map(i=>`<span class="example-chip">${escapeHTML(i)}</span>`).join('')}</div>
      <button class="primary-btn glass-tap" id="closeExampleBtn" style="margin-top:0;">Entendido</button>
    `;
    exampleOverlay.classList.add('show');
    document.getElementById('closeExampleBtn').onclick = ()=>exampleOverlay.classList.remove('show');
  }
  exampleOverlay.addEventListener('click', e=>{ if(e.target===exampleOverlay) exampleOverlay.classList.remove('show'); });

  /* ============ WIZARD ============ */
  let wizard = {};
  function openOverlay(html){
    clearIdleHint();
    sheetBody.innerHTML = `<div class="sheet-handle"></div>` + html;
    aplicaMinCero(sheetBody);
    overlay.classList.add('show');
    if(typeof aplicaTextosLibres === 'function') aplicaTextosLibres(sheetBody.parentElement || document);
  }
  function closeOverlay(){ clearIdleHint(); overlay.classList.remove('show'); }
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeOverlay(); });

  /* ---- Revisar datos: el ticket antes de guardar ----
     Al final de todo lo que crea o registra algo sale un resumen con lo que
     has metido. "Corregir" vuelve al último paso sin perder nada; "Confirmar"
     lo guarda. `filas` es una lista de [etiqueta, valor]; las vacías no salen. */
  function abreTicket(o){
    const ahora = new Date();
    const fecha = ahora.getDate() + ' ' + MESES[ahora.getMonth()].slice(0,3) + ' ' + ahora.getFullYear() + ' · ' + pad2(ahora.getHours()) + ':' + pad2(ahora.getMinutes());
    const filas = (o.filas || []).filter(f=>f && f[1] != null && String(f[1]).trim() !== '');
    openOverlay(`<h3>Revisar datos</h3>
      <div class="ticket" style="--tk:${o.hex || 'var(--accent)'}">
        <div class="tk-head">
          <span class="tk-ico">${ic(o.icono || 'receipt', 19)}</span>
          <span class="tk-t"><b>${escapeHTML(o.titulo || 'Resumen')}</b><i>${fecha}</i></span>
        </div>
        ${o.importe != null ? `<div class="tk-amount ${o.signo || ''}">${escapeHTML(o.importe)}</div>` : ''}
        <div class="tk-rows">${filas.map(([k,v])=>`<div class="tk-row"><span>${escapeHTML(k)}</span><b>${escapeHTML(String(v))}</b></div>`).join('')}</div>
      </div>
      <div class="sheet-actions">
        <button class="ghost-btn" id="tkBack">${ic('edit',13)} Corregir</button>
        <button class="primary-btn glass-tap" id="tkOk" style="margin-top:0;">${ic('check',15)} ${escapeHTML(o.confirmar || 'Confirmar')}</button>
      </div>`);
    sheetBody.querySelector('#tkBack').onclick = ()=>{ if(o.onVolver) o.onVolver(); else closeOverlay(); };
    const ok = sheetBody.querySelector('#tkOk');
    ok.onclick = async ()=>{
      if(ok.classList.contains('is-locked')) return;
      ok.classList.add('is-locked');
      try{ await o.onConfirmar(); }
      catch(e){ console.error(e); ok.classList.remove('is-locked'); }
    };
  }
  const siNo = v => v ? 'Sí' : 'No';

  function startWizard(presetAccount){
    wizard = { account: presetAccount||null, preset: !!presetAccount,
               kind:null, category:null, description:'', note:'', amount:null };
    if(presetAccount) stepKind(); else stepAccount();
  }

  function crumb(){
    const parts = [];
    if(wizard.account) parts.push(accountMeta(wizard.account).label);
    if(wizard.kind) parts.push(wizard.kind==='gasto' ? 'Gasto'
      : (esNomina(wizard.account) ? LT('nomina.pagasExtra','Pagas extra') : 'Ingreso'));
    if(wizard.category) parts.push(wizard.category==='Otro tipo' ? 'Otro' : wizard.category);
    return parts.length ? `<div class="breadcrumb">${parts.map(p=>`<b>${escapeHTML(p)}</b>`).join(' · ')}</div>` : '';
  }

  function usesCategoryStep(){
    /* Un gasto pagado con un neo banco es un gasto como cualquier otro: lleva
       su categoría para que cuente en los límites y en el desglose. Antes se
       apuntaba siempre como "Retiro" y la comida pagada con Revolut no
       consumía el límite de Comida. Lo que entra sigue siendo un aporte. */
    if(wizard.account.startsWith('platform:')) return wizard.kind === 'gasto';
    /* La nómina con un ingreso ya sabe lo que es: se salta la categoría y pide
       directamente una descripción. */
    if(esNomina(wizard.account) && wizard.kind === 'ingreso') return false;
    return true;
  }
  /* La descripción es obligatoria cuando es lo único que identifica el movimiento. */
  function descRequired(){
    if(wizard.category === 'Otro tipo') return true;
    if(esNomina(wizard.account) && wizard.kind === 'ingreso') return true;
    return false;
  }

  function stepAccount(){
    /* Solo los apartados de arriba: Nómina, Neo bancos, Efectivo y las carteras
       que hayas creado tú. Los neo bancos salen al desplegar "Neo bancos". */
    openOverlay(`<h3>¿De qué cuenta?</h3><div class="step-label metal-text">Paso 1</div>
      ${accountChipsHTML({selected: wizard.account})}`);
    bindAccountChips(sheetBody, (id)=>{ wizard.account = id; stepKind(); },
      (id)=>{ const acc = findAccount(id); if(acc) showSheetHint(`${acc.name}: ${fmt(accountBalance(acc.id))} ahora mismo`, acc.icon); });
  }

  function stepKind(){
    /* Invertir solo tiene sentido desde un neo banco: es de donde sale el
       dinero que se invierte, así que la cuarta opción solo sale ahí. */
    const esNeo = String(wizard.account || '').startsWith('platform:');
    openOverlay(`${crumb()}<h3>${esNeo ? '¿Qué movimiento es?' : '¿Ingreso, gasto o transferencia?'}</h3>
      <div class="step-label metal-text">Paso 2</div>
      <div class="chip-grid">
        <div class="chip" data-kind="ingreso">${ic('arrowDown')} ${esNomina(wizard.account) ? L('nomina.pagasExtra','Pagas extra') : 'Ingreso'}</div>
        <div class="chip" data-kind="gasto">${ic('arrowUp')} Gasto</div>
        <div class="chip kind-transfer" data-kind="transferencia">${ic('repeat')} Transferencia</div>
        ${esNeo ? `<div class="chip kind-invest" data-kind="inversion">${ic('trending')} Inversión</div>` : ''}
      </div>
      <div class="sheet-actions"><button class="ghost-btn" id="backBtn">Atrás</button></div>`);
    /* Si la cuenta venía dada por la pantalla, Atrás cierra; si la has elegido
       tú en el paso 1, Atrás te devuelve a la lista de cuentas. */
    sheetBody.querySelector('#backBtn').onclick = wizard.preset ? closeOverlay : stepAccount;
    sheetBody.querySelectorAll('[data-kind]').forEach(el=>{
      el.onclick = ()=>{
        if(el.dataset.kind === 'transferencia'){ openTransferSheet(wizard.account); return; }
        if(el.dataset.kind === 'inversion'){
          const p = state.platforms.find(x=>('platform:'+x.id) === wizard.account);
          openInvestSheet(wizard.account, p ? p.name : null);
          return;
        }
        /* Volver atrás y cambiar de gasto a ingreso no puede arrastrar la
           categoría de gasto que se eligió antes. */
        if(wizard.kind !== el.dataset.kind) wizard.category = null;
        wizard.kind = el.dataset.kind;
        if(usesCategoryStep()) stepCategory(); else stepDescription();
      };
    });
  }

  /* ---- Las fichas de categoría, iguales en toda la app ----
     Una ficha por categoría de gasto, de la más usada a la que menos, con su
     color, su icono y sus ejemplos. `attr` pone el atributo con el que cada
     asistente reconoce la ficha pulsada; `activa` marca la elegida. */
  function catFichasHTML(attr, activa){
    const cats = gastoCats();
    return `<div class="cat-grid">${catsPorUso().map(k=>{
      const v = cats[k]; if(!v) return '';
      return `<div class="cat-card ${activa===k?'active':''}" ${attr(k)} style="--cc:${v.hex}">
          <span class="cc-ico">${ic(v.icon,17)}</span>
          <span class="cc-name">${escapeHTML(k)}</span>
          ${v.ex?`<span class="cc-ex">${escapeHTML(v.ex)}</span>`:''}
        </div>`;
    }).join('')}</div>`;
  }
  function stepCategory(){
    const cats = wizard.kind==='gasto' ? gastoCats() : CAT_INGRESO;
    const otherHTML = wizard.kind==='gasto' ? `
      <div class="other-type-wrap">
        <div class="other-split">
          <div class="chip other-type" data-cat="Otro tipo">${ic('sparkle')} Otro</div>
          <div class="chip new-cat" id="newCatBtn">${ic('plus')} Nueva categoría</div>
        </div>
      </div>` : '';
    const esGasto = wizard.kind === 'gasto';
    openOverlay(`${crumb()}<h3>${esGasto ? '¿Qué categoría?' : '¿De dónde viene el dinero?'}</h3><div class="step-label metal-text">Paso 3</div>
      ${wizard.kind==='gasto'
        ? catFichasHTML(k=>`data-cat="${escapeHTML(k)}"`, wizard.category)
        : `<div class="cat-grid">${Object.entries(cats).map(([k,v])=>`
        <div class="cat-card" data-cat="${escapeHTML(k)}" style="--cc:${v.hex}">
          <span class="cc-ico">${ic(v.icon,17)}</span>
          <span class="cc-name">${escapeHTML(k)}</span>
          ${v.ex?`<span class="cc-ex">${escapeHTML(v.ex)}</span>`:''}
        </div>`).join('')}</div>`}
      ${otherHTML}
      <div class="sheet-actions"><button class="ghost-btn" id="backBtn">Atrás</button></div>`);
    sheetBody.querySelector('#backBtn').onclick = stepKind;
    if(sheetBody.querySelector('#newCatBtn')) sheetBody.querySelector('#newCatBtn').onclick = ()=>openNewCategory(
      nombre=>{ wizard.category = nombre; stepDescription(); }, stepCategory);
    sheetBody.querySelectorAll('[data-cat]').forEach(el=>{
      const cat = el.dataset.cat;
      if(CAT_EXAMPLES[cat]) attachLongPress(el, ()=>openCategoryExamples(cat));
      el.onclick = ()=>{ if(wasLongPress(el)) return; clearIdleHint(); wizard.category = cat; stepDescription(); };
    });
    /* El truco de los ejemplos solo existe en los gastos: en los ingresos el
       aviso no pinta nada y no sale. */
    if(esGasto) startIdleHint('Mantén pulsado en una categoría para ver más ejemplos', 5000);
  }

  /* ---- aviso flotante tras un rato sin tocar nada ---- */
  let idleHintTimer = null, idleHintEl = null, idleHintHandlers = null;
  function clearIdleHint(){
    clearTimeout(idleHintTimer); idleHintTimer = null;
    if(idleHintEl){ idleHintEl.classList.remove('show'); const el = idleHintEl; idleHintEl = null; setTimeout(()=>el.remove(), 320); }
    if(idleHintHandlers){
      ['pointerdown','keydown','wheel','touchstart'].forEach(ev=>sheetBody.removeEventListener(ev, idleHintHandlers, true));
      idleHintHandlers = null;
    }
  }
  /* Muestra el aviso flotante al momento, con el mismo diseño que el resto. */
  function showSheetHint(msg, icon){
    if(!overlay.classList.contains('show')) return;
    if(idleHintEl){
      idleHintEl.querySelector('.ih-txt').textContent = msg;
      idleHintEl.querySelector('.ih-ico').innerHTML = ic(icon || 'bolt',15);
      idleHintEl.classList.remove('show'); void idleHintEl.offsetWidth; idleHintEl.classList.add('show');
      return;
    }
    idleHintEl = document.createElement('div');
    idleHintEl.className = 'idle-hint';
    idleHintEl.innerHTML = `<span class="ih-ico">${ic(icon || 'bolt',15)}</span><span class="ih-txt"></span>`;
    idleHintEl.querySelector('.ih-txt').textContent = msg;
    sheetBody.appendChild(idleHintEl);
    void idleHintEl.offsetWidth;
    idleHintEl.classList.add('show');
  }
  function startIdleHint(msg, delay){
    clearIdleHint();
    const fire = ()=>showSheetHint(msg);
    const reset = ()=>{
      if(idleHintEl) return;          /* ya se ha visto: no reprogramar */
      clearTimeout(idleHintTimer);
      idleHintTimer = setTimeout(fire, delay || 5000);
    };
    idleHintHandlers = reset;
    ['pointerdown','keydown','wheel','touchstart'].forEach(ev=>sheetBody.addEventListener(ev, idleHintHandlers, true));
    idleHintTimer = setTimeout(fire, delay || 5000);
  }

  /* Crear una categoría propia. No deja repetir una que ya exista. Se abre
     desde el botón de añadir un movimiento y desde Límites: cada uno dice qué
