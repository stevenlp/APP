      if(Math.abs(dx) > 3) movido = true;
      car.scrollLeft = sl0 - dx;
    });
    window.addEventListener('mouseup', ()=>{
      if(!down) return;
      down = false;
      if(movido) irA(Math.round(car.scrollLeft / paso()));
    });
    /* Un arrastre no debe contar como clic en una columna. */
    car.addEventListener('click', e=>{ if(movido){ e.stopPropagation(); e.preventDefault(); } }, true);
  }


  /* ============ INICIO TAB ============ */
  /* Lo que se ve abierto ahora mismo. Vive fuera del render para que un
     repintado no cierre lo que el usuario acababa de desplegar. */
  let nbOpen = {};          /* gráficas propias de cada caja */
  let nbOpenBal = {};       /* desglose de cada barra de balance */
  let nbOpenSub = {};       /* sub-desglose (categorías / cuentas) */
  let nbOpenRow = {};       /* movimientos abiertos */
  let nbFrom = '', nbTo = '';   /* filtro de fechas del historial */
  let nbTipoFiltro = 'todos';   /* todos · gastos · inversiones · ingresos */
  let nbHistLimit = 25;
  /* El valor del balance va cambiando solo entre euros y porcentaje. */
  let nbFlipPct = false, nbFlipTimer = null;

  /* Los dos pares que se pueden comparar entre sí. */
  const NB_PARES = {anual:['gta','cta'], mensual:['gtm','ctm']};
  function nbComparando(par){
    const p = NB_PARES[par];
    return !!(nbOpen[p[0]] && nbOpen[p[1]]);
  }
  function nbParDe(id){
    return Object.keys(NB_PARES).find(k=>NB_PARES[k].indexOf(id) >= 0) || null;
  }

  /* Los dos periodos del boceto: el año natural en curso y el mes en curso. */
  function nbRango(kind){
    const h = now();
    if(kind === 'anual') return {from:new Date(h.getFullYear(),0,1,0,0,0,0).getTime(), to:h.getTime(),
      label:String(h.getFullYear()), corto:String(h.getFullYear()), unidad:'mes'};
    return {from:new Date(h.getFullYear(),h.getMonth(),1,0,0,0,0).getTime(), to:h.getTime(),
      label:MESES[h.getMonth()] + ' ' + h.getFullYear(), corto:MESES[h.getMonth()], unidad:'día'};
  }
  function nbSuma(list){ return +list.reduce((s,t)=>s+t.amount,0).toFixed(2); }
  /* Los tres cajones del periodo. La inversión ya no es un gasto: va aparte. */
  function nbTxPeriodo(from, to, tipo){
    return state.transactions.filter(t=>{
      if(t.transfer || t.ts < from || t.ts > to) return false;
      if(tipo === 'inversion') return t.kind === 'gasto' && txEsInversion(t);
      if(tipo === 'ingreso')   return t.kind === 'ingreso';
      return t.kind === 'gasto' && !txEsInversion(t);
    });
  }
  function nbGastosTx(from,to){ return nbTxPeriodo(from, to, 'gasto'); }

  /* Reparte los movimientos del periodo en sus casillas: un mes por casilla si
     el periodo es el año, y un día por casilla si es el mes. Una casilla sin
     movimientos se queda vacía, no a cero. */
  function nbCasillas(kind){
    const h = now(), out = [];
    if(kind === 'anual'){
      for(let m=0;m<=h.getMonth();m++) out.push({k:m, label:MESES[m].slice(0,3), largo:MESES[m], v:null, n:0});
    } else {
      const dias = h.getDate();
      for(let d=1;d<=dias;d++) out.push({k:d, label:String(d), largo:d + ' de ' + MESES[h.getMonth()], v:null, n:0});
    }
    return out;
  }
  function nbIndice(ts, kind){ const d = new Date(ts); return kind === 'anual' ? d.getMonth() : d.getDate()-1; }

  function nbGastoSerie(kind, soloInversion){
    const r = nbRango(kind);
    const tx = nbTxPeriodo(r.from, r.to, soloInversion ? 'inversion' : 'gasto');
    const casillas = nbCasillas(kind);
    /* La línea salta de punto a punto en vez de caer a cero cada día vacío. */
    tx.forEach(t=>{ const b = casillas[nbIndice(t.ts,kind)]; if(b){ b.v = +((b.v || 0) + t.amount).toFixed(2); b.n++; } });
    const conGasto = casillas.filter(b=>b.v != null && b.v > 0);
    const alto = conGasto.length ? conGasto.reduce((a,b)=>b.v > a.v ? b : a) : null;
    const bajo = conGasto.length ? conGasto.reduce((a,b)=>b.v < a.v ? b : a) : null;
    return {casillas, total:nbSuma(tx), alto, bajo, rango:r, tx};
  }

  /* Serie de capital: un punto por cada vez que el capital cambió de verdad.
     Los tramos sin movimiento no pintan punto ni bajan la línea. */
  function nbCapitalSerie(kind){
    const r = nbRango(kind);
    const hist = (state.history || [])
      .filter(h=>typeof h.total === 'number' && h.ts >= r.from && h.ts <= r.to)
      .sort((a,b)=>a.ts - b.ts);
    const casillas = nbCasillas(kind);
    casillas.forEach(b=>{ b.bmin = null; b.bmax = null; b.real = false; });
    hist.forEach(h=>{
      const b = casillas[nbIndice(h.ts,kind)];
      if(!b) return;
      b.v = h.total; b.n++; b.real = true;
      b.bmin = b.bmin == null ? h.total : Math.min(b.bmin, h.total);
      b.bmax = b.bmax == null ? h.total : Math.max(b.bmax, h.total);
    });
    const vals = hist.map(h=>h.total);
    const ahora = patrimonioTotal();
    const max = vals.length ? +Math.max.apply(null, vals).toFixed(2) : ahora;
    const min = vals.length ? +Math.min.apply(null, vals).toFixed(2) : ahora;
    /* Si aún no hay historial dentro del periodo, el valor de hoy hace de todo. */
    if(!vals.length && casillas.length){ const u = casillas[casillas.length-1]; u.v = ahora; u.real = true; }
    return {casillas, max, min, ahora, puntos:hist.length, rango:r};
  }

  /* Números cortos para el eje de euros de las gráficas. */
  function nbEje(v){
    const a = Math.abs(v);
    if(a >= 1000000) return (v/1000000).toFixed(1).replace('.',',') + 'M';
    if(a >= 1000)    return (v/1000).toFixed(1).replace('.',',') + 'k';
    return String(Math.round(v));
  }
  /* "Viernes, 25 de septiembre de 2026": solo la primera letra en mayúscula. */
  function nbFechaLarga(ts){
    const s = new Date(ts).toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function nbMayus(s){ return String(s).charAt(0).toUpperCase() + String(s).slice(1); }
  function nbPctTxt(p){
    if(p == null || !isFinite(p)) return '—';
    return (Math.round(p*10)/10).toFixed(Math.abs(p) >= 10 || p === 0 ? 0 : 1).replace('.', ',') + '%';
  }
  /* JSON dentro de un atributo: hay que escapar comillas y ángulos. */
  function nbAttr(o){
    return JSON.stringify(o).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  }

  /* ---- La gráfica propia de cada bloque ----
     Línea suave con su eje de euros, un punto en cada tramo con datos, el
     máximo y el mínimo agrandados, y una cruz que sigue al dedo o al ratón
     enseñando en un globo qué pasó exactamente en ese punto. */
  function nbLineChart(casillas, hex, opts){
    opts = opts || {};
    const P = casillas.map((b,i)=>({i,b})).filter(o=>o.b.v != null);
    if(P.length < 2) return `<p class="nb-empty">${escapeHTML(opts.vacio || 'Todavía no hay suficientes datos en este periodo. En cuanto se registren dos, la gráfica se dibuja aquí.')}</p>`;
    const W = 300, H = 122, padL = 40, padR = 12, padT = 16, padB = 20;
    const vals = P.map(o=>o.b.v);
    let min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    if(min > 0) min = 0;              /* el eje siempre incluye el cero */
    if(max < 0) max = 0;
    if(max === min) max = min + 1;
    const span = max - min;
    const X = i => padL + (W-padL-padR) * (casillas.length < 2 ? 0 : i/(casillas.length-1));
    const Y = v => padT + (H-padT-padB) * (1 - (v-min)/span);
    const pts = P.map(o=>({x:X(o.i), y:Y(o.b.v)}));
    const linea = smoothPath(pts);
    const base = Y(Math.max(min,0));
    const uid = 'nb' + Math.random().toString(36).slice(2,8);
    const area = `${linea} L${pts[pts.length-1].x.toFixed(1)},${base.toFixed(1)} L${pts[0].x.toFixed(1)},${base.toFixed(1)} Z`;

    const rejilla = [0,0.5,1].map(f=>{
      const v = max - span*f, yy = padT + (H-padT-padB)*f;
      return `<line class="gl" x1="${padL}" y1="${yy.toFixed(1)}" x2="${W-padR}" y2="${yy.toFixed(1)}"/>
        <text class="ax" x="${padL-5}" y="${(yy+2.6).toFixed(1)}" text-anchor="end">${nbEje(v)}</text>`;
    }).join('');

    const marcas = [0, Math.floor((casillas.length-1)/2), casillas.length-1]
      .filter((v,i,a)=>a.indexOf(v) === i)
      .map(i=>`<text class="ax" x="${X(i).toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':(i===casillas.length-1?'end':'middle')}">${escapeHTML(casillas[i].label)}</text>`)
      .join('');

    /* Solo se pincha un punto donde de verdad pasó algo: un gasto registrado o
       una foto del capital. Los tramos heredados no llevan bolita. */
    const conDato = P.filter(o=>opts.tipo === 'capital' ? o.b.real : o.b.v > 0);
    const pool = conDato.length ? conDato : P;
    const alto = pool.reduce((a,o)=>o.b.v > a.b.v ? o : a);
    const bajo = pool.reduce((a,o)=>o.b.v < a.b.v ? o : a);
    const esExtremo = o => o === alto || o === bajo;

    const puntos = conDato.map(o=>{
      const cx = X(o.i).toFixed(1), cy = Y(o.b.v).toFixed(1);
      if(!esExtremo(o)) return `<circle class="mk" cx="${cx}" cy="${cy}" r="2.3" fill="${hex}"/>`;
      return `<circle class="halo" cx="${cx}" cy="${cy}" r="8" stroke="${hex}"/>
        <circle class="mk big" cx="${cx}" cy="${cy}" r="5" fill="${hex}"/>`;
    }).join('');
    const etiqueta = (o, texto, arriba) => {
      const x = X(o.i), y = Y(o.b.v);
      const ancla = x < padL + 26 ? 'start' : (x > W - padR - 26 ? 'end' : 'middle');
      return `<text class="ax" style="font-weight:800;fill:${hex}" x="${x.toFixed(1)}" y="${(arriba ? y-11 : y+16).toFixed(1)}" text-anchor="${ancla}">${texto}</text>`;
    };
    const extremos = alto === bajo ? '' : etiqueta(alto,'máx',true) + etiqueta(bajo,'mín',false);

    /* Lo que enseña el globo en cada tramo, ya formateado. */
    const datos = P.map(o=>{
      const b = o.b;
      let sub;
      if(opts.tipo === 'capital'){
        sub = b.real
          ? (b.bmax !== b.bmin ? `techo <b>${fmt(b.bmax)}</b> · suelo <b>${fmt(b.bmin)}</b>` : `${b.n} cambio${b.n===1?'':'s'}`)
          : 'sin cambios · viene del tramo anterior';
      } else {
        sub = b.n ? `<b>${b.n}</b> movimiento${b.n===1?'':'s'}` : 'sin movimientos';
      }
      return {x:+X(o.i).toFixed(1), y:+Y(o.b.v).toFixed(1), l:nbMayus(b.largo), v:fmt(b.v), s:sub};
    });

    return `<div class="nb-plot" data-pts="${nbAttr(datos)}">
      <svg class="nb-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución en el periodo">
        <defs>
          <linearGradient id="g${uid}" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="${hex}" stop-opacity=".26"/>
            <stop offset="1" stop-color="${hex}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${rejilla}
        <path d="${area}" fill="url(#g${uid})"/>
        <path class="ln" d="${linea}" stroke="${hex}" stroke-width="2.4"/>
        ${puntos}
        ${extremos}
        ${marcas}
        <line class="cross" x1="0" y1="${padT-4}" x2="0" y2="${H-padB}"/>
        <circle class="hot" cx="0" cy="0" r="4.6" fill="#fff" stroke="${hex}" stroke-width="2.6"/>
      </svg>
      <div class="nb-tip"><div class="t-d"></div><div class="t-v"></div><div class="t-n"></div></div>
    </div>
    <div class="nb-leyenda">
      <span class="lmax"><i style="border-color:${hex}"></i> máximo del periodo</span>
      <span class="lmin"><i style="border-color:${hex}"></i> mínimo del periodo</span>
    </div>`;
  }

  /* ---- La comparativa: columnas finas de gasto contra capital ----
     Se dibuja con cajas en vez de con un svg para que llene exactamente el
     alto que le deje la rejilla, sin huecos ni por arriba ni por abajo. */
  /* Cuántos tramos enseña la comparativa. Con el periodo entero salían doce
     meses (o treinta días) en columnas de tres píxeles que no se leían: se
     queda con los seis últimos, que es lo que de verdad se compara, y así
     caben barras del grosor suficiente para verlas. */
  const NB_CMP_VENTANA = 6;
  function nbBarsCompare(kind){
    const g = nbGastoSerie(kind);
    const c = nbCapitalSerie(kind);
    const n = Math.max(g.casillas.length, c.casillas.length);
    let filas = [];
    /* El capital es un saldo, no un gasto: un mes sin apuntes no vale cero,
       vale lo mismo que el último mes que sí tuvo movimiento. Se arrastra
       antes de recortar la ventana para no perder el punto de partida. */
    let ultimoCap = 0;
    for(let i=0;i<n;i++){
      const bg = g.casillas[i], bc = c.casillas[i];
      if(bc && bc.v != null) ultimoCap = Math.max(bc.v, 0);
      filas.push({label:(bg||bc).label, largo:(bg||bc).largo || (bg||bc).label,
                  g:bg && bg.v ? bg.v : 0, c:ultimoCap});
    }
    filas = filas.slice(-NB_CMP_VENTANA);
    const nf = filas.length;
    /* Con pocas columnas cabe el nombre entero y la barra puede engordar. */
    const pocas = nf <= 6;
    const tope = Math.max(1, ...filas.map(f=>Math.max(f.g, f.c)));
    const paso = nf > 12 ? Math.ceil(nf/6) : (nf > 9 ? 2 : 1);
    const cols = filas.map((f,i)=>`<div class="nb-bcol" title="${escapeHTML(f.largo)}: gasto ${fmt(f.g)} · capital ${fmt(f.c)}">
        <span class="nb-bar g" style="--h:${((f.g/tope)*100).toFixed(2)}%;--d:${(i*22)}ms"></span>
        <span class="nb-bar c" style="--h:${((f.c/tope)*100).toFixed(2)}%;--d:${(i*22)+60}ms"></span>
        ${(i % paso === 0 || i === nf-1) ? `<span class="bl">${escapeHTML(f.label)}</span>` : ''}
      </div>`).join('');
    const ejes = [1,0.75,0.5,0.25,0].map(f=>`<span>${nbEje(tope*f)}</span>`).join('');
    const unidad = kind === 'anual' ? 'meses' : 'días';
    const titulo = nf > 1
      ? 'Gastos vs Capital · últimos ' + nf + ' ' + unidad
      : 'Gastos vs Capital · ' + nbMayus(filas[0] ? filas[0].largo : g.rango.label);
    return `<div class="nb-bars ${pocas?'pocas':''}">
      <div class="bt">${escapeHTML(titulo)}</div>
      <div class="nb-bplot">
        <div class="nb-baxis">${ejes}</div>
        <div class="nb-bgrid">${cols}</div>
      </div>
      <div class="nb-bleg">
        <span><i style="background:#FF3B30"></i> Gastos</span>
        <span><i style="background:${capHex()}"></i> Capital</span>
      </div>
    </div>`;
  }

  /* ============ CARTERA DE INVERSIÓN ============
     Antes esto eran dos gráficas de línea, "Inversión anual" y "Inversión
     mensual", que dibujaban el FLUJO: cuánto metiste cada mes. Con aportaciones
     que no son todos los meses, esa gráfica sale medio vacía y no dice nada.

     Lo que importa de una inversión no es cuánto metiste en marzo, es qué
     tienes: cuánto hay invertido, repartido en qué y guardado dónde. Eso no
     depende de que este mes hayas aportado, así que el bloque siempre tiene
     algo que contar. */
  const INV_PALETA = ['#0A84FF','#5E5CE6','#30B0C7','#FF9F0A','#34C759','#AF52DE','#FF6482','#00C7BE'];
  function invIcono(tipo){
    const t = INV_TIPOS.find(x=>x.id === tipo);
    return t ? t.icon : 'trending';
  }
  function invEtiquetaTipo(tipo){
    const t = INV_TIPOS.find(x=>x.id === tipo);
    return t ? t.label : 'Inversión';
  }
  /* Agrupa todas las aportaciones por lo que se compró. La descripción es lo
     que escribiste tú ("MSCI World"); si no hay, se cae al tipo ("ETF"). */
  function invCartera(){
    const tx = state.transactions.filter(t=>txEsInversion(t));
    const pos = {};
    const porCuenta = {};
    let ultima = 0;
    tx.forEach(t=>{
      const etiqueta = String(t.description || t.invLabel || 'Inversión').trim() || 'Inversión';
      const k = etiqueta.toLowerCase();
      if(!pos[k]) pos[k] = {label:etiqueta, tipo:t.invType || 'otro', amount:0, n:0, ultima:0, units:0};
      const p = pos[k];
      p.amount += t.amount;
      p.n++;
      if(t.ts > p.ultima){ p.ultima = t.ts; if(t.invType) p.tipo = t.invType; }
      if(typeof t.units === 'number' && t.units) p.units += t.units;
      const cuenta = accountMeta(t.account).label;
      porCuenta[cuenta] = +((porCuenta[cuenta] || 0) + t.amount).toFixed(2);
      if(t.ts > ultima) ultima = t.ts;
    });
    const lista = Object.keys(pos).map(k=>{
      const p = pos[k];
      p.amount = +p.amount.toFixed(2);
      return p;
    }).sort((a,b)=>b.amount - a.amount);
    return {lista, total:+lista.reduce((s,p)=>s+p.amount,0).toFixed(2), ultima, porCuenta, n:tx.length};
  }
  function invHace(ts){
    const d = Math.round((startOfDay(Date.now()) - startOfDay(ts)) / 86400000);
    if(d <= 0) return 'hoy';
    if(d === 1) return 'ayer';
    if(d < 60) return 'hace ' + d + ' días';
    return 'hace ' + Math.round(d/30) + ' meses';
  }
  function carteraInversionHTML(){
    const c = invCartera();
    if(!c.lista.length){
      return `<div class="nb-card nb-cartera">
        <div class="nb-h"><span class="nb-hico">${ic('trending',13)}</span> ${L('nb.cartera','Cartera de inversión')}</div>
        <p class="nb-empty">Todavía no has apuntado ninguna inversión. Desde un neo banco, el botón redondo te deja registrar una aportación: aquí verás qué tienes, en qué y dónde.</p>
      </div>`;
    }
    const capital = patrimonioTotal();
    const pct = capital > 0 ? (c.total/capital)*100 : null;
    const items = c.lista.map((p,i)=>({label:p.label, amount:p.amount, hex:INV_PALETA[i % INV_PALETA.length], icon:invIcono(p.tipo)}));
    /* Igual que en suscripciones: solo las primeras, y el resto con un toque. */
    const todas = !!pcMas['cartera'];
    const visibles = todas ? c.lista : c.lista.slice(0, PC_TOPE);
    const ocultas = c.lista.length - visibles.length;
    const filas = visibles.map((p,i)=>{
      const hex = INV_PALETA[i % INV_PALETA.length];
      const parte = c.total > 0 ? Math.round((p.amount/c.total)*100) : 0;
      const detalle = [invEtiquetaTipo(p.tipo), p.n + (p.n===1 ? ' aportación' : ' aportaciones')];
      /* Las unidades van con coma decimal, como el resto de cifras de la app. */
      if(p.units) detalle.push(String(+p.units.toFixed(4)).replace('.', ',') + ' ud.');
      return `<div class="ic-row">
        <span class="ic-dot" style="background:${hex}"></span>
        <span class="ic-ico lg" style="--lgc2:${hex};--lgc1:color-mix(in srgb,${hex} 58%,#fff);--lgsh:${hex}88">${ic(invIcono(p.tipo),13)}</span>
        <span class="ic-n">${escapeHTML(p.label)}<i>${escapeHTML(detalle.join(' · '))}</i></span>
        <span class="ic-a">${fmt(p.amount)}<i>${parte}%</i></span>
      </div>`;
    }).join('');
    const cuentas = Object.keys(c.porCuenta)
      .sort((a,b)=>c.porCuenta[b] - c.porCuenta[a])
      .map(k=>`<span><b>${escapeHTML(k)}</b> ${fmt(c.porCuenta[k])}</span>`).join('');
    return `<div class="nb-card nb-cartera">
      <div class="nb-h"><span class="nb-hico">${ic('trending',13)}</span> ${L('nb.cartera','Cartera de inversión')}
        <span class="nb-sub" style="margin-left:auto;">${c.n} ${c.n===1 ? 'aportación' : 'aportaciones'}</span></div>
      <div class="ic-top">
        <div class="ic-donut">${donutSVG(items, c.total, null)}</div>
        <div class="ic-cifras">
          <div class="ic-k">${ic('archive',11)} Total invertido</div>
          <div class="ic-v">${fmt(c.total)}</div>
          <div class="ic-s">${nbPctTxt(pct)} de tu capital</div>
          <div class="ic-s">Última aportación ${escapeHTML(invHace(c.ultima))}</div>
        </div>
      </div>
      <div class="ic-lista">${filas}</div>
      ${c.lista.length > PC_TOPE ? `<button type="button" class="pc-mas ${todas?'on':''}" data-pcmas="cartera">
        <i>${ic('chevronRight',12)}</i>${todas ? 'Mostrar menos' : 'Mostrar ' + ocultas + ' más'}
      </button>` : ''}
      ${cuentas ? `<div class="ic-cuentas">${ic('card',11)} ${cuentas}</div>` : ''}
    </div>`;
  }

  /* Envoltorio del desplegable: el título del tramo y su gráfica dentro. */
  function nbDrop(id, titulo, pie, svg){
    return `<div class="nb-drop ${nbOpen[id]?'open':''}" data-drop="${id}">
      <div class="nb-chart">
        <div class="nb-ct"><span class="nb-ctk">${escapeHTML(titulo)}</span><span class="nb-ctv">${escapeHTML(pie)}</span></div>
        ${svg}
      </div>
    </div>`;
  }
  /* Las dos gráficas de un par. Si están abiertas las dos, se encogen a la
     izquierda y a su derecha entra la comparativa, del mismo alto que ellas. */
  function nbPar(par, dropA, dropB){
    const cmp = nbComparando(par);
    return `<div class="nb-pair ${cmp?'cmp':''}" data-pair="${par}">
      <div class="nb-pair-l">${dropA}${dropB}</div>
      ${cmp ? `<div class="nb-pair-r">${nbBarsCompare(par)}</div>` : ''}
    </div>`;
  }

  /* Una caja de la rejilla 2x2. El título llega ya montado para que siga
     siendo renombrable desde el modo edición. */
  function nbCelda(id, tituloHTML, hex, valor, extra, derecha){
    return `<div class="nb-cell ${derecha?'r':''} ${nbOpen[id]?'on':''}" data-cell="${id}">
      <div class="nb-ck" style="color:${hex}"><i></i>${tituloHTML}</div>
      <div class="nb-cv">${valor}</div>
      <div class="nb-cx">${extra}</div>
    </div>`;
  }

  /* ---- Balance: el capital es el 100% de la barra y el gasto se mide contra
     él. El tramo mayor se pinta detrás a todo lo ancho y el menor delante,
     sea cual sea de los dos. La diferencia sale en verde o en rojo. ---- */
  function nbBalanceData(kind){
    const r = nbRango(kind);
    const gastoTx = nbGastosTx(r.from, r.to);
    const gasto = nbSuma(gastoTx);
    const capital = nbCapitalSerie(kind).max;
    const dif = +(capital - gasto).toFixed(2);
    const ref = Math.abs(capital);
    const pct = v => ref > 0 ? (v/ref)*100 : null;
    const mayor = Math.max(Math.abs(gasto), Math.abs(capital));
    const anchoG = mayor > 0 ? (Math.abs(gasto)/mayor)*100 : 0;
    const anchoC = mayor > 0 ? (Math.abs(capital)/mayor)*100 : 0;

    const porCat = {};
    gastoTx.forEach(t=>{ const c = t.category || 'Otros gastos'; porCat[c] = (porCat[c]||0) + t.amount; });
    const cats = Object.entries(porCat)
      .map(([label,amount])=>({label, amount:+amount.toFixed(2), hex:getCatHex(label,'gasto')}))
      .sort((a,b)=>b.amount-a.amount);

    const sb = computeStatsBanco();
    const cuentas = allAccounts()
      .map(a=>({label:a.name, hex:a.hex, amount:+(a.id==='banco' ? sb.saldo : accountBalance(a.id)).toFixed(2)}))
      .sort((a,b)=>b.amount-a.amount);

    return {kind, rango:r, gasto, capital, dif, pct, anchoG, anchoC, cats, cuentas,
      gMayor: Math.abs(gasto) >= Math.abs(capital)};
  }

  function nbBalanceHTML(kind, nombreHTML, sigG, sigC){
    const d = nbBalanceData(kind);
    const abierto = !!nbOpenBal[kind];
    const signo = d.dif >= 0 ? 'pos' : 'neg';
    /* El mayor se dibuja primero (detrás) y el menor encima. */
    const segG = `<div class="nb-seg gasto ${d.gMayor?'back':'front'}" style="--w:${d.anchoG.toFixed(2)}%;"></div>`;
    const segC = `<div class="nb-seg capital ${d.gMayor?'front':'back'}" style="--w:${d.anchoC.toFixed(2)}%;"></div>`;

    const fila = (clave, nom, hex, valor, tramos) => {
      const ab = !!nbOpenSub[kind+':'+clave];
      const sub = tramos.length ? `<div class="nb-dsub" data-sub="${kind}:${clave}" ${ab?'':'hidden'}>
          ${tramos.map(x=>`<div class="nb-drow">
            <span class="nb-dot" style="background:${x.hex}"></span>
            <span class="nb-dname">${escapeHTML(x.label)}</span>
            <span class="nb-dpct">${nbPctTxt(d.pct(x.amount))}</span>
            <span class="nb-dval">${fmt(x.amount)}</span>
          </div>`).join('')}
        </div>` : '';
      return `<div class="nb-drow ${ab?'open':''}" data-subtoggle="${kind}:${clave}">
          <span class="nb-dchev">${ic('chevronRight',11)}</span>
          <span class="nb-dot" style="background:${hex}"></span>
          <span class="nb-dname">${escapeHTML(nom)}</span>
          <span class="nb-dpct">${nbPctTxt(d.pct(valor))}</span>
          <span class="nb-dval">${fmt(valor)}</span>
        </div>${sub}`;
    };

    const detalle = `<div class="nb-det" data-det="${kind}" ${abierto?'':'hidden'}>
        ${fila('g', sigG + ' · gastos', '#FF3B30', d.gasto, d.cats)}
        ${fila('c', sigC + ' · capital', capHex(), d.capital, d.cuentas)}
        <div class="nb-drow tot ${signo}">
          <span class="nb-dchev" style="opacity:0">${ic('chevronRight',11)}</span>
          <span class="nb-dot" style="background:${d.dif>=0?'#248A3D':'#FF3B30'}"></span>
          <span class="nb-dname">Diferencia</span>
          <span class="nb-dpct">${d.dif>=0?'+':''}${nbPctTxt(d.pct(d.dif))}</span>
          <span class="nb-dval">${d.dif>=0?'+':''}${fmt(d.dif)}</span>
        </div>
      </div>`;

    /* El valor va alternando solo entre los euros y el porcentaje. */
    const eur = (d.dif>=0?'+':'') + fmt(d.dif);
    const pctTxt = (d.dif>=0?'+':'') + nbPctTxt(d.pct(d.dif));

    return `<div class="nb-bal">
      <div class="nb-balk">${nombreHTML}
        <span class="nb-tag g">${escapeHTML(sigG)}</span>
        <span class="nb-tag c">${escapeHTML(sigC)}</span>
      </div>
      <div class="nb-balrow">
        <div class="nb-track" data-bal="${kind}" role="button" tabindex="0" title="Toca para ver el detalle">
          ${d.gMayor ? segG + segC : segC + segG}
        </div>
        <div class="nb-balv ${signo}">
          <span class="v nb-roll ${nbFlipPct?'pct':''}"><span class="r-i"><span>${escapeHTML(eur)}</span><span>${escapeHTML(pctTxt)}</span></span></span>
        </div>
      </div>
      ${detalle}
    </div>`;
  }

  /* ---- Una fila de movimiento, con su desplegable de detalle ---- */
  /* ---- De dónde salió un movimiento ----
     Un apunte no cuenta lo mismo si lo escribiste tú, si lo generó una
     suscripción o si viene de una nota del calendario que cobraste. Saberlo es
     la mitad de la información que uno busca al abrir el historial. */
  function txOrigen(t){
    if(t.subId){
      const s = state.subscriptions.find(x=>x.id === t.subId);
      if(s) return {label:'Pago recurrente', detalle:s.name + ' · ' + cycleOf(s.cycle).label, icon:'repeat'};
      return {label:'Pago recurrente', detalle:'de un bloque que ya no está en la lista', icon:'repeat'};
    }
    if(t.transfer) return {label:'Traspaso entre tus cuentas', detalle:'mueve dinero, no es gasto ni ingreso', icon:'repeat'};
    return {label:'Apuntado a mano', detalle:'desde el botón de añadir', icon:'edit'};
  }
  /* Cuánto pesa este movimiento dentro de su categoría ese mes: sitúa la cifra
     sin tener que ir a buscarla a otra pantalla. */
  function txPesoMes(t){
    if(t.transfer) return null;
    const d = new Date(t.ts);
    const ini = new Date(d.getFullYear(), d.getMonth(), 1).getTime();
    const fin = new Date(d.getFullYear(), d.getMonth()+1, 0, 23,59,59,999).getTime();
    const total = state.transactions
      .filter(x=>!x.transfer && x.kind === t.kind && x.category === t.category && x.ts >= ini && x.ts <= fin)
      .reduce((s,x)=>s+x.amount, 0);
    if(!(total > 0)) return null;
    return {pct: Math.round((t.amount/total)*100), total:+total.toFixed(2),
            mes: MESES[d.getMonth()] + ' ' + d.getFullYear()};
  }

  function nbMovItem(t, prefijo, compacto){
    const tipo = txTipo(t);
    const isGasto = t.kind === 'gasto';
    const reemb = !!t.esReembolso;
    const icono = reemb ? 'undo' : tipo.key === 'inversion' ? 'trending' : tipo.key === 'transfer' ? 'repeat' : getCatIcon(t.category, t.kind);
    const hex   = reemb ? '#FF9500' : tipo.key === 'inversion' ? '#0A84FF' : tipo.key === 'transfer' ? '#8E8E93' : getCatHex(t.category, t.kind);
    const acc = accountMeta(t.account);
    const key = prefijo + ':' + t.id;
    const abierto = !!nbOpenRow[key];
    const importe = reemb
      ? `<span class="nb-ita ref">${fmt(t.amount)}</span>`
      : `<span class="nb-ita ${isGasto?'neg':'pos'}">${isGasto?'-':'+'}${fmt(t.amount)}</span>`;

    /* ---- El panel de detalle ----
       Al abrir el historial lo que se busca es entender un apunte del todo, así
       que aquí va cuanto se puede saber de él sin inventar nada: qué es, de
       dónde salió, cuándo exactamente, de qué cuenta, cuánto pesa dentro de su
       categoría ese mes y, si es una inversión o un traspaso, sus datos
       propios. */
    const filas = [];
    const fila = (k, v, clase) => filas.push(`<div class="r ${clase||''}"><span>${k}</span><b>${v}</b></div>`);
    if(reemb){
      fila('Qué es', 'Reembolso de una suscripción');
      fila('Bloque', escapeHTML(t.description || '—'));
      fila('Devuelto a', escapeHTML(t.cuentaTxt || '—'));
      fila('Fecha', escapeHTML(fmtDateTime(t.ts)));
      fila('Importe', fmt(t.amount));
    } else {
      const origen = txOrigen(t);
      const peso = txPesoMes(t);
      const saldo = accountBalance(t.account);
      if(t.description) fila('Descripción', escapeHTML(t.description));
      fila('Categoría', escapeHTML(t.category || '—'));
      fila('Tipo', escapeHTML(tipo.label));
      fila('Origen', escapeHTML(origen.label) + '<i>' + escapeHTML(origen.detalle) + '</i>');
      fila('Cuenta', escapeHTML(acc.label) + '<i>ahora tiene ' + fmt(saldo) + '</i>');
      fila('Fecha', escapeHTML(nbFechaLarga(t.ts)) + '<i>' + escapeHTML(new Date(t.ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'})) + '</i>');
      fila('Importe', (isGasto?'-':'+') + fmt(t.amount), isGasto ? 'neg' : 'pos');
      if(peso) fila('Peso en su categoría', peso.pct + '%<i>de ' + fmt(peso.total) + ' en ' + escapeHTML(peso.mes) + '</i>');
      if(tipo.key === 'inversion'){
        if(t.invLabel) fila('Tipo de inversión', escapeHTML(t.invLabel));
        if(t.units) fila('Cantidad', String(+Number(t.units).toFixed(4)).replace('.', ',') + ' ud.');
        if(t.fee) fila('Comisión', fmt(t.fee));
      }
      if(t.transfer){
        const par = parejaTransferencia(t);
        if(par) fila('La otra pata', escapeHTML(accountMeta(par.account).label) + '<i>' + (par.kind==='ingreso'?'recibe':'envía') + ' ' + fmt(par.amount) + '</i>');
      }
      if(t.note && t.note !== t.description) fila('Nota', escapeHTML(t.note));
    }

    return `<div class="nb-it ${compacto?'compact':''} ${reemb?'ref':''}" data-row="${escapeHTML(key)}">
        <span class="nb-itd lg round" style="--lgc2:${hex};--lgc1:color-mix(in srgb,${hex} 58%,#fff);--lgsh:${hex}88">${ic(icono,13)}</span>
        <span class="nb-itm">
          <span class="nb-itc">${escapeHTML(reemb ? 'Reembolso' : (t.category || '—'))}</span>
          ${compacto ? importe : ''}
          <span class="nb-its">${escapeHTML(compacto ? fmtDateShort(t.ts) : fmtDateShort(t.ts) + ' · ' + (reemb ? (t.cuentaTxt || '') : acc.label))}</span>
        </span>
        ${compacto ? '' : importe}
      </div>
      <div class="nb-itx" data-rowx="${escapeHTML(key)}" ${abierto?'':'hidden'}>
        ${filas.join('')}
        ${reemb
          ? `<div class="nb-refnota">${ic('bolt',11)} Este apunte es solo informativo: el dinero ya volvió a tu cuenta al deshacerse el gasto original.</div>`
          : `<button type="button" class="nb-del" data-delrow="${escapeHTML(t.id)}">${ic('trash',11)} Eliminar movimiento</button>`}
      </div>`;
  }

  function nbCoincide(t, q){
    if(!q) return true;
    const acc = accountMeta(t.account).label || '';
    return (t.category||'').toLowerCase().includes(q)
      || (t.description||'').toLowerCase().includes(q)
      || (t.note||'').toLowerCase().includes(q)
      || acc.toLowerCase().includes(q)
      || txTipo(t).label.toLowerCase().includes(q);
  }
  /* Los cuatro cajones del panel de historial. */
  function nbEsTipo(t, filtro){
    if(filtro === 'gastos')      return t.kind === 'gasto' && !t.transfer && !txEsInversion(t);
    if(filtro === 'inversiones') return !t.transfer && txEsInversion(t);
    if(filtro === 'ingresos')    return t.kind === 'ingreso' && !t.transfer;
    return true;
  }

  /* ---- El historial completo vive ahora en su propio panel ---- */
  /* ---- Los reembolsos también son historia ----
     Al reembolsar se borra el movimiento original y la suscripción, así que el
     historial se quedaba mudo: el dinero volvía a la cuenta y no había forma de
     saber por qué. Estos apuntes no son movimientos de verdad (el dinero ya
     está cuadrado al haber borrado el gasto), así que entran solo para que se
     vean y no suman en los totales de arriba. */
  function nbReembolsosComoFilas(){
    return (state.subRefunds || []).map(x=>({
      id:'rf:'+x.id, ts:x.ts, esReembolso:true,
      account:'banco', kind:'ingreso', category:'Reembolso',
      description:x.name, note:'Devuelto a ' + x.cuenta, amount:x.amount,
      cuentaTxt:x.cuenta, transfer:false,
    }));
  }
  function nbHistorialFiltrado(){
    const desdeTs = nbFrom ? new Date(nbFrom + 'T00:00:00').getTime() : null;
    const hastaTs = nbTo   ? new Date(nbTo   + 'T23:59:59').getTime() : null;
    const todo = state.transactions.concat(
      (nbTipoFiltro === 'todos' || nbTipoFiltro === 'reembolsos') ? nbReembolsosComoFilas() : []);
    return todo.sort((a,b)=>b.ts - a.ts).filter(t=>{
      if(desdeTs != null && t.ts < desdeTs) return false;
      if(hastaTs != null && t.ts > hastaTs) return false;
      if(nbTipoFiltro === 'reembolsos') return !!t.esReembolso;
      if(t.esReembolso) return nbTipoFiltro === 'todos';
      return nbEsTipo(t, nbTipoFiltro);
    });
  }

  function abreHistorialSheet(){
    const lista = nbHistorialFiltrado();
    const visibles = lista.slice(0, nbHistLimit);
    /* Los reembolsos entran para que se vean, pero no suman: el dinero ya
       cuadró al borrarse el gasto original, y volver a contarlo mentiría. */
    const entra = lista.filter(t=>t.kind==='ingreso' && !t.transfer && !t.esReembolso).reduce((s,t)=>s+t.amount,0);
    const sale  = lista.filter(t=>t.kind==='gasto'   && !t.transfer && !t.esReembolso).reduce((s,t)=>s+t.amount,0);
    const nReemb = lista.filter(t=>t.esReembolso).length;

    const porDia = [];
    visibles.forEach(t=>{
      const clave = new Date(t.ts).toDateString();
      let grupo = porDia.find(g=>g.clave === clave);
      if(!grupo){ grupo = {clave, ts:t.ts, items:[], entra:0, sale:0}; porDia.push(grupo); }
      grupo.items.push(t);
      if(t.transfer || t.esReembolso) return;
      if(t.kind === 'gasto') grupo.sale += t.amount; else grupo.entra += t.amount;
    });
    const diasHTML = porDia.map(g=>`<div class="nb-day">
        <div class="nb-dayh">
          <span class="nb-dayd">${escapeHTML(nbFechaLarga(g.ts))}</span>
          <span class="nb-daysum">
            ${g.entra>0?`<span class="i">+${fmt(g.entra)}</span>`:''}
            ${g.sale>0?`<span class="o">-${fmt(g.sale)}</span>`:''}
          </span>
        </div>
        ${g.items.map(t=>nbMovItem(t,'h')).join('')}
      </div>`).join('');

    const chip = (id, icono, txt) => `<button type="button" class="nb-fchip ${nbTipoFiltro===id?'on':''}" data-filtro="${id}">${ic(icono,12)} ${txt}</button>`;

    openOverlay(`<div class="nb-sheet">
      <h3>${ic('calendar',17)} Historial general por fecha</h3>
      <p style="color:var(--ink-soft);font-size:12.5px;line-height:1.5;margin:0;">Todo lo registrado, del más reciente al más antiguo. Acota el rango y elige qué quieres ver.</p>
      <div class="nb-range">
        <label><span>Desde</span><input type="date" id="nbFrom" value="${escapeHTML(nbFrom)}"></label>
        <label><span>Hasta</span><input type="date" id="nbTo" value="${escapeHTML(nbTo)}"></label>
      </div>
      <div class="nb-fchips">
        ${chip('todos','globe','Todo')}
        ${chip('ingresos','arrowDown','Ingresos')}
        ${chip('gastos','arrowUp','Gastos')}
        ${chip('inversiones','trending','Inversiones')}
        ${chip('reembolsos','undo','Reembolsos')}
        ${(nbFrom || nbTo) ? `<button type="button" class="nb-rclr" id="nbRangeClear">${ic('close',11)} Quitar fechas</button>` : ''}
      </div>
      <div class="nb-resumen">
        <span>${lista.length} apunte${lista.length===1?'':'s'}</span>
        <span class="i">+${fmt(entra)}</span>
        <span class="o">-${fmt(sale)}</span>
        ${nReemb?`<span class="rf">${nReemb} reembolso${nReemb===1?'':'s'}</span>`:''}
      </div>
      <div class="nb-lista">
        ${lista.length
          ? diasHTML + (lista.length > visibles.length
              ? `<button type="button" class="nb-more" id="nbMore">Ver ${Math.min(lista.length - visibles.length, 25)} más · ${lista.length} en total</button>`
              : '')
          : `<p class="nb-empty">No hay movimientos con estos filtros.${(nbFrom||nbTo)?' Prueba a ampliar el rango de fechas.':''}</p>`}
      </div>
      <div class="sheet-actions"><button class="ghost-btn" id="nbHistCerrar">Cerrar</button></div>
    </div>`);

    const cont = sheetBody;
    const desde = cont.querySelector('#nbFrom');
    if(desde) desde.onchange = ()=>{ nbFrom = desde.value; nbHistLimit = 25; abreHistorialSheet(); };
    const hasta = cont.querySelector('#nbTo');
    if(hasta) hasta.onchange = ()=>{ nbTo = hasta.value; nbHistLimit = 25; abreHistorialSheet(); };
    const quita = cont.querySelector('#nbRangeClear');
    if(quita) quita.onclick = ()=>{ nbFrom = ''; nbTo = ''; nbHistLimit = 25; abreHistorialSheet(); };
    cont.querySelectorAll('[data-filtro]').forEach(b=>{
      b.onclick = ()=>{ nbTipoFiltro = b.dataset.filtro; nbHistLimit = 25; abreHistorialSheet(); };
    });
    const mas = cont.querySelector('#nbMore');
    if(mas) mas.onclick = ()=>{ nbHistLimit += 25; abreHistorialSheet(); };
    const cerrar = cont.querySelector('#nbHistCerrar');
    if(cerrar) cerrar.onclick = closeOverlay;
    nbBindFilas(cont);
  }

  function renderInicio(){
    const q = txSearchQuery.trim().toLowerCase();

    let alertHTML = '';
    if(lastAlertMsg && !dismissedAlert){
      alertHTML = `<div class="alert-banner">${ic('warning',16)} ${lastAlertMsg}<span class="x" id="dismissAlert">${ic('close',13)}</span></div>`;
    }

    /* ---------- 1 · Gastos y capital, anuales y mensuales ---------- */
    const gA = nbGastoSerie('anual'),   gM = nbGastoSerie('mensual');
    const cA = nbCapitalSerie('anual'), cM = nbCapitalSerie('mensual');

    const picoGasto = s => s.alto
      ? `<span><b class="dn">↑ ${escapeHTML(s.alto.largo)}</b> ${fmt(s.alto.v)}</span><span><b class="up">↓ ${escapeHTML(s.bajo.largo)}</b> ${fmt(s.bajo.v)}</span>`
      : `<span>Sin gastos en este periodo</span>`;
    const picoCap = s => `<span><b class="up">↑ máx</b> ${fmt(s.max)}</span><span><b class="dn">↓ mín</b> ${fmt(s.min)}</span>`;

    const dGta = nbDrop('gta','Gastos de cada mes de ' + gA.rango.label, 'total ' + fmt(gA.total),
      nbLineChart(gA.casillas,'#FF3B30',{tipo:'gasto'}));
    const dCta = nbDrop('cta','Capital a lo largo de ' + cA.rango.label, 'máx ' + fmt(cA.max) + ' · mín ' + fmt(cA.min),
      nbLineChart(cA.casillas,capHex(),{tipo:'capital'}));
    const dGtm = nbDrop('gtm','Gastos de cada día de ' + gM.rango.corto, 'total ' + fmt(gM.total),
      nbLineChart(gM.casillas,'#FF9F0A',{tipo:'gasto'}));
    const dCtm = nbDrop('ctm','Capital a lo largo de ' + cM.rango.corto, 'máx ' + fmt(cM.max) + ' · mín ' + fmt(cM.min),
      nbLineChart(cM.casillas,capHex(true),{tipo:'capital'}));

    const totalesHTML = `<div class="nb-card">
      <div class="nb-h"><span class="nb-hico">${ic('gauge',13)}</span> ${L('nb.totales','Totales del año y del mes')}
        <span class="nb-sub" style="margin-left:auto;">${escapeHTML(gA.rango.label)} · ${escapeHTML(gM.rango.corto)}</span></div>
      <div class="nb-grid">
        <span class="nb-badge">${ic('receipt',18)}</span>
        ${nbCelda('gta', L('nb.gta','Gastos Totales Anuales'),  '#FF3B30', fmt(gA.total), picoGasto(gA), false)}
        ${nbCelda('cta', L('nb.cta','Capital Total Anual'),     capHex(), fmt(cA.max),   picoCap(cA),   true)}
        ${nbCelda('gtm', L('nb.gtm','Gastos Totales Mensuales'),'#FF9F0A', fmt(gM.total), picoGasto(gM), false)}
        ${nbCelda('ctm', L('nb.ctm','Capital Total Mensual'),   capHex(true), fmt(cM.max),   picoCap(cM),   true)}
      </div>
      ${nbPar('anual', dGta, dCta)}
      ${nbPar('mensual', dGtm, dCtm)}
    </div>`;

    /* ---------- 2 · Balance total y balance total mensual ---------- */
    const balanceHTML = `<div class="nb-card">
      <div class="nb-h"><span class="nb-hico">${ic('scale',13)}</span> ${L('nb.balance','Balance')}
        <span class="nb-sub" style="margin-left:auto;">capital − gastos</span></div>
      ${nbBalanceHTML('anual',   L('nb.balT','Balance.T'),    'G.T.A', 'C.T.A')}
      ${nbBalanceHTML('mensual', L('nb.balTM','Balance.T.M'), 'G.T.M', 'C.T.M')}
      <p class="nb-cap"><b>G.T.A / G.T.M</b> = gastos totales del año / mes · <b>C.T.A / C.T.M</b> = capital total del año / mes</p>
    </div>`;

    /* ---------- 3 · Cartera de inversión ---------- */
    const inversionHTML = carteraInversionHTML();

    /* ---------- 4 · Movimientos: buscador, los dos historiales y el panel ---------- */
    const todos = state.transactions.slice().sort((a,b)=>b.ts - a.ts);
    /* Aquí entra absolutamente todo: gastos, inversiones, pagos recurrentes,
       traspasos entre cuentas propias y transferencias a terceros. */
    const gastos   = todos.filter(t=>t.kind==='gasto'   && nbCoincide(t,q));
    const ingresos = todos.filter(t=>t.kind==='ingreso' && nbCoincide(t,q));
    const columna = (clase, icono, tituloHTML, lista, prefijo) => `<div class="nb-col">
        <div class="nb-colh ${clase}">${ic(icono,12)} ${tituloHTML}</div>
        ${lista.length
          ? lista.slice(0,3).map(t=>nbMovItem(t,prefijo,true)).join('')
          : `<p class="nb-empty">${q ? 'Nada coincide con la búsqueda.' : 'Todavía no hay nada aquí.'}</p>`}
        ${lista.length > 3 ? `<div class="nb-colf">Solo los 3 últimos · ${lista.length} en total</div>` : ''}
      </div>`;

    const movimientosHTML = `<div class="nb-card nb-mov">
      <div class="nb-h"><span class="nb-hico">${ic('receipt',13)}</span> ${L('nb.movimientos','Movimientos')}</div>
      <div class="nb-search">
        <span class="nb-sico">${ic('search',15)}</span>
        <input type="text" id="nbSearch" placeholder="Buscar por categoría, nota o cuenta..." value="${escapeHTML(txSearchQuery)}" autocomplete="off">
        ${txSearchQuery ? `<span class="nb-sclr" id="nbSearchClear">${ic('close',12)}</span>` : ''}
      </div>
      <div class="nb-cols">
        ${columna('in', 'arrowDown',L('nb.hIngresos','Historial de ingresos'), ingresos,'i')}
        ${columna('out','arrowUp',  L('nb.hGastos','Historial de Gastos'),     gastos,  'g')}
      </div>
      <button type="button" class="nb-histbtn" id="nbHistOpen">
        <span class="hb-ico">${ic('calendar',15)}</span>
        <span class="hb-t">
          <span class="hb-k">${LT('nb.historial','Historial General Por Fecha')}</span>
          <span class="hb-s">${state.transactions.length} movimiento${state.transactions.length===1?'':'s'}</span>
        </span>
        <span class="hb-c">${ic('chevronRight',15)}</span>
      </button>
    </div>`;

    /* ---------- 0 · Saldo grande y accesos rápidos ---------- */
    const heroOculto = (()=>{ try{ return localStorage.getItem('finanzas:heroOculto') === '1'; }catch(e){ return false; } })();
    const HERO_ACTS = [
      ['nuevo','plus','Añadir'],
      ['suscripciones','repeat','Pagos'],
      ['limites','gauge','Límites'],
      ['carteras','wallet','Carteras'],
    ];
    const heroEvo = (()=>{
      /* Evolución del capital en el mes: una cifra por día con histórico; los días
         sin dato arrastran el anterior y el último punto es el capital de hoy. */
      const hoy = now(), diaHoy = hoy.getDate();
      const diasMes = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0).getDate();
      const ahora = patrimonioTotal();
      let vals = [], last = null;
      cM.casillas.forEach(c=>{ if(c.v != null) last = c.v; vals.push(last); });
      const primero = vals.find(v=>v != null);
      vals = vals.map(v=>v == null ? (primero != null ? primero : ahora) : v);
      if(vals.length) vals[vals.length-1] = ahora; else vals = [ahora];
      if(vals.length < 2) vals = [vals[0], vals[0]];
      const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
      const W = 318, H = 56, pad = 6, rng = (mx - mn) || 1;
      const pts = vals.map((v,i)=>[(i/(vals.length-1))*W, mx === mn ? H/2 : pad + (1 - (v-mn)/rng)*(H-2*pad)]);
      const lineD = pts.map((p,i)=>(i?'L':'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      const areaD = mx === mn ? '' : lineD + ' L' + W + ' ' + H + ' L0 ' + H + ' Z';
      const top = ((gM && gM.tx) || []).slice().sort((a,b)=>b.amount - a.amount)[0];
      const medio = top ? escapeHTML(String(top.description || top.category || 'Gasto').slice(0,18)) + ' · <b class="neg">−' + fmt(top.amount) + '</b>' : '';
      const marca = mx === mn ? '' : (ahora <= mn + 0.005 ? 'mín' : ahora >= mx - 0.005 ? 'máx' : '');
      const mesCorto = MESES[hoy.getMonth()].slice(0,3).toLowerCase();
      const quedan = diasMes - diaHoy;
      return `<div class="hero-evo">
        <svg class="hero-spk" width="100%" height="64" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Capital a lo largo del mes: de ${escapeHTML(fmt(vals[0]))} a ${escapeHTML(fmt(ahora))}">
          <defs><linearGradient id="heroSpk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="spk-s0"/><stop offset="1" class="spk-s1"/></linearGradient></defs>
          <path class="spk-area" d="${areaD}"/>
          <path class="spk-line" d="${lineD}" vector-effect="non-scaling-stroke"/>
        </svg>
        <div class="hero-evo-l"><span>1 ${mesCorto} · <b>${fmt(vals[0])}</b></span><span>${medio}</span><span>hoy${marca ? ' · <b class="mk ' + (marca === 'mín' ? 'neg' : 'pos') + '">' + marca + '</b>' : ''}</span></div>
      </div>
      <div class="hero-prog"><div class="hp-bar"><i style="width:${Math.min(100, Math.round(diaHoy/diasMes*100))}%"></i></div><span>Día <b>${diaHoy}</b> de ${diasMes} · quedan <b>${quedan}</b></span></div>`;
    })();
    const heroHTML = `<section class="hero">
      <div class="hero-k"><span>Capital disponible</span>
        <button type="button" class="hero-eye" id="heroEye" aria-label="${heroOculto?'Mostrar':'Ocultar'} saldo">${ic(heroOculto?'eyeOff':'eye',15)}</button>
      </div>
      <div class="hero-v ${heroOculto?'oculto':''}" id="heroV">${fmt(patrimonioTotal())}</div>
      <div class="hero-meta">
        <span class="hero-pill">${ic('arrowUp',12)} ${fmt(gM.total || 0)} <i>gastado este mes</i></span>
      </div>
      ${heroEvo}
      <div class="hero-acts">${HERO_ACTS.map(([k,icon,label],i)=>`
        <button type="button" class="hero-act" data-heroact="${k}" style="--i:${i}">
          <span class="ha-ico lg round ${i ? 'neutral' : ''}">${ic(icon,22)}</span><span class="ha-l">${label}</span>
        </button>`).join('')}
      </div>
    </section>`;

    root.innerHTML = heroHTML + renderBloques('inicio', [

  }
  /* Saludo según la hora, para el título de Inicio. */

  /* ---- El valor del balance rueda entre euros y porcentaje ----
     Como el dígito de un reloj digital: el valor que sale sube y el que entra

  function nbPintaFlip(){

    if(nbFlipTimer) return;

  /* ---- Navegar por una gráfica con el dedo o con el ratón ---- */
  function nbBindPlots(cont){
    cont.querySelectorAll('.nb-plot').forEach(plot=>{
      let pts;
      try{ pts = JSON.parse(plot.dataset.pts || '[]'); }catch(e){ pts = []; }
      if(!pts.length) return;
      const svg   = plot.querySelector('svg');
      const cross = plot.querySelector('.cross');
      const hot   = plot.querySelector('.hot');
      const tip   = plot.querySelector('.nb-tip');
      const elD = tip.querySelector('.t-d'), elV = tip.querySelector('.t-v'), elN = tip.querySelector('.t-n');
      const VB = 300, VH = 122;

      const mueve = (clientX)=>{
        const r = svg.getBoundingClientRect();
        if(!r.width) return;
        const sx = ((clientX - r.left) / r.width) * VB;
        /* El punto más cercano manda: así la cruz siempre cae sobre un tramo. */
        let p = pts[0];
        for(let i=1;i<pts.length;i++){ if(Math.abs(pts[i].x - sx) < Math.abs(p.x - sx)) p = pts[i]; }
        cross.setAttribute('x1', p.x); cross.setAttribute('x2', p.x);
        hot.setAttribute('cx', p.x);   hot.setAttribute('cy', p.y);
        elD.textContent = p.l;
        elV.textContent = p.v;
        elN.innerHTML = p.s;
        const px = Math.min(Math.max((p.x / VB) * 100, 16), 84);
        tip.style.left = px + '%';
        tip.style.top  = ((p.y / VH) * 100) + '%';
        plot.classList.add('live');
      };
      const fuera = ()=> plot.classList.remove('live');

      plot.addEventListener('pointermove', e=>{ if(editMode) return; mueve(e.clientX); });
      plot.addEventListener('pointerdown', e=>{ if(editMode) return; mueve(e.clientX); });
      plot.addEventListener('pointerleave', fuera);
      plot.addEventListener('pointercancel', fuera);
      /* En el móvil el dedo se levanta y el globo se queda un momento más. */
      plot.addEventListener('pointerup', ()=> setTimeout(fuera, 1600));
    });
  }

  /* Abrir y cerrar la ficha de cada movimiento, y borrarlo desde dentro. */

  /* Todo lo que se puede tocar en los bloques nuevos. Los desplegables se
     abren y cierran sin repintar la página, para no perder el sitio; solo

  function renderCalendar(){
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    const first = new Date(y,m,1);
    const startDow = (first.getDay()+6)%7;
    const daysInMonth = new Date(y,m+1,0).getDate();
    const todayStr = now().toDateString();
    const byDay = {};
    state.transactions.filter(t=>{ const d=new Date(t.ts); return d.getFullYear()===y && d.getMonth()===m && !t.transfer; })
      .forEach(t=>{
        const day=new Date(t.ts).getDate();
        if(!byDay[day]) byDay[day]={};
        const key = t.kind+':'+t.category;
        if(!byDay[day][key]) byDay[day][key] = {count:0, amount:0, kind:t.kind, category:t.category};
        byDay[day][key].count++; byDay[day][key].amount += t.amount;
      });
    /* Proyecta los cobros futuros de cada suscripción sobre el mes mostrado. */
    const subDays = {};
    const monthStart = new Date(y,m,1).getTime();
    const monthEnd = new Date(y,m+1,0,23,59,59).getTime();
    activeSubs().filter(s=>!subLibre(s)).forEach(s=>{
      let t = s.nextTs, guard = 0;
      /* Un pago puntual no avanza: si su fecha no cae en el mes, no sale. */
      while(t < monthStart && guard++ < 500){ const sig = subAdvance(s, t); if(sig === t) break; t = sig; }
      while(t <= monthEnd && guard++ < 500){
        const dd = new Date(t).getDate();
        (subDays[dd] = subDays[dd] || []).push(s);
        const sig = subAdvance(s, t);
        if(sig === t) break;
        t = sig;
      }
    });

    let cells = '';
    for(let i=0;i<startDow;i++) cells += `<div class="cal-day empty"></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const isToday = new Date(y,m,d).toDateString()===todayStr;
      let inner = '', markClass = '', subMark = '';
      /* El title de la casilla se va montando por trozos: fecha, movimientos,
         cobros y notas. Así al pasar por encima se resume el día entero. */
      const titulo = [d + ' de ' + MESES[m]];
      if(byDay[d]){
        const entries = Object.values(byDay[d]).sort((a,b)=> b.count-a.count || b.amount-a.amount);
        const top = entries[0];
        const icon = getCatIcon(top.category, top.kind);
        markClass = top.kind==='gasto' ? 'marked-red' : 'marked-blue';
        inner = `<div class="demo">${ic(icon,13)}</div>`;
        if(top.count>1){
          const cls = top.kind==='gasto' ? 'red' : 'blue';
          inner += `<div class="cal-badge ${cls}">×${top.count}</div>`;
        }
        const nMov = entries.reduce((s,x)=>s+x.count,0);
        titulo.push(nMov + ' movimiento' + (nMov===1?'':'s'));
      }
      if(subDays[d]){
        const subs = subDays[d];
        const total = subs.reduce((s,x)=>s+x.amount,0);
        titulo.push(subs.map(s=>s.name).join(', ') + ' · ' + fmt(total));
        if(!markClass){
          const soloCita = subs.every(subEsCita), soloInv = subs.every(x=>x.kind==='inversion');
          markClass = soloCita ? 'marked-cita' : soloInv ? 'marked-inv' : 'marked-sub';
          inner = `<div class="demo">${ic(soloCita ? 'calendar' : soloInv ? 'trending' : 'repeat',13)}</div>`;
          if(subs.length>1) inner += `<div class="cal-badge sub">×${subs.length}</div>`;
        } else {
          subMark = `<span class="cal-subdot"></span>`;
        }
      }
      /* Sello horizontal de citas: si ese día tienes una consulta apuntada se
         ve desde la vista general, sin abrirlo. Con más de una, se dobla. */
      const citasDia = (subDays[d] || []).filter(subEsCita);
      const nNotas = citasDia.length;
      let notaMark = '';
      if(nNotas){
        notaMark = `<span class="cal-notestamp${nNotas>1?' multi':''}"></span>`;
        titulo.push(nNotas + ' cita' + (nNotas===1?'':'s'));
      }
      const nPend = nNotas;
      /* El aro de "hoy" se comporta igual que antes: anillo cuando el día ya
         está marcado por una suscripción, y relleno lleno cuando está limpio. */
      const hoyCls = isToday ? (markClass ? 'today-ring' : 'today') : '';
      cells += `<div class="cal-day ${hoyCls} ${markClass} ${nNotas?'has-note':''} ${nPend?'has-pend':''}" data-day="${d}"`
        + `${subDays[d]?` data-subday="${d}"`:''}`
        + ` role="button" tabindex="0" title="${escapeHTML(titulo.join(' · '))}">${d}${inner}${subMark}${notaMark}</div>`;
    }
    const subCount = Object.values(subDays).reduce((s,a)=>s+a.length,0);
    const subTotalMonth = Object.values(subDays).flat().reduce((s,x)=>s+x.amount,0);
    const notasMes = Object.values(subDays).flat().filter(subEsCita).length;
    return `<div class="calendar-card">
      <div class="cal-head"><div class="cal-title">${MESES[m]} ${y}</div><div class="cal-nav"><div class="glass-tap" data-dir="-1">‹</div><div class="glass-tap" data-dir="1">›</div></div></div>
      <div class="dm-date"><b>Pulsa cualquier día</b> para ver qué tiene y añadir lo que haga falta.${notasMes?` Este mes tienes <b>${notasMes} cita${notasMes===1?'':'s'}</b> apuntada${notasMes===1?'':'s'}.`:''}</div>
      <div class="cal-grid">${DOW.map(d=>`<div class="cal-dow">${d}</div>`).join('')}${cells}</div>
      <div class="cal-legend">
        <span><i class="cl-dot red"></i>Gasto</span>
        <span><i class="cl-dot blue"></i>Ingreso</span>
        <span><i class="cl-dot sub"></i>Suscripción</span>
        <span><i class="cl-dot inv"></i>Inversión</span>
        <span><i class="cl-bar note"></i>Cita</span>
        ${subCount?`<span class="cl-total">${subCount} cobro${subCount===1?'':'s'} · ${fmt(subTotalMonth)}</span>`:''}
      </div>
    </div>`;
  }

  /* ---- El calendario, ahora dentro de Suscripciones ----
     Aquí solo se mira: qué se pagó ese día, qué toca pagar y qué hay apuntado.
     Lo que se añade se añade como bloque, por el mismo embudo que cualquier
     suscripción, así que no hay dos formas distintas de apuntar lo mismo. */
  function bindCalendarioVista(cont){
    cont.querySelectorAll('.cal-nav div').forEach(el=>{
      el.onclick = ()=>{ if(editMode) return; calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + parseInt(el.dataset.dir,10), 1); renderSuscripciones(); };
    });
    cont.querySelectorAll('.cal-day[data-day]').forEach(el=>{
      const abrir = ()=>{ if(editMode) return; openDayModal(calCursor.getFullYear(), calCursor.getMonth(), parseInt(el.dataset.day,10)); };
      el.onclick = abrir;
      el.onkeydown = (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); abrir(); } };
    });
  }

  /* ============ CITAS Y CONSULTAS ============
     Una cita es un bloque más de la lista de Suscripciones, con la diferencia
     de que pasa una sola vez y a una hora concreta: el dentista a las 17:30,
     la ITV, la revisión del coche. Antes esto era un sistema aparte —"notas del
     calendario"— con su propia lista, su propio guardado y su propio flujo. Dos
     formas de apuntar lo mismo significan dos sitios donde mirar y dos listas
     que cuadrar, así que ahora es una sola: la cita nace por el mismo embudo
     que cualquier bloque y hereda todo lo suyo (avisa cuando llega la hora, se
     paga, se aplaza, se reembolsa, se finaliza y sale en el historial).

     Lo único propio que conserva es el aviso a su hora exacta: las demás cosas
     van por día, una cita va por minuto. */
  const CITA_CAT = 'Citas y consultas';
  function subEsCita(sub){ return !!(sub && sub.cita); }
  /* Una cita sin coste decidido todavía: ni cero, ni un número, sin definir. */
  function citaSinCoste(sub){ return subEsCita(sub) && sub.costUndefined === true; }
  function citasPendientes(){
    return state.subscriptions.filter(s=>subEsCita(s) && !s.done);
  }
  function citasVencidas(){
    const ahora = Date.now();
    return citasPendientes().filter(s=>s.nextTs <= ahora).sort((a,b)=>a.nextTs - b.nextTs);
  }

  let citaAvisoVisto = {};
  let citaTimer = null;

  /* ---- El aviso del calendario ----
     Un punto sobre el botón de Calendario mientras queden citas sin resolver;
     se pone rojo en cuanto alguna ha llegado a su hora. */
  function pintaAvisoNotas(){
    const pend = citasPendientes().length, vencidas = citasVencidas().length;
    const destino = root.querySelector('.sub-switch [data-subtab="calendario"]');
    /* El botón solo existe estando en Suscripciones; si no, no hay nada que
       pintar y el aviso vuelve en cuanto entras. */
    if(!destino) return;
    let badge = destino.querySelector('.ni-badge');
    if(!pend){ if(badge) badge.remove(); return; }
    if(!badge){
      badge = document.createElement('span');
      badge.className = 'ni-badge';
      destino.appendChild(badge);
    }
    badge.textContent = pend > 9 ? '9+' : String(pend);
    badge.classList.toggle('due', vencidas > 0);
    badge.title = vencidas
      ? vencidas + ' cita' + (vencidas===1?'':'s') + ' pendiente' + (vencidas===1?'':'s') + ' de resolver'
      : pend + ' cita' + (pend===1?'':'s') + ' apuntada' + (pend===1?'':'s');
  }

  function arrancaVigilanteNotas(){
    if(citaTimer) return;
    citaTimer = setInterval(compruebaNotasVencidas, 30000);
  }
  function compruebaNotasVencidas(){
    pintaAvisoNotas();
    if(!state.onboarded || askingSalary) return;
    if(overlay.classList.contains('show')) return;
    const due = citasVencidas().find(s=>!citaAvisoVisto[s.id]);
    if(due) abreCitaVencida(due);
  }

  /* ---- La hoja que salta cuando llega la hora ---- */
  function abreCitaVencida(sub){
    if(!sub || sub.done) return;
    citaAvisoVisto[sub.id] = true;
    const cuando = new Date(sub.nextTs);
    const fechaTxt = cuando.toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'})
      + ' · ' + (sub.time || fmtHora(sub.nextTs));
    const tieneCoste = !citaSinCoste(sub) && sub.amount > 0;
    openOverlay(`<h3>${ic('bell',18)} Toca pagar</h3>
      <div class="step-label metal-text">Apuntaste esto para ${escapeHTML(fechaTxt)}</div>
      <div class="nv-nota">
        <span class="nv-hora">${escapeHTML(sub.time || fmtHora(sub.nextTs))}</span>
        <span class="nv-texto">${escapeHTML(sub.name)}</span>
        <span class="nv-coste ${tieneCoste?'set':'undef'}">${tieneCoste ? fmt(sub.amount) : 'Sin definir'}</span>
      </div>
      ${tieneCoste ? '' : `
        <div class="field-label">¿Cuánto ha costado? (puedes dejarlo y decirlo en el siguiente paso)</div>
        <input type="number" inputmode="decimal" id="nvCoste" placeholder="0.00">`}
      <p class="nv-aviso">${ic('bolt',12)} Hasta que no lo cobres no cuenta como gasto en ningún sitio.</p>
      <div class="sheet-actions">
        <button class="ghost-btn" id="nvAplazar">${ic('clock',14)} Aplazar</button>
        <button class="primary-btn glass-tap" id="nvCobrar" style="margin-top:0;">${ic('check',15)} Cobrar</button>
      </div>
      <div class="sheet-actions">
        <button class="ghost-btn" id="nvCancel">${ic('close',14)} Cancelar</button>
      </div>`);
    sheetBody.querySelector('#nvAplazar').onclick = ()=>{ closeOverlay(); abreAplazar(sub); };
    sheetBody.querySelector('#nvCancel').onclick = ()=>{
      closeOverlay();
      confirmSheet('Cancelar la cita',
        `"${escapeHTML(sub.name)}" se quita de la lista sin cobrarse.`,
        'Cancelar la cita', async ()=>{
          const copia = JSON.stringify(state.subscriptions);
          state.subscriptions = state.subscriptions.filter(s=>s.id !== sub.id);
          await saveState(); render();
          showUndoToast(`"${sub.name}" cancelada`, async ()=>{
            state.subscriptions = JSON.parse(copia);
            await saveState(); render();
          });
        }, true);
    };
    sheetBody.querySelector('#nvCobrar').onclick = ()=>{
      const inp = sheetBody.querySelector('#nvCoste');
      if(inp && inp.value.trim() !== ''){
        const v = parseFloat(inp.value);
        if(!(v > 0)){ markInvalid(inp, 'Escribe un importe mayor que cero en el recuadro rojo'); return; }
        sub.amount = +v.toFixed(2);
        sub.costUndefined = false;
      }
      closeOverlay();
      if(!(sub.amount > 0)){
        showToast('Ponle primero un importe a la cita para poder cobrarla.', true);
        return;
      }
      pagaSubDesdeCita(sub);
    };
  }
  function fmtHora(ts){ return new Date(ts).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}); }
  /* El cobro de una cita es el mismo de cualquier bloque; se saca aparte solo
     para poder llamarlo desde la hoja del aviso. */
  async function pagaSubDesdeCita(sub){
    const ts = Date.now();
    registerSubscriptionPayment(sub, ts);
    sub.lastChargedTs = ts;
    sub.done = true;
    await saveState(); render();
    showToast(`${sub.name}: ${fmt(sub.amount)} pagado.`);
  }

  /* ---- Movimientos y cobros de un día concreto ---- */
  function txOnDay(y,m,d){
    const ini = new Date(y,m,d,0,0,0,0).getTime();
    const fin = new Date(y,m,d,23,59,59,999).getTime();
    return state.transactions.filter(t=> t.ts >= ini && t.ts <= fin).sort((a,b)=> a.ts - b.ts);
  }
  function subsOnDay(y,m,d){
    const ini = new Date(y,m,d,0,0,0,0).getTime();
    const fin = new Date(y,m,d,23,59,59,999).getTime();
    const out = [];
    activeSubs().filter(s=>!subLibre(s) && !subCompletada(s)).forEach(s=>{
      let t = s.nextTs, guard = 0;
      while(t < ini && guard++ < 800){ const sig = subAdvance(s, t); if(sig === t) break; t = sig; }
      if(t >= ini && t <= fin) out.push(s);
    });
    return out;
  }

  /* ---- La pantalla de un día ----
     Solo se mira. Arriba, todo lo que ese día tiene: lo que ya se pagó, los
     cobros que caen y las citas apuntadas. Abajo, un botón que lleva al mismo
     embudo que cualquier bloque nuevo. */
  let dayModal = null;
  function openDayModal(y,m,d){
    dayModal = {y, m, d};
    pintaDayModal();
  }
  function pintaDayModal(){
    if(!dayModal) return;
    const y = dayModal.y, m = dayModal.m, d = dayModal.d;
    const largo  = new Date(y,m,d).toLocaleDateString('es-ES',{weekday:'long', day:'numeric', month:'long'});
    const titulo = largo.charAt(0).toUpperCase() + largo.slice(1);
    const hoy0 = new Date(now().getFullYear(), now().getMonth(), now().getDate()).getTime();
    const dif  = Math.round((new Date(y,m,d).getTime() - hoy0) / 86400000);
    const cuando = dif === 0 ? 'Hoy' : dif === 1 ? 'Mañana' : dif === -1 ? 'Ayer'
      : dif > 0 ? 'Dentro de ' + dif + ' días' : 'Hace ' + Math.abs(dif) + ' días';

    const txs  = txOnDay(y,m,d);
    const subs = subsOnDay(y,m,d);

    const gastoDia   = txs.filter(t=>t.kind==='gasto'   && !t.transfer).reduce((s,t)=>s+t.amount,0);
    const ingresoDia = txs.filter(t=>t.kind==='ingreso' && !t.transfer).reduce((s,t)=>s+t.amount,0);
    const previsto   = subs.filter(s=>!citaSinCoste(s)).reduce((s,x)=>s+(x.amount||0),0);
    const sinCoste   = subs.filter(citaSinCoste).length;

    const pills = [];
    if(gastoDia)   pills.push(`<span class="dm-pill out">${ic('arrowUp',12)} Gasto ${fmt(gastoDia)}</span>`);
    if(ingresoDia) pills.push(`<span class="dm-pill in">${ic('arrowDown',12)} Ingreso ${fmt(ingresoDia)}</span>`);
    if(previsto)   pills.push(`<span class="dm-pill prev">${ic('clock',12)} Previsto ${fmt(previsto)}</span>`);
    if(sinCoste)   pills.push(`<span class="dm-pill">${ic('warning',12)} ${sinCoste} sin coste</span>`);
    if(!pills.length) pills.push(`<span class="dm-pill">${ic('leaf',12)} Día sin nada apuntado</span>`);

    const filaTx = t => {
      const tipo  = txTipo(t);
      const icono = tipo.key === 'inversion' ? 'trending' : tipo.key === 'transfer' ? 'repeat' : getCatIcon(t.category, t.kind);
      const hex   = tipo.key === 'inversion' ? '#0A84FF' : tipo.key === 'transfer' ? '#8E8E93' : getCatHex(t.category, t.kind);
      const isGasto = t.kind === 'gasto';
      const det = [fmtHora(t.ts), tipo.label, accountMeta(t.account).label];
      if(t.description) det.push(t.description);
      return `<div class="dm-row">
          <span class="dm-ico" style="background:${hex}22;color:${hex}">${ic(icono,14)}</span>
          <span class="dm-txt">
            <span class="dm-k">${escapeHTML(t.category || '—')}</span>
            <span class="dm-s">${escapeHTML(det.join(' · '))}</span>
          </span>
          <span class="dm-a ${isGasto?'neg':'pos'}">${isGasto?'-':'+'}${fmt(t.amount)}</span>
        </div>`;
    };
    /* Un bloque que cae ese día: suscripción, inversión o cita. Se pinta igual
       que en la lista de Suscripciones para que se reconozca de un vistazo. */
    const filaSub = s => {
      const cita = subEsCita(s);
      const esInv = s.kind === 'inversion';
      const icono = cita ? 'calendar' : esInv ? 'trending' : getCatIcon(s.category, 'gasto');
      const hex   = cita ? '#FF9500' : esInv ? '#0A84FF' : getCatHex(s.category, 'gasto');
      const det = cita
        ? [(s.time || fmtHora(s.nextTs)), 'Cita o consulta', accountMeta(s.account).label]
        : [cycleOf(s.cycle).label, esInv ? 'Inversión' : 'Suscripción', accountMeta(s.account).label];
      return `<div class="dm-row" data-irsub="${escapeHTML(s.id)}" role="button" tabindex="0">
          <span class="dm-ico" style="background:${hex}22;color:${hex}">${ic(icono,14)}</span>
          <span class="dm-txt">
            <span class="dm-k">${escapeHTML(s.name)}</span>
            <span class="dm-s">${escapeHTML(det.join(' · '))}</span>
          </span>
          <span class="dm-a prev">${citaSinCoste(s) ? 'Sin definir' : fmt(s.amount)}</span>
          <i class="dm-chev">${ic('chevronRight',13)}</i>
        </div>`;
    };
    const seccion = (icono, nombre, n, cuerpo) =>
      `<div class="dm-sec">${ic(icono,13)} ${nombre}${n ? `<span class="dm-n">${n}</span>` : ''}</div>${cuerpo}`;

    const vacioMov = `<div class="dm-empty">Este día no tiene ningún movimiento registrado.</div>`;

    openOverlay(`
      <h3>${escapeHTML(titulo)}</h3>
      <div class="dm-date">${escapeHTML(cuando + ' · ' + y)}</div>
      <div class="dm-sum">${pills.join('')}</div>

      ${seccion('receipt', 'Movimientos del día', txs.length, txs.length ? txs.map(filaTx).join('') : vacioMov)}

      ${subs.length ? seccion('repeat', 'Lo que toca este día', subs.length, subs.map(filaSub).join('')) : ''}

      <button type="button" class="dm-add glass-tap" id="dmAdd">
        <span class="da-ico">${ic('plus',17)}</span>
        <span class="da-t"><b>Añadir un gasto a este día</b><i>Suscripción, inversión, cita o cualquier otro pago</i></span>
        <span class="da-c">${ic('chevronRight',15)}</span>
      </button>

      <div class="sheet-actions">
        <button class="ghost-btn" id="dmClose">Cerrar</button>
      </div>`);
    const cerrar = sheetBody.querySelector('#dmClose');
    if(cerrar) cerrar.onclick = ()=>{ dayModal = null; closeOverlay(); };
    const add = sheetBody.querySelector('#dmAdd');
    if(add) add.onclick = ()=>{
      const fecha = new Date(y, m, d, 9, 0, 0, 0).getTime();
      dayModal = null;
      openSubWizard(null, {nextTs:fecha});
    };
    /* Tocar un bloque del día lo abre en su propia hoja, con sus botones. */
    sheetBody.querySelectorAll('[data-irsub]').forEach(el=>{
      const ir = ()=>{
        dayModal = null;
        closeOverlay();
        subTab = 'suscripciones';
        openSubId = el.dataset.irsub;
        activeTab = 'suscripciones';
        render();
        setTimeout(()=>{
          const card = document.querySelector('.sub-card[data-subid="' + el.dataset.irsub + '"]');
          if(card) card.scrollIntoView({block:'center', behavior:'smooth'});
        }, 160);
      };
      el.onclick = ir;
      el.onkeydown = (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); ir(); } };
    });
  }
  /* ============ LÍMITES · su propia pestaña ============
     Cada categoría lleva su propio periodo: hay gastos que solo se entienden
     mirados al mes (la compra) y otros al año (el seguro del coche). El importe
     es el del periodo que elijas, sin multiplicar nada por detrás: 100 € al mes
     que pasas a anual son 100 € al año, ni un euro más.

     Lo consumido cuenta TODAS las carteras. Antes solo miraba la Nómina, así
     que un gasto de comida pagado en efectivo o con Revolut dejaba el límite
     intacto y parecía que ibas sobrado. */
  function limitePeriodo(cat){
    const m = state.limitPeriods || {};
    return m[cat] === 'anio' ? 'anio' : 'mes';
  }
  /* El mes que miran los límites. Antes iba atado al mes del calendario, que
     ahora vive en Suscripciones: si allí retrocedías a agosto, los límites
     hablaban de agosto sin que nada en esta pestaña lo dijera. Ahora tienen sus
     propias flechas arriba. Un límite anual mira el año entero de ese mes. */
  let limCursor = new Date();
  function limiteRango(cat, cursor){
    const d = cursor || limCursor;
    const y = d.getFullYear(), m = d.getMonth();
    if(limitePeriodo(cat) === 'anio'){
      return {from: new Date(y,0,1,0,0,0,0).getTime(),
              to:   new Date(y+1,0,1,0,0,0,0).getTime() - 1,
              texto: 'año ' + y};
    }
    return {from: new Date(y,m,1,0,0,0,0).getTime(),
            to:   new Date(y,m+1,1,0,0,0,0).getTime() - 1,
            texto: MESES[m] + (y !== now().getFullYear() ? ' de ' + y : '')};
  }
  /* Lo gastado en una categoría dentro de un tramo, salga de la cartera que
     salga. Fuera quedan las transferencias (mueven dinero, no lo gastan) y la
     inversión (se aparta, no se gasta), igual que en el resto de la app. */
  function limiteGastado(cat, r){
    let total = 0;
    state.transactions.forEach(t=>{
      if(t.kind !== 'gasto' || t.transfer) return;
      if(t.category !== cat) return;
      if(txEsInversion(t)) return;
      if(t.ts < r.from || t.ts > r.to) return;
      total += t.amount;
    });
    return +total.toFixed(2);
  }
  function limiteColor(ratio){
    if(ratio >= 1) return '#FF3B30';
    if(ratio >= 0.75) return '#FF9500';
    if(ratio >= 0.5) return '#32ADE6';
    return '#248A3D';
  }
  function renderLimitesTab(){
    root.innerHTML = renderBloques('limites', [
      {id:'limites', name:'Límites de gasto', html:limitesBloqueHTML()},
    ]);
    bindBloques('limites', root);
    bindLimites(root);
  }
  function limitesBloqueHTML(){
    const rows = state.limitCategories.map(cat=>{
      const info = catInfo(cat, 'gasto');
      const per = limitePeriodo(cat);
      const r = limiteRango(cat);
      const spent = limiteGastado(cat, r);
      const limit = state.limits[cat] || 0;
      const ratio = limit > 0 ? clamp01(spent/limit) : 0;
      const armed = armedLimitCat === cat, deleting = deletingLimitCat === cat;
      return `<div class="list-row limit-row ${deleting?'deleting':''}" data-limitrow="${escapeHTML(cat)}">
        <div class="limit-top">
          <div class="limit-cat"><span class="lim-ico" style="--ti:${info.hex}">${ic(info.icon,17)}</span> <span data-cat="${escapeHTML(cat)}">${escapeHTML(cat)}</span></div>
          <input class="limit-input" type="number" inputmode="decimal" data-limit-cat="${escapeHTML(cat)}" placeholder="Sin límite" value="${limit>0?limit:''}">
        </div>
        <div class="limit-mid">
          <div class="seg lim-seg">
            <button type="button" class="seg-b ${per==='mes'?'on':''}" data-limper="mes" data-limcat="${escapeHTML(cat)}">Mensual</button>
            <button type="button" class="seg-b ${per==='anio'?'on':''}" data-limper="anio" data-limcat="${escapeHTML(cat)}">Anual</button>
          </div>
          <span class="lim-tramo">${ic('calendar',11)} ${escapeHTML(r.texto)}</span>
        </div>
        <div class="limit-bar-track"><div class="limit-bar-fill" style="width:${limit>0?ratio*100:0}%;background:${limiteColor(ratio)}"></div></div>
        <div class="limit-foot ${ratio>=1?'over':''}">
          <span>${fmt(spent)} gastado${limit>0 ? ' de ' + fmt(limit) + (per==='anio' ? ' al año' : ' al mes') : ''}</span>
          <span>${limit>0 ? (ratio>=1 ? '¡Superado!' : Math.round(ratio*100)+'%') : 'Sin límite'}</span>
        </div>
        ${armed?`<div class="row-delete-overlay"><span class="del-confirm-btn glass-tap" data-delconfirm-limit="${escapeHTML(cat)}">${ic('trash',13)} Eliminar</span></div>`:''}
      </div>`;
    }).join('');
    const hoy = now();
    const esteMes = limCursor.getFullYear() === hoy.getFullYear() && limCursor.getMonth() === hoy.getMonth();
    return `<div class="section-title" style="margin-top:16px;">${ic('gauge')} Límites de gasto por categoría</div>
      <div class="cal-head lim-mes">
        <div class="cal-title">${MESES[limCursor.getMonth()]} ${limCursor.getFullYear()}${esteMes ? '' : ` <span class="lim-hoy" id="limHoy" role="button" tabindex="0">volver a hoy</span>`}</div>
        <div class="cal-nav"><div class="glass-tap" data-limdir="-1">‹</div><div class="glass-tap" data-limdir="1">›</div></div>
      </div>
      ${state.limitCategories.length
        ? `<div class="list-card">${rows}</div>`
        : `<div class="ledger-card lim-vacio">${ic('gauge',14)} Todavía no has puesto ningún límite. Añade una categoría y dile cuánto quieres gastar como mucho.</div>`}
      <div class="ledger-card add-tile glass-tap" id="addLimitCatBtn"><div class="plus">${ic('plus',16)}</div><div class="lbl">Añadir categoría</div></div>`;
  }
  /* Escribir el importe, cambiar de mensual a anual, moverse de mes, añadir una
     categoría y quitarla manteniéndola pulsada. Todo repinta solo esta pestaña. */
  function bindLimites(cont){
    cont.querySelectorAll('[data-limit-cat]').forEach(el=>{
      el.onchange = async ()=>{
        const cat = el.dataset.limitCat;
        const v = parseFloat(el.value);
        state.limits[cat] = (v > 0) ? +v.toFixed(2) : 0;
        await saveState(); renderLimitesTab();
      };
    });
    cont.querySelectorAll('[data-limper]').forEach(el=>{
      el.onclick = async (e)=>{
        e.stopPropagation();
        if(editMode) return;
        const cat = el.dataset.limcat, val = el.dataset.limper;
        if(limitePeriodo(cat) === val) return;
        if(!state.limitPeriods) state.limitPeriods = {};
        state.limitPeriods[cat] = val;
        await saveState(); renderLimitesTab();
      };
    });
    cont.querySelectorAll('[data-limdir]').forEach(el=>{
      el.onclick = ()=>{
        if(editMode) return;
        limCursor = new Date(limCursor.getFullYear(), limCursor.getMonth() + parseInt(el.dataset.limdir,10), 1);
        renderLimitesTab();
      };
    });
    const hoy = cont.querySelector('#limHoy');
    if(hoy) hoy.onclick = ()=>{ if(editMode) return; limCursor = new Date(); renderLimitesTab(); };
    cont.querySelectorAll('[data-limitrow]').forEach(el=>{
      attachLongPress(el, ()=>{ armedLimitCat = el.dataset.limitrow; renderLimitesTab(); });
      el.addEventListener('click', (e)=>{
        if(wasLongPress(el)) return;
        if(e.target.closest('[data-limit-cat]') || e.target.closest('[data-limper]')) return;
        if(armedLimitCat === el.dataset.limitrow){ armedLimitCat = null; renderLimitesTab(); }
      });
    });
    cont.querySelectorAll('[data-delconfirm-limit]').forEach(el=>{
      el.onclick = (e)=>{
        e.stopPropagation();
        const cat = el.dataset.delconfirmLimit;
        deletingLimitCat = cat; renderLimitesTab();
        setTimeout(async ()=>{
          const valor = state.limits[cat];
          const per = (state.limitPeriods || {})[cat];
          state.limitCategories = state.limitCategories.filter(c=>c!==cat);
          delete state.limits[cat];
          if(state.limitPeriods) delete state.limitPeriods[cat];
          armedLimitCat = null; deletingLimitCat = null;
          await saveState(); render();
          showUndoToast('Categoría de límite eliminada', async ()=>{
            state.limitCategories.push(cat);
            if(valor !== undefined) state.limits[cat] = valor;
            if(per !== undefined){
              if(!state.limitPeriods) state.limitPeriods = {};
              state.limitPeriods[cat] = per;
            }
            await saveState(); render();
          });
        }, 420);
      };
    });
    const mas = cont.querySelector('#addLimitCatBtn');
    if(mas) mas.onclick = ()=>{ if(!editMode) openAddLimitCategory(false); };
  }

  /* ---- Elegir la categoría de un límite nuevo ----
     Las mismas fichas que el botón de añadir un movimiento, pero solo salen las
     diez que más usas y que todavía no tienen límite; el orden cambia solo a
     medida que apuntas gastos. La última ficha despliega el resto, y abajo se
     puede crear una categoría nueva sin salir de aquí. */
  const LIM_TOP = 10;
  function openAddLimitCategory(verResto){
    const libres = catsPorUso().filter(c=>!state.limitCategories.includes(c));
    const top = libres.slice(0, LIM_TOP), resto = libres.slice(LIM_TOP);
    const ficha = c=>{
      const v = catInfo(c, 'gasto');
      return `<div class="cat-card" data-addlimit="${escapeHTML(c)}" style="--cc:${v.hex}">
          <span class="cc-ico">${ic(v.icon,17)}</span>
          <span class="cc-name">${escapeHTML(c)}</span>
          ${v.ex?`<span class="cc-ex">${escapeHTML(v.ex)}</span>`:''}
        </div>`;
    };
    const fichaResto = resto.length ? `<div class="cat-card cat-resto ${verResto?'on':''}" data-limresto="1" role="button" tabindex="0" style="--cc:#8E8E93">
        <span class="cc-ico">${ic(verResto ? 'close' : 'search',17)}</span>
        <span class="cc-name">${verResto ? 'Ver solo las habituales' : 'Otras categorías'}</span>
